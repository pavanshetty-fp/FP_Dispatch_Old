<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>Shift Planner — FleetPanda Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ══ FP DS — light ══════════════════════════════════════════
   Values taken from FP-DS-2026/src/index.css, resolved. Things that are not
   simply the dark theme inverted, and are easy to get wrong:
     · the ground is WARM (#e8e8e4) and everything on it is cool — deliberate
     · a card sits LIGHTER than its lane here; dark inverts that
     · --brand orange is the product mark and the focus ring, never the CTA;
       the CTA is --primary, near-black
     · three stroke weights do three jobs — card rim, divider, field boundary
     · hover is grey (--fp-emphasis); selected is the brand tint (--fp-selected)
   The system has no timeline unit, so the three views below borrow the board
   card and the delivery-timeline's hour scale rather than invent a third thing. */
:root{
  --fp-surface-base:#e8e8e4;
  --fp-shell-ground:#f2f2f2;
  --fp-surface-1b:#ffffff;
  --fp-surface-1a:#f4f5f8;
  --fp-card-1:#dee1e7;
  --fp-card-2:#e8eaed;
  --fp-table-header:#f1f2f2;
  --fp-row-hover:#e8eaed;
  --chip:#efefeb;
  --muted:#e9eaeb;

  --fp-ink-1:#030405;
  --fp-ink-3:#4f5968;
  --fp-ink-inverse:#f0f2f5;

  --fp-outline-1:#cfd3d9;
  --fp-outline-2:#adaeb4;
  --fp-stroke-hairline:#c8c9cd;
  --fp-stroke-field:#91949b;

  --brand:#fa6400;
  --primary:#090c0f;
  --primary-foreground:#f0f2f5;
  --fp-selected:#fee8d9;
  --fp-selected-strong:#a33f00;
  --fp-selected-border:#fdb98c;
  --fp-emphasis:#dee0e5;
  --fp-emphasis-hover:#e4e6ea;
  --ring:#fa6400;

  --status-caution:#b45309;
  --status-info:#1d4ed8;
  --status-success:#15803d;
  --status-failed:#dc2626;
  --status-neutral:#4f5968;

  --r-md:8px; --r-lg:10px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Geist',system-ui,sans-serif;background:var(--fp-surface-base);color:var(--fp-ink-1);height:100vh;overflow:hidden;}

.sp2{height:100vh;display:flex;flex-direction:column;background:var(--fp-shell-ground);}

/* ── Header ───────────────────────────────────────────────── */
.sp2-hdr{height:56px;background:var(--fp-surface-1b);border-bottom:1px solid var(--fp-stroke-hairline);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;}
.sp2-title{display:flex;align-items:center;gap:10px;}
.sp2-title h1{font-size:16px;line-height:24px;font-weight:600;color:var(--fp-ink-1);}
.sp2-title-sub{font-size:12px;line-height:16px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}
.sp2-date{display:flex;align-items:center;gap:6px;}
.sp2-nav-btn{width:36px;height:36px;border:1px solid var(--fp-stroke-field);border-radius:var(--r-md);background:var(--fp-surface-1b);color:var(--fp-ink-1);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.sp2-nav-btn:hover{background:var(--fp-emphasis);}
.sp2-date-inp{height:36px;background:var(--fp-surface-1b);border:1px solid var(--fp-stroke-field);border-radius:var(--r-md);color:var(--fp-ink-1);font-family:inherit;font-size:14px;padding:0 12px;outline:none;text-align:center;min-width:164px;cursor:pointer;font-variant-numeric:tabular-nums;}
.sp2-date-inp:focus{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklab,var(--ring) 50%,transparent);}
.sp2-today{height:36px;padding:0 14px;border:1px solid var(--fp-stroke-field);border-radius:var(--r-md);background:var(--fp-surface-1b);color:var(--fp-ink-1);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;}
.sp2-today:hover{background:var(--fp-emphasis);}

/* ── Two columns ──────────────────────────────────────────── */
.sp2-body{flex:1;display:flex;overflow:hidden;min-height:0;}
.sp2-col{display:flex;flex-direction:column;min-width:0;overflow:hidden;}
/* plain percentages, not clamp(): flex-basis cannot interpolate between a
   clamp() and a percentage, so the transition stalls where it started. */
.sp2-col-orders{flex:0 0 40%;min-width:272px;border-right:1px solid var(--fp-stroke-hairline);transition:flex-basis .22s ease;background:var(--fp-card-1);}
.sp2-body[data-view="v"] .sp2-col-orders{flex-basis:25%;}
.sp2-body[data-view="v"] .sp2-tl-wrap{overflow-x:hidden;}
.sp2-col-unit{flex:1 1 60%;background:var(--fp-surface-1a);}

.sp2-col-hdr{min-height:52px;display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--fp-stroke-hairline);flex-shrink:0;flex-wrap:wrap;background:var(--fp-surface-1b);}
.sp2-col-title{font-size:14px;line-height:20px;font-weight:600;color:var(--fp-ink-1);white-space:nowrap;}
.sp2-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 7px;border-radius:9999px;background:var(--muted);font-size:12px;font-weight:500;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}

.sp2-seg{display:flex;background:var(--muted);border:1px solid var(--fp-outline-1);border-radius:var(--r-md);padding:2px;}
.sp2-seg-btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border:none;background:transparent;color:var(--fp-ink-3);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;border-radius:6px;white-space:nowrap;}
.sp2-seg-btn:hover{background:var(--fp-emphasis-hover);color:var(--fp-ink-1);}
.sp2-seg-btn.on{background:var(--primary);color:var(--primary-foreground);font-weight:600;}
.sp2-seg-n{font-size:11px;opacity:.75;font-variant-numeric:tabular-nums;}
.sp2-flt-lbl{font-size:10px;font-weight:600;color:var(--fp-ink-3);text-transform:uppercase;letter-spacing:0.12em;}
.sp2-custom{display:none;align-items:center;gap:6px;}
.sp2-custom.on{display:flex;}
.sp2-time{height:32px;width:72px;background:var(--fp-surface-1b);border:1px solid var(--fp-stroke-field);border-radius:var(--r-md);color:var(--fp-ink-1);font-family:inherit;font-size:13px;padding:0 8px;outline:none;text-align:center;font-variant-numeric:tabular-nums;}
.sp2-time:focus{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklab,var(--ring) 50%,transparent);}

/* ── Timeline ─────────────────────────────────────────────── */
.sp2-tl-wrap{flex:1;overflow:auto;min-height:0;position:relative;}
.sp2-tl-wrap::-webkit-scrollbar{height:10px;width:8px;}
.sp2-tl-wrap::-webkit-scrollbar-thumb{background:var(--fp-outline-2);border-radius:5px;}
.sp2-tl{position:relative;padding:0 16px 18px;min-width:min-content;}

.sp2-ruler{position:sticky;top:0;z-index:3;height:32px;background:var(--fp-card-1);border-bottom:1px solid var(--fp-stroke-hairline);display:flex;margin:0 -16px;padding:0 16px;}
.sp2-hour{flex-shrink:0;position:relative;font-size:12px;color:var(--fp-ink-3);padding-top:9px;border-left:1px solid var(--fp-outline-1);padding-left:6px;font-variant-numeric:tabular-nums;}

.sp2-lanes{position:relative;padding-top:12px;}
.sp2-lane{position:relative;height:146px;margin-bottom:8px;}
.sp2-grid{position:absolute;inset:0;display:flex;pointer-events:none;}
.sp2-grid-col{flex-shrink:0;border-left:1px solid color-mix(in oklab,var(--fp-outline-1) 55%,transparent);}

/* the order card — board card's shape and stack levels */
.sp2-card{position:absolute;top:0;height:142px;background:var(--fp-surface-1b);border:1px solid var(--fp-outline-1);border-left:3px solid var(--status-neutral);border-radius:var(--r-lg);padding:10px 12px;display:flex;flex-direction:column;gap:5px;cursor:pointer;overflow:hidden;transition:border-color .12s,box-shadow .12s,background .12s;}
.sp2-card:hover{border-color:var(--fp-outline-2);box-shadow:0 1px 3px rgba(3,4,5,.10),0 1px 2px rgba(3,4,5,.06);}
.sp2-card.sel{border-color:var(--fp-selected-border);background:var(--fp-selected);}
.sp2-card.planned{border-left-color:var(--status-success);}
.sp2-card.unplanned{border-left-color:var(--status-caution);}
.sp2-card-top{display:flex;align-items:center;gap:8px;}
.sp2-ord{font-size:14px;font-weight:600;color:var(--fp-ink-1);white-space:nowrap;font-variant-numeric:tabular-nums;}
.sp2-time-lbl{margin-left:auto;font-size:12px;color:var(--fp-ink-3);white-space:nowrap;font-variant-numeric:tabular-nums;}
.sp2-ship{font-size:13px;font-weight:500;color:var(--fp-ink-3);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp2-addr{font-size:12px;color:var(--fp-ink-3);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;opacity:.85;}
.sp2-prods{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;}
.sp2-chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:9999px;background:var(--chip);font-size:12px;color:var(--fp-ink-1);white-space:nowrap;}
.sp2-chip-q{color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}
.sp2-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.sp2-card-foot{display:flex;align-items:center;gap:7px;}

/* pills: kind colour at 10%, text the kind colour, no border */
.sp2-pill{display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:9999px;font-size:12px;font-weight:400;white-space:nowrap;}
.sp2-pill-planned{background:color-mix(in oklab,var(--status-success) 10%,transparent);color:var(--status-success);}
.sp2-pill-unplanned{background:color-mix(in oklab,var(--status-caution) 10%,transparent);color:var(--status-caution);}
.sp2-type{font-size:10px;font-weight:600;color:var(--fp-ink-3);text-transform:uppercase;letter-spacing:0.12em;white-space:nowrap;}

.sp2-empty{padding:44px 16px;text-align:center;font-size:14px;color:var(--fp-ink-3);}

/* ── Vertical timeline ────────────────────────────────────
   Same orders, same cards; time runs down a rail instead of across the top,
   so the column needs width for one card, not for hours. */
.sp2-vt{padding:12px 16px 20px;position:relative;}
.sp2-vt-rail{position:absolute;left:62px;top:0;bottom:0;width:1px;background:var(--fp-outline-1);}
.sp2-vrow{position:relative;display:flex;gap:14px;margin-bottom:10px;}
.sp2-vtime{width:48px;flex-shrink:0;text-align:right;padding-top:10px;font-size:12px;color:var(--fp-ink-3);font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums;}
.sp2-vnode{position:absolute;left:58px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--fp-surface-1b);border:2px solid var(--status-neutral);z-index:1;}
.sp2-vrow.planned .sp2-vnode{border-color:var(--status-success);}
.sp2-vrow.unplanned .sp2-vnode{border-color:var(--status-caution);}
.sp2-vgap{position:relative;height:22px;margin:0 0 10px 76px;display:flex;align-items:center;font-size:12px;color:var(--fp-ink-3);opacity:.8;}
.sp2-vcard{flex:1;min-width:0;margin-left:22px;}

/* ── No timeline — the orders, in the order the day runs them ── */

.sp2-flow .sp2-card{position:static;width:auto;height:auto;min-height:0;}
.sp2-flow .sp2-addr{-webkit-line-clamp:1;}

/* ── Column 2 ─────────────────────────────────────────────── */
.sp2-unit-row{display:flex;align-items:flex-start;min-height:100%;}
.sp2-sec{padding:16px;min-width:0;}
.sp2-sec-drv{flex:0 0 clamp(300px,37%,392px);border-right:1px solid var(--fp-stroke-hairline);align-self:stretch;}
.sp2-sec-trk{flex:1;min-width:0;}
.sp2-sec-lbl{font-size:10px;font-weight:600;color:var(--fp-ink-3);text-transform:uppercase;letter-spacing:0.14em;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.sp2-sec-lbl::after{content:'';flex:1;height:1px;background:var(--fp-stroke-hairline);}

.sp2-state{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;border-radius:9999px;font-size:12px;font-weight:500;white-space:nowrap;}
.sp2-state.on-duty{background:color-mix(in oklab,var(--status-success) 10%,transparent);color:var(--status-success);}
.sp2-state.off-duty{background:var(--muted);color:var(--status-neutral);}
.sp2-state.driving{background:color-mix(in oklab,var(--status-info) 10%,transparent);color:var(--status-info);}
.sp2-state::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
/* the CTA is --primary, near-black. Brand orange is the mark and the ring. */
.sp2-view{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:none;border-radius:var(--r-md);background:var(--primary);color:var(--primary-foreground);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;}
.sp2-view:hover{background:color-mix(in oklab,var(--primary) 88%,#fff);}

.sp2-truck{background:var(--fp-surface-1b);border:1px solid var(--fp-outline-1);border-radius:var(--r-lg);overflow:hidden;}
.sp2-truck-top{padding:14px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--fp-stroke-hairline);}
.sp2-truck-ico{width:32px;height:32px;border-radius:var(--r-md);background:var(--fp-card-1);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sp2-truck-id{font-size:16px;line-height:24px;font-weight:600;color:var(--fp-ink-1);}
.sp2-truck-sub{font-size:13px;color:var(--fp-ink-3);margin-top:1px;}
.sp2-truck-cap{margin-left:auto;text-align:right;}
.sp2-truck-pct{font-size:18px;line-height:28px;font-weight:600;color:var(--fp-ink-1);font-variant-numeric:tabular-nums;}
.sp2-truck-pct-lbl{font-size:12px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}

.full .sp2-comp-pct,.full .sp2-comp-word{color:var(--status-success);}
.partial .sp2-comp-pct,.partial .sp2-comp-word{color:var(--status-caution);}
.empty-c .sp2-comp-pct,.empty-c .sp2-comp-word{color:var(--status-neutral);}

.sp2-none{padding:36px 16px;text-align:center;font-size:14px;color:var(--fp-ink-3);line-height:1.6;}

#sp2Toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:var(--r-md);font-size:14px;font-weight:500;z-index:200;display:none;white-space:nowrap;background:var(--primary);color:var(--primary-foreground);box-shadow:0 8px 24px rgba(3,4,5,.18);}


/* ── Header tools: the view switch, and everything else behind one icon ── */
.sp2-hdr-tools{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0;}
.sp2-ico-btn{position:relative;width:36px;height:36px;border:1px solid var(--fp-stroke-field);border-radius:var(--r-md);background:var(--fp-surface-1b);color:var(--fp-ink-1);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sp2-ico-btn:hover{background:var(--fp-emphasis);}
.sp2-ico-btn.on{border-color:var(--fp-selected-border);background:var(--fp-selected);}
.sp2-ico-dot{display:none;position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--brand);border:2px solid var(--fp-surface-1b);}
.sp2-search{height:36px;flex:1;min-width:0;max-width:280px;background:var(--fp-surface-1b);border:1px solid var(--fp-stroke-field);border-radius:var(--r-md);color:var(--fp-ink-1);font-family:inherit;font-size:13px;padding:0 12px;outline:none;}
.sp2-search:focus{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklab,var(--ring) 50%,transparent);}

/* The columns clip their own overflow, so a popover has to escape them. */
.sp2-pop{display:none;position:fixed;z-index:120;min-width:280px;background:var(--fp-surface-1b);border:1px solid var(--fp-outline-1);border-radius:var(--r-lg);box-shadow:0 8px 24px rgba(3,4,5,.14),0 2px 6px rgba(3,4,5,.08);padding:14px;}
.sp2-pop.on{display:block;}
.sp2-pop-row{display:flex;flex-direction:column;gap:7px;margin-bottom:12px;}
.sp2-pop-row .sp2-seg{align-self:flex-start;}
.sp2-pop-foot{padding-top:11px;border-top:1px solid var(--fp-stroke-hairline);}
.sp2-pop-ttl{font-size:10px;font-weight:600;color:var(--fp-ink-3);text-transform:uppercase;letter-spacing:.14em;margin-bottom:9px;}
.sp2-pop-item{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:9px 10px;border:1px solid var(--fp-outline-1);border-radius:var(--r-md);background:var(--fp-surface-1b);font-family:inherit;cursor:pointer;margin-bottom:6px;}
.sp2-pop-item:hover{background:var(--fp-emphasis);}
.sp2-pop-item-id{font-size:14px;font-weight:600;color:var(--fp-ink-1);}
.sp2-pop-item-sub{font-size:12px;color:var(--fp-ink-3);}
.sp2-link{border:none;background:none;padding:0;font-family:inherit;font-size:13px;color:var(--fp-ink-3);text-decoration:underline;cursor:pointer;}
.sp2-link:hover{color:var(--fp-ink-1);}

/* ── Section 1: the roster ─────────────────────────────── */
.sp2-unit-row{display:flex;align-items:stretch;flex:1;min-height:0;}
.sp2-sec{padding:16px;min-width:0;display:flex;flex-direction:column;min-height:0;}
.sp2-sec-drv{flex:0 0 clamp(268px,30%,330px);border-right:1px solid var(--fp-stroke-hairline);}
.sp2-sec-trk{flex:1;min-width:0;overflow-y:auto;}
.sp2-drv-tabs{align-self:stretch;margin-bottom:10px;}
.sp2-drv-tabs .sp2-seg-btn{flex:1;justify-content:center;padding:0 6px;}
.sp2-drv-list{flex:1;overflow-y:auto;min-height:0;margin:0 -4px;padding:0 4px;}
.sp2-drv-list::-webkit-scrollbar{width:8px;}
.sp2-drv-list::-webkit-scrollbar-thumb{background:var(--fp-outline-2);border-radius:5px;}
.sp2-grp{position:sticky;top:0;z-index:2;background:var(--fp-surface-1a);display:flex;align-items:center;gap:8px;padding:8px 0 6px;font-size:10px;font-weight:600;color:var(--fp-ink-3);text-transform:uppercase;letter-spacing:.14em;}
.sp2-drow{background:var(--fp-surface-1b);border:1px solid var(--fp-outline-1);border-radius:var(--r-lg);padding:10px 12px;margin-bottom:8px;cursor:pointer;}
.sp2-drow:hover{background:var(--fp-emphasis);}
.sp2-drow.on{border-color:var(--fp-selected-border);background:var(--fp-selected);}
.sp2-drow-top{display:flex;align-items:center;gap:8px;}
.sp2-drow-chev{color:var(--fp-ink-3);display:flex;flex-shrink:0;transition:transform .15s;}
.sp2-drow.on .sp2-drow-chev{transform:rotate(90deg);}
.sp2-drow-name{font-size:14px;font-weight:600;color:var(--fp-ink-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp2-drow-top .sp2-state{margin-left:auto;flex-shrink:0;}
.sp2-drow-sub{font-size:12px;color:var(--fp-ink-3);margin-top:4px;font-variant-numeric:tabular-nums;}
.sp2-drow-sync{font-size:12px;color:var(--fp-ink-3);margin-top:2px;opacity:.85;}
.sp2-drow-open{margin-top:10px;padding-top:10px;border-top:1px solid var(--fp-stroke-hairline);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sp2-drow-meta{font-size:12px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}
.sp2-drow-open .sp2-view{margin-left:auto;height:32px;padding:0 12px;font-size:13px;}

/* ── Section 2: the rig, drawn ─────────────────────────── */
.sp2-veh-wrap{position:relative;overflow-x:auto;padding:4px 14px 12px;border-bottom:1px solid var(--fp-stroke-hairline);transition:background .12s;}
.sp2-veh-wrap.sp2-over{background:var(--fp-selected);}
.sp2-veh{position:relative;display:flex;align-items:flex-end;padding:18px 0 16px;min-width:min-content;}
.sp2-cabwrap{position:relative;flex:0 0 54px;}
.sp2-cab{height:58px;border:2px solid var(--fp-ink-1);border-right:none;border-radius:9px 0 0 4px;background:var(--fp-card-2);position:relative;}
.sp2-cab-win{position:absolute;left:7px;right:7px;top:7px;height:19px;border-radius:4px 7px 0 0;background:var(--fp-surface-1b);border:1px solid var(--fp-outline-2);}
.sp2-tankwrap{position:relative;flex-basis:0;min-width:min-content;}
.sp2-tank{display:flex;height:118px;border:2px solid var(--fp-ink-1);border-radius:4px 11px 11px 4px;overflow:hidden;background:var(--fp-surface-1b);}
.sp2-wheel{position:absolute;bottom:-11px;width:22px;height:22px;border-radius:50%;background:var(--fp-surface-1b);border:3px solid var(--fp-ink-1);}
.sp2-hitch{flex:0 0 20px;height:6px;margin-bottom:28px;background:var(--fp-ink-1);border-radius:3px;}
.sp2-veh-tag{position:absolute;left:0;right:0;top:-15px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fp-ink-3);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}

/* A compartment is as wide as it is big, and the load rises inside it. */
.sp2-cmp{position:relative;flex-basis:0;min-width:86px;border-right:2px solid var(--fp-ink-1);overflow:hidden;}
.sp2-cmp:last-child{border-right:none;}
.sp2-cmp.sp2-over{outline:2px dashed var(--brand);outline-offset:-3px;}
.sp2-cmp-liq{position:absolute;left:0;right:0;bottom:0;opacity:.85;transition:height .3s ease;}
.sp2-cmp-txt{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:5px 4px;}
.sp2-cmp-c{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--fp-ink-1);text-align:center;}
/* the plate keeps the numbers off the product colour, whatever colour it is */
.sp2-cmp-plate{margin-top:auto;background:rgba(255,255,255,.9);border-radius:5px;padding:4px 2px 5px;text-align:center;}
.sp2-cmp-p{font-size:11px;font-weight:600;color:var(--fp-ink-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp2-cmp-p.empty{color:var(--fp-ink-3);font-weight:400;}
.sp2-cmp-q{font-size:11px;color:var(--fp-ink-1);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp2-cmp-q span{color:var(--fp-ink-3);}
.sp2-cmp-s{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:2px;line-height:1.3;}
.sp2-cmp-s.full{color:var(--status-success);}
.sp2-cmp-s.partial{color:var(--status-caution);}
.sp2-cmp-s.empty-c{color:var(--fp-ink-3);}

.sp2-drop-hint{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:4px;padding:3px 11px;border-radius:9999px;background:var(--fp-selected);color:var(--fp-selected-strong);font-size:11px;font-weight:600;pointer-events:none;white-space:nowrap;}
.sp2-body.dragging .sp2-drop-hint{display:block;}
.sp2-body.dragging .sp2-veh-wrap{outline:2px dashed var(--fp-selected-border);outline-offset:-6px;}

.sp2-veh-wrap::-webkit-scrollbar{height:8px;}
.sp2-veh-wrap::-webkit-scrollbar-thumb{background:var(--fp-outline-2);border-radius:4px;}
.sp2-veh-scroll{position:relative;}
.sp2-veh-fade{position:absolute;top:0;bottom:0;right:0;width:44px;pointer-events:none;opacity:0;transition:opacity .15s;background:linear-gradient(to right,rgba(255,255,255,0),var(--fp-surface-1b));}
.sp2-veh-scroll.more .sp2-veh-fade{opacity:1;}
.sp2-rig-foot{padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.sp2-trl-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--fp-stroke-field);border-radius:var(--r-md);background:var(--fp-surface-1b);color:var(--fp-ink-1);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;}
.sp2-trl-btn:hover{background:var(--fp-emphasis);}
.sp2-rig-trl{font-size:13px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}


/* ══ V2 — a lane per driver ═══════════════════════════════
   V1 asks you to choose a driver and then shows one rig. A lane shows every
   rig at once, so an order can go straight to whichever has room. */
.sp2-lanes-wrap{flex:1;overflow-y:auto;min-height:0;}
.sp2-lanes-wrap::-webkit-scrollbar{width:8px;}
.sp2-lanes-wrap::-webkit-scrollbar-thumb{background:var(--fp-outline-2);border-radius:5px;}
.sp2-ln-hdr{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:14px;padding:7px 16px;background:var(--fp-card-1);border-bottom:1px solid var(--fp-stroke-hairline);font-size:10px;font-weight:600;color:var(--fp-ink-3);text-transform:uppercase;letter-spacing:.14em;}
.sp2-ln-hdr-drv{flex:0 0 180px;}
.sp2-ln-hdr-sum{margin-left:auto;font-variant-numeric:tabular-nums;}

.sp2-ln{display:flex;gap:14px;padding:12px 16px;border-bottom:1px solid var(--fp-stroke-hairline);cursor:pointer;transition:background .12s;}
.sp2-ln:hover{background:var(--fp-emphasis);}
/* the chosen lane lifts off the list rather than tinting */
.sp2-ln.on{background:var(--fp-surface-1b);box-shadow:0 1px 2px rgba(3,4,5,.06),0 6px 20px rgba(3,4,5,.12);position:relative;z-index:1;}
.sp2-ln.sp2-over{background:var(--fp-selected);outline:2px dashed var(--fp-selected-border);outline-offset:-4px;}
/* off duty is dimmer ground, never dimmer ink — the words still have to read */
.sp2-ln.off-duty .sp2-ln-day{background:var(--fp-card-2);}

.sp2-ln-drv{flex:0 0 180px;min-width:0;}
.sp2-ln-drv-top{display:flex;align-items:center;gap:8px;}
.sp2-av{width:30px;height:30px;border-radius:50%;background:var(--fp-card-1);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--fp-ink-1);flex-shrink:0;}
.sp2-ln-name{font-size:14px;font-weight:600;color:var(--fp-ink-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp2-ln-drv .sp2-state{margin-top:7px;}
.sp2-ln-shift{font-size:12px;color:var(--fp-ink-3);margin-top:5px;font-variant-numeric:tabular-nums;}
.sp2-ln-sync{font-size:11px;color:var(--fp-ink-3);margin-top:2px;}

.sp2-ln-day{flex:1;min-width:0;background:var(--fp-surface-1b);border:1px solid var(--fp-outline-1);border-radius:var(--r-lg);padding:10px 12px;}
.sp2-ln-truck{display:flex;align-items:center;gap:9px;flex-wrap:wrap;color:var(--fp-ink-3);}
.sp2-ln-truck-id{font-size:14px;font-weight:600;color:var(--fp-ink-1);}
.sp2-ln-comps{font-size:12px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}
.sp2-ln-cap{margin-left:auto;font-size:12px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;}
.sp2-ln-cap b{font-size:15px;font-weight:600;color:var(--fp-ink-1);}
.sp2-trl-btn.sm{height:26px;padding:0 9px;font-size:12px;}

.sp2-ln-stops{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px solid var(--fp-stroke-hairline);}
.sp2-ln-stops-lbl{font-size:12px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;margin-right:2px;}
.sp2-stop{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:9999px;background:var(--chip);font-size:12px;color:var(--fp-ink-1);cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap;}
.sp2-stop:hover{background:var(--fp-emphasis-hover);}
.sp2-stop.sel{background:var(--fp-selected);box-shadow:inset 0 0 0 1px var(--fp-selected-border);}
.sp2-stop-t{color:var(--fp-ink-3);}
.sp2-stop b{font-weight:400;color:var(--fp-ink-3);}
.sp2-stop-none{font-size:12px;color:var(--fp-ink-3);}


/* ── the tanker, drawn ────────────────────────────────────
   Natural size, scrolled rather than scaled, so a compartment's numbers stay
   the same size whatever truck is under them. */
/* centred when it is narrower than the lane; `safe` so a long rig still
   starts at its nose instead of being clipped on the left */
.sp2-rig{position:relative;margin-top:10px;overflow-x:auto;padding-bottom:2px;display:flex;justify-content:center;justify-content:safe center;}
.sp2-rig::-webkit-scrollbar{height:7px;}
.sp2-rig::-webkit-scrollbar-thumb{background:var(--fp-outline-2);border-radius:4px;}
.sp2-sv{display:block;flex:none;}
/* Type inside the drawing is in DESIGN units and renders at TK.scale, so these
   are the rendered sizes divided by 0.68. All of it is the design's dark ink:
   a status colour would have to sit on whatever fuel is behind it. */
.sp2-sv text{font-family:inherit;text-anchor:middle;dominant-baseline:middle;fill:#242425;}
.sp2-sv-c{font-size:13px;font-weight:700;letter-spacing:.04em;opacity:.55;}
.sp2-sv-p{font-size:18px;font-weight:600;}
.sp2-sv-p.empty{font-weight:400;opacity:.5;}
.sp2-sv-q{font-size:16px;}
.sp2-sv-s{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.75;}
.sp2-sv-tag{font-size:13px;font-weight:600;letter-spacing:.09em;fill:var(--fp-ink-3);text-transform:uppercase;}

/* one box per vehicle, divided into compartments — not a row of loose tiles */
.sp2-bars{display:flex;gap:10px;margin-top:9px;height:52px;}
.sp2-barbox{flex:1;min-width:0;display:flex;border:1.5px solid var(--fp-outline-2);border-radius:var(--r-md);overflow:hidden;background:var(--fp-surface-1b);}
.sp2-bar2{position:relative;flex-basis:0;min-width:28px;border-right:1.5px solid var(--fp-outline-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden;}
.sp2-bar2:last-child{border-right:none;}
.sp2-bar2.sp2-over{box-shadow:inset 0 0 0 2px var(--brand);}
.sp2-bar2-fill{position:absolute;left:0;right:0;bottom:0;transition:height .3s ease;}
.sp2-bar2-c{position:relative;z-index:1;font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--fp-ink-1);opacity:.62;}
.sp2-bar2-p{position:relative;z-index:1;font-size:10px;font-weight:600;color:var(--fp-ink-1);max-width:100%;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp2-r2-chassis{height:5px;margin:0 12px 0 0;background:var(--fp-ink-1);border-radius:0 0 3px 3px;}
.sp2-r2-cabframe{height:5px;margin-left:5px;background:var(--fp-ink-1);}
.sp2-r2-axles{position:relative;height:20px;}
.sp2-r2-wheel{position:absolute;top:-2px;width:19px;height:19px;border-radius:50%;background:var(--fp-surface-1b);border:3px solid var(--fp-ink-1);}
.sp2-r2-art::-webkit-scrollbar{height:7px;}
.sp2-r2-art::-webkit-scrollbar-thumb{background:var(--fp-outline-2);border-radius:4px;}
.sp2-r2-hitch{flex:0 0 16px;flex-shrink:0;height:5px;margin-top:110px;background:var(--fp-ink-1);border-radius:3px;}
.sp2-r2-tag{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fp-ink-3);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}


/* ── Compact: a density, not a second drawing ─────────────
   The selected lane keeps the tanker whatever the density; the rest keep their
   bars and lose the writing, which you only need for the rig you are loading. */
.sp2-lanes-wrap[data-dense="compact"] .sp2-ln:not(.on){padding:7px 16px;}
.sp2-lanes-wrap[data-dense="compact"] .sp2-ln:not(.on) .sp2-ln-day{padding:7px 10px;}
.sp2-lanes-wrap[data-dense="compact"] .sp2-ln:not(.on) .sp2-ln-sync{display:none;}
.sp2-lanes-wrap[data-dense="compact"] .sp2-ln:not(.on) .sp2-ln-shift{margin-top:3px;}
.sp2-lanes-wrap[data-dense="compact"] .sp2-ln:not(.on) .sp2-ln-drv .sp2-state{margin-top:5px;}
.sp2-lanes-wrap[data-dense="compact"] .sp2-ln:not(.on) .sp2-bars{height:30px;margin-top:7px;}
.sp2-lanes-wrap[data-dense="compact"] .sp2-ln:not(.on) .sp2-bar2-p{display:none;}
.sp2-lanes-wrap[data-dense="compact"] .sp2-ln:not(.on) .sp2-ln-stops{margin-top:6px;padding-top:5px;}
.sp2-lanes-wrap[data-dense="compact"] .sp2-ln:not(.on) .sp2-stop{display:none;}
.sp2-lanes-wrap[data-dense="compact"] .sp2-ln:not(.on) .sp2-trl-btn,
.sp2-lanes-wrap[data-dense="compact"] .sp2-ln:not(.on) .sp2-ln-truck .sp2-link{display:none;}

/* ── where the driver is in their shift ─────────────────── */
.sp2-shift{margin-top:9px;padding-top:9px;border-top:1px solid var(--fp-stroke-hairline);}
.sp2-shift-top{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;}
.sp2-shift-win{font-size:12px;color:var(--fp-ink-1);font-weight:500;font-variant-numeric:tabular-nums;}
.sp2-shift-word{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fp-ink-3);}
.sp2-shift.running .sp2-shift-word{color:var(--status-success);}
.sp2-shift.over .sp2-shift-word{color:var(--status-failed);}
.sp2-shift-left{margin-left:auto;font-size:12px;font-weight:600;color:var(--fp-ink-1);font-variant-numeric:tabular-nums;white-space:nowrap;}
.sp2-shift-bar{position:relative;height:6px;border-radius:3px;background:var(--fp-card-1);margin-top:6px;overflow:visible;}
.sp2-shift-done{height:100%;border-radius:3px;background:var(--status-neutral);opacity:.45;}
.sp2-shift.running .sp2-shift-done{background:var(--status-success);opacity:.55;}
.sp2-shift.over .sp2-shift-done{background:var(--status-failed);opacity:.45;}
.sp2-shift-now{position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:var(--fp-ink-1);transform:translateX(-1.5px);}
.sp2-shift-sub{font-size:11px;color:var(--fp-ink-3);margin-top:5px;font-variant-numeric:tabular-nums;}
.sp2-ln-drv .sp2-link{margin-top:8px;display:inline-block;}

/* the truck name is the way to change it */
.sp2-ln-truck-id{display:inline-flex;align-items:center;gap:4px;border:none;background:none;padding:2px 4px;margin-left:-4px;border-radius:4px;font-family:inherit;font-size:14px;font-weight:600;color:var(--fp-ink-1);cursor:pointer;}
.sp2-ln-truck-id:hover{background:var(--fp-emphasis-hover);}
.sp2-ln-truck-id svg{opacity:.5;}

/* a compartment that has been picked up and is waiting to be put down */
.sp2-sv-held{fill:none;stroke:var(--brand);stroke-width:3;stroke-dasharray:7 5;}
.sp2-pop-scroll{max-height:300px;overflow-y:auto;margin:0 -4px;padding:0 4px;}
.sp2-pop-item.on{border-color:var(--fp-selected-border);background:var(--fp-selected);}
/* ── the grip between the columns, and a column on its own ── */
.sp2-split{flex:0 0 7px;cursor:col-resize;background:var(--fp-card-1);border-right:1px solid var(--fp-stroke-hairline);position:relative;}
.sp2-split::after{content:'';position:absolute;top:50%;left:2px;width:3px;height:34px;margin-top:-17px;border-radius:2px;background:var(--fp-outline-2);}
.sp2-split:hover,.sp2-split.on{background:var(--fp-emphasis);}
.sp2-split:hover::after,.sp2-split.on::after{background:var(--brand);}
.sp2-ico-btn.sm{width:30px;height:30px;}
.sp2-body[data-only="orders"] .sp2-col-unit,
.sp2-body[data-only="orders"] .sp2-split,
.sp2-body[data-only="drivers"] .sp2-col-orders,
.sp2-body[data-only="drivers"] .sp2-split{display:none;}
.sp2-body[data-only="orders"] .sp2-col-orders,
.sp2-body[data-only="drivers"] .sp2-col-unit{flex:1 1 100% !important;}
.sp2-ln-stops{display:flex;align-items:center;gap:12px;}
.sp2-stop-list{flex:1;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.sp2-ln-stops-lbl{margin-left:auto;flex-shrink:0;}
.sp2-stop-x{border:none;background:none;padding:0 0 0 3px;margin-right:-3px;font-family:inherit;font-size:15px;line-height:1;color:var(--fp-ink-3);cursor:pointer;}
.sp2-stop-x:hover{color:var(--status-failed);}

/* more gallons than rig: say by how much, and offer the ways out */
.sp2-over-warn{margin-top:9px;padding:9px 11px;border-radius:var(--r-md);background:color-mix(in oklab,var(--status-failed) 9%,transparent);border:1px solid color-mix(in oklab,var(--status-failed) 30%,transparent);}
.sp2-over-head{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--status-failed);font-variant-numeric:tabular-nums;}
.sp2-over-head b{font-weight:600;}
.sp2-over-fixes{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;}
.sp2-fix{height:28px;padding:0 11px;border:1px solid var(--fp-stroke-field);border-radius:var(--r-md);background:var(--fp-surface-1b);color:var(--fp-ink-1);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;font-variant-numeric:tabular-nums;}
.sp2-fix:hover{background:var(--fp-emphasis);border-color:var(--fp-ink-3);}
.sp2-move{min-width:290px;}
.sp2-move-range{width:100%;accent-color:var(--brand);margin:2px 0 10px;}
.sp2-move-row{display:flex;align-items:center;gap:8px;}
.sp2-move-row .sp2-time{width:88px;text-align:right;}
.sp2-move-of{font-size:11px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}
.sp2-move-quick{display:flex;align-items:center;gap:6px;margin-top:11px;}
/* ── how much of this order the chosen rig could take ── */
.sp2-vs{font-size:11px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;}
.sp2-fit{display:block;margin-top:6px;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:500;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
.sp2-fit.perfect{background:var(--status-success);color:var(--primary-foreground);font-weight:600;}
.sp2-fit.full{background:color-mix(in oklab,var(--status-success) 12%,transparent);color:var(--status-success);}
.sp2-fit.part{background:color-mix(in oklab,var(--status-caution) 12%,transparent);color:var(--status-caution);}
.sp2-fit.none{background:var(--muted);color:var(--status-neutral);}
</style>
</head>
<body>

<div class="sp2">

  <!-- Header -->
  <div class="sp2-hdr">
    <div class="sp2-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6fd4ff" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <h1>Shift Planner</h1>
      <span class="sp2-title-sub" id="sp2Sub">—</span>
    </div>
    <div class="sp2-date">
      <button class="sp2-nav-btn" onclick="sp2Shift(-1)" title="Previous day">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <input class="sp2-date-inp" id="sp2Date" value="Wed 19 Nov 2026" onchange="sp2Render()">
      <button class="sp2-nav-btn" onclick="sp2Shift(1)" title="Next day">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <button class="sp2-today" onclick="sp2Today()">Today</button>
    </div>
  </div>

  <div class="sp2-body" id="sp2Body" data-view="v">

    <!-- ══ Column 1 — the orders, on a timeline ══ -->
    <div class="sp2-col sp2-col-orders">
      <div class="sp2-col-hdr">
        <span class="sp2-col-title">Orders</span>
        <span class="sp2-count" id="sp2OrdCount">0</span>
        <span class="sp2-vs" id="sp2Vs"></span>

        <div class="sp2-hdr-tools">
          <div class="sp2-seg" id="sp2Quick">
            <button class="sp2-seg-btn on" data-q="unplanned" onclick="sp2SetQuick('unplanned')">Unplanned <span class="sp2-seg-n" id="sp2nUn"></span></button>
            <button class="sp2-seg-btn"    data-q="planned"   onclick="sp2SetQuick('planned')">Planned <span class="sp2-seg-n" id="sp2nPl"></span></button>
            <button class="sp2-seg-btn"    data-q="all"       onclick="sp2SetQuick('all')">All <span class="sp2-seg-n" id="sp2nAll"></span></button>
          </div>
          <div class="sp2-seg">
            <button class="sp2-seg-btn" data-v="h" onclick="sp2SetView('h')" title="Horizontal timeline">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="7" y1="8" x2="7" y2="16"/><line x1="14" y1="8" x2="14" y2="16"/></svg>
            </button>
            <button class="sp2-seg-btn on" data-v="v" onclick="sp2SetView('v')" title="Vertical timeline">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="3" x2="12" y2="21"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="14" x2="16" y2="14"/></svg>
            </button>
          </div>
          <button class="sp2-ico-btn sm" onclick="sp2PopOut('orders')" title="Open this column in its own window"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></button>
        </div>
      </div>

      <div class="sp2-tl-wrap" id="sp2TlWrap">
        <div class="sp2-tl" id="sp2Tl"></div>
      </div>
    </div>

    <div class="sp2-split" id="sp2Split" title="Drag to resize"></div>

    <!-- ══ Column 2 — the driver, and the rig mapped to them ══ -->
    <div class="sp2-col sp2-col-unit">
      <div class="sp2-col-hdr">
        <span class="sp2-col-title">Driver &amp; truck</span>
        <span class="sp2-count" id="sp2DrvCount">0</span>
        <input class="sp2-search" id="sp2DrvSearch" placeholder="Search driver, truck or hub" oninput="sp2RenderUnit()">
