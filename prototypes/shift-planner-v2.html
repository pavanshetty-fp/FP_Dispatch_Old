            <button class="sp2-seg-btn on" data-s="all" onclick="sp2SetShift('all')">All</button>
            <button class="sp2-seg-btn"    data-s="am"  onclick="sp2SetShift('am')">AM</button>
            <button class="sp2-seg-btn"    data-s="pm"  onclick="sp2SetShift('pm')">PM</button>
          </div>
          <div class="sp2-seg" id="sp2DenseSeg">
            <button class="sp2-seg-btn on" data-z="compact" onclick="sp2SetDense('compact')" title="Compact — more drivers on screen">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="3" y1="14" x2="21" y2="14"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <button class="sp2-seg-btn" data-z="full" onclick="sp2SetDense('full')" title="Full — every compartment spelled out">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="14" width="18" height="7" rx="1.5"/></svg>
            </button>
          </div>
          <button class="sp2-ico-btn sm" onclick="sp2PopOut('drivers')" title="Open this column in its own window"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></button>
        </div>
      </div>

      <div class="sp2-lanes-wrap" id="sp2V2"></div>
    </div>

    <!-- the trailers this yard has, picked when one is hitched -->
    <div class="sp2-pop" id="sp2TrlPop"></div>
  </div>
</div>

<div id="sp2Toast"></div>

<script>
// ══════════════════════════════════════════════════════════
//  Reference data
// ══════════════════════════════════════════════════════════
var SP2_PROD_COLORS = {
  'UNL87':'#c4a319', 'UNL93':'#8a6cff', 'CLR DSL':'#2f9be0',
  'HO DSL':'#e0483f', 'Diesel DEF':'#46cf9c', 'Kerosene':'#c8ccd2',
};

// shifts as the docs have them: early 05:00–13:00 / 06:00–14:00, late 07:00–15:00 / 08:00–16:00
var SP2_SHIFTS = {
  e5:{ name:'Early', from:300, to:780 }, e6:{ name:'Early', from:360, to:840 },
  l7:{ name:'Late',  from:420, to:900 }, l8:{ name:'Late',  from:480, to:960 },
};

// A truck is a spec plus a number. Compartment counts and capacities are fixed
// physical properties of the spec; what is in them right now is the day's state.
var SP2_SPECS = [
  { pre:'BT', type:'Bobtail',    meter:210, caps:[1200,900,700] },
  { pre:'TW', type:'Tank wagon', meter:320, caps:[2000,2000,1000] },
  { pre:'PB', type:'Tank wagon', meter:380, caps:[2000,1500,1500,1000] },
  { pre:'HV', type:'Transport',  meter:620, caps:[2000,2000,2000,1500,1500] },
  { pre:'LT', type:'Transport',  meter:580, caps:[2500,2500,2000,2000,1500] },
];

// A trailer is hitched behind the truck and carries its own compartments.
var SP2_TRAILERS = {
  'TR-200': { type:'Pup trailer',   caps:[1800,1200] },
  'TR-410': { type:'Tandem pup',    caps:[2000,2000,1000] },
  'TR-660': { type:'Full trailer',  caps:[2500,2500,2000] },
};

// Ten drivers in each of the three states the fleet reports.
var SP2_ROSTER = [
  ['driving',  'Arpita Shah'],     ['driving',  'Marcus Webb'],    ['driving',  'Linh Tran'],
  ['driving',  'Diego Fuentes'],   ['driving',  'Samuel Okafor'],  ['driving',  'Nadia Rahman'],
  ['driving',  'Grace Okonkwo'],   ['driving',  'Hector Alvarez'], ['driving',  'Mei Lin Chow'],
  ['driving',  'Ivan Petrov'],
  ['on-duty',  'Priya Sharma'],    ['on-duty',  'Alex Moreau'],    ['on-duty',  'Ravi Patel'],
  ['on-duty',  'Dana Whitfield'],  ['on-duty',  'Yusuf Demir'],    ['on-duty',  'Carla Mendes'],
  ['on-duty',  'Owen Fitzgerald'], ['on-duty',  'Aisha Bello'],    ['on-duty',  'Pablo Ruiz'],
  ['on-duty',  'Jenny Kwon'],
  ['off-duty', 'Omar Khalid'],     ['off-duty', 'Beatrice Lang'],  ['off-duty', 'Kofi Mensah'],
  ['off-duty', 'Svetlana Orlov'],  ['off-duty', 'Tomas Herrera'],  ['off-duty', 'Rachel Nguyen'],
  ['off-duty', 'Miles Donovan'],   ['off-duty', 'Farah Haddad'],   ['off-duty', 'Gus Lindqvist'],
  ['off-duty', 'Noor Siddiqui'],
];

var SP2_HUBS   = ['Denver Hub','Phoenix Hub','Portland Hub','Tampa Hub','San Jose Hub'];
var SP2_SHIFTK = ['e6','e5','l7','l8'];
var SP2_PRODS  = ['UNL87','CLR DSL','HO DSL','UNL93','Diesel DEF','Kerosene'];

var SP2_TRUCKS = {};
var SP2_DRIVERS = {};
(function buildFleet() {
  SP2_ROSTER.forEach(function (row, i) {
    var state = row[0], name = row[1];
    var spec  = SP2_SPECS[i % SP2_SPECS.length];
    var truck = spec.pre + '-' + (4 + i * 3);
    SP2_TRUCKS[truck] = { type:spec.type, meter:spec.meter,
                          comps:spec.caps.map(function (c) { return { cap:c }; }) };

    // A truck that is already rolling is rarely empty; one that is off duty is.
    // A few leave the yard loaded out, with no room left for anything else.
    var loaded = state !== 'off-duty' && i % 7 === 3;
    var load = spec.caps.map(function (cap, c) {
      if (loaded) return { p:SP2_PRODS[(i + c) % SP2_PRODS.length], q:cap };
      if (state === 'off-duty' || (i + c) % 3 === 0) return { p:'', q:0 };
      var p = SP2_PRODS[(i + c * 2) % SP2_PRODS.length];
      var frac = (i + c) % 4 === 1 ? 1 : ((i * 7 + c * 13) % 55 + 35) / 100;
      return { p:p, q:Math.round(cap * frac / 50) * 50 };
    });

    // Transports tend to pull a trailer; the rest start without one.
    var trl = spec.type === 'Transport' && i % 2 === 0
            ? Object.keys(SP2_TRAILERS)[i % 3] : null;

    SP2_DRIVERS['d' + i] = {
      name:name, state:state, truck:truck, shift:SP2_SHIFTK[i % 4],
      hub:SP2_HUBS[i % SP2_HUBS.length],
      synced: state === 'off-duty' ? 90 + i * 7 : state === 'driving' ? 1 + (i % 9) : 4 + (i % 26),
      load:load,
      trailer:trl,
      tload: trl ? SP2_TRAILERS[trl].caps.map(function () { return { p:'', q:0 }; }) : [],
    };
  });
})();

// Order type is a field on the order: Delivery · Extraction · Transfer.
// A planned order carries a driver; an unplanned one has none yet.
var SP2_SHIPTOS = [
  ['Morris Group — Upstairs Hub',     '1180 Wewatta St, Denver CO 80202'],
  ['Acme Fuel Co — Branch 1A',        '20400 Stevens Creek Blvd, Cupertino CA 95014'],
  ['Dean Ltd — SJ Main',              '2130 N First St, San Jose CA 95131'],
  ['Aguilar and Sons — Tampa HQ',     '4221 W Boy Scout Blvd, Tampa FL 33607'],
  ["Jeff's Jalopies — Tucson Main",   '3760 E Speedway Blvd, Tucson AZ 85716'],
  ['Sunbelt Pump — PC268',            '1409 John Sims Pkwy, Niceville FL 32578'],
  ['Clearwater Utilities — Portland', '1500 SW 1st Ave, Portland OR 97201'],
  ['Morris Group — Downtown',         '1601 Blake St, Denver CO 80202'],
  ['Dean Ltd — Oakland Depot',        '800 Embarcadero W, Oakland CA 94607'],
  ['Morris Group — East Depot',       '5400 Havana St, Denver CO 80239'],
  ['Granite Ridge Quarry — Pit 3',    '7725 W Colfax Ave, Lakewood CO 80214'],
  ['Northwind Transit — Yard B',      '2800 NE Holman St, Portland OR 97211'],
  ['Cactus Freight — Gate 12',        '4402 E Elwood St, Phoenix AZ 85040'],
  ['Pinecrest Schools — Bus Barn',    '9015 SW Barbur Blvd, Portland OR 97219'],
  ['Harbor Marine — Slip 40',         '1 Ferry Plaza, San Francisco CA 94111'],
  ['Redrock Mining — Haul Road',      '1550 S Highway 191, Moab UT 84532'],
  ['Valley Co-op — Silo Row',         '600 N Main St, Greeley CO 80631'],
  ['Summit Builders — Site 7',        '3300 E 1st Ave, Denver CO 80206'],
];
var SP2_TYPES = ['Delivery','Delivery','Delivery','Transfer','Delivery','Extraction'];

var SP2_ORDERS = (function buildOrders() {
  var out = [], n = 36;
  for (var i = 0; i < n; i++) {
    var st = SP2_SHIPTOS[i % SP2_SHIPTOS.length];
    // two products on every third order, one otherwise
    var prods = [{ p:SP2_PRODS[i % SP2_PRODS.length], q:(((i * 5) % 7) + 8) * 200 }];
    if (i % 3 === 1) prods.push({ p:SP2_PRODS[(i + 2) % SP2_PRODS.length], q:(((i * 3) % 5) + 4) * 200 });
    // two thirds of the day's orders are already planned, spread over the roster
    var planned = i % 3 !== 2;
    out.push({
      id:'D-' + (5157060 + i),
      ship:st[0], addr:st[1],
      t:305 + ((i * 47) % 740),                 // 05:05 through 21:25
      type:SP2_TYPES[i % SP2_TYPES.length],
      driver: planned ? 'd' + ((i * 7) % 30) : '',
      prods:prods,
    });
  }
  return out;
})();

// ══════════════════════════════════════════════════════════
//  State
// ══════════════════════════════════════════════════════════
var sp2Quick = 'unplanned';    // unplanned · planned · all — the column is the
                               // still-to-plan list, so an assigned order leaves it
var sp2Shift_ = 'all';         // all · am · pm — which drivers' shifts, not which orders
var sp2Driver = 'd0';
var sp2DrvFilter = 'all';
var sp2Dense = 'compact';    // compact · full — the chosen lane is always full        // v1 roster + one rig · v2 a lane per driver   // all · driving · on-duty · off-duty
var sp2Drag = null;          // the order id being dragged
var sp2MoveFrom = null;      // a compartment picked up, waiting for somewhere to go
// The planner has no clock of its own — the day is fixed — so 'now' is a
// stated time rather than a real one. It is what makes a shift read as
// started, running or over.
var SP2_NOW = 13 * 60 + 30;  // 13:30 — late enough that the early shift has ended
                             // and the later ones are still running, so the three
                             // standings are not all the same
var sp2SelOrder = null;
var sp2View = 'v';            // v vertical (the default) · h horizontal

var SP2_HOUR_W = 132;          // pixels per hour on the timeline
var SP2_CARD_W = 206;

function sp2Hhmm(m){ return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); }
function sp2Short(m){
  var h24 = Math.floor(m/60), mm = m%60, h = h24%12===0 ? 12 : h24%12;
  return h + (mm ? ':'+String(mm).padStart(2,'0') : '') + (h24<12 ? 'a' : 'p');
}
function sp2ShiftLabel(k){ var s = SP2_SHIFTS[k]; return s ? s.name + ' ' + sp2Hhmm(s.from) + '–' + sp2Hhmm(s.to) : '—'; }
function sp2Planned(o){ return !!o.driver; }
function sp2Gal(o){ return o.prods.reduce(function(s,p){ return s+p.q; },0); }

// The timeline draws the whole working day. The shift filter no longer cuts it
// down — a shift belongs to a driver, so it narrows the driver list instead.
function sp2Window() { return { from:5*60, to:22*60 }; }

// AM is the early shifts, PM the late ones, as the docs name them.
function sp2ShiftBand(k) { return (SP2_SHIFTS[k] && SP2_SHIFTS[k].name === 'Early') ? 'am' : 'pm'; }

function sp2Visible() {
  var w = sp2Window();
  return SP2_ORDERS.filter(function(o) {
    if (o.t < w.from || o.t > w.to) return false;
    if (sp2Quick === 'planned')   return sp2Planned(o);
    if (sp2Quick === 'unplanned') return !sp2Planned(o);
    return true;
  }).sort(function(a,b){ return a.t - b.t; });
}

// ══════════════════════════════════════════════════════════
//  Column 1 — the timeline
// ══════════════════════════════════════════════════════════
// What the chosen rig could take of an order, without loading anything. Packed
// the same way a real drop would be — top up a compartment already holding the
// product, then take an empty one — so the number is the one you would get.
function sp2FitFor(k, o) {
  var d = SP2_DRIVERS[k];
  if (!d || !SP2_TRUCKS[d.truck]) return null;
  var cells = sp2Cells(k).map(function (c) { return { cap:c.cap, p:c.l.p, q:c.l.q }; });
  var cap = cells.reduce(function (s, c) { return s + c.cap; }, 0);
  var fits = 0, total = sp2Gal(o);
  o.prods.forEach(function (pr) {
    var left = pr.q;
    [1, 2].forEach(function (pass) {
      cells.forEach(function (c) {
        if (!left) return;
        var same = c.p === pr.p, empty = !c.p || c.q === 0;
        if (pass === 1 ? !(same && c.q > 0) : !empty) return;
        if (pass === 2) c.p = pr.p;
        var take = Math.min(c.cap - c.q, left);
        c.q += take; left -= take; fits += take;
      });
    });
  });
  var after = cells.reduce(function (s, c) { return s + c.q; }, 0);
  return { fits:fits, total:total, over:total - fits,
           pct: total ? Math.round(fits / total * 100) : 0,
           rigPct: cap ? Math.round(after / cap * 100) : 0 };
}

// The chip that says it. "Fills the truck" is the one worth looking for: the
// whole order goes on AND the rig leaves full.
function sp2FitChip(o) {
  if (o.driver) return '';
  var f = sp2FitFor(sp2Driver, o);
  if (!f) return '';
  var d = SP2_DRIVERS[sp2Driver];
  var why = 'Against ' + d.name + ' · ' + d.truck + ' — ' + f.fits.toLocaleString() +
            ' of ' + f.total.toLocaleString() + ' gal would load, leaving the rig ' + f.rigPct + '% full';
  var cls, text;
  if (f.pct >= 100 && f.rigPct >= 100) { cls = 'perfect'; text = 'Fills the truck'; }
  else if (f.pct >= 100)               { cls = 'full';    text = 'Fits · rig ' + f.rigPct + '%'; }
  else if (f.pct > 0)                  { cls = 'part';    text = f.pct + '% fits · ' + f.over.toLocaleString() + ' gal over'; }
  else                                 { cls = 'none';    text = 'No room'; }
  return '<span class="sp2-fit ' + cls + '" title="' + why + '">' + text + '</span>';
}

// The card is the same in every view; only where it sits changes.
function sp2CardHtml(o, style) {
  var planned = sp2Planned(o);
  var chips = o.prods.map(function(pr) {
    var col = SP2_PROD_COLORS[pr.p] || 'var(--fp-ink-3)';
    return '<span class="sp2-chip"><span class="sp2-dot" style="background:' + col + ';"></span>' +
           pr.p + ' <span class="sp2-chip-q">' + pr.q.toLocaleString() + '</span></span>';
  }).join('');
  return '<div class="sp2-card ' + (planned ? 'planned' : 'unplanned') +
      (sp2SelOrder === o.id ? ' sel' : '') + '" ' + (style ? 'style="' + style + '" ' : '') +
      'draggable="true" ondragstart="sp2DragStart(event,\'' + o.id + '\')" ondragend="sp2DragEnd()" ' +
      'onclick="sp2PickOrder(\'' + o.id + '\')" title="Drag onto the truck to load it · ' + o.ship + '">' +
    '<div class="sp2-card-top"><span class="sp2-ord">' + o.id + '</span>' +
      '<span class="sp2-time-lbl">' + sp2Hhmm(o.t) + '</span></div>' +
    '<div class="sp2-ship">' + o.ship + '</div>' +
    '<div class="sp2-addr">' + o.addr + '</div>' +
    '<div class="sp2-prods">' + chips + '</div>' +
    '<div class="sp2-card-foot">' +
      '<span class="sp2-pill ' + (planned ? 'sp2-pill-planned' : 'sp2-pill-unplanned') + '">' +
        (planned ? 'Planned' : 'Unplanned') + '</span>' +
      '<span class="sp2-type">' + o.type + '</span>' +
    '</div>' +
    sp2FitChip(o) +
  '</div>';
}

// Time runs down a rail instead of across the top. The gap between two orders
// is written on the rail, so the shape of the day still reads without an axis
// wide enough to scale it.
function sp2RenderVertical(orders) {
  if (!orders.length) return '<div class="sp2-empty">No orders in this window — widen the shift range or clear the filter.</div>';
  var rows = orders.map(function(o, i) {
    var gap = '';
    if (i) {
      var mins = o.t - orders[i-1].t;
      if (mins >= 45) {
        var h = Math.floor(mins/60), m = mins%60;
        gap = '<div class="sp2-vgap">' + (h ? h + 'h ' : '') + (m ? m + 'm' : '') + ' later</div>';
      }
    }
    return gap + '<div class="sp2-vrow ' + (sp2Planned(o) ? 'planned' : 'unplanned') + '">' +
      '<span class="sp2-vtime">' + sp2Hhmm(o.t) + '</span>' +
      '<span class="sp2-vnode"></span>' +
      '<div class="sp2-vcard">' + sp2CardHtml(o) + '</div>' +
    '</div>';
  }).join('');
  return '<div class="sp2-vt"><div class="sp2-vt-rail"></div>' + rows + '</div>';
}

function sp2RenderTimeline() {
  var orders = sp2Visible();
  var tl = document.getElementById('sp2Tl');

  if (sp2View !== 'h') {
    tl.classList.add('sp2-flow');
    tl.style.padding = '0';
    tl.innerHTML = sp2RenderVertical(orders);
    sp2Counts();
    return;
  }
  tl.classList.remove('sp2-flow');
  tl.style.padding = '';

  var w = sp2Window();
  var hours = Math.ceil((w.to - w.from) / 60);

  var ruler = '';
  for (var i = 0; i <= hours; i++) {
    var m = w.from + i*60;
    var h24 = Math.floor((m % 1440) / 60);
    var tick = h24 === 0 ? '12a' : h24 === 12 ? '12p' : String(h24 % 12 === 0 ? 12 : h24 % 12);
    ruler += '<div class="sp2-hour" style="width:' + SP2_HOUR_W + 'px;">' + tick + '</div>';
  }

  if (!orders.length) {
    tl.innerHTML = '<div class="sp2-ruler">' + ruler + '</div>' +
      '<div class="sp2-empty">No orders in this window — widen the shift range or clear the filter.</div>';
    sp2Counts();
    return;
  }

  // lane packing: an order takes a lane where it does not overlap what is already there
  var lanes = [];
  orders.forEach(function(o) {
    var x = ((o.t - w.from) / 60) * SP2_HOUR_W;
    var placed = false;
    for (var li = 0; li < lanes.length && !placed; li++) {
      var last = lanes[li][lanes[li].length - 1];
      if (x >= last.x + SP2_CARD_W + 8) { lanes[li].push({ o:o, x:x }); placed = true; }
    }
    if (!placed) lanes.push([{ o:o, x:x }]);
  });

  var trackW = Math.max(hours * SP2_HOUR_W, 600);
  var grid = '';
  for (var g = 0; g <= hours; g++) grid += '<div class="sp2-grid-col" style="width:' + SP2_HOUR_W + 'px;"></div>';

  var lanesHtml = lanes.map(function(lane) {
    var cards = lane.map(function(slot) {
      return sp2CardHtml(slot.o, 'left:' + slot.x + 'px;width:' + SP2_CARD_W + 'px;');
    }).join('');
    return '<div class="sp2-lane" style="width:' + trackW + 'px;">' +
      '<div class="sp2-grid">' + grid + '</div>' + cards + '</div>';
  }).join('');

  tl.innerHTML = '<div class="sp2-ruler">' + ruler + '</div>' +
    '<div class="sp2-lanes" style="width:' + trackW + 'px;">' + lanesHtml + '</div>';
  sp2Counts();
}

function sp2Counts() {
  var w = sp2Window();
  var inWindow = SP2_ORDERS.filter(function(o){ return o.t >= w.from && o.t <= w.to; });
  var pl = inWindow.filter(sp2Planned).length;
  document.getElementById('sp2nAll').textContent = inWindow.length;
  document.getElementById('sp2nUn').textContent  = inWindow.length - pl;
  document.getElementById('sp2nPl').textContent  = pl;
  document.getElementById('sp2OrdCount').textContent = sp2Visible().length;
  var d = SP2_DRIVERS[sp2Driver], vs = document.getElementById('sp2Vs');
  if (vs) vs.textContent = d ? 'fit vs ' + d.truck : '';
}

function sp2SetQuick(q) {
  sp2Quick = q;
  document.querySelectorAll('#sp2Quick .sp2-seg-btn').forEach(function(b) {
    b.classList.toggle('on', b.dataset.q === q);
  });
  sp2RenderTimeline();
}
function sp2SetView(v) {
  sp2View = v;
  document.querySelectorAll('[data-v]').forEach(function(b) {
    b.classList.toggle('on', b.dataset.v === v);
  });
  document.getElementById('sp2Body').setAttribute('data-view', v);
  // the shift range still filters, but only the horizontal view draws a scale
  document.getElementById('sp2TlWrap').style.overflowX = v === 'h' ? 'auto' : 'hidden';
  sp2RenderTimeline();
}

function sp2SetShift(s) {
  sp2Shift_ = s;
  document.querySelectorAll('[data-s]').forEach(function(b) {
    b.classList.toggle('on', b.dataset.s === s);
  });
  sp2RenderUnit();
}

// Only two controls sit in the header: the view switch, and this. Everything
// that narrows the list lives behind it, with a dot when it is narrowing.
function sp2PopAt(id, btn) {
  var p = document.getElementById(id), open = !p.classList.contains('on');
  document.querySelectorAll('.sp2-pop').forEach(function (x) { x.classList.remove('on'); });
  if (!open) return false;
  p.classList.add('on');
  var r = btn.getBoundingClientRect();
  p.style.top  = (r.bottom + 6) + 'px';
  p.style.left = Math.max(8, Math.min(window.innerWidth - p.offsetWidth - 8,
                                      r.right - p.offsetWidth)) + 'px';
  return true;
}
document.addEventListener('mousedown', function (e) {
  if (e.target.closest('.sp2-pop') || e.target.closest('.sp2-ico-btn') ||
      e.target.closest('.sp2-trl-btn')) return;
  document.querySelectorAll('.sp2-pop').forEach(function (x) { x.classList.remove('on'); });
});

// picking an order shows the driver it is planned on
function sp2PickOrder(id) {
  sp2SelOrder = id;
  var o = SP2_ORDERS.filter(function(x){ return x.id === id; })[0];
  if (o && o.driver) sp2Driver = o.driver;
  sp2Render();
  if (o && !o.driver) sp2Toast(o.id + ' has no driver yet — it sits unplanned');
}

// ══════════════════════════════════════════════════════════
//  Column 2 — driver, and the truck mapped to them
// ══════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════
//  Column 2 · Section 1 — the roster
// ══════════════════════════════════════════════════════════
var SP2_STATES = [['driving','Driving'], ['on-duty','On duty'], ['off-duty','Off duty']];

function sp2StateWord(s) {
  for (var i = 0; i < SP2_STATES.length; i++) if (SP2_STATES[i][0] === s) return SP2_STATES[i][1];
  return s;
}
function sp2Synced(m) {
  if (m < 60) return m + ' min ago';
  var h = Math.round(m / 60);
  return h < 24 ? h + ' hr ago' : Math.round(h / 24) + ' days ago';
}
// Available is not a fourth duty state — it crosses them. A driver is
// available when they are on the roster today and the rig still has room.
function sp2Avail(d) {
  if (d.state === 'off-duty') return false;
  var a = sp2Sum(SP2_TRUCKS[d.truck].comps.map(function (c) { return c.cap; }), d.load);
  var b = d.trailer ? sp2Sum(SP2_TRAILERS[d.trailer].caps, d.tload) : { cap:0, q:0 };
  return (a.q + b.q) < (a.cap + b.cap);
}

function sp2DriverKeys() {
  var q = (document.getElementById('sp2DrvSearch').value || '').toLowerCase().trim();
  return Object.keys(SP2_DRIVERS).filter(function (k) {
    var d = SP2_DRIVERS[k];
    if (sp2Shift_ !== 'all' && sp2ShiftBand(d.shift) !== sp2Shift_) return false;
    if (sp2DrvFilter === 'available') { if (!sp2Avail(d)) return false; }
    else if (sp2DrvFilter !== 'all' && d.state !== sp2DrvFilter) return false;
    if (q && (d.name + ' ' + d.truck + ' ' + d.hub).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}

// One row per driver. The chosen one opens in place — its orders, its gallons
// and the way into the full record — so the roster never leaves the screen.
function sp2DrvCounts(shown) {
  var all = Object.keys(SP2_DRIVERS);
  var n = function (s) { return all.filter(function (k) { return SP2_DRIVERS[k].state === s; }).length; };
  document.getElementById('sp2dAll').textContent = all.length;
  document.getElementById('sp2dAv').textContent =
    all.filter(function (k) { return sp2Avail(SP2_DRIVERS[k]); }).length;
  document.getElementById('sp2dDr').textContent  = n('driving');
  document.getElementById('sp2dOn').textContent  = n('on-duty');
  document.getElementById('sp2dOff').textContent = n('off-duty');
  document.getElementById('sp2DrvCount').textContent = shown;
}

function sp2SetDrvFilter(f) {
  sp2DrvFilter = f;
  document.querySelectorAll('[data-d]').forEach(function (b) {
    b.classList.toggle('on', b.dataset.d === f);
  });
  sp2RenderUnit();
}

// Compact is only a density, not a different render: the chosen lane stays
// full, so you can scan thirty rigs and still work the one you are on.
function sp2SetDense(z) {
  sp2Dense = z;
  document.querySelectorAll('[data-z]').forEach(function (b) {
    b.classList.toggle('on', b.dataset.z === z);
  });
  document.getElementById('sp2V2').setAttribute('data-dense', z);
}

// ══════════════════════════════════════════════════════════
//  Column 2 · Section 2 — the rig, drawn
// ══════════════════════════════════════════════════════════
// Truck and trailer are the same thing twice, so one function draws both. The
// compartments divide the tank by capacity, and the load rises inside them.
function sp2Sum(caps, load) {
  var cap = caps.reduce(function (a, c) { return a + c; }, 0);
  var q = caps.reduce(function (a, c, i) { return a + ((load[i] && load[i].q) || 0); }, 0);
  return { cap:cap, q:q, pct:cap ? Math.round(q / cap * 100) : 0 };
}

// ── the trailer yard ──────────────────────────────────────
var sp2TrlFor = null;       // the driver the trailer popover is hitching to


// ══════════════════════════════════════════════════════════
//  Shift standing, and moving fuel between compartments
// ══════════════════════════════════════════════════════════
function sp2Dur(m) {
  m = Math.max(0, Math.round(m));
  var h = Math.floor(m / 60);
  return (h ? h + 'h ' : '') + (m % 60) + 'm';
}

// Where the driver is in their shift right now — the thing a dispatcher wants
// before handing them another drop.
function sp2ShiftState(d) {
  var s = SP2_SHIFTS[d.shift];
  if (!s) return null;
  var span = s.to - s.from, done = SP2_NOW - s.from;
  if (done < 0)      return { kind:'before',  pct:0,   note:'starts in ' + sp2Dur(-done), s:s, span:span };
  if (done >= span)  return { kind:'over',    pct:100, note:'ended ' + sp2Dur(done - span) + ' ago', s:s, span:span };
  return { kind:'running', pct:Math.round(done / span * 100),
           note:sp2Dur(span - done) + ' left', s:s, span:span };
}

function sp2ShiftStrip(d) {
  var st = sp2ShiftState(d);
  if (!st) return '';
  var word = st.kind === 'before' ? 'Not started' : st.kind === 'over' ? 'Shift over' : 'Mid-shift';
  return '<div class="sp2-shift ' + st.kind + '">' +
      '<div class="sp2-shift-top">' +
        '<span class="sp2-shift-win">' + sp2ShiftLabel(d.shift) + '</span>' +
        '<span class="sp2-shift-word">' + word + '</span>' +
        '<span class="sp2-shift-left">' + st.note + '</span>' +
      '</div>' +
      '<div class="sp2-shift-bar">' +
        '<div class="sp2-shift-done" style="width:' + st.pct + '%;"></div>' +
        (st.kind === 'running' ? '<span class="sp2-shift-now" style="left:' + st.pct + '%;"></span>' : '') +
      '</div>' +
      '<div class="sp2-shift-sub">' + sp2Dur(st.span) + ' shift · 30 min buffer · now ' + sp2Hhmm(SP2_NOW) + '</div>' +
    '</div>';
}

// One compartment, wherever it sits on the rig.
function sp2Cell(k, unit, i) {
  var d = SP2_DRIVERS[k];
  if (unit === 'trailer') {
    var tr = d.trailer && SP2_TRAILERS[d.trailer];
    return tr ? { cap:tr.caps[i], l:d.tload[i] } : null;
  }
  return { cap:SP2_TRUCKS[d.truck].comps[i].cap, l:d.load[i] };
}

// Moving fuel is a quantity, not a compartment. Pick the compartment it comes
// out of, pick the one it goes into, then say how much — all of it, or 200 gal
// of it. One product per compartment still holds, so the destination has to be
// empty or already hold the same thing.
var sp2MoveTo = null, sp2MoveMax = 0;

function sp2CompClick(e, k, unit, i) {
  e.stopPropagation();
  var here = sp2Cell(k, unit, i);
  if (!here) return;

  if (!sp2MoveFrom) {
    if (!here.l.q) return;                       // nothing in it to move
    sp2MoveFrom = { k:k, unit:unit, i:i };
    sp2RenderUnit();
    sp2Toast('Moving ' + here.l.p + ' — pick the compartment it goes into');
    return;
  }
  if (sp2MoveFrom.k === k && sp2MoveFrom.unit === unit && sp2MoveFrom.i === i)
    return sp2MoveCancel();                      // put it back
  if (sp2MoveFrom.k !== k) {
    sp2Toast('Fuel moves between compartments of one rig, not between trucks');
    return sp2MoveCancel();
  }

  var from = sp2Cell(k, sp2MoveFrom.unit, sp2MoveFrom.i);
  if (here.l.q && here.l.p !== from.l.p)
    return sp2Toast('That compartment holds ' + here.l.p + ' — one product per compartment');
  var room = here.cap - here.l.q;
  if (room <= 0) return sp2Toast('That compartment is full');

  sp2MoveTo = { unit:unit, i:i };
  sp2MoveMax = Math.min(from.l.q, room);
  var step = sp2MoveMax >= 400 ? 50 : 10;
  document.getElementById('sp2TrlPop').innerHTML =
    '<div class="sp2-pop-ttl">Move ' + from.l.p + ' · ' +
      sp2CompName(sp2MoveFrom.unit, sp2MoveFrom.i) + ' → ' + sp2CompName(unit, i) + '</div>' +
    '<div class="sp2-move">' +
      '<input class="sp2-move-range" id="sp2MoveR" type="range" min="0" step="' + step + '" max="' +
        sp2MoveMax + '" value="' + sp2MoveMax + '" oninput="sp2MoveSync(this.value)">' +
      '<div class="sp2-move-row">' +
        '<input class="sp2-time" id="sp2MoveN" value="' + sp2MoveMax + '" oninput="sp2MoveSync(this.value)">' +
        '<span class="sp2-move-of">gal of ' + from.l.q.toLocaleString() +
          ' · room for ' + room.toLocaleString() + '</span>' +
      '</div>' +
      '<div class="sp2-move-quick">' +
        '<button class="sp2-fix" onclick="sp2MoveSync(' + Math.round(sp2MoveMax * 0.25) + ')">25%</button>' +
        '<button class="sp2-fix" onclick="sp2MoveSync(' + Math.round(sp2MoveMax * 0.5) + ')">50%</button>' +
        '<button class="sp2-fix" onclick="sp2MoveSync(' + sp2MoveMax + ')">All</button>' +
        '<button class="sp2-view" style="margin-left:auto;height:28px;padding:0 14px;font-size:12px;" ' +
          'onclick="sp2DoMove(\'' + k + '\')">Move</button>' +
      '</div>' +
    '</div>';
  sp2PopAt('sp2TrlPop', e.currentTarget);
}

function sp2CompName(unit, i) { return (unit === 'trailer' ? 'Trailer C' : 'C') + (i + 1); }

function sp2MoveSync(v) {
  v = Math.max(0, Math.min(sp2MoveMax, Math.round(+v || 0)));
  var r = document.getElementById('sp2MoveR'), n = document.getElementById('sp2MoveN');
  if (r) r.value = v;
  if (n && +n.value !== v) n.value = v;
}

function sp2MoveCancel() {
  sp2MoveFrom = null; sp2MoveTo = null;
  var pop = document.getElementById('sp2TrlPop');
  if (pop) pop.classList.remove('on');
  sp2Render();          // moving fuel changes what else would fit
}

function sp2DoMove(k) {
  if (!sp2MoveFrom || !sp2MoveTo) return sp2MoveCancel();
  var n = document.getElementById('sp2MoveN');
  var qty = Math.max(0, Math.min(sp2MoveMax, Math.round(+(n && n.value) || 0)));
  if (!qty) return sp2MoveCancel();
  var from = sp2Cell(k, sp2MoveFrom.unit, sp2MoveFrom.i);
  var to   = sp2Cell(k, sp2MoveTo.unit,   sp2MoveTo.i);
  var prod = from.l.p;
  from.l.q -= qty;
  if (!from.l.q) from.l.p = '';
  to.l.p = prod;
  to.l.q += qty;
  var what = sp2CompName(sp2MoveFrom.unit, sp2MoveFrom.i) + ' → ' + sp2CompName(sp2MoveTo.unit, sp2MoveTo.i);
  sp2MoveCancel();
  sp2Toast(qty.toLocaleString() + ' gal of ' + prod + ' moved · ' + what);
}

// ── changing who drives what ─────────────────────────────
// Both pickers are the same move underneath: two drivers trade rigs. Changing
// the driver takes the planned orders along, because the work is going with
// the truck; changing the truck leaves them where they are.
function sp2TradeRigs(a, b, withOrders) {
  var A = SP2_DRIVERS[a], B = SP2_DRIVERS[b], tmp;
  ['truck', 'load', 'trailer', 'tload'].forEach(function (f) {
    tmp = A[f]; A[f] = B[f]; B[f] = tmp;
  });
  if (withOrders) SP2_ORDERS.forEach(function (o) {
    if (o.driver === a) o.driver = b; else if (o.driver === b) o.driver = a;
  });
}

function sp2TruckPop(btn, k) {
  var mine = SP2_DRIVERS[k].truck;
  var rows = Object.keys(SP2_TRUCKS).map(function (id) {
    var sp = SP2_TRUCKS[id];
    var holder = Object.keys(SP2_DRIVERS).filter(function (x) { return SP2_DRIVERS[x].truck === id; })[0];
    var cap = sp.comps.reduce(function (s, c) { return s + c.cap; }, 0);
    return '<button class="sp2-pop-item' + (id === mine ? ' on' : '') +
        '" onclick="sp2PickTruck(\'' + k + '\',\'' + id + '\')">' +
        '<span class="sp2-pop-item-id">' + id + (id === mine ? ' · current' : '') + '</span>' +
        '<span class="sp2-pop-item-sub">' + sp.type + ' · ' + sp.comps.length + ' comps · ' +
          cap.toLocaleString() + ' gal' + (holder && holder !== k ? ' · ' + SP2_DRIVERS[holder].name : '') +
        '</span></button>';
  }).join('');
  document.getElementById('sp2TrlPop').innerHTML =
    '<div class="sp2-pop-ttl">Give ' + SP2_DRIVERS[k].name + ' a different truck</div>' +
    '<div class="sp2-pop-scroll">' + rows + '</div>';
  sp2PopAt('sp2TrlPop', btn);
}
function sp2PickTruck(k, id) {
  document.getElementById('sp2TrlPop').classList.remove('on');
  if (SP2_DRIVERS[k].truck === id) return;
  var holder = Object.keys(SP2_DRIVERS).filter(function (x) { return SP2_DRIVERS[x].truck === id; })[0];
  if (holder) sp2TradeRigs(k, holder, false);
  else SP2_DRIVERS[k].truck = id;
  sp2Render();
  sp2Toast(SP2_DRIVERS[k].name + ' is on ' + id + (holder ? ' — ' + SP2_DRIVERS[holder].name + ' takes ' + SP2_DRIVERS[holder].truck : ''));
}

function sp2DriverPop(btn, k) {
  var rows = sp2DriverKeys().filter(function (x) { return x !== k; }).map(function (x) {
    var d = SP2_DRIVERS[x], st = sp2ShiftState(d);
    return '<button class="sp2-pop-item" onclick="sp2PickDriverFor(\'' + k + '\',\'' + x + '\')">' +
        '<span class="sp2-pop-item-id">' + d.name + '</span>' +
        '<span class="sp2-pop-item-sub">' + sp2StateWord(d.state) + ' · ' + sp2ShiftLabel(d.shift) +
          (st ? ' · ' + st.note : '') + ' · ' + d.truck + '</span></button>';
  }).join('');
  document.getElementById('sp2TrlPop').innerHTML =
    '<div class="sp2-pop-ttl">Hand ' + SP2_DRIVERS[k].truck + ' and its orders to</div>' +
    '<div class="sp2-pop-scroll">' + rows + '</div>';
  sp2PopAt('sp2TrlPop', btn);
}
function sp2PickDriverFor(k, other) {
  document.getElementById('sp2TrlPop').classList.remove('on');
  sp2TradeRigs(k, other, true);
  sp2Driver = other;
  sp2Render();
  sp2Toast(SP2_DRIVERS[other].name + ' takes it over from ' + SP2_DRIVERS[k].name);
}

function sp2TrailerPop(btn, k) {
  sp2TrlFor = k || sp2Driver;
  var p = document.getElementById('sp2TrlPop');
  p.innerHTML = '<div class="sp2-pop-ttl">Hitch a trailer</div>' +
    Object.keys(SP2_TRAILERS).map(function (k) {
      var tr = SP2_TRAILERS[k];
      var cap = tr.caps.reduce(function (a, c) { return a + c; }, 0);
      return '<button class="sp2-pop-item" onclick="sp2AddTrailer(\'' + k + '\')">' +
          '<span class="sp2-pop-item-id">' + k + '</span>' +
          '<span class="sp2-pop-item-sub">' + tr.type + ' · ' + tr.caps.length +
            ' comps · ' + cap.toLocaleString() + ' gal</span>' +
        '</button>';
    }).join('');
  sp2PopAt('sp2TrlPop', btn);
}
function sp2AddTrailer(trl, k) {
  k = k || sp2TrlFor || sp2Driver;
  var d = SP2_DRIVERS[k];
  d.trailer = trl;
  d.tload = SP2_TRAILERS[trl].caps.map(function () { return { p:'', q:0 }; });
  document.getElementById('sp2TrlPop').classList.remove('on');
  sp2Render();
  sp2Toast(trl + ' hitched to ' + d.truck);
}
function sp2DropTrailer(k) {
  var d = SP2_DRIVERS[k || sp2Driver], had = d.trailer;
  var left = d.tload.reduce(function (a, l) { return a + l.q; }, 0);
  if (left) return sp2Toast(had + ' still holds ' + left.toLocaleString() + ' gal — unload it first');
  d.trailer = null; d.tload = [];
  sp2Render();
  sp2Toast(had + ' unhitched');
}
function sp2Unload(k) {
  var d = SP2_DRIVERS[k || sp2Driver];
  d.load.forEach(function (l) { l.p = ''; l.q = 0; });
  d.tload.forEach(function (l) { l.p = ''; l.q = 0; });
  sp2Render();
  sp2Toast(d.truck + ' emptied — the orders stay planned');
}

// ══════════════════════════════════════════════════════════
//  Drag an order onto the rig
// ══════════════════════════════════════════════════════════
function sp2DragStart(e, id) {
  sp2Drag = id;
  e.dataTransfer.effectAllowed = 'copy';
  try { e.dataTransfer.setData('text/plain', id); } catch (x) {}
  document.getElementById('sp2Body').classList.add('dragging');
}
function sp2DragEnd() {
  sp2Drag = null;
  document.getElementById('sp2Body').classList.remove('dragging');
  document.querySelectorAll('.sp2-over').forEach(function (x) { x.classList.remove('sp2-over'); });
}
function sp2DragOver(e) {
  if (!sp2Drag) return;
  e.preventDefault(); e.stopPropagation();
  e.dataTransfer.dropEffect = 'copy';
  var el = e.currentTarget;
  if (!el.classList.contains('sp2-over')) {
    document.querySelectorAll('.sp2-over').forEach(function (x) { x.classList.remove('sp2-over'); });
    el.classList.add('sp2-over');
  }
}
function sp2DragLeave(e) {
  if (!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove('sp2-over');
}

// One product per compartment — the rule only bends for a blend, and none of
// these are blends. So a line fills what already holds it, then takes an empty.
// Every compartment on the rig, rear to front, as somewhere to put fuel.
function sp2Cells(k) {
  var d = SP2_DRIVERS[k], out = [];
  SP2_TRUCKS[d.truck].comps.forEach(function (c, i) { out.push({ cap:c.cap, l:d.load[i], u:'truck', i:i }); });
  if (d.trailer) SP2_TRAILERS[d.trailer].caps.forEach(function (c, i) {
    out.push({ cap:c, l:d.tload[i], u:'trailer', i:i });
  });
  return out;
}

// One product per compartment — the rule only bends for a blend, and none of
// these are blends. So a line fills what already holds it, then takes an empty.
function sp2PackInto(k, prods, unit, idx) {
  var cells = sp2Cells(k);
  if (idx >= 0) cells.sort(function (a, b) {
    return (b.u === unit && b.i === idx) - (a.u === unit && a.i === idx);
  });
  var short = [], put = 0;
  prods.forEach(function (pr) {
    var left = pr.q;
    [1, 2].forEach(function (pass) {
      cells.forEach(function (c) {
        if (!left) return;
        var same = c.l.p === pr.p, empty = !c.l.p || c.l.q === 0;
        if (pass === 1 ? !(same && c.l.q > 0) : !empty) return;
        if (pass === 2) c.l.p = pr.p;
        var take = Math.min(c.cap - c.l.q, left);
        c.l.q += take; left -= take; put += take;
      });
    });
    if (left) short.push(pr.p + ' ' + left.toLocaleString() + ' gal');
  });
  return { put:put, short:short };
}

// Taking an order off a truck takes its gallons with it, product by product,
// from wherever they ended up — fuel can have been moved since it was loaded.
function sp2TakeOut(k, prods) {
  var cells = sp2Cells(k);
  prods.forEach(function (pr) {
    var left = pr.q;
    cells.forEach(function (c) {
      if (!left || c.l.p !== pr.p) return;
      var take = Math.min(c.l.q, left);
      c.l.q -= take; left -= take;
      if (!c.l.q) c.l.p = '';
    });
  });
}

function sp2Drop(e, unit, idx, k) {
  e.preventDefault(); e.stopPropagation();
  var id = sp2Drag || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
  sp2DragEnd();
  if (!id) return;
  k = k || sp2Driver;
  var o = SP2_ORDERS.filter(function (x) { return x.id === id; })[0];
  var d = SP2_DRIVERS[k];
  if (!o || !d) return;

  // An order already planned on someone else is theirs until it is taken off
  // their lane. Moving it across behind their back is how double-booking starts.
  if (o.driver && o.driver !== k)
    return sp2Toast(o.id + ' is planned on ' + SP2_DRIVERS[o.driver].name +
                    ' — take it off that lane first');
  if (o.driver === k) return;

  var r = sp2PackInto(k, o.prods, unit, idx);
  o.driver = k;
  sp2Driver = k;
  sp2SelOrder = o.id;
  sp2Render();

  if (r.short.length)
    sp2Toast(o.id + ' on ' + d.truck + ' — ' + r.short.join(', ') + ' would not fit' +
             (d.trailer ? '' : '; hitch a trailer'));
  else
    sp2Toast(o.id + ' loaded onto ' + d.truck + ' · ' + r.put.toLocaleString() + ' gal');
}

// ── taking orders back off, and what to do when the rig is over ──
function sp2UnplanOrder(e, k, id) {
  e.stopPropagation();
  var o = SP2_ORDERS.filter(function (x) { return x.id === id; })[0];
  if (!o) return;
  sp2TakeOut(k, o.prods);
  o.driver = '';
  if (sp2SelOrder === id) sp2SelOrder = null;
  sp2Render();
  sp2Toast(id + ' taken off ' + SP2_DRIVERS[k].truck + ' — back in the orders column');
}

function sp2RigCap(k) {
  var d = SP2_DRIVERS[k];
  var cap = SP2_TRUCKS[d.truck].comps.reduce(function (s, c) { return s + c.cap; }, 0);
  if (d.trailer) cap += SP2_TRAILERS[d.trailer].caps.reduce(function (s, c) { return s + c; }, 0);
  return cap;
}

// More gallons planned than the rig holds. Say by how much, and offer the two
// ways out a dispatcher actually has: cut the biggest order back, or drop one
// and take a smaller one that fills the space better.
function sp2Overload(k) {
  var cap = sp2RigCap(k);
  var mine = SP2_ORDERS.filter(function (o) { return o.driver === k; });
  var want = mine.reduce(function (s, o) { return s + sp2Gal(o); }, 0);
  if (want <= cap) return null;
  var over = want - cap;
  var bySize = mine.slice().sort(function (a, b) { return sp2Gal(b) - sp2Gal(a); });
  var drop = mine.slice().sort(function (a, b) { return sp2Gal(a) - sp2Gal(b); })
                 .filter(function (o) { return sp2Gal(o) >= over; })[0] || bySize[0];
  var roomAfter = cap - (want - sp2Gal(drop));
  var swapIn = SP2_ORDERS.filter(function (o) { return !o.driver && sp2Gal(o) <= roomAfter; })
                 .sort(function (a, b) { return sp2Gal(b) - sp2Gal(a); })[0];
  return { over:over, cap:cap, want:want, trim:bySize[0], drop:drop, swapIn:swapIn, roomAfter:roomAfter };
}

function sp2TrimOrder(e, k, id, by) {
  e.stopPropagation();
  var o = SP2_ORDERS.filter(function (x) { return x.id === id; })[0];
  if (!o) return;
  var total = sp2Gal(o), cut = [], run = 0;
  o.prods.forEach(function (pr, n) {
    // the last line absorbs the rounding, so the total cut is exactly `by`
    var c = n === o.prods.length - 1 ? by - run : Math.min(pr.q, Math.round(by * pr.q / total));
    c = Math.max(0, Math.min(pr.q, c));
    run += c; cut.push({ p:pr.p, q:c }); pr.q -= c;
  });
  sp2TakeOut(k, cut);
  sp2Render();
  sp2Toast(id + ' cut by ' + by.toLocaleString() + ' gal');
}

function sp2SwapOrder(e, k, dropId, addId) {
  e.stopPropagation();
  sp2UnplanOrder({ stopPropagation: function () {} }, k, dropId);
  if (addId) {
    var o = SP2_ORDERS.filter(function (x) { return x.id === addId; })[0];
    sp2PackInto(k, o.prods, 'auto', -1);
    o.driver = k;
  }
  sp2Render();
  sp2Toast(addId ? dropId + ' out, ' + addId + ' in' : dropId + ' taken off');
}

// design units; the whole thing is drawn at this scale
var TK = { h:100, chassisY:106, chassisH:46, wheelY:124, wheelR:23.5, tankX:12,
           H:172, scale:0.68,
           shell:'#E0E0DF', divider:'#878686', frame:'#303436', dark:'#242425',
           // the chassis is grey now; TK.frame stays dark for the tractor's bar
           chassis:'#878686',
           marker:'#FE8F04', hub:'#8B8A8A' };

// The design's wave, normalised: the same bezier at any width, any level.
function sp2Wave(w, y, h) {
  var p = function (fx, fy) { return (fx * w).toFixed(2) + ',' + (y + fy).toFixed(2); };
  return 'M' + p(0.3972, 8.4352) +
         'C' + p(0.2402, 12.4047) + ' ' + p(0.06698, 4.4657) + ' ' + p(0, 0) +
         'V' + h + 'H' + w.toFixed(2) + 'V' + y.toFixed(2) +
         'C' + p(0.8552, -8.4352) + ' ' + p(0.5934, 3.4733) + ' ' + p(0.3972, 8.4352) + 'Z';
}

// three concentric circles, exactly as the design's wheel
function sp2Wheel(cx) {
  return '<circle cx="' + cx + '" cy="' + (TK.wheelY + TK.wheelR) + '" r="23.5" fill="' + TK.dark + '"/>' +
         '<circle cx="' + cx + '" cy="' + (TK.wheelY + TK.wheelR) + '" r="15.5" fill="' + TK.shell + '"/>' +
         '<circle cx="' + cx + '" cy="' + (TK.wheelY + TK.wheelR) + '" r="7.5" fill="' + TK.hub + '"/>';
}

// Widths come from the space available, so the rig spans the lane instead of
// sitting small in the corner of it. Capacity still sets the proportion; the
// floor keeps a compartment at roughly the shape the design drew.
// The ceiling is twice the compartment the design draws. Past that a tank
// stops reading as a tank and becomes a stretched bar, so a wide lane keeps
// the slack and the rig sits centred in it instead.
var TK_MIN_W = 100, TK_MAX_W = 440, TK_GAP = 18, TK_TRACTOR = 185, TK_OVERHANG = 24;
var TK_SIDE_PAD = 50;   // air either side of the rig, in screen pixels

function sp2RigWidths(caps, availUnits, nUnits) {
  var total = caps.reduce(function (a, c) { return a + c; }, 0);
  var budget = availUnits - nUnits * TK_OVERHANG - TK_TRACTOR - (nUnits > 1 ? TK_GAP : 0);
  // if the floors overshoot the budget the rig runs long and scrolls; if the
  // ceiling bites, it comes up short of the lane and centres
  return caps.map(function (c) {
    return Math.min(TK_MAX_W, Math.max(TK_MIN_W, Math.round(budget * c / total)));
  });
}

// One tank: shell, fuel, dividers, labels — however many compartments it has.
function sp2TankSvg(x, caps, widths, load, k, unit, uid) {
  var tw = widths.reduce(function (a, b) { return a + b; }, 0);
  var h = TK.h, clip = 'ck' + uid;
  var fuel = '', dividers = '', labels = '', hits = '', cx = x;

  caps.forEach(function (cap, i) {
    var w = widths[i], l = load[i] || { p:'', q:0 };
    var pct = cap ? Math.min(100, Math.round(l.q / cap * 100)) : 0;
    var cls = pct >= 99 ? 'full' : pct > 0 ? 'partial' : 'empty-c';
    var word = pct >= 99 ? 'Full' : pct > 0 ? 'Partially full' : 'Empty';
    var col = SP2_PROD_COLORS[l.p] || 'transparent';
    var mid = cx + w / 2;

    if (pct > 0) {
      fuel += '<g transform="translate(' + cx + ',0)">' +
        '<path class="sp2-sv-liq" data-c="' + i + '" data-top="' + (h * (1 - pct / 100)).toFixed(1) + '" ' +
          'd="' + sp2Wave(w, h * (1 - pct / 100), h) + '" fill="' + col + '"/></g>';
    } else {
      // the design marks an empty compartment with a dashed line at the floor
      fuel += '<line x1="' + (cx + 8) + '" y1="' + (h - 6) + '" x2="' + (cx + w - 8) + '" y2="' + (h - 6) +
              '" stroke="' + TK.divider + '" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.85"/>';
    }
    if (i) dividers += '<rect x="' + (cx - 1) + '" y="0" width="2" height="' + h + '" fill="' + TK.divider + '"/>';
    if (sp2MoveFrom && sp2MoveFrom.k === k && sp2MoveFrom.unit === unit && sp2MoveFrom.i === i)
      labels += '<rect class="sp2-sv-held" x="' + (cx + 2) + '" y="2" width="' + (w - 4) +
                '" height="' + (h - 4) + '" rx="6"/>';
    labels +=
      '<text x="' + mid + '" y="22" class="sp2-sv-c">C' + (i + 1) + ' · ' + cap.toLocaleString() + '</text>' +
      '<text x="' + mid + '" y="45" class="sp2-sv-p' + (l.p ? '' : ' empty') + '">' + (l.p || 'Empty') + '</text>' +
      '<text x="' + mid + '" y="65" class="sp2-sv-q">' + l.q.toLocaleString() + ' gal</text>' +
      '<text x="' + mid + '" y="82" class="sp2-sv-s ' + cls + '">' + pct + '% · ' + word + '</text>';
    hits += '<rect x="' + cx + '" y="0" width="' + w + '" height="' + h + '" fill="transparent" ' +
            'style="cursor:pointer;" ondragover="sp2DragOver(event)" ondragleave="sp2DragLeave(event)" ' +
            'ondrop="sp2Drop(event,\'' + unit + '\',' + i + ',\'' + k + '\')" ' +
            'onclick="sp2CompClick(event,\'' + k + '\',\'' + unit + '\',' + i + ')">' +
            '<title>C' + (i + 1) + ' · ' + cap.toLocaleString() + ' gal capacity</title></rect>';
    cx += w;
  });

  return '<defs><clipPath id="' + clip + '">' +
      '<rect x="' + x + '" y="0" width="' + tw + '" height="' + h + '" rx="34"/>' +
    '</clipPath></defs>' +
    '<rect x="' + x + '" y="0" width="' + tw + '" height="' + h + '" rx="34" fill="' + TK.shell + '"/>' +
    '<g clip-path="url(#' + clip + ')">' + fuel + dividers + '</g>' +
    labels + hits;
}

// A trailer is its own vehicle in the design — own chassis, own two bogies, own
// markers — so a hitched one is drawn as a second unit rather than as a second
// tank hanging off the truck's frame.
function sp2Unit(x0, caps, widths, load, k, unitKey, uid, label) {
  var tw = widths.reduce(function (a, b) { return a + b; }, 0);
  var uw = tw + TK_OVERHANG;
  var wheelsAt = [x0 + 45.5, x0 + 100.5, x0 + uw - 100.5, x0 + uw - 45.5];
  var arches = wheelsAt.map(function (cx) {
    // the fender arch the chassis carries over each wheel
    return '<path d="M' + (cx - 25.5) + ',' + (TK.wheelY + TK.wheelR) + 'a25.5,25.5 0 0 1 51,0" ' +
           'fill="none" stroke="' + TK.chassis + '" stroke-width="2"/>';
  }).join('');
  return '<g>' +
      '<rect x="' + x0 + '" y="' + TK.chassisY + '" width="' + uw + '" height="12" rx="3" fill="' + TK.chassis + '"/>' +
      '<rect x="' + (x0 + 14) + '" y="' + (TK.chassisY + 10) + '" width="112" height="18" rx="3" fill="' + TK.chassis + '"/>' +
      '<rect x="' + (x0 + uw - 126) + '" y="' + (TK.chassisY + 10) + '" width="112" height="18" rx="3" fill="' + TK.chassis + '"/>' +
      '<rect x="' + (x0 + 134) + '" y="109" width="13" height="6" rx="2" fill="' + TK.marker + '"/>' +
      '<rect x="' + (x0 + uw - 147) + '" y="109" width="13" height="6" rx="2" fill="' + TK.marker + '"/>' +
      arches + wheelsAt.map(sp2Wheel).join('') +
      sp2TankSvg(x0 + 12, caps, widths, load, k, unitKey, uid) +
      '<text x="' + (x0 + uw / 2) + '" y="' + (TK.H - 4) + '" class="sp2-sv-tag">' + label + '</text>' +
    '</g>';
}

// The tractor, from the design: stack, cab, windscreen, mirror, steps, lamp,
// bumper — each at the offset it has in the file, measured from the fifth wheel.
function sp2Tractor(x) {
  var im = function (a, dx, dy, w, h) {
    return '<image href="' + TRUCK_ART[a] + '" x="' + (x + dx) + '" y="' + dy +
           '" width="' + w + '" height="' + h + '"/>';
  };
  // The artwork is drawn nose-right, so the whole tractor is flipped about its
  // own middle — it keeps the same box, it just faces the other way.
  return '<g transform="translate(' + (2 * x + TK_TRACTOR) + ',0) scale(-1,1)">' +
    im('stack', 0, 12, 30.884, 104.03) +
    im('cab', 6.5, 28.25, 174.746, 123.491) +
    '<rect x="' + (x + 6.5) + '" y="119.28" width="102.404" height="24.382" rx="2" fill="' + TK.frame + '"/>' +
    '<rect x="' + (x + 6.5) + '" y="129.69" width="95.903" height="31.968" rx="4" fill="' + TK.shell + '"/>' +
    '<rect x="' + (x + 20.2) + '" y="127.41" width="4.567" height="36.534" rx="1" fill="' + TK.divider + '"/>' +
    '<rect x="' + (x + 52.17) + '" y="127.41" width="4.567" height="36.534" rx="1" fill="' + TK.divider + '"/>' +
    '<rect x="' + (x + 84.14) + '" y="127.41" width="4.567" height="36.534" rx="1" fill="' + TK.divider + '"/>' +
    im('windshield', 52.01, 39.31, 43.075, 36.892) +
    '<rect x="' + (x + 91.03) + '" y="44.51" width="9.753" height="24.382" rx="2" fill="' + TK.dark + '"/>' +
    im('mirror-arm', 94.28, 64.83, 9.753, 13.004) +
    '<rect x="' + (x + 52.01) + '" y="88.4" width="17.88" height="6.502" rx="3" fill="' + TK.dark + '"/>' +
    im('headlight', 157.67, 107.9, 19.506, 11.378) +
    im('bumper', 156, 121, 28.762, 19) +
    im('wheel-tractor', 113.85, 124.07, 46.458, 46.458) +
  '</g>';
}

function sp2RigSvg(k, availPx) {
  var d = SP2_DRIVERS[k], t = SP2_TRUCKS[d.truck];
  var trl = d.trailer ? SP2_TRAILERS[d.trailer] : null;
  var uid = (k + d.truck + (d.trailer || '')).replace(/[^a-z0-9]/gi, '');
  var truckCaps = t.comps.map(function (c) { return c.cap; });
  var trlCaps = trl ? trl.caps : [];
  var nUnits = trl ? 2 : 1;

  var all = trlCaps.concat(truckCaps);
  var w = sp2RigWidths(all, availPx / TK.scale, nUnits);
  var trlW = w.slice(0, trlCaps.length), truckW = w.slice(trlCaps.length);

  // nose first, then the truck it pulls, then anything hitched behind that
  var x = TK_TRACTOR, body = '';
  body += sp2Unit(x, truckCaps, truckW, d.load, k, 'truck', uid + 'a',
                  d.truck + ' · ' + t.type);
  x += truckW.reduce(function (a, b) { return a + b; }, 0) + TK_OVERHANG;
  if (trl) {
    x += TK_GAP;
    body += sp2Unit(x, trlCaps, trlW, d.tload, k, 'trailer', uid + 'b',
                    d.trailer + ' · ' + trl.type);
    x += trlW.reduce(function (a, b) { return a + b; }, 0) + TK_OVERHANG;
  }
  var W = x;

  return '<svg class="sp2-sv" width="' + Math.round(W * TK.scale) + '" height="' + Math.round(TK.H * TK.scale) +
      '" viewBox="0 0 ' + W + ' ' + TK.H + '">' +
      '<image href="' + TRUCK_ART['kingpin'] + '" x="' + (TK_TRACTOR - 24) + '" y="119" width="54" height="15.3"/>' +
      sp2Tractor(0) + body +
    '</svg>';
}

function sp2RigArt(k) {
  return '<div class="sp2-rig" ondragover="sp2DragOver(event)" ondragleave="sp2DragLeave(event)" ' +
      'ondrop="sp2Drop(event,\'auto\',-1,\'' + k + '\')" data-k="' + k + '">' +
    sp2RigSvg(k, 640) +
    '<div class="sp2-drop-hint">Drop the order here to load it</div>' +
  '</div>';
}

// The first render cannot know how wide the lane is, so redraw once it does —
// and again whenever the window changes it.
function sp2FitRig() {
  var box = document.querySelector('.sp2-rig');
  if (!box) return;
  var avail = box.clientWidth - 2 * TK_SIDE_PAD;
  if (avail < 240 || !SP2_DRIVERS[box.dataset.k]) return;
  var svg = box.querySelector('.sp2-sv');
  if (svg && Math.abs(+svg.getAttribute('width') - avail) < 2) return;
  box.insertAdjacentHTML('afterbegin', sp2RigSvg(box.dataset.k, avail));
  if (svg) svg.remove();
}
window.addEventListener('resize', function () {
  clearTimeout(window._sp2fit);
  window._sp2fit = setTimeout(sp2FitRig, 120);
});

// Every other lane: plain rectangles, filled to the level. No cab, no wheels —
// enough to see who has room, and nothing more.
function sp2SimpleBars(k) {
  var d = SP2_DRIVERS[k], t = SP2_TRUCKS[d.truck];
  var row = function (caps, load, unit) {
    return caps.map(function (cap, i) {
      var l = load[i] || { p:'', q:0 };
      var pct = cap ? Math.min(100, Math.round(l.q / cap * 100)) : 0;
      var cls = pct >= 99 ? 'full' : pct > 0 ? 'partial' : 'empty-c';
      var col = SP2_PROD_COLORS[l.p] || 'transparent';
      return '<div class="sp2-bar2 ' + cls + '" style="flex-grow:' + cap + ';" ' +
          'ondragover="sp2DragOver(event)" ondragleave="sp2DragLeave(event)" ' +
          'ondrop="sp2Drop(event,\'' + unit + '\',' + i + ',\'' + k + '\')" ' +
          'title="C' + (i + 1) + ' · ' + (l.p || 'Empty') + ' · ' +
            l.q.toLocaleString() + ' / ' + cap.toLocaleString() + ' gal">' +
        '<div class="sp2-bar2-fill" style="height:' + pct + '%;background:' + col + ';"></div>' +
        '<span class="sp2-bar2-c">C' + (i + 1) + '</span>' +
        '<span class="sp2-bar2-p">' + (l.p || '') + '</span>' +
      '</div>';
    }).join('');
  };
  var box = function (inner) { return '<div class="sp2-barbox">' + inner + '</div>'; };
  var out = box(row(t.comps.map(function (c) { return c.cap; }), d.load, 'truck'));
  if (d.trailer) out += box(row(SP2_TRAILERS[d.trailer].caps, d.tload, 'trailer'));
  return '<div class="sp2-bars">' + out + '</div>';
}

function sp2LaneHtml(k) {
  var d = SP2_DRIVERS[k], t = SP2_TRUCKS[d.truck];
  var caps = t.comps.map(function (c) { return c.cap; });
  var trl = d.trailer ? SP2_TRAILERS[d.trailer] : null;
  var a = sp2Sum(caps, d.load), b = sp2Sum(trl ? trl.caps : [], d.tload);
  var cap = a.cap + b.cap, q = a.q + b.q, pct = cap ? Math.round(q / cap * 100) : 0;

  var mine = SP2_ORDERS.filter(function (o) { return o.driver === k; })
                       .sort(function (x, y) { return x.t - y.t; });
  var gal = mine.reduce(function (s, o) { return s + sp2Gal(o); }, 0);
  var stops = mine.length
    ? mine.map(function (o) {
        return '<span class="sp2-stop' + (sp2SelOrder === o.id ? ' sel' : '') +
            '" onclick="sp2PickOrder(\'' + o.id + '\')" title="' + o.ship + '">' +
            '<span class="sp2-stop-t">' + sp2Hhmm(o.t) + '</span>' + o.id +
            '<b>' + sp2Gal(o).toLocaleString() + ' gal</b>' +
            '<button class="sp2-stop-x" title="Take this order off ' + d.truck + '" ' +
              'onclick="sp2UnplanOrder(event,\'' + k + '\',\'' + o.id + '\')">×</button></span>';
      }).join('')
    : '<span class="sp2-stop-none">No orders planned — drag one here</span>';

  var over = sp2Overload(k);
  var warn = !over ? '' :
    '<div class="sp2-over-warn">' +
      '<div class="sp2-over-head">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' +
        over.want.toLocaleString() + ' gal planned onto ' + over.cap.toLocaleString() +
        ' gal of rig — over by <b>' + over.over.toLocaleString() + ' gal</b>' +
      '</div>' +
      '<div class="sp2-over-fixes">' +
        '<button class="sp2-fix" onclick="sp2TrimOrder(event,\'' + k + '\',\'' + over.trim.id + '\',' + over.over + ')">' +
          'Cut ' + over.trim.id + ' by ' + over.over.toLocaleString() + ' gal</button>' +
        '<button class="sp2-fix" onclick="sp2SwapOrder(event,\'' + k + '\',\'' + over.drop.id + '\',' +
            (over.swapIn ? '\'' + over.swapIn.id + '\'' : 'null') + ')">' +
          'Drop ' + over.drop.id + ' (' + sp2Gal(over.drop).toLocaleString() + ' gal)' +
          (over.swapIn ? ' and take ' + over.swapIn.id + ' (' + sp2Gal(over.swapIn).toLocaleString() + ' gal)' : '') +
        '</button>' +
      '</div>' +
    '</div>';

  return '<div class="sp2-ln' + (k === sp2Driver ? ' on' : '') + ' ' + d.state + '" data-k="' + k + '" ' +
      'ondragover="sp2DragOver(event)" ondragleave="sp2DragLeave(event)" ' +
      'ondrop="sp2Drop(event,\'auto\',-1,\'' + k + '\')" onclick="sp2PickDriver(\'' + k + '\')">' +

    '<div class="sp2-ln-drv">' +
      '<div class="sp2-ln-drv-top">' +
        '<div class="sp2-av">' + d.name.split(' ').map(function (x) { return x[0]; }).join('').slice(0, 2) + '</div>' +
        '<div class="sp2-ln-name">' + d.name + '</div>' +
      '</div>' +
      '<span class="sp2-state ' + d.state + '">' + sp2StateWord(d.state) + '</span>' +
      '<div class="sp2-ln-shift">' + sp2ShiftLabel(d.shift) + '</div>' +
      '<div class="sp2-ln-sync">' + d.hub + ' · synced ' + sp2Synced(d.synced) + '</div>' +
      (k === sp2Driver
        ? sp2ShiftStrip(d) +
          '<button class="sp2-link" onclick="event.stopPropagation();sp2DriverPop(this,\'' + k + '\')">Change driver</button>'
        : '') +
    '</div>' +

    '<div class="sp2-ln-day">' +
      '<div class="sp2-ln-truck">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>' +
        '<button class="sp2-ln-truck-id" onclick="event.stopPropagation();sp2TruckPop(this,\'' + k + '\')" ' +
          'title="Change truck">' + d.truck + (trl ? ' + ' + d.trailer : '') +
          '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg>' +
        '</button>' +
        '<span class="sp2-ln-comps">' + (caps.length + (trl ? trl.caps.length : 0)) + ' compartments · ' +
          cap.toLocaleString() + ' gal</span>' +
        '<span class="sp2-ln-cap"><b>' + pct + '%</b> · ' + q.toLocaleString() + ' aboard</span>' +
        (trl
          ? '<button class="sp2-link" onclick="event.stopPropagation();sp2DropTrailer(\'' + k + '\')">Unhitch</button>'
          : '<button class="sp2-trl-btn sm" onclick="event.stopPropagation();sp2TrailerPop(this,\'' + k + '\')">+ Trailer</button>') +
        '<button class="sp2-link" onclick="event.stopPropagation();sp2Unload(\'' + k + '\')">Unload</button>' +
      '</div>' +

      (k === sp2Driver ? sp2RigArt(k) : sp2SimpleBars(k)) +

      warn +
      '<div class="sp2-ln-stops">' +
        '<div class="sp2-stop-list">' + stops + '</div>' +
        '<span class="sp2-ln-stops-lbl">' + mine.length + ' order' + (mine.length === 1 ? '' : 's') +
          ' · ' + gal.toLocaleString() + ' gal planned</span>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function sp2RenderLanes() {
  var keys = sp2DriverKeys(), host = document.getElementById('sp2V2');
  sp2DrvCounts(keys.length);
  if (!keys.length) { host.innerHTML = '<div class="sp2-empty">No driver matches that.</div>'; return; }
  var w = sp2Window();
  host.innerHTML =
    '<div class="sp2-ln-hdr">' +
      '<span class="sp2-ln-hdr-drv">Driver · availability</span>' +
      '<span class="sp2-ln-hdr-day">' + (sp2Shift_ === 'all' ? 'All shifts'
          : sp2Shift_ === 'am' ? 'AM · early shifts' : 'PM · late shifts') + '</span>' +
      '<span class="sp2-ln-hdr-sum">' + SP2_ORDERS.filter(sp2Planned).length + ' planned · ' +
        SP2_ORDERS.filter(function (o) { return !sp2Planned(o); }).length + ' unplanned</span>' +
    '</div>' +
    keys.map(sp2LaneHtml).join('');
  sp2FitRig();
}

function sp2RenderUnit() {
  document.getElementById('sp2V2').setAttribute('data-dense', sp2Dense);
  sp2RenderLanes();
}

// loading, unloading and hitching all change what would fit
function sp2AfterRig() { sp2Render(); }

function sp2PickDriver(k) {
  sp2Driver = k;
  sp2Render();          // the cards on the left are measured against this rig
}
function sp2ViewDriver() { sp2Toast(SP2_DRIVERS[sp2Driver].name + ' — driver details would open here'); }

// ══════════════════════════════════════════════════════════
//  Shell
// ══════════════════════════════════════════════════════════
function sp2Render(){ sp2RenderTimeline(); sp2RenderUnit(); sp2Sub(); }

function sp2Sub() {
  var w = sp2Window();
  document.getElementById('sp2Sub').textContent =
    document.getElementById('sp2Date').value + ' · ' + sp2Hhmm(w.from) + '–' + sp2Hhmm(w.to);
}

var SP2_DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var SP2_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function sp2Fmt(d) {
  return SP2_DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + SP2_MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}
var sp2Cursor = new Date(2026, 10, 19);
function sp2ShiftDay(n) {
  sp2Cursor.setDate(sp2Cursor.getDate() + n);
  document.getElementById('sp2Date').value = sp2Fmt(sp2Cursor);
  sp2Render();
}
function sp2Today() { sp2Cursor = new Date(2026, 10, 19); document.getElementById('sp2Date').value = sp2Fmt(sp2Cursor); sp2Render(); }

function sp2Toast(msg) {
  var t = document.getElementById('sp2Toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.style.display = 'none'; }, 2600);
}

(function () {
  document.getElementById('sp2Date').value = sp2Fmt(sp2Cursor);
  sp2Render();
})();


// ══════════════════════════════════════════════════════════
//  Columns: resize the split, or take one into its own window
// ══════════════════════════════════════════════════════════
// A popped-out column is a second copy of the page showing only that column.
// It keeps its own state — the two windows do not talk to each other, so an
// order cannot be dragged from one into the other.
function sp2PopOut(which) {
  var u = new URL(location.href);
  u.searchParams.set('only', which);
  window.open(u.toString(), 'sp2-' + which, 'width=1000,height=900');
}

(function () {
  var only = new URL(location.href).searchParams.get('only');
  if (only === 'orders' || only === 'drivers') {
    document.getElementById('sp2Body').setAttribute('data-only', only);
    var nav = document.querySelector('.shell-nav');        // only in the combined file
    if (nav) nav.style.display = 'none';
  }

  var grip = document.getElementById('sp2Split');
  var body = document.getElementById('sp2Body');
  var col  = document.querySelector('.sp2-col-orders');
  var on = false;
  grip.addEventListener('mousedown', function (e) {
    on = true; grip.classList.add('on');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', function (e) {
    if (!on) return;
    var r = body.getBoundingClientRect();
    // a hand-set width wins over the one the view would pick
    col.style.flexBasis = Math.min(72, Math.max(14, (e.clientX - r.left) / r.width * 100)) + '%';
    sp2FitRig();
  });
  document.addEventListener('mouseup', function () {
    if (!on) return;
    on = false; grip.classList.remove('on');
    document.body.style.cursor = ''; document.body.style.userSelect = '';
    sp2FitRig();
  });
})();

// the header arrows move the day
function sp2Shift(n){ sp2ShiftDay(n); }
</script>
