<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>Shift Planner — FleetPanda Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ══ FP DS — light ══════════════════════════════════════════
   Values taken from FP-DS-2026/src/index.css, resolved. Things that are not
   simply the dark theme inverted, and are easy to get wrong:
     · the ground is WARM (#e8e8e4) and everything on it is cool — deliberate
     · a card sits LIGHTER than its lane here; dark inverts that
     · --brand orange is the product mark and the focus ring, never the CTA;
       the CTA is --primary, near-black
     · three stroke weights do three jobs — card rim, divider, field boundary
     · hover is grey (--fp-emphasis); selected is the brand tint (--fp-selected)
   The system has no timeline unit, so the three views below borrow the board
   card and the delivery-timeline's hour scale rather than invent a third thing. */
:root{
  --fp-surface-base:#e8e8e4;
  --fp-shell-ground:#f2f2f2;
  --fp-surface-1b:#ffffff;
  --fp-surface-1a:#f4f5f8;
  --fp-card-1:#dee1e7;
  --fp-card-2:#e8eaed;
  --fp-table-header:#f1f2f2;
  --fp-row-hover:#e8eaed;
  --chip:#efefeb;
  --muted:#e9eaeb;

  --fp-ink-1:#030405;
  --fp-ink-3:#4f5968;
  --fp-ink-inverse:#f0f2f5;

  --fp-outline-1:#cfd3d9;
  --fp-outline-2:#adaeb4;
  --fp-stroke-hairline:#c8c9cd;
  --fp-stroke-field:#91949b;

  --brand:#fa6400;
  --primary:#090c0f;
  --primary-foreground:#f0f2f5;
  --fp-selected:#fee8d9;
  --fp-selected-strong:#a33f00;
  --fp-selected-border:#fdb98c;
  --fp-emphasis:#dee0e5;
  --fp-emphasis-hover:#e4e6ea;
  --ring:#fa6400;

  --status-caution:#b45309;
  --status-info:#1d4ed8;
  --status-success:#15803d;
  --status-failed:#dc2626;
  --status-neutral:#4f5968;

  --r-md:8px; --r-lg:10px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Geist',system-ui,sans-serif;background:var(--fp-surface-base);color:var(--fp-ink-1);height:100vh;overflow:hidden;}

.sp2{height:100vh;display:flex;flex-direction:column;background:var(--fp-shell-ground);}

/* ── Header ───────────────────────────────────────────────── */
.sp2-hdr{height:56px;background:var(--fp-surface-1b);border-bottom:1px solid var(--fp-stroke-hairline);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;}
.sp2-title{display:flex;align-items:center;gap:10px;}
.sp2-title h1{font-size:16px;line-height:24px;font-weight:600;color:var(--fp-ink-1);}
.sp2-title-sub{font-size:12px;line-height:16px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}
.sp2-date{display:flex;align-items:center;gap:6px;}
.sp2-nav-btn{width:36px;height:36px;border:1px solid var(--fp-stroke-field);border-radius:var(--r-md);background:var(--fp-surface-1b);color:var(--fp-ink-1);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.sp2-nav-btn:hover{background:var(--fp-emphasis);}
.sp2-date-inp{height:36px;background:var(--fp-surface-1b);border:1px solid var(--fp-stroke-field);border-radius:var(--r-md);color:var(--fp-ink-1);font-family:inherit;font-size:14px;padding:0 12px;outline:none;text-align:center;min-width:164px;cursor:pointer;font-variant-numeric:tabular-nums;}
.sp2-date-inp:focus{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklab,var(--ring) 50%,transparent);}
.sp2-today{height:36px;padding:0 14px;border:1px solid var(--fp-stroke-field);border-radius:var(--r-md);background:var(--fp-surface-1b);color:var(--fp-ink-1);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;}
.sp2-today:hover{background:var(--fp-emphasis);}

/* ── Two columns ──────────────────────────────────────────── */
.sp2-body{flex:1;display:flex;overflow:hidden;min-height:0;}
.sp2-col{display:flex;flex-direction:column;min-width:0;overflow:hidden;}
/* plain percentages, not clamp(): flex-basis cannot interpolate between a
   clamp() and a percentage, so the transition stalls where it started. */
.sp2-col-orders{flex:0 0 40%;min-width:272px;border-right:1px solid var(--fp-stroke-hairline);transition:flex-basis .22s ease;background:var(--fp-card-1);}
.sp2-body[data-view="v"] .sp2-col-orders{flex-basis:25%;}
.sp2-body[data-view="n"] .sp2-col-orders{flex-basis:23%;}
.sp2-col-unit{flex:1 1 60%;background:var(--fp-surface-1a);}

.sp2-col-hdr{min-height:52px;display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--fp-stroke-hairline);flex-shrink:0;flex-wrap:wrap;background:var(--fp-surface-1b);}
.sp2-col-title{font-size:14px;line-height:20px;font-weight:600;color:var(--fp-ink-1);white-space:nowrap;}
.sp2-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 7px;border-radius:9999px;background:var(--muted);font-size:12px;font-weight:500;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}

.sp2-seg{display:flex;background:var(--muted);border:1px solid var(--fp-outline-1);border-radius:var(--r-md);padding:2px;}
.sp2-seg-btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border:none;background:transparent;color:var(--fp-ink-3);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;border-radius:6px;white-space:nowrap;}
.sp2-seg-btn:hover{background:var(--fp-emphasis-hover);color:var(--fp-ink-1);}
.sp2-seg-btn.on{background:var(--primary);color:var(--primary-foreground);font-weight:600;}
.sp2-seg-n{font-size:11px;opacity:.75;font-variant-numeric:tabular-nums;}
.sp2-flt-lbl{font-size:10px;font-weight:600;color:var(--fp-ink-3);text-transform:uppercase;letter-spacing:0.12em;}
.sp2-custom{display:none;align-items:center;gap:6px;}
.sp2-custom.on{display:flex;}
.sp2-time{height:32px;width:72px;background:var(--fp-surface-1b);border:1px solid var(--fp-stroke-field);border-radius:var(--r-md);color:var(--fp-ink-1);font-family:inherit;font-size:13px;padding:0 8px;outline:none;text-align:center;font-variant-numeric:tabular-nums;}
.sp2-time:focus{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklab,var(--ring) 50%,transparent);}

/* ── Timeline ─────────────────────────────────────────────── */
.sp2-tl-wrap{flex:1;overflow:auto;min-height:0;position:relative;}
.sp2-tl-wrap::-webkit-scrollbar{height:10px;width:8px;}
.sp2-tl-wrap::-webkit-scrollbar-thumb{background:var(--fp-outline-2);border-radius:5px;}
.sp2-tl{position:relative;padding:0 16px 18px;min-width:min-content;}

.sp2-ruler{position:sticky;top:0;z-index:3;height:32px;background:var(--fp-card-1);border-bottom:1px solid var(--fp-stroke-hairline);display:flex;margin:0 -16px;padding:0 16px;}
.sp2-hour{flex-shrink:0;position:relative;font-size:12px;color:var(--fp-ink-3);padding-top:9px;border-left:1px solid var(--fp-outline-1);padding-left:6px;font-variant-numeric:tabular-nums;}

.sp2-lanes{position:relative;padding-top:12px;}
.sp2-lane{position:relative;height:124px;margin-bottom:8px;}
.sp2-grid{position:absolute;inset:0;display:flex;pointer-events:none;}
.sp2-grid-col{flex-shrink:0;border-left:1px solid color-mix(in oklab,var(--fp-outline-1) 55%,transparent);}

/* the order card — board card's shape and stack levels */
.sp2-card{position:absolute;top:0;height:120px;background:var(--fp-surface-1b);border:1px solid var(--fp-outline-1);border-left:3px solid var(--status-neutral);border-radius:var(--r-lg);padding:10px 12px;display:flex;flex-direction:column;gap:5px;cursor:pointer;overflow:hidden;transition:border-color .12s,box-shadow .12s,background .12s;}
.sp2-card:hover{border-color:var(--fp-outline-2);box-shadow:0 1px 3px rgba(3,4,5,.10),0 1px 2px rgba(3,4,5,.06);}
.sp2-card.sel{border-color:var(--fp-selected-border);background:var(--fp-selected);}
.sp2-card.planned{border-left-color:var(--status-success);}
.sp2-card.unplanned{border-left-color:var(--status-caution);}
.sp2-card-top{display:flex;align-items:center;gap:8px;}
.sp2-ord{font-size:14px;font-weight:600;color:var(--fp-ink-1);white-space:nowrap;font-variant-numeric:tabular-nums;}
.sp2-time-lbl{margin-left:auto;font-size:12px;color:var(--fp-ink-3);white-space:nowrap;font-variant-numeric:tabular-nums;}
.sp2-ship{font-size:13px;font-weight:500;color:var(--fp-ink-3);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp2-addr{font-size:12px;color:var(--fp-ink-3);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;opacity:.85;}
.sp2-prods{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;}
.sp2-chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:9999px;background:var(--chip);font-size:12px;color:var(--fp-ink-1);white-space:nowrap;}
.sp2-chip-q{color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}
.sp2-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.sp2-card-foot{display:flex;align-items:center;gap:7px;}

/* pills: kind colour at 10%, text the kind colour, no border */
.sp2-pill{display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:9999px;font-size:12px;font-weight:400;white-space:nowrap;}
.sp2-pill-planned{background:color-mix(in oklab,var(--status-success) 10%,transparent);color:var(--status-success);}
.sp2-pill-unplanned{background:color-mix(in oklab,var(--status-caution) 10%,transparent);color:var(--status-caution);}
.sp2-type{font-size:10px;font-weight:600;color:var(--fp-ink-3);text-transform:uppercase;letter-spacing:0.12em;white-space:nowrap;}

.sp2-empty{padding:44px 16px;text-align:center;font-size:14px;color:var(--fp-ink-3);}

/* ── Vertical timeline ────────────────────────────────────
   Same orders, same cards; time runs down a rail instead of across the top,
   so the column needs width for one card, not for hours. */
.sp2-vt{padding:12px 16px 20px;position:relative;}
.sp2-vt-rail{position:absolute;left:62px;top:0;bottom:0;width:1px;background:var(--fp-outline-1);}
.sp2-vrow{position:relative;display:flex;gap:14px;margin-bottom:10px;}
.sp2-vtime{width:48px;flex-shrink:0;text-align:right;padding-top:10px;font-size:12px;color:var(--fp-ink-3);font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums;}
.sp2-vnode{position:absolute;left:58px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--fp-surface-1b);border:2px solid var(--status-neutral);z-index:1;}
.sp2-vrow.planned .sp2-vnode{border-color:var(--status-success);}
.sp2-vrow.unplanned .sp2-vnode{border-color:var(--status-caution);}
.sp2-vgap{position:relative;height:22px;margin:0 0 10px 76px;display:flex;align-items:center;font-size:12px;color:var(--fp-ink-3);opacity:.8;}
.sp2-vcard{flex:1;min-width:0;margin-left:22px;}

/* ── No timeline — the orders, in the order the day runs them ── */
.sp2-list{padding:12px 16px 20px;display:flex;flex-direction:column;gap:8px;}
.sp2-lrow{display:flex;align-items:stretch;gap:10px;}
.sp2-ltime{width:46px;flex-shrink:0;padding-top:10px;font-size:12px;color:var(--fp-ink-3);font-weight:500;font-variant-numeric:tabular-nums;}

.sp2-flow .sp2-card{position:static;width:auto;height:auto;min-height:0;}
.sp2-flow .sp2-addr{-webkit-line-clamp:1;}

/* ── Column 2 ─────────────────────────────────────────────── */
.sp2-unit-row{display:flex;align-items:flex-start;min-height:100%;}
.sp2-sec{padding:16px;min-width:0;}
.sp2-sec-drv{flex:0 0 clamp(300px,37%,392px);border-right:1px solid var(--fp-stroke-hairline);align-self:stretch;}
.sp2-sec-trk{flex:1;min-width:0;}
.sp2-sec-lbl{font-size:10px;font-weight:600;color:var(--fp-ink-3);text-transform:uppercase;letter-spacing:0.14em;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.sp2-sec-lbl::after{content:'';flex:1;height:1px;background:var(--fp-stroke-hairline);}

.sp2-drv{background:var(--fp-surface-1b);border:1px solid var(--fp-outline-1);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:12px;}
.sp2-drv-top{display:flex;align-items:center;gap:12px;}
.sp2-av{width:36px;height:36px;border-radius:50%;background:var(--fp-card-1);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--fp-ink-1);flex-shrink:0;}
.sp2-drv-name{font-size:16px;line-height:24px;font-weight:600;color:var(--fp-ink-1);}
.sp2-drv-shift{font-size:13px;color:var(--fp-ink-3);margin-top:1px;}
.sp2-drv-state{margin-left:auto;text-align:right;}
.sp2-state{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;border-radius:9999px;font-size:12px;font-weight:500;white-space:nowrap;}
.sp2-state.on-duty{background:color-mix(in oklab,var(--status-success) 10%,transparent);color:var(--status-success);}
.sp2-state.off-duty{background:var(--muted);color:var(--status-neutral);}
.sp2-state.driving{background:color-mix(in oklab,var(--status-info) 10%,transparent);color:var(--status-info);}
.sp2-state::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.sp2-sync{font-size:12px;color:var(--fp-ink-3);margin-top:6px;}
.sp2-drv-foot{display:flex;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--fp-stroke-hairline);}
.sp2-drv-meta{font-size:13px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}
/* the CTA is --primary, near-black. Brand orange is the mark and the ring. */
.sp2-view{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:none;border-radius:var(--r-md);background:var(--primary);color:var(--primary-foreground);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;}
.sp2-view:hover{background:color-mix(in oklab,var(--primary) 88%,#fff);}

.sp2-truck{background:var(--fp-surface-1b);border:1px solid var(--fp-outline-1);border-radius:var(--r-lg);overflow:hidden;}
.sp2-truck-top{padding:14px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--fp-stroke-hairline);}
.sp2-truck-ico{width:32px;height:32px;border-radius:var(--r-md);background:var(--fp-card-1);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sp2-truck-id{font-size:16px;line-height:24px;font-weight:600;color:var(--fp-ink-1);}
.sp2-truck-sub{font-size:13px;color:var(--fp-ink-3);margin-top:1px;}
.sp2-truck-cap{margin-left:auto;text-align:right;}
.sp2-truck-pct{font-size:18px;line-height:28px;font-weight:600;color:var(--fp-ink-1);font-variant-numeric:tabular-nums;}
.sp2-truck-pct-lbl{font-size:12px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}

.sp2-comps{padding:14px;display:flex;flex-direction:column;gap:12px;}
.sp2-comp{display:flex;align-items:center;gap:12px;}
.sp2-comp-id{width:28px;font-size:12px;font-weight:600;color:var(--fp-ink-3);flex-shrink:0;}
.sp2-comp-main{flex:1;min-width:0;}
.sp2-comp-row1{display:flex;align-items:baseline;gap:7px;margin-bottom:5px;}
.sp2-comp-prod{font-size:13px;color:var(--fp-ink-1);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp2-comp-prod.empty{color:var(--fp-ink-3);font-weight:400;}
.sp2-comp-qty{margin-left:auto;font-size:12px;color:var(--fp-ink-3);white-space:nowrap;font-variant-numeric:tabular-nums;}
.sp2-bar{height:18px;border-radius:6px;background:var(--fp-card-1);overflow:hidden;position:relative;}
.sp2-bar-fill{height:100%;transition:width .25s;}
.sp2-bar-striped{position:absolute;inset:0;}
.sp2-comp-state{width:104px;flex-shrink:0;text-align:right;}
.sp2-comp-pct{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
.sp2-comp-word{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;font-weight:600;margin-top:1px;}
.full .sp2-comp-pct,.full .sp2-comp-word{color:var(--status-success);}
.partial .sp2-comp-pct,.partial .sp2-comp-word{color:var(--status-caution);}
.empty-c .sp2-comp-pct,.empty-c .sp2-comp-word{color:var(--status-neutral);}

.sp2-none{padding:36px 16px;text-align:center;font-size:14px;color:var(--fp-ink-3);line-height:1.6;}

#sp2Toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:var(--r-md);font-size:14px;font-weight:500;z-index:200;display:none;white-space:nowrap;background:var(--primary);color:var(--primary-foreground);box-shadow:0 8px 24px rgba(3,4,5,.18);}

</style>
</head>
<body>

<div class="sp2">

  <!-- Header -->
  <div class="sp2-hdr">
    <div class="sp2-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6fd4ff" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <h1>Shift Planner</h1>
      <span class="sp2-title-sub" id="sp2Sub">—</span>
    </div>
    <div class="sp2-date">
      <button class="sp2-nav-btn" onclick="sp2Shift(-1)" title="Previous day">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <input class="sp2-date-inp" id="sp2Date" value="Wed 19 Nov 2026" onchange="sp2Render()">
      <button class="sp2-nav-btn" onclick="sp2Shift(1)" title="Next day">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <button class="sp2-today" onclick="sp2Today()">Today</button>
    </div>
  </div>

  <div class="sp2-body" id="sp2Body" data-view="h">

    <!-- ══ Column 1 — the orders, on a timeline ══ -->
    <div class="sp2-col sp2-col-orders">
      <div class="sp2-col-hdr">
        <span class="sp2-col-title">Orders</span>
        <span class="sp2-count" id="sp2OrdCount">0</span>

        <div class="sp2-seg" id="sp2Quick">
          <button class="sp2-seg-btn on" data-q="all"       onclick="sp2SetQuick('all')">All <span class="sp2-seg-n" id="sp2nAll"></span></button>
          <button class="sp2-seg-btn"    data-q="unplanned" onclick="sp2SetQuick('unplanned')">Unplanned <span class="sp2-seg-n" id="sp2nUn"></span></button>
          <button class="sp2-seg-btn"    data-q="planned"   onclick="sp2SetQuick('planned')">Planned <span class="sp2-seg-n" id="sp2nPl"></span></button>
        </div>

        <span class="sp2-flt-lbl" style="margin-left:4px;">View</span>
        <div class="sp2-seg">
          <button class="sp2-seg-btn on" data-v="h" onclick="sp2SetView('h')" title="Horizontal timeline">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="7" y1="8" x2="7" y2="16"/><line x1="14" y1="8" x2="14" y2="16"/></svg>
          </button>
          <button class="sp2-seg-btn" data-v="v" onclick="sp2SetView('v')" title="Vertical timeline">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="3" x2="12" y2="21"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="14" x2="16" y2="14"/></svg>
          </button>
          <button class="sp2-seg-btn" data-v="n" onclick="sp2SetView('n')" title="No timeline — ordered list">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
          </button>
        </div>

        <span class="sp2-flt-lbl" style="margin-left:4px;">Shift</span>
        <div class="sp2-seg">
          <button class="sp2-seg-btn on" data-s="am"     onclick="sp2SetShift('am')">AM</button>
          <button class="sp2-seg-btn"    data-s="pm"     onclick="sp2SetShift('pm')">PM</button>
          <button class="sp2-seg-btn"    data-s="custom" onclick="sp2SetShift('custom')">Custom</button>
        </div>
        <div class="sp2-custom" id="sp2Custom">
          <input class="sp2-time" id="sp2From" value="05:00" onchange="sp2Render()">
          <span style="color:var(--fp-ink-3);font-size:13px;">–</span>
          <input class="sp2-time" id="sp2To" value="22:00" onchange="sp2Render()">
        </div>
      </div>

      <div class="sp2-tl-wrap" id="sp2TlWrap">
        <div class="sp2-tl" id="sp2Tl"></div>
      </div>
    </div>

    <!-- ══ Column 2 — the driver, and the truck mapped to them ══ -->
    <div class="sp2-col sp2-col-unit">
      <div class="sp2-col-hdr">
        <span class="sp2-col-title">Driver &amp; truck</span>
        <select class="sp2-date-inp" id="sp2DrvSel" style="margin-left:auto;min-width:0;flex:1;text-align:left;" onchange="sp2PickDriver(this.value)"></select>
      </div>
      <div style="flex:1;overflow-y:auto;min-height:0;" id="sp2Unit"></div>
    </div>

  </div>
</div>

<div id="sp2Toast"></div>

<script>
// ══════════════════════════════════════════════════════════
//  Reference data
// ══════════════════════════════════════════════════════════
var SP2_PROD_COLORS = {
  'UNL87':'#c4a319', 'UNL93':'#8a6cff', 'CLR DSL':'#2f9be0',
  'HO DSL':'#e0483f', 'Diesel DEF':'#46cf9c', 'Kerosene':'#c8ccd2',
};

// shifts as the docs have them: early 05:00–13:00 / 06:00–14:00, late 07:00–15:00 / 08:00–16:00
var SP2_SHIFTS = {
  e5:{ name:'Early', from:300, to:780 }, e6:{ name:'Early', from:360, to:840 },
  l7:{ name:'Late',  from:420, to:900 }, l8:{ name:'Late',  from:480, to:960 },
};

// Compartment counts and capacities are fixed physical properties; what is in
// them right now is the day's state.
var SP2_TRUCKS = {
  'BT-4':  { type:'Bobtail',    meter:210, comps:[{cap:1200},{cap:900},{cap:700}] },
  'Hi-12': { type:'Tank wagon', meter:320, comps:[{cap:2000},{cap:2000},{cap:1000}] },
  'PB-9':  { type:'Tank wagon', meter:380, comps:[{cap:2000},{cap:1500},{cap:1500},{cap:1000}] },
  'HV-7':  { type:'Transport',  meter:620, comps:[{cap:2000},{cap:2000},{cap:2000},{cap:1500},{cap:1500}] },
};

var SP2_DRIVERS = {
  alex:  { name:'Alex Trebek',  shift:'e6', truck:'Hi-12', state:'driving',  synced:2,  hub:'Denver Hub',
           load:[{p:'UNL87',q:2000},{p:'UNL87',q:1400},{p:'CLR DSL',q:0}] },
  ravi:  { name:'Ravi Patel',   shift:'e5', truck:'HV-7',  state:'on-duty',  synced:7,  hub:'Denver Hub',
           load:[{p:'HO DSL',q:2000},{p:'HO DSL',q:500},{p:'CLR DSL',q:2000},{p:'UNL93',q:900},{p:'',q:0}] },
  omar:  { name:'Omar Khalid',  shift:'l8', truck:'BT-4',  state:'off-duty', synced:46, hub:'Phoenix Hub',
           load:[{p:'UNL87',q:1200},{p:'',q:0},{p:'',q:0}] },
  priya: { name:'Priya Sharma', shift:'e6', truck:'PB-9',  state:'on-duty',  synced:1,  hub:'Denver Hub',
           load:[{p:'CLR DSL',q:2000},{p:'CLR DSL',q:1200},{p:'UNL87',q:1500},{p:'Diesel DEF',q:800}] },
};

// Order type is a field on the order: Delivery · Extraction · Transfer.
var SP2_ORDERS = [
  { id:'D-5157060', ship:'Morris Group — Upstairs Hub',  addr:'1180 Wewatta St, Denver CO 80202',        t:390,  type:'Delivery',   driver:'alex',  prods:[{p:'UNL87',q:3000},{p:'CLR DSL',q:1500}] },
  { id:'D-5157061', ship:'Acme Fuel Co — Branch 1A',     addr:'20400 Stevens Creek Blvd, Cupertino CA',  t:495,  type:'Delivery',   driver:'alex',  prods:[{p:'UNL87',q:2000}] },
  { id:'D-5157062', ship:'Dean Ltd — SJ Main',           addr:'2130 N First St, San Jose CA 95131',      t:420,  type:'Delivery',   driver:'ravi',  prods:[{p:'HO DSL',q:2500}] },
  { id:'D-5157063', ship:'Aguilar and Sons — Tampa HQ',  addr:'4221 W Boy Scout Blvd, Tampa FL 33607',   t:630,  type:'Transfer',   driver:'ravi',  prods:[{p:'CLR DSL',q:2000},{p:'UNL93',q:1000}] },
  { id:'D-5157064', ship:"Jeff's Jalopies — Tucson Main", addr:'3760 E Speedway Blvd, Tucson AZ 85716',  t:1140, type:'Delivery',   driver:'omar',  prods:[{p:'UNL87',q:1800}] },
  { id:'D-5157065', ship:'Sunbelt Pump — PC268',         addr:'1409 John Sims Pkwy, Niceville FL 32578', t:405,  type:'Delivery',   driver:'priya', prods:[{p:'CLR DSL',q:3200}] },
  { id:'D-5157066', ship:'Clearwater Utilities — Portland', addr:'1500 SW 1st Ave, Portland OR 97201',   t:560,  type:'Delivery',   driver:'priya', prods:[{p:'Diesel DEF',q:800},{p:'UNL87',q:1800}] },
  { id:'D-5157067', ship:'Morris Group — Downtown',      addr:'1601 Blake St, Denver CO 80202',          t:660,  type:'Extraction', driver:'',      prods:[{p:'UNL93',q:900}] },
  { id:'D-5157068', ship:'Dean Ltd — Oakland Depot',     addr:'800 Embarcadero W, Oakland CA 94607',     t:810,  type:'Delivery',   driver:'',      prods:[{p:'HO DSL',q:1400}] },
  { id:'D-5157069', ship:'Morris Group — East Depot',    addr:'5400 Havana St, Denver CO 80239',         t:915,  type:'Transfer',   driver:'',      prods:[{p:'CLR DSL',q:1100}] },
];

// ══════════════════════════════════════════════════════════
//  State
// ══════════════════════════════════════════════════════════
var sp2Quick = 'all';          // all · unplanned · planned
var sp2Shift_ = 'am';          // am · pm · custom
var sp2Driver = 'alex';
var sp2SelOrder = null;
var sp2View = 'h';            // h horizontal · v vertical · n no timeline

var SP2_HOUR_W = 132;          // pixels per hour on the timeline
var SP2_CARD_W = 206;

function sp2Hhmm(m){ return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); }
function sp2Short(m){
  var h24 = Math.floor(m/60), mm = m%60, h = h24%12===0 ? 12 : h24%12;
  return h + (mm ? ':'+String(mm).padStart(2,'0') : '') + (h24<12 ? 'a' : 'p');
}
function sp2ShiftLabel(k){ var s = SP2_SHIFTS[k]; return s ? s.name + ' ' + sp2Hhmm(s.from) + '–' + sp2Hhmm(s.to) : '—'; }
function sp2Planned(o){ return !!o.driver; }
function sp2Gal(o){ return o.prods.reduce(function(s,p){ return s+p.q; },0); }

// the window the timeline draws, from the shift filter
function sp2Window() {
  if (sp2Shift_ === 'am') return { from:5*60,  to:13*60 };
  if (sp2Shift_ === 'pm') return { from:13*60, to:22*60 };
  var f = sp2ParseTime(document.getElementById('sp2From').value, 5*60);
  var t = sp2ParseTime(document.getElementById('sp2To').value, 22*60);
  if (t <= f) t = f + 60;
  return { from:f, to:t };
}
function sp2ParseTime(v, dflt) {
  var m = String(v||'').match(/^(\d{1,2}):(\d{2})$/);
  return m ? Math.min(1440, Math.max(0, +m[1]*60 + +m[2])) : dflt;
}

function sp2Visible() {
  var w = sp2Window();
  return SP2_ORDERS.filter(function(o) {
    if (o.t < w.from || o.t > w.to) return false;
    if (sp2Quick === 'planned')   return sp2Planned(o);
    if (sp2Quick === 'unplanned') return !sp2Planned(o);
    return true;
  }).sort(function(a,b){ return a.t - b.t; });
}

// ══════════════════════════════════════════════════════════
//  Column 1 — the timeline
// ══════════════════════════════════════════════════════════
// The card is the same in every view; only where it sits changes.
function sp2CardHtml(o, style) {
  var planned = sp2Planned(o);
  var chips = o.prods.map(function(pr) {
    var col = SP2_PROD_COLORS[pr.p] || 'var(--fp-ink-3)';
    return '<span class="sp2-chip"><span class="sp2-dot" style="background:' + col + ';"></span>' +
           pr.p + ' <span class="sp2-chip-q">' + pr.q.toLocaleString() + '</span></span>';
  }).join('');
  return '<div class="sp2-card ' + (planned ? 'planned' : 'unplanned') +
      (sp2SelOrder === o.id ? ' sel' : '') + '" ' + (style ? 'style="' + style + '" ' : '') +
      'onclick="sp2PickOrder(\'' + o.id + '\')" title="' + o.ship + ' · ' + o.addr + '">' +
    '<div class="sp2-card-top"><span class="sp2-ord">' + o.id + '</span>' +
      '<span class="sp2-time-lbl">' + sp2Hhmm(o.t) + '</span></div>' +
    '<div class="sp2-ship">' + o.ship + '</div>' +
    '<div class="sp2-addr">' + o.addr + '</div>' +
    '<div class="sp2-prods">' + chips + '</div>' +
    '<div class="sp2-card-foot">' +
      '<span class="sp2-pill ' + (planned ? 'sp2-pill-planned' : 'sp2-pill-unplanned') + '">' +
        (planned ? 'Planned' : 'Unplanned') + '</span>' +
      '<span class="sp2-type">' + o.type + '</span>' +
    '</div>' +
  '</div>';
}

// Time runs down a rail instead of across the top. The gap between two orders
// is written on the rail, so the shape of the day still reads without an axis
// wide enough to scale it.
function sp2RenderVertical(orders) {
  if (!orders.length) return '<div class="sp2-empty">No orders in this window — widen the shift range or clear the filter.</div>';
  var rows = orders.map(function(o, i) {
    var gap = '';
    if (i) {
      var mins = o.t - orders[i-1].t;
      if (mins >= 45) {
        var h = Math.floor(mins/60), m = mins%60;
        gap = '<div class="sp2-vgap">' + (h ? h + 'h ' : '') + (m ? m + 'm' : '') + ' later</div>';
      }
    }
    return gap + '<div class="sp2-vrow ' + (sp2Planned(o) ? 'planned' : 'unplanned') + '">' +
      '<span class="sp2-vtime">' + sp2Hhmm(o.t) + '</span>' +
      '<span class="sp2-vnode"></span>' +
      '<div class="sp2-vcard">' + sp2CardHtml(o) + '</div>' +
    '</div>';
  }).join('');
  return '<div class="sp2-vt"><div class="sp2-vt-rail"></div>' + rows + '</div>';
}

// No axis at all: the orders in the sequence the day runs them.
function sp2RenderList(orders) {
  if (!orders.length) return '<div class="sp2-empty">No orders in this window — widen the shift range or clear the filter.</div>';
  return '<div class="sp2-list">' + orders.map(function(o) {
    return '<div class="sp2-lrow"><span class="sp2-ltime">' + sp2Hhmm(o.t) + '</span>' +
      '<div style="flex:1;min-width:0;">' + sp2CardHtml(o) + '</div></div>';
  }).join('') + '</div>';
}

function sp2RenderTimeline() {
  var orders = sp2Visible();
  var tl = document.getElementById('sp2Tl');

  if (sp2View !== 'h') {
    tl.classList.add('sp2-flow');
    tl.style.padding = '0';
    tl.innerHTML = sp2View === 'v' ? sp2RenderVertical(orders) : sp2RenderList(orders);
    sp2Counts();
    return;
  }
  tl.classList.remove('sp2-flow');
  tl.style.padding = '';

  var w = sp2Window();
  var hours = Math.ceil((w.to - w.from) / 60);

  var ruler = '';
  for (var i = 0; i <= hours; i++) {
    var m = w.from + i*60;
    var h24 = Math.floor((m % 1440) / 60);
    var tick = h24 === 0 ? '12a' : h24 === 12 ? '12p' : String(h24 % 12 === 0 ? 12 : h24 % 12);
    ruler += '<div class="sp2-hour" style="width:' + SP2_HOUR_W + 'px;">' + tick + '</div>';
  }

  if (!orders.length) {
    tl.innerHTML = '<div class="sp2-ruler">' + ruler + '</div>' +
      '<div class="sp2-empty">No orders in this window — widen the shift range or clear the filter.</div>';
    sp2Counts();
    return;
  }

  // lane packing: an order takes a lane where it does not overlap what is already there
  var lanes = [];
  orders.forEach(function(o) {
    var x = ((o.t - w.from) / 60) * SP2_HOUR_W;
    var placed = false;
    for (var li = 0; li < lanes.length && !placed; li++) {
      var last = lanes[li][lanes[li].length - 1];
      if (x >= last.x + SP2_CARD_W + 8) { lanes[li].push({ o:o, x:x }); placed = true; }
    }
    if (!placed) lanes.push([{ o:o, x:x }]);
  });

  var trackW = Math.max(hours * SP2_HOUR_W, 600);
  var grid = '';
  for (var g = 0; g <= hours; g++) grid += '<div class="sp2-grid-col" style="width:' + SP2_HOUR_W + 'px;"></div>';

  var lanesHtml = lanes.map(function(lane) {
    var cards = lane.map(function(slot) {
      return sp2CardHtml(slot.o, 'left:' + slot.x + 'px;width:' + SP2_CARD_W + 'px;');
    }).join('');
    return '<div class="sp2-lane" style="width:' + trackW + 'px;">' +
      '<div class="sp2-grid">' + grid + '</div>' + cards + '</div>';
  }).join('');

  tl.innerHTML = '<div class="sp2-ruler">' + ruler + '</div>' +
    '<div class="sp2-lanes" style="width:' + trackW + 'px;">' + lanesHtml + '</div>';
  sp2Counts();
}

function sp2Counts() {
  var w = sp2Window();
  var inWindow = SP2_ORDERS.filter(function(o){ return o.t >= w.from && o.t <= w.to; });
  var pl = inWindow.filter(sp2Planned).length;
  document.getElementById('sp2nAll').textContent = inWindow.length;
  document.getElementById('sp2nUn').textContent  = inWindow.length - pl;
  document.getElementById('sp2nPl').textContent  = pl;
  document.getElementById('sp2OrdCount').textContent = sp2Visible().length;
}

function sp2SetQuick(q) {
  sp2Quick = q;
  document.querySelectorAll('#sp2Quick .sp2-seg-btn').forEach(function(b) {
    b.classList.toggle('on', b.dataset.q === q);
  });
  sp2RenderTimeline();
}
function sp2SetView(v) {
  sp2View = v;
  document.querySelectorAll('[data-v]').forEach(function(b) {
    b.classList.toggle('on', b.dataset.v === v);
  });
  document.getElementById('sp2Body').setAttribute('data-view', v);
  // the shift range still filters, but only the horizontal view draws a scale
  document.getElementById('sp2TlWrap').style.overflowX = v === 'h' ? 'auto' : 'hidden';
  sp2RenderTimeline();
}

function sp2SetShift(s) {
  sp2Shift_ = s;
  document.querySelectorAll('[data-s]').forEach(function(b) {
    b.classList.toggle('on', b.dataset.s === s);
  });
  document.getElementById('sp2Custom').classList.toggle('on', s === 'custom');
  sp2RenderTimeline();
}

// picking an order shows the driver it is planned on
function sp2PickOrder(id) {
  sp2SelOrder = id;
  var o = SP2_ORDERS.filter(function(x){ return x.id === id; })[0];
  if (o && o.driver) {
    sp2Driver = o.driver;
    document.getElementById('sp2DrvSel').value = o.driver;
  }
  sp2Render();
  if (o && !o.driver) sp2Toast(o.id + ' has no driver yet — it sits unplanned');
}

// ══════════════════════════════════════════════════════════
//  Column 2 — driver, and the truck mapped to them
// ══════════════════════════════════════════════════════════
function sp2RenderUnit() {
  var d = SP2_DRIVERS[sp2Driver];
  var host = document.getElementById('sp2Unit');
  if (!d) { host.innerHTML = '<div class="sp2-none">Pick a driver to see their truck.</div>'; return; }


  var s = SP2_SHIFTS[d.shift];
  var stateWord = d.state === 'driving' ? 'Driving' : d.state === 'on-duty' ? 'On duty' : 'Off duty';
  var mine = SP2_ORDERS.filter(function(o){ return o.driver === sp2Driver; });
  var gal = mine.reduce(function(a,o){ return a + sp2Gal(o); }, 0);

  var drv = '<div class="sp2-sec sp2-sec-drv">' +
      '<div class="sp2-sec-lbl">Driver</div>' +
      '<div class="sp2-drv">' +
        '<div class="sp2-drv-top">' +
          '<div class="sp2-av">' + d.name.split(' ').map(function(x){return x[0];}).join('').slice(0,2) + '</div>' +
          '<div><div class="sp2-drv-name">' + d.name + '</div>' +
            '<div class="sp2-drv-shift">' + sp2ShiftLabel(d.shift) + ' · ' + d.hub + '</div></div>' +
          '<div class="sp2-drv-state">' +
            '<span class="sp2-state ' + d.state + '">' + stateWord + '</span>' +
            '<div class="sp2-sync">Last synced ' + (d.synced < 60 ? d.synced + ' min ago' : 'over an hour ago') + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="sp2-drv-foot">' +
          '<span class="sp2-drv-meta">' + mine.length + ' order' + (mine.length===1?'':'s') +
            ' · ' + gal.toLocaleString() + ' gal</span>' +
          '<button class="sp2-view" onclick="sp2ViewDriver()">View details' +
            '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>' +
          '</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  var t = SP2_TRUCKS[d.truck];
  if (!t) return host.innerHTML = '<div class="sp2-unit-row">' + drv +
    '<div class="sp2-sec sp2-sec-trk"><div class="sp2-none">No truck mapped to this driver.</div></div></div>';

  var totalCap = t.comps.reduce(function(a,c){ return a+c.cap; }, 0);
  var onboard  = d.load.reduce(function(a,l){ return a+l.q; }, 0);
  var pct = totalCap ? Math.round(onboard/totalCap*100) : 0;

  var comps = t.comps.map(function(cmp, i) {
    var l = d.load[i] || { p:'', q:0 };
    var p = cmp.cap ? Math.round(l.q / cmp.cap * 100) : 0;
    // Full, partially full, or empty — the three states a compartment is in
    var cls  = p >= 99 ? 'full' : p > 0 ? 'partial' : 'empty-c';
    var word = p >= 99 ? 'Full' : p > 0 ? 'Partially full' : 'Empty';
    var col  = SP2_PROD_COLORS[l.p] || 'var(--fp-outline-2)';
    return '<div class="sp2-comp ' + cls + '">' +
        '<span class="sp2-comp-id">C' + (i+1) + '</span>' +
        '<div class="sp2-comp-main">' +
          '<div class="sp2-comp-row1">' +
            (l.p ? '<span class="sp2-dot" style="background:' + col + ';"></span>' : '') +
            '<span class="sp2-comp-prod' + (l.p ? '' : ' empty') + '">' + (l.p || 'empty') + '</span>' +
            '<span class="sp2-comp-qty">' + l.q.toLocaleString() + ' / ' + cmp.cap.toLocaleString() + ' gal</span>' +
          '</div>' +
          '<div class="sp2-bar"><div class="sp2-bar-striped"></div>' +
            '<div class="sp2-bar-fill" style="width:' + p + '%;background:' + (l.p ? col : 'transparent') + ';opacity:.85;"></div>' +
          '</div>' +
        '</div>' +
        '<div class="sp2-comp-state"><div class="sp2-comp-pct">' + p + '%</div>' +
          '<div class="sp2-comp-word">' + word + '</div></div>' +
      '</div>';
  }).join('');

  host.innerHTML = '<div class="sp2-unit-row">' + drv +
    '<div class="sp2-sec sp2-sec-trk">' +
      '<div class="sp2-sec-lbl">Truck &amp; compartments</div>' +
      '<div class="sp2-truck">' +
        '<div class="sp2-truck-top">' +
          '<div class="sp2-truck-ico">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6fd4ff" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>' +
          '</div>' +
          '<div><div class="sp2-truck-id">' + d.truck + '</div>' +
            '<div class="sp2-truck-sub">' + t.type + ' · ' + totalCap.toLocaleString() + ' gal · ' +
              t.comps.length + ' comps · ' + t.meter + ' gpm</div></div>' +
          '<div class="sp2-truck-cap"><div class="sp2-truck-pct">' + pct + '%</div>' +
            '<div class="sp2-truck-pct-lbl">' + onboard.toLocaleString() + ' gal aboard</div></div>' +
        '</div>' +
        '<div class="sp2-comps">' + comps + '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function sp2PickDriver(k) {
  sp2Driver = k;
  // keep the picker honest when the driver is chosen by clicking an order
  var sel = document.getElementById('sp2DrvSel');
  if (sel && sel.value !== k) sel.value = k;
  sp2RenderUnit();
}
function sp2ViewDriver(){ sp2Toast(SP2_DRIVERS[sp2Driver].name + ' — driver details would open here'); }

// ══════════════════════════════════════════════════════════
//  Shell
// ══════════════════════════════════════════════════════════
function sp2Render(){ sp2RenderTimeline(); sp2RenderUnit(); sp2Sub(); }

function sp2Sub() {
  var w = sp2Window();
  document.getElementById('sp2Sub').textContent =
    document.getElementById('sp2Date').value + ' · ' + sp2Hhmm(w.from) + '–' + sp2Hhmm(w.to);
}

var SP2_DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var SP2_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function sp2Fmt(d) {
  return SP2_DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + SP2_MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}
var sp2Cursor = new Date(2026, 10, 19);
function sp2ShiftDay(n) {
  sp2Cursor.setDate(sp2Cursor.getDate() + n);
  document.getElementById('sp2Date').value = sp2Fmt(sp2Cursor);
  sp2Render();
}
function sp2Today() { sp2Cursor = new Date(2026, 10, 19); document.getElementById('sp2Date').value = sp2Fmt(sp2Cursor); sp2Render(); }

function sp2Toast(msg) {
  var t = document.getElementById('sp2Toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.style.display = 'none'; }, 2600);
}

(function () {
  var sel = document.getElementById('sp2DrvSel');
  sel.innerHTML = Object.keys(SP2_DRIVERS).map(function(k) {
    return '<option value="' + k + '">' + SP2_DRIVERS[k].name + ' · ' + SP2_DRIVERS[k].truck + '</option>';
  }).join('');
  sel.value = sp2Driver;
  document.getElementById('sp2Date').value = sp2Fmt(sp2Cursor);
  sp2Render();
})();

// the header arrows move the day
function sp2Shift(n){ sp2ShiftDay(n); }
</script>
