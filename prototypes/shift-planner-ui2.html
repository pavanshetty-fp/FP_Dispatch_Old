})();

// ── Orders sized to the fleet that is actually standing there ──
// The day's orders are cut to fill WHOLE rigs, so on a part-loaded truck
// nothing fits and "Fill the rest" has nothing to say. That is true of the
// data, not of the work: a real day has small orders in it. So a handful of
// the unplanned orders are re-cut to the room the fleet actually has left —
// one per driver who would otherwise be offered nothing — and given a window
// and a ship-to that driver can genuinely reach inside their shift.
(function sizeSomeOrdersToTheFleet() {
  var TARGET = 18;                       // drivers we want to be able to try
  var pool = SP2_ORDERS.filter(function (o) { return !o.driver && !sp2HasBlend(o); });
  var next = 0, fitted = 0;

  Object.keys(SP2_DRIVERS).forEach(function (k) {
    if (fitted >= TARGET || next >= pool.length) return;
    var d = SP2_DRIVERS[k];
    if (d.state === 'off-duty') return;
    if (sp2Suggest(k, 1).picks.length) return;        // already has something to take

    var cells = sp2Cells(k).map(function (c) { return { cap:c.cap, p:c.l.p, q:c.l.q }; });
    var best = sp2BestRoom(cells);
    if (best.gal < 400) return;                        // nothing worth a run

    var sh = SP2_SHIFTS[d.shift];
    var t = sp2TimeLeft(k);
    // there, the drop, and back again has to fit whatever runs out first
    var maxTrip = Math.floor((t.left - 30) / 2);
    if (maxTrip < 10) return;

    // the nearest ship-to to this driver's hub that the run can reach
    var near = null;
    SP2_SHIPTOS.forEach(function (st) {
      if (!sp2InRegion(d.hub, st[1])) return;
      var mi = 2 + (sp2Hash(d.hub + '|' + st[0]) % 280) / 10;
      var min = sp2Drive(mi, k);
      if (min <= maxTrip && (!near || min < near.min)) near = { st:st, min:min };
    });
    if (!near) return;

    var o = pool[next];
    o.ship = near.st[0]; o.addr = near.st[1];
    // the window closes with the shift, so there is as long as possible to run it
    var len = [120, 180, 240, 180][sp2Hash(o.id) % 4];
    o.t = Math.max(sh.from, sh.to - len);
    // one product, cut to the room this rig actually has for it
    o.prods = [{ p: best.p || SP2_PRODS[next % SP2_PRODS.length],
                 q: Math.max(200, Math.floor(best.gal / 50) * 50) }];

    if (sp2CanRun(k, o)) return;                       // the run still does not work
    next++; fitted++;
  });
})();

// ══════════════════════════════════════════════════════════
//  State
// ══════════════════════════════════════════════════════════
var sp2Quick = 'unplanned';    // unplanned · planned · all — the column is the
                               // still-to-plan list, so an assigned order leaves it
var sp2Shift_ = 'all';         // all · am · pm — which drivers' shifts, not which orders
var sp2Driver = 'd0';
var sp2Picked = {};            // orders ticked for a single drag — id → true
// The planner opens on the work that still needs doing: the orders nobody has
// taken, against the trucks that still have room. Both columns start narrowed.
var sp2DrvFilter = 'available';
var sp2Dense = 'compact';    // compact · full — the chosen lane is always full        // v1 roster + one rig · v2 a lane per driver   // all · driving · on-duty · off-duty
var sp2Drag = null;          // the order ids being dragged, or null
var sp2MoveFrom = null;      // a compartment picked up, waiting for somewhere to go
// The planner has no clock of its own — the day is fixed — so 'now' is a
// stated time rather than a real one. It is what makes a shift read as
// started, running or over.
var sp2SelOrder = null;
var sp2View = 'v';            // v vertical (the default) · h horizontal
var sp2Sort = 'time';         // time · fit — fit ranks against the chosen rig
var sp2BlendOnly = false;     // narrow to orders carrying a blend
var sp2AvailOrder = null;     // the Available order, held still while you work in it

var SP2_HOUR_W = 132;          // pixels per hour on the timeline
var SP2_CARD_W = 400;    // the round-3 card holds a table, so it needs the width
var SP2_CARD_BASE = 198; // everything on the card that is not a table row
var SP2_CARD_ROW  = 44;  // one row of the lines table

function sp2Hhmm(m){ return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); }
function sp2Short(m){
  var h24 = Math.floor(m/60), mm = m%60, h = h24%12===0 ? 12 : h24%12;
  return h + (mm ? ':'+String(mm).padStart(2,'0') : '') + (h24<12 ? 'a' : 'p');
}
function sp2ShiftLabel(k){ var s = SP2_SHIFTS[k]; return s ? s.name + ' ' + sp2Hhmm(s.from) + '–' + sp2Hhmm(s.to) : '—'; }
function sp2Planned(o){ return !!o.driver; }
function sp2Gal(o){ return o.prods.reduce(function(s,p){ return s+p.q; },0); }

// The timeline draws the whole working day. The shift filter no longer cuts it
// down — a shift belongs to a driver, so it narrows the driver list instead.
function sp2Window() { return { from:5*60, to:22*60 }; }

// AM is the early shifts, PM the late ones, as the docs name them.
function sp2ShiftBand(k) { return (SP2_SHIFTS[k] && SP2_SHIFTS[k].name === 'Early') ? 'am' : 'pm'; }

// Worth-doing-first, against the chosen rig: an order that fills the truck
// outright, then ones that go on whole (fuller rig first), then part loads by
// how much of them lands.
function sp2FitScore(o) {
  var f = sp2FitFor(sp2Driver, o);
  if (!f) return -1;
  if (f.pct >= 100 && f.rigPct >= 100) return 1e9;
  if (f.pct >= 100) return 1e6 + f.rigPct * 1000 + f.fits;
  return f.pct * 1000 + f.fits;
}

function sp2Visible() {
  var w = sp2Window();
  var list = SP2_ORDERS.filter(function(o) {
    if (o.t < w.from || o.t > w.to) return false;
    if (sp2BlendOnly && !sp2HasBlend(o)) return false;
    if (sp2Quick === 'planned')   return sp2Planned(o);
    if (sp2Quick === 'unplanned') return !sp2Planned(o);
    return true;
  });
  if (sp2Sort === 'fit')
    return list.sort(function (a, b) { return sp2FitScore(b) - sp2FitScore(a) || a.t - b.t; });
  return list.sort(function(a,b){ return a.t - b.t; });
}

// ══════════════════════════════════════════════════════════
//  Column 1 — the timeline
// ══════════════════════════════════════════════════════════
// What the chosen rig could take of an order, without loading anything. Packed
// the same way a real drop would be — top up a compartment already holding the
// product, then take an empty one — so the number is the one you would get.
// ── Filling the rest of the rig ─────────────────────────
// What would fill the room that is left, without splitting anything. An order
// is a whole order: it goes on or it does not. A suggestion has to clear four
// things at once — the fuel fits the compartments that are still open, the
// delivery window can be met inside this driver's shift, the run there and
// back fits what is left of the shift, and it fits inside the hours Samsara
// says the driver has.
function sp2PackSim(cells, o) {
  var fits = 0;
  o.prods.forEach(function (pr) {
    var left = pr.q;
    [1, 2].forEach(function (pass) {
      cells.forEach(function (c) {
        if (!left) return;
        var same = c.p === pr.p, empty = !c.p || c.q === 0;
        if (pass === 1 ? !(same && c.q > 0) : !empty) return;
        if (pass === 2) c.p = pr.p;
        var take = Math.min(c.cap - c.q, left);
        c.q += take; left -= take; fits += take;
      });
    });
  });
  return fits;
}

// How long this driver can still be out: whichever runs out first, the shift
// or the clock Samsara is holding them to.
function sp2TimeLeft(k) {
  var d = SP2_DRIVERS[k], sh = SP2_SHIFTS[d.shift];
  var shiftLeft = Math.max(0, sh.to - Math.max(SP2_NOW, sh.from));
  var hos = d.hos[sp2HosBind(d.hos)];
  return { shift:shiftLeft, hos:hos, left:Math.min(shiftLeft, hos) };
}

function sp2CanRun(k, o) {
  var d = SP2_DRIVERS[k], sh = SP2_SHIFTS[d.shift], w = sp2Win(o);
  if (sp2WinClash(o, k)) return 'window';
  var trip = sp2Trip(o, k);
  if (!trip) return 'hub';
  // leaving as early as the shift allows, can they still be there in time?
  if (Math.max(SP2_NOW, sh.from) + trip.min > w.to) return 'too far to make the window';
  // there, the drop, and back again, inside whatever runs out first
  var t = sp2TimeLeft(k);
  if (trip.min * 2 + 30 > t.left)
    return t.hos < t.shift ? 'past the hours left' : 'past the end of the shift';
  return null;
}

// Room is not the same as placeable room. One product can spread across every
// EMPTY compartment, and can top up compartments already holding that same
// product — but it cannot share a compartment with something else. So the most
// a single order can take is the empties plus the best same-product top-up.
function sp2BestRoom(cells) {
  var empties = 0, byProd = {};
  cells.forEach(function (c) {
    var free = c.cap - c.q;
    if (free <= 0) return;
    if (!c.p || c.q === 0) empties += free;
    else byProd[c.p] = (byProd[c.p] || 0) + free;
  });
  var best = { gal:empties, p:null };
  Object.keys(byProd).forEach(function (p) {
    if (byProd[p] + empties > best.gal) best = { gal:byProd[p] + empties, p:p };
  });
  return best;
}

function sp2Suggest(k, max) {
  var d = SP2_DRIVERS[k];
  if (!d || d.state === 'off-duty') return { picks:[], why:'This driver is off duty.' };
  var cells = sp2Cells(k).map(function (c) { return { cap:c.cap, p:c.l.p, q:c.l.q }; });
  var cap = cells.reduce(function (a, c) { return a + c.cap; }, 0);
  var room = cap - cells.reduce(function (a, c) { return a + c.q; }, 0);
  if (room <= 0) return { picks:[], room:0, why:'The rig is full.' };

  var best0 = sp2BestRoom(cells);
  var pool = SP2_ORDERS.filter(function (o) { return !o.driver; });
  var smallest = pool.reduce(function (m, o) {
    var g = sp2Gal(o); return g && (!m || g < m) ? g : m;
  }, 0);
  var blockedByTime = 0, tooBig = 0;
  var picks = [];
  for (var round = 0; round < (max || 3); round++) {
    var best = null;
    pool.forEach(function (o) {
      if (picks.indexOf(o) >= 0) return;
      var total = sp2Gal(o);
      if (!total) return;
      var trial = cells.map(function (c) { return { cap:c.cap, p:c.p, q:c.q }; });
      // no splitting: the whole order goes on, or it is not a suggestion
      if (sp2PackSim(trial, o) < total) { if (!round) tooBig++; return; }
      if (sp2CanRun(k, o)) { if (!round) blockedByTime++; return; }
      var after = trial.reduce(function (a, c) { return a + c.q; }, 0);
      if (!best || after > best.after) best = { o:o, after:after, cells:trial };
    });
    if (!best) break;
    cells = best.cells;
    picks.push(best.o);
    best.o.__after = Math.round(best.after / cap * 100);
  }

  var why = null;
  if (!picks.length) {
    if (blockedByTime && !tooBig)
      why = 'What fits cannot be run inside this driver\u2019s shift and hours.';
    else
      why = 'At most <b>' + best0.gal.toLocaleString() + ' gal</b> can go on in one order here' +
            (best0.p ? ', and only as ' + best0.p : ', since one product cannot share a compartment') +
            '. The smallest unplanned order is ' + smallest.toLocaleString() + ' gal.' +
            (blockedByTime ? ' ' + blockedByTime + ' that would fit cannot be run today.' : '');
  }
  return { picks:picks, room:room, cap:cap, best:best0, why:why };
}

function sp2TakeSuggestion(e, k, id) {
  e.stopPropagation();
  var o = SP2_ORDERS.filter(function (x) { return x.id === id; })[0];
  var d = SP2_DRIVERS[k];
  if (!o || !d || o.driver) return;
  var r = sp2PackInto(k, o.prods, 'auto', -1);
  o.driver = k;
  sp2Driver = k;
  sp2SelOrder = o.id;
  sp2Render();
  sp2Toast(o.id + ' loaded onto ' + d.truck + ' \u00b7 ' + r.put.toLocaleString() + ' gal');
}

function sp2SuggestHtml(k) {
  var sg = sp2Suggest(k, 3);
  var head = '<div class="sp2-sg-head"><span class="sp2-sg-ttl">Fill the rest</span>' +
    (sg.room > 0
      ? '<span class="sp2-sg-room">' + sg.room.toLocaleString() + ' gal of room' +
        (sg.best && sg.best.gal < sg.room
          ? ' \u00b7 at most ' + sg.best.gal.toLocaleString() + ' in one order' : '') +
        '</span>'
      : '') +
    '</div>';
  if (!sg.picks.length)
    return '<div class="sp2-sg">' + head + '<div class="sp2-sg-none">' + sg.why + '</div></div>';

  // A suggestion is an act, not a label: each one is a row with its own Add,
  // so an order goes onto the rig without being dragged there.
  var rows = sg.picks.map(function (o) {
    var trip = sp2Trip(o, k), w = sp2Win(o);
    return '<div class="sp2-sg-item">' +
        '<div class="sp2-sg-main">' +
          '<div class="sp2-sg-l1">' +
            '<span class="sp2-sg-id">' + o.id + '</span>' +
            '<span class="sp2-kind" title="' + o.type + '">' + o.type.charAt(0) + '</span>' +
            '<span class="sp2-sg-ship">' + o.ship + '</span>' +
          '</div>' +
          '<div class="sp2-sg-l2">' +
            '<span class="sp2-sg-gal">' + sp2Gal(o).toLocaleString() + ' gal</span>' +
            '<span class="sp2-sep"></span>' +
            '<span>' + sp2Clock(w.from) + '\u2013' + sp2Clock(w.to) + '</span>' +
            (trip ? '<span class="sp2-sep"></span><span>' + trip.mi.toFixed(1) + ' mi \u00b7 ' +
                    trip.min + ' min</span>' : '') +
          '</div>' +
        '</div>' +
        '<span class="sp2-sg-to" title="Where the rig lands once this is on">\u2192 ' +
          o.__after + '%</span>' +
        '<button class="sp2-sg-add" onclick="sp2TakeSuggestion(event,\'' + k + '\',\'' + o.id + '\')" ' +
          'title="Put ' + o.id + ' on ' + SP2_DRIVERS[k].truck + '">Add</button>' +
      '</div>';
  }).join('');
  var all = sg.picks.length > 1
    ? '<button class="sp2-sg-addall" onclick="sp2TakeAll(event,\'' + k + '\')">Add all ' +
        sg.picks.length + '</button>'
    : '';
  return '<div class="sp2-sg">' + head + '<div class="sp2-sg-list">' + rows + '</div>' + all + '</div>';
}

function sp2TakeAll(e, k) {
  e.stopPropagation();
  var sg = sp2Suggest(k, 3), d = SP2_DRIVERS[k];
  if (!sg.picks.length) return;
  var gal = 0;
  sg.picks.forEach(function (o) {
    if (o.driver) return;
    gal += sp2PackInto(k, o.prods, 'auto', -1).put;
    o.driver = k;
  });
  sp2Driver = k;
  sp2Render();
  sp2Toast(sg.picks.length + ' orders loaded onto ' + d.truck + ' \u00b7 ' + gal.toLocaleString() + ' gal');
}

function sp2FitFor(k, o) {
  var d = SP2_DRIVERS[k];
  if (!d || !SP2_TRUCKS[d.truck]) return null;
  var cells = sp2Cells(k).map(function (c) { return { cap:c.cap, p:c.l.p, q:c.l.q }; });
  var cap = cells.reduce(function (s, c) { return s + c.cap; }, 0);
  var fits = 0, total = sp2Gal(o);
  o.prods.forEach(function (pr) {
    var left = pr.q;
    [1, 2].forEach(function (pass) {
      cells.forEach(function (c) {
        if (!left) return;
        var same = c.p === pr.p, empty = !c.p || c.q === 0;
        if (pass === 1 ? !(same && c.q > 0) : !empty) return;
        if (pass === 2) c.p = pr.p;
        var take = Math.min(c.cap - c.q, left);
        c.q += take; left -= take; fits += take;
      });
    });
  });
  var after = cells.reduce(function (s, c) { return s + c.q; }, 0);
  return { fits:fits, total:total, over:total - fits,
           pct: total ? Math.round(fits / total * 100) : 0,
           rigPct: cap ? Math.round(after / cap * 100) : 0 };
}

// The chip that says it. "Fills the truck" is the one worth looking for: the
// whole order goes on AND the rig leaves full.
// ── Where it is, and when ──────────────────────────────────
// A hub is a real place, so the run to a ship-to is real work. We have no
// routing engine here, so the figure is a stable pseudo-distance per
// hub + ship-to pair — it never moves for the same pair, and it changes when
// you look at a driver who sets out from somewhere else.
function sp2Hash(str) {
  var h = 2166136261;
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = (h * 16777619) >>> 0; }
  return h;
}
function sp2Trip(o, k) {
  var d = SP2_DRIVERS[k || sp2Driver];
  if (!d) return null;
  var h = sp2Hash(d.hub + '|' + o.ship);
  // In region, a stop is 2–30 miles out — drivers own regions and work them.
  // Out of region it is a haul no shift absorbs, which is what makes the
  // planner refuse it rather than quietly offering Denver a Tampa drop.
  var mi = sp2InRegion(d.hub, o.addr || sp2AddrOf(o.ship))
    ? 2 + (h % 280) / 10
    : 160 + (h % 3400) / 10;
  return { hub:d.hub, mi:mi, min: sp2Drive(mi, k || sp2Driver) };
}

// An order is delivered inside a window, not at an instant. The window starts
// at the order's time; how long it runs is a property of the order.
function sp2Win(o) {
  var len = [120, 180, 240, 180][sp2Hash(o.id) % 4];
  return { from:o.t, to:Math.min(o.t + len, 24 * 60 - 5) };
}
// The window is only a problem against a particular driver's shift, so the
// clash is computed where the two meet — never stored on the order.
function sp2WinClash(o, k) {
  var d = SP2_DRIVERS[k || sp2Driver]; if (!d) return null;
  var sh = SP2_SHIFTS[d.shift], w = sp2Win(o);
  var first = d.name.split(' ')[0];
  // A window that merely OPENS before the shift is not a clash — the delivery
  // still has hours inside the shift to happen in. Only a window that cannot be
  // met is one, and the last hour is what cannot be made up.
  if (w.from >= sh.to)   return 'after ' + first + '\u2019s shift';
  if (w.to   <= sh.from) return 'before ' + first + '\u2019s shift';
  if (w.to   >  sh.to)   return sp2Dur(w.to - sh.to) + ' past ' + first + '\u2019s shift';
  return null;
}
function sp2Dur(m) {
  var h = Math.floor(m / 60), x = m % 60;
  return h && x ? h + 'h ' + x + 'm' : h ? h + 'h' : x + 'm';
}

function sp2FitChip(o) {
  // A planned order's head answers a different question: not "would it fit"
  // but "who has it".
  if (o.driver) {
    var od = SP2_DRIVERS[o.driver];
    return od ? '<span class="sp2-who" title="Planned on ' + od.name + '">' +
                  od.name.split(' ')[0] + ' \u00b7 ' + od.truck + '</span>' : '';
  }
  var f = sp2FitFor(sp2Driver, o);
  if (!f) return '';
  var d = SP2_DRIVERS[sp2Driver];
  var why = 'Against ' + d.name + ' · ' + d.truck + ' — ' + f.fits.toLocaleString() +
            ' of ' + f.total.toLocaleString() + ' gal would load, leaving the rig ' + f.rigPct + '% full';
  var cls, text;
  if (f.pct >= 100 && f.rigPct >= 100) { cls = 'perfect'; text = 'Fills the truck'; }
  else if (f.pct >= 100)               { cls = 'full';    text = 'Fits \u00b7 rig <b>' + f.rigPct + '%</b>'; }
  else if (f.pct > 0)                  { cls = 'part';    text = '<b>' + f.pct + '%</b> fits \u00b7 ' + f.over.toLocaleString() + ' gal over'; }
  else                                 { cls = 'none';    text = 'No room'; }
  return '<span class="sp2-fit ' + cls + '" title="' + why + '">' + text + '</span>';
}

// The card is the same in every view; only where it sits changes.
// A splash blend is two products carried in one compartment, so the card lists
// both — each constituent is its own chip, with its own gallons, carrying the
// blend it belongs to and the share it takes. One chip naming two products
// would hide the quantity the terminal actually has to rack.
function sp2Lines(o) {
  var out = [];
  o.prods.forEach(function (pr, src) {
    var b = SP2_BLENDS[pr.p];
    if (!b) return out.push({ p:pr.p, q:pr.q, src:src });
    // the shares are racked in round gallons, so every part but the last is
    // taken to the nearest ten and the last one carries the remainder — the
    // line still totals what was ordered, and no chip reads 8,503 gal
    var left = pr.q;
    b.parts.forEach(function (x, n) {
      var q = n === b.parts.length - 1 ? left
            : Math.round(pr.q * x.pct / 1000) * 10;
      left -= q;
      out.push({ p:x.p, q:q, blend:pr.p, pct:x.pct, src:src, n:n, of:b.parts.length });
    });
  });
  return out;
}

// The card reads down in three bands, separated by space and nothing else:
// which order it is, where it goes, and what is on it. One subject per band,
// and the quantities on a single right edge so two orders compare by eye.
var sp2OpenProds = {};         // orders whose load band has been opened out
var SP2_PROD_CAP = 2;          // products shown before the rest fold into "+N"

function sp2TogglePlist(e, id) {
  e.stopPropagation();
  if (sp2OpenProds[id]) delete sp2OpenProds[id]; else sp2OpenProds[id] = true;
  sp2Render();
}

// ── The order card, round 3 ─────────────────────────────
// Two units with a rule between them. Above it: which order this is, where it
// goes and when it has to be there. Below it: what was asked for, as a table
// you can correct in place. Nothing else — the fit and the run from the hub
// have both come off while their places are decided.
var SP2_UNITS = ['gal', 'L', 'each', 'case', 'drum', 'pail'];

// What the customer asked for, line by line. A splash blend stays ONE line
// here — B5 is what was ordered; the constituents are what the terminal racks,
// and those live in the sheet.
function sp2LineUnit(pr) { return pr.unit || 'gal'; }

// A row is a racked line; the number that is stored is the ORDERED line it
// came from. Typing into a constituent therefore moves the whole blend, and
// its partner follows in ratio — a blend trimmed on one side is off-spec fuel,
// not a smaller order.
function sp2RowSrc(o, n) {
  var pr = sp2Lines(o)[n];
  return pr ? pr : null;
}
function sp2SetQty(e, id, n) {
  e.stopPropagation();
  var o = SP2_ORDERS.filter(function (x) { return x.id === id; })[0];
  var pr = o && sp2RowSrc(o, n);
  if (!pr || !o.prods[pr.src]) return;
  var v = Math.max(0, Math.round(parseFloat(String(e.target.value).replace(/[^0-9.]/g, '')) || 0));
  o.prods[pr.src].q = pr.blend ? Math.round(v * 100 / pr.pct) : v;
  sp2Render();
}
function sp2SetUnit(e, id, n) {
  e.stopPropagation();
  var o = SP2_ORDERS.filter(function (x) { return x.id === id; })[0];
  var pr = o && sp2RowSrc(o, n);
  if (!pr || !o.prods[pr.src]) return;
  o.prods[pr.src].unit = e.target.value;
  sp2Render();
}

// Gallons add up to gallons. A line switched to cases cannot join them, so it
// is counted on its own rather than quietly folded in.
function sp2Totals(o) {
  var by = {};
  o.prods.forEach(function (pr) {
    var u = sp2LineUnit(pr);
    by[u] = (by[u] || 0) + pr.q;
  });
  return Object.keys(by).sort(function (a, b) {
    return a === 'gal' ? -1 : b === 'gal' ? 1 : a.localeCompare(b);
  }).map(function (u) { return by[u].toLocaleString() + ' ' + u; });
}

function sp2CardV3(o, style) {
  var planned = sp2Planned(o);
  var picked  = sp2Picked[o.id] ? ' picked' : '';
  var w = sp2Win(o);

  // The table lists what the terminal actually racks: a splash blend is its
  // constituents, one row each, every row carrying its own blend and share.
  // The rows of one blend are joined by a bracket so two blends on an order
  // never read as four unrelated products.
  var lines = sp2Lines(o);
  var anyBlend = lines.some(function (pr) { return pr.blend; });

  var rows = lines.map(function (pr, n) {
    var col = SP2_PROD_COLORS[pr.p] || 'var(--fp-ink-3)';
    var grp = '';
    if (pr.blend) {
      var first = pr.n === 0, last = pr.n === pr.of - 1;
      grp = ' g' + (first ? ' g-first' : last ? ' g-last' : ' g-mid');
    }
    var ratio = pr.blend
      ? '<b>' + pr.blend + '</b> \u00b7 ' + pr.pct + '%'
      : '<span class="sp2-lt-none">\u2014</span>';
    return '<div class="sp2-lt-row">' +
        '<span class="sp2-lt-c sp2-lt-p"><i class="sp2-dot" style="background:' + col + ';"></i>' +
          '<span>' + pr.p + '</span></span>' +
        (anyBlend ? '<span class="sp2-lt-c sp2-lt-ratio' + grp + '"' +
          (pr.blend ? ' title="' + pr.pct + '% of a ' + pr.blend + ' splash blend"' : '') +
          '>' + ratio + '</span>' : '') +
        '<span class="sp2-lt-c sp2-lt-edit">' +
          '<input class="sp2-cell" type="text" inputmode="numeric" value="' + pr.q.toLocaleString() + '" ' +
            'aria-label="Quantity for ' + pr.p + '" ' +
            'onclick="event.stopPropagation()" onchange="sp2SetQty(event,\'' + o.id + '\',' + n + ')">' +
        '</span>' +
        '<span class="sp2-lt-c sp2-lt-edit">' +
          '<select class="sp2-cell sp2-cell-u" aria-label="Type for ' + pr.p + '" ' +
            'onclick="event.stopPropagation()" onchange="sp2SetUnit(event,\'' + o.id + '\',' + n + ')">' +
            SP2_UNITS.map(function (u) {
              return '<option value="' + u + '"' + (u === sp2LineUnit(o.prods[pr.src]) ? ' selected' : '') +
                     '>' + u + '</option>';
            }).join('') +
          '</select>' +
        '</span>' +
      '</div>';
  }).join('');

  return '<div class="sp2-card sp2-v3 ' + (planned ? 'planned' : 'unplanned') +
      (sp2SelOrder === o.id ? ' sel' : '') + picked + '" ' + (style ? 'style="' + style + '" ' : '') +
      'data-id="' + o.id + '" ' +
      'draggable="true" ondragstart="sp2DragStart(event,\'' + o.id + '\')" ondragend="sp2DragEnd()" ' +
      'onclick="sp2PickOrder(\'' + o.id + '\')" title="Drag onto the truck to load it">' +

    // ── unit 1 · which order, where it goes, when ──
    '<div class="sp2-card-top">' +
      '<button class="sp2-cbx' + picked + '" title="Pick this order, and drag them together" ' +
        'onclick="sp2TogglePick(event,\'' + o.id + '\')"></button>' +
      '<span class="sp2-ord">' + o.id + '</span>' +
      '<span class="sp2-kind" title="' + o.type + '">' + o.type.charAt(0) + '</span>' +
      '<span class="sp2-pill sp2-pill-r ' + (planned ? 'sp2-pill-planned' : 'sp2-pill-unplanned') + '">' +
        (planned ? 'Planned' : 'Unplanned') + '</span>' +
      '<button class="sp2-chev" title="Open this order" ' +
        'onclick="sp2OrderOpen(event,\'' + o.id + '\')">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<polyline points="9 18 15 12 9 6"/></svg></button>' +
    '</div>' +

    '<div class="sp2-ship-row">' +
      '<svg class="sp2-pin" width="14" height="14" viewBox="0 0 24 24" fill="none" ' +
        'stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z" fill="currentColor" fill-opacity=".22"/>' +
        '<circle cx="12" cy="10" r="3"/></svg>' +
      '<span class="sp2-ship">' + o.ship + '</span>' +
      '<span class="sp2-tip" role="tooltip">' + o.addr + '</span>' +
    '</div>' +
    '<div class="sp2-win">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>' +
      '<span>' + sp2Clock(w.from) + ' \u2013 ' + sp2Clock(w.to) + '</span>' +
    '</div>' +

    // ── unit 2 · what was asked for, correctable in place ──
    // The DS lines table: flush to the card's edges, a tinted header band,
    // 44px rows, every cell the control itself rather than a box inside a box.
    '<div class="sp2-lt' + (anyBlend ? ' blended' : '') + '">' +
      '<div class="sp2-lt-head">' +
        '<span>Product</span>' +
        (anyBlend ? '<span>Blend ratio</span>' : '') +
        '<span>Quantity</span><span>Type</span>' +
      '</div>' +
      rows +
      '<div class="sp2-lt-tot">' +
        '<span>Total</span>' +
        (anyBlend ? '<span></span>' : '') +
        '<span>' + sp2Totals(o).join(' \u00b7 ') + '</span><span></span>' +
      '</div>' +
    '</div>' +
  '</div>';
}

// The window is a time of day a person reads, not a duty clock.
function sp2Clock(m) {
  var h = Math.floor(m / 60) % 24, x = m % 60;
  var ap = h < 12 ? 'AM' : 'PM', h12 = h % 12 === 0 ? 12 : h % 12;
  return h12 + ':' + String(x).padStart(2, '0') + ' ' + ap;
}

// Every order card is the round-3 card now; the band design it replaced is
// in V1 and in the commit before this one.
function sp2CardHtml(o, style) {
  return sp2CardV3(o, style);

  var planned = sp2Planned(o);
  var picked  = sp2Picked[o.id] ? ' picked' : '';
  var lines   = sp2Lines(o);
  var open    = !!sp2OpenProds[o.id];
  var shown   = open ? lines : lines.slice(0, SP2_PROD_CAP);
  var hidden  = lines.length - shown.length;

  // Every product is its own chip on its own row, the blend's share beside the
  // name and the gallons on the right edge. Capped at two, so a blended order
  // costs a plain order's height until you ask for the rest.
  var rows = shown.map(function (pr) {
    var col = SP2_PROD_COLORS[pr.p] || 'var(--fp-ink-3)';
    return '<span class="sp2-chip"><i class="sp2-dot" style="background:' + col + ';"></i>' +
             pr.p + '</span>' +
           '<span class="sp2-prow-b">' + (pr.blend ? pr.blend + ' \u00b7 ' + pr.pct + '%' : '') + '</span>' +
           '<span class="sp2-prow-q">' + pr.q.toLocaleString() + ' gal</span>';
  }).join('');

  // The window is the fact that can be wrong, so the window carries the
  // warning — not the card, which has nothing else the matter with it.
  var w = sp2Win(o), clash = sp2WinClash(o, sp2Driver), trip = sp2Trip(o, sp2Driver);
  var when = '<span class="sp2-when' + (clash ? ' clash' : '') + '">' + sp2Hhmm(w.from) +
               '\u2013' + sp2Hhmm(w.to) + (clash ? ' \u00b7 ' + clash : '') + '</span>';
  var run = trip
    ? (clash ? '' : '<span class="sp2-sep"></span>') +
      '<span class="sp2-trip"><b>' + trip.mi.toFixed(1) + ' mi</b> \u00b7 ' + trip.min + ' min</span>' +
      '<span class="sp2-from" title="Measured from ' + trip.hub + '">from ' +
        trip.hub.replace(' Hub', '') + '</span>'
    : '';

  var blended = lines.filter(function (pr) { return pr.blend; }).length;
  var count = lines.length + ' product' + (lines.length === 1 ? '' : 's') +
              (sp2HasBlend(o) ? ' \u00b7 ' + blended + ' in a blend' : '');

  return '<div class="sp2-card ' + (planned ? 'planned' : 'unplanned') +
      (sp2SelOrder === o.id ? ' sel' : '') + picked + '" ' + (style ? 'style="' + style + '" ' : '') +
      'data-id="' + o.id + '" ' +
      'draggable="true" ondragstart="sp2DragStart(event,\'' + o.id + '\')" ondragend="sp2DragEnd()" ' +
      'onclick="sp2PickOrder(\'' + o.id + '\')" title="Drag onto the truck to load it \u00b7 ' + o.ship + '">' +

    // ── band 1 · which order it is, and whether it fits ──
    '<div class="sp2-card-top">' +
      '<button class="sp2-cbx' + picked + '" title="Pick this order, and drag them together" ' +
        'onclick="sp2TogglePick(event,\'' + o.id + '\')"></button>' +
      '<span class="sp2-ord">' + o.id + '</span>' +
      '<span class="sp2-kind" title="' + o.type + '">' + o.type.charAt(0) + '</span>' +
      '<span class="sp2-pill ' + (planned ? 'sp2-pill-planned' : 'sp2-pill-unplanned') + '">' +
        (planned ? 'Planned' : 'Unplanned') + '</span>' +
      sp2FitChip(o) +
      '<button class="sp2-open" title="Open this order" ' +
        'onclick="sp2OrderOpen(event,\'' + o.id + '\')">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
        '<path d="M15 3h6v6"/><path d="M10 14 21 3"/>' +
        '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></button>' +
    '</div>' +

    // ── band 2 · where it goes, and when ──
    '<div class="sp2-card-l">' +
      '<div class="sp2-ship">' + o.ship + '</div>' +
      '<div class="sp2-addr">' + o.addr + '</div>' +
      '<div class="sp2-meta">' + when + run + '</div>' +
    '</div>' +

    // ── band 3 · what is on it, closing with the total ──
    '<div class="sp2-card-r">' + rows + '</div>' +
    '<div class="sp2-load-foot">' +
      '<span class="sp2-load-n">' + count + '</span>' +
      (lines.length > SP2_PROD_CAP
        ? '<button class="sp2-more" onclick="sp2TogglePlist(event,\'' + o.id + '\')" ' +
            'title="' + (open ? 'Fold the rest away' : 'Show the other ' + hidden) + '">' +
            (open ? 'Show less' : '+' + hidden) + '</button>'
        : '') +
      '<span class="sp2-load-tot">' + sp2Gal(o).toLocaleString() + ' gal</span>' +
    '</div>' +
  '</div>';
}

// Time runs down a rail instead of across the top. The gap between two orders
// is written on the rail, so the shape of the day still reads without an axis
// wide enough to scale it.
function sp2RenderVertical(orders) {
  if (!orders.length) return '<div class="sp2-empty">Nothing here — try another status or shift.</div>';
  var ranked = sp2Sort === 'fit';
  var rows = orders.map(function(o, i) {
    var gap = '';
    if (i && !ranked) {
      var mins = o.t - orders[i-1].t;
      if (mins >= 45) {
        var h = Math.floor(mins/60), m = mins%60;
        gap = '<div class="sp2-vgap">' + (h ? h + 'h ' : '') + (m ? m + 'm' : '') + ' later</div>';
      }
    }
    return gap + '<div class="sp2-vrow' + (ranked ? ' ranked' : '') + ' ' +
      (sp2Planned(o) ? 'planned' : 'unplanned') + '">' +
      (ranked ? '<span class="sp2-rank">' + (i + 1) + '</span>' : '') +
      '<span class="sp2-vtime">' + sp2Hhmm(o.t) + '</span>' +
      '<span class="sp2-vnode"></span>' +
      '<div class="sp2-vcard">' + sp2CardHtml(o) + '</div>' +
    '</div>';
  }).join('');
  return '<div class="sp2-vt' + (ranked ? ' ranked' : '') + '">' +
    (ranked ? '' : '<div class="sp2-vt-rail"></div>') + rows + '</div>';
}

function sp2RenderTimeline() {
  var orders = sp2Visible();
  var tl = document.getElementById('sp2Tl');

  if (sp2View !== 'h') {
    tl.classList.add('sp2-flow');
    tl.style.padding = '0';
    tl.innerHTML = sp2RenderVertical(orders);
    sp2Counts();
    return;
  }
  tl.classList.remove('sp2-flow');
  tl.style.padding = '';

  var w = sp2Window();
  var hours = Math.ceil((w.to - w.from) / 60);

  var ruler = '';
  for (var i = 0; i <= hours; i++) {
    var m = w.from + i*60;
    var h24 = Math.floor((m % 1440) / 60);
    var tick = h24 === 0 ? '12a' : h24 === 12 ? '12p' : String(h24 % 12 === 0 ? 12 : h24 % 12);
    ruler += '<div class="sp2-hour" style="width:' + SP2_HOUR_W + 'px;">' + tick + '</div>';
  }

  if (!orders.length) {
    tl.innerHTML = '<div class="sp2-ruler">' + ruler + '</div>' +
      '<div class="sp2-empty">No orders in this window — widen the shift range or clear the filter.</div>';
    sp2Counts();
    return;
  }

  // lane packing: an order takes a lane where it does not overlap what is already there
  var lanes = [];
  orders.forEach(function(o) {
    var x = ((o.t - w.from) / 60) * SP2_HOUR_W;
    var placed = false;
    for (var li = 0; li < lanes.length && !placed; li++) {
      var last = lanes[li][lanes[li].length - 1];
      if (x >= last.x + SP2_CARD_W + 8) { lanes[li].push({ o:o, x:x }); placed = true; }
    }
    if (!placed) lanes.push([{ o:o, x:x }]);
  });

  var trackW = Math.max(hours * SP2_HOUR_W, 600);
  var grid = '';
  for (var g = 0; g <= hours; g++) grid += '<div class="sp2-grid-col" style="width:' + SP2_HOUR_W + 'px;"></div>';

  // The cards in a lane are placed by time, so the lane has to be as tall as
  // the tallest one in it — and a card is as tall as its lines table.
  var laneHeight = function (lane) {
    return lane.reduce(function (h, slot) {
      return Math.max(h, SP2_CARD_BASE + slot.o.prods.length * SP2_CARD_ROW);
    }, 0);
  };
  var lanesHtml = lanes.map(function(lane) {
    var cards = lane.map(function(slot) {
      return sp2CardHtml(slot.o, 'left:' + slot.x + 'px;width:' + SP2_CARD_W + 'px;');
    }).join('');
    return '<div class="sp2-lane" style="width:' + trackW + 'px;height:' + laneHeight(lane) + 'px;">' +
      '<div class="sp2-grid">' + grid + '</div>' + cards + '</div>';
  }).join('');

  tl.innerHTML = '<div class="sp2-ruler">' + ruler + '</div>' +
    '<div class="sp2-lanes" style="width:' + trackW + 'px;">' + lanesHtml + '</div>';
  sp2Counts();
}

function sp2Counts() {
  var w = sp2Window();
  var inWindow = SP2_ORDERS.filter(function(o){ return o.t >= w.from && o.t <= w.to; });
  var pl = inWindow.filter(sp2Planned).length;
  document.getElementById('sp2nAll').textContent = inWindow.length;
  document.getElementById('sp2nUn').textContent  = inWindow.length - pl;
  document.getElementById('sp2nPl').textContent  = pl;
  document.getElementById('sp2nBl').textContent  = inWindow.filter(sp2HasBlend).length;
  document.getElementById('sp2OrdCount').textContent = sp2Visible().length;
  var d = SP2_DRIVERS[sp2Driver], vs = document.getElementById('sp2Vs');
  if (vs) vs.textContent = d ? 'fit vs ' + d.truck : '';
  var n = Object.keys(sp2Picked).length, bar = document.getElementById('sp2PickBar');
  if (bar) { bar.classList.toggle('on', n > 0); document.getElementById('sp2PickN').textContent = n; }
}

function sp2SetQuick(q) {
  sp2Quick = q;
  document.querySelectorAll('#sp2Quick .sp2-seg-btn').forEach(function(b) {
    b.classList.toggle('on', b.dataset.q === q);
  });
  sp2RenderTimeline();
}
// A time axis cannot be re-sorted, so ranking by fit means the vertical list.
function sp2SetSort(o) {
  sp2Sort = o;
  document.querySelectorAll('[data-o]').forEach(function (b) {
    b.classList.toggle('on', b.dataset.o === o);
  });
  var h = document.querySelector('[data-v="h"]');
  h.disabled = o === 'fit';
  h.title = o === 'fit' ? 'Not available while sorting by fit — a time axis cannot be re-ordered'
                        : 'Horizontal timeline';
  if (o === 'fit' && sp2View === 'h') sp2SetView('v'); else sp2RenderTimeline();
}

function sp2ToggleBlend() {
  sp2BlendOnly = !sp2BlendOnly;
  document.getElementById('sp2BlendBtn').classList.toggle('on', sp2BlendOnly);
  sp2RenderTimeline();
}

function sp2SetView(v) {
  sp2View = v;
  document.querySelectorAll('[data-v]').forEach(function(b) {
    b.classList.toggle('on', b.dataset.v === v);
  });
  document.getElementById('sp2Body').setAttribute('data-view', v);
  // the shift range still filters, but only the horizontal view draws a scale
  document.getElementById('sp2TlWrap').style.overflowX = v === 'h' ? 'auto' : 'hidden';
  sp2RenderTimeline();
}

function sp2SetShift(s) {
  sp2Shift_ = s;
  document.querySelectorAll('[data-s]').forEach(function(b) {
    b.classList.toggle('on', b.dataset.s === s);
  });
  sp2RenderUnit();
}

// Only two controls sit in the header: the view switch, and this. Everything
// that narrows the list lives behind it, with a dot when it is narrowing.
function sp2PopAt(id, btn) {
  var p = document.getElementById(id), open = !p.classList.contains('on');
  document.querySelectorAll('.sp2-pop').forEach(function (x) { x.classList.remove('on'); });
  if (!open) return false;
  p.classList.add('on');
  var r = btn.getBoundingClientRect();
  p.style.top  = (r.bottom + 6) + 'px';
  p.style.left = Math.max(8, Math.min(window.innerWidth - p.offsetWidth - 8,
                                      r.right - p.offsetWidth)) + 'px';
  return true;
}
document.addEventListener('mousedown', function (e) {
  if (e.target.closest('.sp2-pop') || e.target.closest('.sp2-ico-btn') ||
      e.target.closest('.sp2-trl-btn')) return;
  document.querySelectorAll('.sp2-pop').forEach(function (x) { x.classList.remove('on'); });
});

// picking an order shows the driver it is planned on
function sp2PickOrder(id) {
  sp2SelOrder = id;
  var o = SP2_ORDERS.filter(function(x){ return x.id === id; })[0];
  if (o && o.driver) sp2Driver = o.driver;
  sp2Render();
  if (o && !o.driver) sp2Toast(o.id + ' has no driver yet — it sits unplanned');
}

// ══════════════════════════════════════════════════════════
//  Column 2 — driver, and the truck mapped to them
// ══════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════
//  Column 2 · Section 1 — the roster
// ══════════════════════════════════════════════════════════
var SP2_STATES = [['driving','Driving'], ['on-duty','On duty'], ['off-duty','Off duty']];

function sp2StateWord(s) {
  for (var i = 0; i < SP2_STATES.length; i++) if (SP2_STATES[i][0] === s) return SP2_STATES[i][1];
  return s;
}
function sp2Synced(m) {
  if (m < 60) return m + ' min ago';
  var h = Math.round(m / 60);
  return h < 24 ? h + ' hr ago' : Math.round(h / 24) + ' days ago';
}
// Available is not a fourth duty state — it crosses them. A driver is
// available when they are on the roster today and the rig still has room.
function sp2Avail(d) {
  if (d.state === 'off-duty') return false;
  var a = sp2Sum(SP2_TRUCKS[d.truck].comps.map(function (c) { return c.cap; }), d.load);
  var b = d.trailer ? sp2Sum(SP2_TRAILERS[d.trailer].caps, d.tload) : { cap:0, q:0 };
  return (a.q + b.q) < (a.cap + b.cap);
}

function sp2DriverKeys() {
  var q = (document.getElementById('sp2DrvSearch').value || '').toLowerCase().trim();
  if (sp2DrvFilter === 'available' && !sp2AvailOrder) sp2FreezeAvail();
  var keys = Object.keys(SP2_DRIVERS).filter(function (k) {
    var d = SP2_DRIVERS[k];
    if (sp2Shift_ !== 'all' && sp2ShiftBand(d.shift) !== sp2Shift_) return false;
    // A rig that had room when you arrived keeps its place even once you have
    // filled it — otherwise the card you just loaded disappears from under you.
    // It drops off the next time you ask Available for a fresh order.
    if (sp2DrvFilter === 'available') {
      if (!sp2Avail(d) && sp2AvailOrder.indexOf(k) < 0) return false;
    } else if (sp2DrvFilter !== 'all' && d.state !== sp2DrvFilter) return false;
    if (q && (d.name + ' ' + d.truck + ' ' + d.hub).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  // Available leads with the rigs that have most room — but it is taken ONCE,
  // when you arrive at the tab, and then held. Loading a truck fills it, and a
  // list that re-sorted on every drop would slide the card you are working on
  // out from under you. Clicking Available again is how you ask for a fresh one.
  if (sp2DrvFilter === 'available') {
    var at = {};
    sp2AvailOrder.forEach(function (k, n) { at[k] = n; });
    keys.sort(function (a, b) {
      var pa = at[a], pb = at[b];
      if (pa === undefined && pb === undefined) return sp2RigFill(a).pct - sp2RigFill(b).pct;
      if (pa === undefined) return 1;        // newly freed up: joins the end
      if (pb === undefined) return -1;
      return pa - pb;
    });
  }
  return keys;
}

// The ordering Available would give right now, by room.
function sp2AvailRank() {
  return Object.keys(SP2_DRIVERS)
    .filter(function (k) { return sp2Avail(SP2_DRIVERS[k]); })
    .sort(function (a, b) {
      var fa = sp2RigFill(a), fb = sp2RigFill(b);
      return fa.pct - fb.pct || fb.free - fa.free;
    });
}
function sp2FreezeAvail() { sp2AvailOrder = sp2AvailRank(); }

// One card, moved to where its space puts it — on request, never on its own.
function sp2MoveLane(e, k) {
  e.stopPropagation();
  if (!sp2AvailOrder) return;
  var rest = sp2AvailOrder.filter(function (x) { return x !== k; });
  var f = sp2RigFill(k), at = rest.length;
  for (var n = 0; n < rest.length; n++) {
    var g = sp2RigFill(rest[n]);
    if (g.pct > f.pct || (g.pct === f.pct && g.free < f.free)) { at = n; break; }
  }
  rest.splice(at, 0, k);
  sp2AvailOrder = rest;
  sp2RenderUnit();
  sp2Toast(SP2_DRIVERS[k].truck + ' moved to ' + (at + 1) + ' of ' + rest.length + ' by space left');
}

// How full a rig is, 0–100. Drives the Available ordering.
function sp2RigFill(k) {
  var cap = sp2RigCap(k);
  var on = sp2Cells(k).reduce(function (s, c) { return s + c.l.q; }, 0);
  return { pct: cap ? on / cap * 100 : 100, free: cap - on };
}

// ══════════════════════════════════════════════════════════
//  Hours of service — surfaced from Samsara, never computed here
// ══════════════════════════════════════════════════════════
// Samsara runs the DOT rules against each driver's own ruleset and we read the
// four clocks as they come. So every number below is shown, compared and
// coloured, but none of it is derived from our own shift data: if Samsara and
// the shift window disagree, Samsara is right and the lane says so.

function sp2Hm(m) {
  if (m <= 0) return '0:00';
  return Math.floor(m / 60) + ':' + String(Math.round(m % 60)).padStart(2, '0');
}
// Green until a fifth of the limit is left, amber from there, red near violation.
function sp2HosCls(rem, max) {
  var f = rem / max;
  return f < 0.08 ? 'bad' : f < 0.2 ? 'warn' : 'ok';
}
// The clock that will stop the driver first — the one worth naming on a card.
function sp2HosBind(h) {
  return ['brk','drv','shf','cyc'].reduce(function (a, b) {
    return h[b] / SP2_HOS_MAX[b] < h[a] / SP2_HOS_MAX[a] ? b : a;
  });
}
function sp2HosWorst(h) {
  var b = sp2HosBind(h);
  return sp2HosCls(h[b], SP2_HOS_MAX[b]);
}

// The strip every lane carries: all four clocks, the binding one marked.
// The shift time, what is left of it, and — on hover — everything about this
// driver's clock: the shift drawn, the four Samsara boxes, and the way into
// the record.
function sp2ShiftBlock(k) {
  var d = SP2_DRIVERS[k], st = sp2ShiftState(d);
  var off = d.state === 'off-duty';
  var read = off ? 'Off duty' : st ? st.note : '\u2014';
  var cls = off ? 'off' : st ? st.kind : '';
  return '<div class="sp2-hv">' +
      '<div class="sp2-ln-shift">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
          'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
          '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>' +
        '<span>' + sp2ShiftLabel(d.shift) + '</span>' +
      '</div>' +
      '<div class="sp2-ln-left ' + cls + '">' + read + '</div>' +
      '<div class="sp2-hv-card" onclick="event.stopPropagation()">' +
        sp2ShiftStrip(d) +
        sp2HosStrip(k, true) +
        '<button class="sp2-hv-cta" onclick="sp2CrewOpen(event,\'' + k + '\')">' +
          'Open driver details' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
          'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<polyline points="9 18 15 12 9 6"/></svg></button>' +
      '</div>' +
    '</div>';
}

function sp2HosStrip(k, bare) {
  var h = SP2_DRIVERS[k].hos, bind = sp2HosBind(h);
  var cells = ['brk','drv','shf','cyc'].map(function (c) {
    var rem = h[c], max = SP2_HOS_MAX[c], cls = sp2HosCls(rem, max);
    // the binding clock is marked only when it is actually tight — on a rested
    // driver every clock is green and underlining one of them says nothing
    var mark = c === bind && cls !== 'ok';
    return '<div class="sp2-hos-c ' + cls + (mark ? ' bind' : '') + '" ' +
        'title="' + SP2_HOS_NAME[c] + ' — ' + sp2Hm(rem) + ' of ' + (max / 60) + 'h left">' +
        '<div class="sp2-hos-c-top">' +
          '<span class="sp2-hos-c-l">' + SP2_HOS_NAME[c] + '</span>' +
          '<span class="sp2-hos-c-v">' + sp2Hm(rem) + '</span>' +
        '</div>' +
        '<div class="sp2-hos-bar"><i style="width:' +
          Math.max(2, Math.round(rem / max * 100)) + '%;"></i></div>' +
      '</div>';
  }).join('');
  return '<div class="sp2-hos ' + sp2HosWorst(h) + (bare ? ' bare' : '') + '"' +
      (bare ? '' : ' onclick="sp2HosOpen(event,\'' + k + '\')"') +
      ' title="Hours of service, read from Samsara">' +
      '<div class="sp2-hos-top">' +
        '<span class="sp2-hos-ttl">HOS</span>' +
        '<span class="sp2-hos-src">Samsara</span>' +
        (bare ? '' : '<span class="sp2-hos-go">View detail</span>') +
      '</div>' +
      '<div class="sp2-hos-row">' + cells + '</div>' +
    '</div>';
}

// ── The detail ───────────────────────────────────────────
// One ring per clock, depleting as the hours go — the same shape as the dials
// in the Samsara driver app, so a dispatcher reading both sees one picture.
function sp2HosDial(key, rem) {
  var max = SP2_HOS_MAX[key], cls = sp2HosCls(rem, max);
  var r = 25, c = 2 * Math.PI * r, on = Math.max(0, Math.min(1, rem / max));
  return '<div class="sp2-dial ' + cls + '">' +
      '<svg class="sp2-sv" width="64" height="64" viewBox="0 0 64 64">' +
        '<circle cx="32" cy="32" r="' + r + '" fill="none" stroke="var(--fp-outline-1)" stroke-width="6"/>' +
        '<circle cx="32" cy="32" r="' + r + '" fill="none" stroke="currentColor" stroke-width="6" ' +
          'stroke-linecap="round" stroke-dasharray="' + (c * on).toFixed(1) + ' ' + c.toFixed(1) + '" ' +
          'transform="rotate(-90 32 32)"/>' +
      '</svg>' +
      '<div class="sp2-dial-v">' + sp2Hm(rem) + '</div>' +
      '<div class="sp2-dial-l">' + SP2_HOS_NAME[key] + '</div>' +
      '<div class="sp2-dial-max">of ' + (max / 60) + 'h</div>' +
    '</div>';
}

// The day as the ELD recorded it. Off-duty drivers have no day to show.
var SP2_DUTY_DAY = [
  ['ON', 15, 'Pre-trip inspection'],
  ['D',  95, 'Drive to terminal'],
  ['ON', 40, 'Loading'],
  ['D',  70, 'Drive to first stop'],
  ['ON', 35, 'Delivery'],
  ['OFF',30, 'Required 30-minute break'],
  ['D',  80, 'Drive'],
  ['ON', 45, 'Delivery'],
  ['D',  60, 'Drive'],
  ['ON', 30, 'Post-trip inspection'],
];
function sp2HosLog(k) {
  var d = SP2_DRIVERS[k], s = SP2_SHIFTS[d.shift];
  if (d.state === 'off-duty') return [{ st:'OFF', from:0, to:1440, what:'Off duty — not on the roster today' }];
  var at = s.from, end = Math.min(s.to, SP2_NOW), out = [];
  if (end <= at) return [];
  SP2_DUTY_DAY.forEach(function (row) {
    if (at >= end) return;
    var to = Math.min(at + row[1], end);
    out.push({ st:row[0], from:at, to:to, what:row[2] });
    at = to;
  });
  return out;
}

// The classic ELD graph: four rows, a stepped line between them.
var SP2_DUTY_ROWS = ['OFF','SB','D','ON'];
function sp2HosGraph(k) {
  var log = sp2HosLog(k);
  var W = 392, H = 76, rowH = H / 4, x = function (m) { return m / 1440 * W; };
  var grid = SP2_DUTY_ROWS.map(function (r, n) {
    return '<line x1="0" y1="' + (n * rowH) + '" x2="' + W + '" y2="' + (n * rowH) +
           '" stroke="var(--fp-outline-1)" stroke-width="1"/>' +
           '<text x="2" y="' + (n * rowH + 11) + '" class="sp2-g-lbl">' + r + '</text>';
  }).join('') + '<line x1="0" y1="' + H + '" x2="' + W + '" y2="' + H +
    '" stroke="var(--fp-outline-1)" stroke-width="1"/>';
  var hours = '';
  for (var hh = 0; hh <= 24; hh += 3)
    hours += '<line x1="' + x(hh * 60) + '" y1="0" x2="' + x(hh * 60) + '" y2="' + H +
             '" stroke="var(--fp-stroke-hairline)" stroke-width="1" opacity=".55"/>' +
             '<text x="' + x(hh * 60) + '" y="' + (H + 11) + '" class="sp2-g-hr">' + hh + '</text>';
  var path = '', prev = null;
  log.forEach(function (r) {
    var y = SP2_DUTY_ROWS.indexOf(r.st) * rowH + rowH / 2;
    if (prev !== null && prev !== y) path += 'L' + x(r.from).toFixed(1) + ',' + y.toFixed(1) + ' ';
    path += (path ? 'L' : 'M') + x(r.from).toFixed(1) + ',' + y.toFixed(1) + ' ' +
            'L' + x(r.to).toFixed(1) + ',' + y.toFixed(1) + ' ';
    prev = y;
  });
  return '<svg class="sp2-g sp2-sv" width="' + W + '" height="' + (H + 15) + '" viewBox="0 0 ' + W + ' ' + (H + 15) + '">' +
      hours + grid +
      (path ? '<path d="' + path + '" fill="none" stroke="var(--status-success)" stroke-width="2" ' +
              'stroke-linejoin="round" stroke-linecap="round"/>' : '') +
    '</svg>';
}

var sp2HosFor = null;
function sp2HosBodyHtml(k) {
  var d = SP2_DRIVERS[k], h = d.hos, bind = sp2HosBind(h);
  var used = SP2_HOS_MAX.cyc - h.cyc;

  var log = sp2HosLog(k).map(function (r) {
    return '<div class="sp2-dl-row">' +
        '<span class="sp2-duty ' + r.st + '">' + r.st + '</span>' +
        '<span class="sp2-dl-t">' + sp2Hhmm(r.from) + '–' + sp2Hhmm(r.to) + '</span>' +
        '<span class="sp2-dl-w">' + r.what + '</span>' +
        '<span class="sp2-dl-d">' + sp2Dur(r.to - r.from) + '</span>' +
      '</div>';
  }).join('') || '<div class="sp2-hos-none">Nothing recorded yet — the shift has not begun.</div>';

  return '<div class="sp2-hos-who">' +
      '<div class="sp2-av lg">' + d.name.split(' ').map(function (x) { return x[0]; }).join('').slice(0, 2) + '</div>' +
      '<div>' +
        '<div class="sp2-hos-nm">' + d.name + '</div>' +
        '<div class="sp2-hos-sub">' + d.truck + ' · ' + d.hub + ' · ' + sp2ShiftLabel(d.shift) + '</div>' +
      '</div>' +
      '<span class="sp2-duty ' + h.duty + ' big">' + h.duty + '</span>' +
    '</div>' +

    '<div class="sp2-hos-note">Read from Samsara ' + sp2Dur(h.read) + ' ago. Samsara computes these ' +
      'against this driver&rsquo;s ruleset; FleetPanda only shows them.</div>' +

    '<div class="sp2-dials">' + ['brk','drv','shf','cyc'].map(function (c) {
      return sp2HosDial(c, h[c]);
    }).join('') + '</div>' +

    '<div class="sp2-hos-bind ' + sp2HosCls(h[bind], SP2_HOS_MAX[bind]) + '">' +
      SP2_HOS_NAME[bind] + ' is the binding limit — ' + sp2Hm(h[bind]) + ' left' +
    '</div>' +

    '<div class="sp2-hos-sect">Weekly cycle</div>' +
    '<div class="sp2-cyc">' +
      '<div class="sp2-cyc-bar"><i style="width:' + Math.round(used / SP2_HOS_MAX.cyc * 100) + '%;"></i></div>' +
      '<div class="sp2-cyc-ln"><b>' + sp2Hm(used) + '</b> used of 70h · <b>' + sp2Hm(h.cyc) + '</b> available</div>' +
      '<div class="sp2-hos-fine">A rolling 8-day window, counted in hours — not day N of 8. ' +
        sp2Hm(h.back) + ' comes back tonight as the oldest day rolls off.</div>' +
    '</div>' +

    '<div class="sp2-hos-sect">Today</div>' +
    sp2HosGraph(k) +
    '<div class="sp2-dl">' + log + '</div>';
}

// One sheet, two records. It reads; it never acts — changing a driver, a truck
// or a load is done in the lane, and a second place to do it is a second place
// for the two to disagree.
function sp2SheetShow(title, size, html) {
  document.getElementById('sp2SheetTtl').textContent = title;
  var sh = document.getElementById('sp2HosSheet');
  sh.setAttribute('data-size', size);
  document.getElementById('sp2HosBody').innerHTML = html;
  sh.classList.add('on');
  document.getElementById('sp2HosScrim').classList.add('on');
}
function sp2HosClose() {
  sp2HosFor = null; sp2OrdFor = null;

  document.getElementById('sp2HosScrim').classList.remove('on');
}
function sp2HosOpen(e, k) { sp2CrewOpen(e, k); }
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && document.getElementById('sp2HosSheet').classList.contains('on')) sp2HosClose();
});

// ── The order, and what it adds up to ───────────────────
var sp2OrdFor = null;
var SP2_ACTORS = ['Priya Raman','Dale Hoffmann','Marcus Webb','Yasmin Qureshi'];

    '<div class="sp2-sh-grid">' +

// ── Driver, truck and trailer, in one sheet ──────────────
function sp2CrewOpen(e, k) {
  if (e) e.stopPropagation();
  sp2HosFor = k;
  var d = SP2_DRIVERS[k], t = SP2_TRUCKS[d.truck];
  var trl = d.trailer ? SP2_TRAILERS[d.trailer] : null;

  var comps = function (caps, load, pre) {
    return '<div class="sp2-sh-tbl">' + caps.map(function (cap, i) {
      var l = (load && load[i]) || { p:'', q:0 };
      var col = SP2_PROD_COLORS[l.p] || 'var(--fp-outline-1)';
      return '<div class="sp2-sh-row">' +
          '<span class="sp2-sh-c">' + pre + (i + 1) + '</span>' +

              sp2Gal(o).toLocaleString() + ' gal</span>' +

      }).join('') + '</div>'
    : '<div class="sp2-hos-none">Nothing planned on this rig yet.</div>';

  sp2SheetShow(d.name + ' \u00b7 ' + d.truck + (trl ? ' + ' + d.trailer : ''), 'crew',
    sp2HosBodyHtml(k) +

    '<div class="sp2-sh-facts">' +
      '<span>' + t.type + '</span><span>' + t.comps.length + ' compartments</span>' +
      '<span>' + t.comps.reduce(function (a, c) { return a + c.cap; }, 0).toLocaleString() + ' gal</span>' +
      '<span>Meter ' + t.meter + '</span>' +
    '</div>' +
    comps(t.comps.map(function (c) { return c.cap; }), d.load, 'C') +
    (trl
      ? '<div class="sp2-hos-sect">Trailer \u00b7 ' + d.trailer + '</div>' +
        '<div class="sp2-sh-facts">' +
          '<span>Pup trailer</span><span>' + trl.caps.length + ' compartments</span>' +
          '<span>' + trl.caps.reduce(function (a, c) { return a + c; }, 0).toLocaleString() + ' gal</span>' +
        '</div>' +
        comps(trl.caps, d.tload, 'T')
      : '<div class="sp2-hos-sect">Trailer</div>' +
        '<div class="sp2-hos-none">No trailer hitched.</div>') +
    '<div class="sp2-hos-sect">Today\u2019s route</div>' + route);
}
