   makes do with 7px — it is the column that runs into the card's edge */
.sp2-two-l .sp2-ct-f{gap:3px;padding-right:12px;}
.sp2-two-l .sp2-ct-pct{font-size:10px;}
.sp2-two-l .sp2-ct-foot{padding:8px 9px;font-size:12px;flex-wrap:wrap;row-gap:7px;}
.sp2-two-l .sp2-ct-btn{height:26px;padding:0 11px;font-size:12px;}
.sp2-two-r .sp2-rig{margin-top:0;overflow:visible;min-width:0;max-width:100%;}
/* the drawing scales to the column it is given rather than scrolling */
.sp2-two-r .sp2-rig svg{max-width:100%;height:auto;}

/* ── the load as a table ───────────────────────────────
   The drawing above it keeps the picture; this is where the load is changed.
   Same lines table as the order card: a tinted head, 40px rows, the cell IS
   the control, everything left-aligned. */
.sp2-ct{display:grid;grid-template-columns:62px minmax(0,1fr) 110px 110px;
  margin-top:10px;background:var(--fp-surface-1b);border:1px solid var(--fp-outline-1);
  border-radius:var(--r-md);overflow:hidden;}
.sp2-ct.loose{border-color:color-mix(in oklab,var(--status-caution) 45%,var(--fp-outline-1));}
.sp2-ct-head{display:contents;}
.sp2-ct-head>span{height:36px;display:flex;align-items:center;padding:0 12px;
  background:var(--fp-table-header);border-bottom:1px solid var(--fp-stroke-hairline);
  font-size:13px;font-weight:500;color:var(--fp-ink-1);}
.sp2-ct-row{display:contents;}
.sp2-ct .sp2-lt-c{height:40px;border-bottom:1px solid var(--fp-stroke-hairline);}
.sp2-ct-row:last-of-type .sp2-lt-c{border-bottom:none;}
.sp2-ct-n{padding:0 12px;font-size:13px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}
.sp2-ct-p{gap:8px;padding:0 12px;font-size:13px;color:var(--fp-ink-1);overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;}
/* The monitor reads top-down: the bar across the whole column, the number
   under it. Side by side, the bar was squeezed to a stub and the number sat
   on the column's right edge with nothing to breathe into. */
.sp2-ct-f{flex-direction:column;align-items:stretch;justify-content:center;gap:3px;
  padding:0 12px;font-size:13px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}
.sp2-ct-pct{align-self:stretch;font-size:11px;line-height:1;color:var(--fp-ink-3);}
.sp2-ct-bar{width:100%;height:6px;border-radius:9999px;background:var(--fp-card-1);overflow:hidden;}
.sp2-ct-bar>i{display:block;height:100%;}
.sp2-ct-foot{grid-column:1 / -1;display:flex;align-items:center;gap:10px;padding:9px 12px;
  border-top:1px solid var(--fp-stroke-hairline);font-size:13px;}
.sp2-ct-ok{color:var(--status-success);font-weight:500;}
.sp2-ct-loose{color:var(--status-caution);}
.sp2-ct-loose b{font-weight:600;font-variant-numeric:tabular-nums;}
.sp2-ct-btn{margin-left:auto;height:28px;padding:0 13px;border:none;border-radius:var(--r-md);
  background:var(--primary);color:var(--primary-foreground);font-family:inherit;font-size:13px;
  font-weight:500;cursor:pointer;}
.sp2-ct-btn:hover{background:color-mix(in oklab,var(--primary) 88%,#fff);}
.sp2-ct-btn.out{margin-left:0;border:1px solid var(--fp-stroke-field);background:var(--fp-surface-1b);
  color:var(--fp-ink-1);}
.sp2-ct-btn.out:hover{background:var(--fp-emphasis);}
.sp2-ct-loose ~ .sp2-ct-btn.out{margin-left:0;}

/* ── what would fill the rest of the rig ───────────────
   Sits directly under the drawing, because it is about the room the drawing
   just showed. Every pick is a whole order: there is no splitting here. */
.sp2-sg{margin-top:10px;padding:10px 12px;border:1px solid var(--fp-outline-1);
  border-radius:var(--r-md);background:var(--fp-surface-1a);}
.sp2-sg-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;row-gap:4px;margin-bottom:8px;}
.sp2-sg-ttl{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--fp-ink-3);}
.sp2-sg-room{margin-left:auto;font-size:12px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}
.sp2-sg-list{display:flex;flex-direction:column;gap:6px;}
.sp2-sg-item{display:flex;align-items:center;gap:10px;padding:8px 10px;
  background:var(--fp-surface-1b);border:1px solid var(--fp-outline-1);border-radius:var(--r-md);}
.sp2-sg-item:hover{border-color:var(--fp-outline-2);}
.sp2-sg-main{flex:1;min-width:0;}
.sp2-sg-l1{display:flex;align-items:center;gap:7px;min-width:0;}
.sp2-sg-l2{display:flex;align-items:center;gap:8px;margin-top:3px;font-size:12px;
  color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}
.sp2-sg-id{font-size:13px;font-weight:600;color:var(--fp-ink-1);font-variant-numeric:tabular-nums;
  flex-shrink:0;}
.sp2-sg-ship{font-size:13px;color:var(--fp-ink-3);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;}
.sp2-sg-gal{color:var(--fp-ink-1);font-weight:500;}
.sp2-sg-to{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:1px;
  text-align:right;}
.sp2-sg-to-c{font-size:12px;font-weight:600;color:var(--fp-ink-1);}
.sp2-sg-to-p{font-size:11px;font-weight:600;color:var(--status-success);
  font-variant-numeric:tabular-nums;}
/* the act is filled: an outline reads as one more thing to look at, not the
   thing to press */
.sp2-sg-add{flex-shrink:0;height:28px;padding:0 14px;border:none;border-radius:var(--r-md);
  background:var(--primary);color:var(--primary-foreground);font-family:inherit;font-size:13px;
  font-weight:500;cursor:pointer;}
.sp2-sg-add:hover{background:color-mix(in oklab,var(--primary) 88%,#fff);}
.sp2-sg-addall{margin-top:8px;height:28px;padding:0 12px;border:1px solid var(--fp-stroke-field);
  border-radius:var(--r-md);background:var(--fp-surface-1b);color:var(--fp-ink-1);
  font-family:inherit;font-size:13px;cursor:pointer;}
.sp2-sg-addall:hover{background:var(--fp-emphasis);}
.sp2-sg-none{font-size:12px;color:var(--fp-ink-3);line-height:1.5;}
.sp2-why{position:relative;display:inline-flex;align-items:center;gap:5px;}
.sp2-info{display:inline-flex;color:var(--fp-ink-3);cursor:help;}
.sp2-info:hover{color:var(--fp-ink-1);}
.sp2-why-card{visibility:hidden;opacity:0;position:absolute;left:0;top:calc(100% + 8px);
  z-index:95;width:320px;padding:8px;background:var(--fp-surface-1b);
  border:1px solid var(--fp-outline-1);border-radius:var(--r-lg);
  box-shadow:0 8px 20px -6px rgba(3,4,5,.18);cursor:default;
  transition:opacity .12s linear,visibility 0s linear .45s;}
.sp2-why-card::before{content:'';position:absolute;left:0;right:0;top:-12px;height:12px;}
.sp2-info:hover + .sp2-why-card,.sp2-info:focus + .sp2-why-card,
.sp2-why-card:hover{visibility:visible;opacity:1;transition:opacity .12s linear;}
.sp2-why-h{display:block;padding:2px 6px 5px;font-size:10px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3);}
.sp2-why-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:3px 6px;font-size:12px;color:var(--fp-ink-2,var(--fp-ink-3));line-height:1.4;}
.sp2-why-row b{flex-shrink:0;font-weight:500;color:var(--fp-ink-1);
  font-variant-numeric:tabular-nums;}
.sp2-why-row.tot{margin-top:3px;padding-top:6px;border-top:1px solid var(--fp-stroke-hairline);
  color:var(--fp-ink-1);}
.sp2-why-n{display:block;padding:6px 6px 2px;font-size:11px;color:var(--fp-ink-3);
  line-height:1.45;}

/* ── the order card, round 3 ──────────────────────────
   Two units with a rule between them; the rule is flush to the card's edges
   because it divides the card, not the content inside it. */
.sp2-card.sp2-v3{padding:12px 14px;}
.sp2-ship-row{position:relative;display:flex;align-items:center;gap:7px;margin-top:11px;min-width:0;}
.sp2-pin{flex-shrink:0;color:var(--fp-ink-3);}
.sp2-ship-row .sp2-ship{font-size:14px;font-weight:500;color:var(--fp-ink-1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* the address is one hover away rather than a second line on every card */
.sp2-tip{position:absolute;left:18px;top:calc(100% + 6px);z-index:40;display:none;
  max-width:300px;padding:7px 10px;border:1px solid var(--fp-outline-1);border-radius:var(--r-md);
  background:var(--fp-surface-1b);color:var(--fp-ink-1);font-size:12px;line-height:1.45;
  box-shadow:0 4px 6px -1px rgba(3,4,5,.1),0 2px 4px -2px rgba(3,4,5,.1);}
.sp2-ship-row:hover .sp2-tip{display:block;}
.sp2-win{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:12px;
  color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}
.sp2-win svg{flex-shrink:0;}
.sp2-rule{height:1px;background:var(--fp-stroke-hairline);margin:12px -14px;}

/* The FP DS lines table (unit.lines-table), as the sheets draw it: flush to
   the card's edges, a tinted header band, 44px rows ruled by a hairline, every
   cell the control itself rather than a bordered box inside a box, and
   everything left-aligned — the figures included. */
/* The table sits in a card of its own inside the order card, 5px off its
   left, right and bottom edges — the order card's padding is 12px 14px, so the
   negative margins take it back out to that inset. The inner card's rim is
   what divides the two units; a rule above it as well would be two strokes
   saying one thing. */
/* The card at rest: one line for the whole load, in the frame the table would
   have filled, so opening it changes the contents and not the shape. */
.sp2-lsum{display:flex;align-items:center;gap:8px;height:44px;
  margin:10px -12px -10px;width:calc(100% + 24px);padding:0 12px;
  background:none;border:none;border-top:1px solid var(--fp-stroke-hairline);
  font-family:inherit;cursor:pointer;text-align:left;
  /* shut, the line is the card's last band, so its wash turns the card's own
     bottom corners rather than ending square inside them — the 3px comes off
     the card's inner curve for the band's own inset */
  border-radius:0 0 calc(var(--r-lg) - 3px) calc(var(--r-lg) - 3px);}
/* open, the same button keeps its box — square again, since the table now
   carries the card's bottom edge — and the table grows below it */
.sp2-lsum.open{margin-bottom:0;border-radius:0;}
.sp2-lsum:hover{background:var(--fp-emphasis-hover);}
.sp2-lsum-n{font-size:14px;color:var(--fp-ink-1);white-space:nowrap;}
.sp2-lsum-q{margin-left:auto;font-size:14px;font-weight:600;color:var(--fp-ink-1);
  font-variant-numeric:tabular-nums;white-space:nowrap;}

.sp2-lt{display:grid;grid-template-columns:minmax(0,1fr) 110px 64px;
  margin:0 -12px -10px;background:none;overflow:hidden;}
.sp2-lt.blended{grid-template-columns:minmax(0,1fr) 76px 110px 64px;}
.sp2-lt-head{display:contents;}
.sp2-lt-head>span{min-height:40px;display:flex;align-items:center;padding:9px 12px;
  background:var(--fp-table-header);border-bottom:1px solid var(--fp-stroke-hairline);
  font-size:14px;font-weight:500;color:var(--fp-ink-1);text-align:left;line-height:1.2;}
.sp2-lt-row{display:contents;}
.sp2-lt-c{height:44px;display:flex;align-items:center;min-width:0;
  border-bottom:1px solid var(--fp-stroke-hairline);}
.sp2-lt-row:last-of-type .sp2-lt-c{border-bottom:none;}
.sp2-lt-p{gap:8px;padding:0 12px;font-size:14px;color:var(--fp-ink-1);}
.sp2-lt-p>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp2-lt-ratio{padding:0 12px;font-size:14px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp2-lt-ratio b{font-weight:500;color:var(--fp-ink-1);}
/* the rows of one blend are joined by a bracket, so two blends on an order
   never read as four unrelated products */
.sp2-lt-ratio.g{position:relative;padding-left:26px;}
.sp2-lt-ratio.g::before{content:'';position:absolute;left:12px;width:1.5px;
  background:var(--fp-outline-2);}
.sp2-lt-ratio.g-first::before{top:50%;bottom:-1px;border-top-left-radius:2px;}
.sp2-lt-ratio.g-mid::before{top:-1px;bottom:-1px;}
.sp2-lt-ratio.g-last::before{top:-1px;bottom:50%;}
.sp2-lt-ratio.g::after{content:'';position:absolute;left:12px;top:50%;width:7px;height:1.5px;
  background:var(--fp-outline-2);}
.sp2-lt-none{color:var(--fp-ink-3);}
/* an editable cell IS the control — no border, washes on hover, rings on focus */
.sp2-lt-edit{position:relative;padding:0;}
.sp2-cell{position:absolute;inset:0;width:100%;height:100%;padding:0 12px;border:none;
  border-radius:0;background:transparent;color:var(--fp-ink-1);font-family:inherit;
  font-size:14px;outline:none;font-variant-numeric:tabular-nums;}
.sp2-cell:hover{background:var(--fp-emphasis);}
.sp2-cell:focus{background:var(--fp-surface-1a);box-shadow:inset 0 0 0 2px color-mix(in oklab,var(--ring) 50%,transparent);}
.sp2-cell-u{cursor:pointer;appearance:none;padding-right:20px;
  background-image:linear-gradient(45deg,transparent 50%,var(--fp-ink-3) 50%),
    linear-gradient(135deg,var(--fp-ink-3) 50%,transparent 50%);
  background-position:calc(100% - 13px) 20px,calc(100% - 8px) 20px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
.sp2-cell-u:hover{background-color:var(--fp-emphasis);}

/* the head's right edge: the status, then the way in */
.sp2-pill-r{margin-left:auto;}
.sp2-chev{width:24px;height:24px;flex-shrink:0;border:none;border-radius:var(--r-md);
  background:transparent;color:var(--fp-ink-3);display:inline-flex;align-items:center;
  justify-content:center;cursor:pointer;}
.sp2-chev:hover{background:var(--fp-emphasis);color:var(--fp-ink-1);}

/* the window, the clash, and the run from the hub */
.sp2-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px;
  font-size:12px;color:var(--fp-ink-3);}
.sp2-when{font-variant-numeric:tabular-nums;}
.sp2-when.clash{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:9999px;
  background:color-mix(in oklab,var(--status-caution) 11%,transparent);color:var(--status-caution);font-weight:500;}
.sp2-clash{color:var(--status-caution);}
.sp2-sep{width:1px;height:12px;background:var(--fp-outline-2);}
.sp2-trip{font-variant-numeric:tabular-nums;white-space:nowrap;}
.sp2-trip b{font-weight:500;color:var(--fp-ink-1);}
.sp2-from{opacity:.8;white-space:nowrap;}

/* picking several orders to drag as one */
.sp2-picked{display:none;align-items:center;gap:8px;height:24px;padding:0 10px;border-radius:9999px;background:var(--fp-selected);color:var(--fp-selected-strong);font-size:12px;}
.sp2-picked.on{display:inline-flex;}
.sp2-picked b{font-weight:600;font-variant-numeric:tabular-nums;}
.sp2-picked .sp2-link{font-size:12px;color:var(--fp-selected-strong);}
.sp2-ghost{position:fixed;top:-200px;left:-200px;padding:7px 11px;border-radius:var(--r-md);background:var(--fp-ink-1);color:var(--fp-surface-1b);font-family:inherit;font-size:12px;font-weight:500;}
.sp2-cbx{width:16px;height:16px;flex-shrink:0;border:1px solid var(--fp-stroke-field);
  border-radius:4px;background:var(--fp-surface-1b);padding:0;cursor:pointer;position:relative;}
.sp2-cbx:hover{border-color:var(--fp-ink-1);}
.sp2-cbx.picked{background:var(--fp-ink-1);border-color:var(--fp-ink-1);}
.sp2-cbx.picked::after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;
  border:solid var(--fp-surface-1b);border-width:0 2px 2px 0;transform:rotate(45deg);}
.sp2-card.picked{border-color:var(--fp-selected-border);background:var(--fp-selected);}
.sp2-open{margin-left:auto;width:24px;height:24px;flex-shrink:0;border:1px solid var(--fp-stroke-field);
  border-radius:var(--r-md);background:var(--fp-surface-1b);color:var(--fp-ink-3);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
.sp2-open:hover{background:var(--fp-emphasis);color:var(--fp-ink-1);}
.sp2-card-l .sp2-ship{margin-top:6px;}
</style>
</head>
<body>

<div class="sp2">

  <!-- Header -->
  <!-- ══ One head for both columns ══════════════════════════
       The presets and the filters narrow the whole planner, so they sit above
       it rather than once per column. Each column keeps only how it shows
       itself, and wears its own chips under its name. -->
  <div class="sp2-head">
    <div class="sp2-vr" id="sp2Vr"></div>

    <!-- what narrows and orders on the left; what the day is on the right -->
    <div class="sp2-tools">
      <div class="sp2-tools-l">
        <div class="sp2-srch" id="sp2SrchWrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
          <input class="sp2-search" id="sp2DrvSearch" type="search"
            placeholder="Search orders, ship-tos, drivers or trucks" aria-label="Search all columns"
            oninput="sp2DrvSearchIn()">
          <button class="sp2-srch-x" aria-label="Clear search" onclick="sp2DrvSearchClear()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <div class="sp2-fltwrap">
          <button class="sp2-tool-btn" id="sp2FpBtn" onclick="sp2FpToggle(event)" title="Filters">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/>
              <line x1="10" y1="18" x2="14" y2="18"/></svg>
            Filters <span class="sp2-bubble" id="sp2FpN"></span>
          </button>
          <div class="sp2-fp" id="sp2Fp" onclick="event.stopPropagation()"></div>
        </div>

        <div class="sp2-fltwrap">
          <button class="sp2-tool-btn" id="sp2SortBtn" onclick="sp2SortToggle(event)" title="Sort orders">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg><span class="sp2-bubble" id="sp2SortN"></span>
          </button>
          <div class="sp2-fltpop" id="sp2SortPop" onclick="event.stopPropagation()">
            <div class="sp2-fltpop-h">Sort orders by</div>
            <button class="sp2-fltrow on" data-o="time" onclick="sp2SetSort('time')"
              title="In the order the day runs them"><span class="sp2-tick">✓</span>Time</button>
            <button class="sp2-fltrow" data-o="fit" onclick="sp2SetSort('fit')"
              title="Best fit for the chosen rig first"><span class="sp2-tick">✓</span>Fit
              <span class="sp2-fltrow-n" id="sp2SortFitVs"></span></button>
            <button class="sp2-fltrow" data-o="driver" onclick="sp2SetSort('driver')"
              title="Every driver’s orders together"><span class="sp2-tick">✓</span>Driver</button>
          </div>
        </div>
      </div>

      <div class="sp2-tools-r">
        <div class="sp2-date">
          <button class="sp2-nav-btn" onclick="sp2Shift(-1)" title="Previous day">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          </button>

    var sh = SP2_SHIFTS[SP2_SHIFTK[i % 4]];

// The catch is that the fleet spans 2,800 to 10,500 gal, so no single quantity
// is a good fill for every class — 9,000 gal fills an HV exactly and swamps a

var SP2_CLASS = {};
SP2_SPECS.forEach(function (s) { SP2_CLASS[s.pre] = s.caps; });

// One run of compartments per product, each run filled before the next starts —

function sp2SizeTo(caps, fill, nProd) {

  var left = Math.round(cap * fill / 50) * 50;

    for (var c = g * per; c < hi; c++) room += caps[c];
    var q = Math.min(room, left);
    if (q > 0) { out.push(q); left -= q; }
  }
  return out;
}

// The day's cuts, in the order the unplanned list takes them: rig class, then

// reads 85–100% on BOTH transports — an HV filled to the brim is 86% of an LT.
// Fifty gallons either side and one of the two falls out of the band, so the
// strip carries most of the day's work.
//
// The fleet runs from 2,800 to 10,500 gal, and no single quantity is a good
// fill for all of it: 9,000 gal fills an HV exactly and swamps a bobtail three
// times over. So the band is a per-class promise, not a fleet-wide one, and

var SP2_CUT = [

  ['BT',0.930], ['HV',1.000], ['LT',0.950], ['HV',0.995], ['PB',1.000],
  ['HV',0.990], ['TW',0.880], ['HV',1.000], ['BT',1.000], ['HV',0.995],

  function cutFor(planned, i) {

    var planned = i % 3 !== 2;
    out.push({
      id:'D-' + (5157060 + i),
      ship:st[0], addr:st[1],
      t:305 + ((i * 47) % 740),                 // 05:05 through 21:25
      type:SP2_TYPES[i % SP2_TYPES.length],
      driver: planned ? SP2_ON_ROAD[(i * 7) % SP2_ON_ROAD.length] : '',
      prods:linesFor(cutFor(planned, i), i, null),

  // terminal splash-blends, one it simply racks.

      type:SP2_TYPES[(j + 2) % SP2_TYPES.length],

// ── The day, built as runs rather than as single drops ──
// The dispatch docs are explicit about the shape of a driver's day:
//   · field research — "typical 3–4 deliveries per shift, fewer when spread out"
//   · the consolidated Corpus Christi day — 4.0 stops per load, average fill 76%
//   · "drivers own regions and customers; cross-region delivery is unusual"
//   · "single truck per ship-to is the norm; low product mix"
// So a planned rig carries a ROUTE: four or five ship-tos near its hub, mostly
// one product, windows stepping through the shift. The day's orders were cut
// to fill whole rigs one at a time, which is the opposite shape, so the
// planned side of the day is rebuilt here and the whole-rig cuts are left in
// the unplanned column, where the fit chip and the fit sort still need them.
//
// Capacities are NOT touched. The class bands are fixed in the truck-types doc
// (tank wagon 3,500–7,999, transport 8,000–11,500) and a 2,800-gal bobtail
// running five 500-gal drops is a real day, not a broken one.
(function buildTheDayIntoRuns() {
  var road = Object.keys(SP2_DRIVERS).filter(function (k) {
    var d = SP2_DRIVERS[k];
    return d.state !== 'off-duty' && SP2_YARD.indexOf(k) < 0;
  });
  // every rig that is out gets a run; the yard stays unplanned, which is the
  // whole point of the yard, and an off-duty driver has no day to plan
  SP2_ORDERS.forEach(function (o) { o.driver = ''; });

  var seq = 0, taken = {};
  road.forEach(function (k, n) {
    var d = SP2_DRIVERS[k], t = SP2_TRUCKS[d.truck];

    var cap = caps.concat(tcaps).reduce(function (a, b) { return a + b; }, 0);
    var stops = [4, 5, 4, 5, 5, 4, 5, 4, 4, 5][n % 10];

    // a rig that left the yard full stays full; the rest run the docs' 76%

    var total = Math.round(cap * (full ? 0.99 : [0.74, 0.86, 0.80, 0.92, 0.78][n % 5]) / 50) * 50;

    // the ship-tos this driver's region holds: the nearest to their hub
    var near = SP2_SHIPTOS.filter(function (st) { return sp2InRegion(d.hub, st[1]) && !taken[st[0]]; })
      .map(function (st) {
        return { st:st, mi: 2 + (sp2Hash(d.hub + '|' + st[0]) % 280) / 10 };
      }).sort(function (a, b) { return a.mi - b.mi; }).slice(0, stops);
    stops = near.length;
    if (!stops) return;
    near.forEach(function (x) { taken[x.st[0]] = true; });

    // low product mix: one product down the run, a second on the last stop
    var pa = SP2_PRODS[n % SP2_PRODS.length];
    var pb = SP2_PRODS[(n + 2) % SP2_PRODS.length];

    var sh = SP2_SHIFTS[d.shift];
    // Nothing can be delivered until the truck has driven to the rack and
    // loaded, so the windows are laid out from THAT moment, not from the
    // start of the shift. Without this every run reads late by an hour.
    var begin = Math.max(sh.from, SP2_NOW - 45) +
      sp2Drive(sp2Terminal(d.hub).mi, k) + Math.round(total / SP2_GPM_LOAD + 25);
    // windows open and close at different times across the fleet, so the day
    // carries all three readings: made, waited for, and missed
    // Windows open at different hours and run for different spans across the
    // fleet, so the day carries all three readings: made, waited for, missed.
    // A run whose windows are packed into the front of the shift finishes late;
    // one whose windows are spread wide leaves the driver waiting.
    var first = begin + [10, 70, 25, 90, 40][n % 5];
    var last  = Math.min(sh.to - 60, first + [170, 330, 105, 350, 200][n % 5]);
    last = Math.max(last, first + 40);

    var left = total;
    near.forEach(function (x, i) {
      var share = i === stops - 1 ? left

      share = Math.min(share, left);
      left -= share;
      if (share < 150) return;
      SP2_ORDERS.push({
        id: 'D-' + (5157200 + seq++),
        ship: x.st[0], addr: x.st[1],
        t: Math.round((first + (last - first) * (stops > 1 ? i / (stops - 1) : 0)) / 5) * 5,
        type: SP2_TYPES[(n + i) % SP2_TYPES.length],
        driver: k,
        prods: [{ p: i === stops - 1 && n % 2 === 0 ? pb : pa, q: share }],

  // One rig is planned past its tanks on purpose. A day where nothing is ever
  // over capacity never shows the red banner, the readings inside it, or the

    for (var n = 0; n < road.length; n++) {
      var k = road[n], d = SP2_DRIVERS[k], t = SP2_TRUCKS[d.truck];
      var best = null;
      d.load.forEach(function (l, i) {
        var room = t.comps[i].cap - l.q;
        if (l.p && room > 0 && (!best || room > best.room)) best = { p:l.p, room:room };
      });
      if (!best) continue;
      var mine = SP2_ORDERS.filter(function (o) {
        return o.driver === k && o.prods.length === 1 && o.prods[0].p === best.p;
      });
      if (!mine.length) continue;
      var cap = t.comps.reduce(function (a, c) { return a + c.cap; }, 0) +
        (d.trailer ? SP2_TRAILERS[d.trailer].caps.reduce(function (a, c) { return a + c; }, 0) : 0);
      var want = SP2_ORDERS.filter(function (o) { return o.driver === k; })
        .reduce(function (a, o) { return a + sp2Gal(o); }, 0);

      mine[mine.length - 1].prods[0].q += (cap - want) + 1500;

    }

})();

// ── Orders sized to the fleet that is actually standing there ──
// The day's orders are cut to fill WHOLE rigs, so on a part-loaded truck
// nothing fits and "Fill the rest" has nothing to say. That is true of the
// data, not of the work: a real day has small orders in it. So a handful of
// the unplanned orders are re-cut to the room the fleet actually has left —
// one per driver who would otherwise be offered nothing — and given a window
// and a ship-to that driver can genuinely reach inside their shift.
(function sizeSomeOrdersToTheFleet() {
  var TARGET = 18;                       // drivers we want to be able to try
  var pool = SP2_ORDERS.filter(function (o) { return !o.driver && !sp2HasBlend(o); });
  var next = 0, fitted = 0;

  Object.keys(SP2_DRIVERS).forEach(function (k) {
    if (fitted >= TARGET || next >= pool.length) return;
    var d = SP2_DRIVERS[k];
    if (d.state === 'off-duty') return;
    if (sp2Suggest(k, 1).picks.length) return;        // already has something to take

    var cells = sp2Cells(k).map(function (c) { return { cap:c.cap, p:c.l.p, q:c.l.q }; });
    var best = sp2BestRoom(cells);
    if (best.gal < 400) return;                        // nothing worth a run

    var sh = SP2_SHIFTS[d.shift];
    var t = sp2TimeLeft(k);
    // there, the drop, and back again has to fit whatever runs out first
    var maxTrip = Math.floor((t.left - 30) / 2);
    if (maxTrip < 10) return;

    // the nearest ship-to to this driver's hub that the run can reach
    var near = null;
    SP2_SHIPTOS.forEach(function (st) {
      if (!sp2InRegion(d.hub, st[1])) return;
      var mi = 2 + (sp2Hash(d.hub + '|' + st[0]) % 280) / 10;
      var min = sp2Drive(mi, k);
      if (min <= maxTrip && (!near || min < near.min)) near = { st:st, min:min };
    });
    if (!near) return;

    var o = pool[next];
    o.ship = near.st[0]; o.addr = near.st[1];
    // the window closes with the shift, so there is as long as possible to run it
    var len = [120, 180, 240, 180][sp2Hash(o.id) % 4];
    o.t = Math.max(sh.from, sh.to - len);
    // one product, cut to the room this rig actually has for it
    o.prods = [{ p: best.p || SP2_PRODS[next % SP2_PRODS.length],

    if (sp2CanRun(k, o)) return;                       // the run still does not work
    next++; fitted++;
  });
})();

// ══════════════════════════════════════════════════════════
//  State
// ══════════════════════════════════════════════════════════

var sp2Picked = {};            // orders ticked for a single drag — id → true
// The planner opens on the work that still needs doing: the orders nobody has
// taken, against the trucks that still have room. Both columns start narrowed.
var sp2Drag = null;          // the order ids being dragged, or null
var sp2MoveFrom = null;      // a compartment picked up, waiting for somewhere to go

var sp2SelOrder = null;

// choices, it is thirty rows in the way of the one answer.
var sp2OnlyDriver = null;
// Which cards have their products open. A card at rest states what it is
// carrying in one line; the table is there when you want to correct it.
var sp2CardOpen = {};
var sp2View = 'v';            // v vertical (the default) · h horizontal
var sp2Sort = 'time';         // time · fit — fit ranks against the chosen rig
var sp2BlendOnly = false;     // narrow to orders carrying a blend
var sp2AvailOrder = null;     // the Available order, held still while you work in it

var SP2_HOUR_W = 132;          // pixels per hour on the timeline
var SP2_CARD_W = 400;    // the round-3 card holds a table, so it needs the width
var SP2_CARD_BASE = 198; // everything on the card that is not a table row
var SP2_CARD_ROW  = 44;  // one row of the lines table

function sp2Hhmm(m){ return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); }
function sp2Short(m){
  var h24 = Math.floor(m/60), mm = m%60, h = h24%12===0 ? 12 : h24%12;
  return h + (mm ? ':'+String(mm).padStart(2,'0') : '') + (h24<12 ? 'a' : 'p');
}

// ══════════════════════════════════════════════════════════
//  Column 1 — the timeline
// ══════════════════════════════════════════════════════════
// What the chosen rig could take of an order, without loading anything. Packed

// ── Filling the rest of the rig ─────────────────────────
// What would fill the room that is left, without splitting anything. An order
// is a whole order: it goes on or it does not. A suggestion has to clear four
// things at once — the fuel fits the compartments that are still open, the

        if (pass === 2) c.p = pr.p;

      // no splitting: the whole order goes on, or it is not a suggestion
      if (sp2PackSim(trial, o) < total) { if (!round) tooBig++; return; }
      if (sp2CanRun(k, o)) { if (!round) blockedByTime++; return; }
      var after = trial.reduce(function (a, c) { return a + c.q; }, 0);
      if (!best || after > best.after) best = { o:o, after:after, cells:trial };
    });
    if (!best) break;
    cells = best.cells;
    picks.push(best.o);
    best.o.__after = Math.round(best.after / cap * 100);
  }

  var why = null;
  if (!picks.length) {
    if (blockedByTime && !tooBig)
      why = 'What fits cannot be run inside this driver\u2019s shift and hours.';
    else
      why = 'At most <b>' + best0.gal.toLocaleString() + ' gal</b> can go on in one order here' +
            (best0.p ? ', and only as ' + best0.p : ', since one product cannot share a compartment') +
            '. The smallest unplanned order is ' + smallest.toLocaleString() + ' gal.' +
            (blockedByTime ? ' ' + blockedByTime + ' that would fit cannot be run today.' : '');
  }
  return { picks:picks, room:room, cap:cap, best:best0, why:why };
}

// A dry run of the packer \u2014 the same two passes on a copy of the cells \u2014 so a
// suggestion can name the compartments the fuel will land in BEFORE it is
// added. Anything else would be a guess that the Add button then contradicts.
function sp2WouldFill(k, prods) {
  var cells = sp2Cells(k).map(function (c) {
    return { cap:c.cap, p:c.l.p, q:c.l.q, u:c.u, i:c.i };
  });
  var hit = {}, names = [];
  prods.forEach(function (pr) {
    var left = pr.q;
    [1, 2].forEach(function (pass) {
      cells.forEach(function (c) {
        if (!left) return;
        var same = c.p === pr.p, empty = !c.p || c.q === 0;
        if (pass === 1 ? !(same && c.q > 0) : !empty) return;
        var take = Math.min(c.cap - c.q, left);
        if (!take) return;
        if (pass === 2) c.p = pr.p;
        c.q += take; left -= take;
        var nm = sp2CompName(c.u, c.i);
        if (!hit[nm]) { hit[nm] = 1; names.push(nm); }
      });
    });
  });
  return names;
}
// What of this order the rig could take as it stands: the same two passes the
// packer runs — room for the same product in a part-filled compartment first,
// then an empty one — against a copy, so nothing moves. This is the question
// behind a split: fit what fits, and the rest is a second order.
function sp2SplitPlan(k, o) {
  var cells = sp2Cells(k).map(function (c) { return { cap:c.cap, p:c.l.p, q:c.l.q }; });
  var take = [], req = 0, fits = 0;
  o.prods.forEach(function (pr) {
    var left = pr.q, got = 0;
    req += pr.q;
    [1, 2].forEach(function (pass) {
      cells.forEach(function (c) {
        if (!left) return;
        var same = c.p === pr.p, empty = !c.p || c.q === 0;
        if (pass === 1 ? !(same && c.q > 0) : !empty) return;
        var t = Math.min(c.cap - c.q, left);
        if (!t) return;
        if (pass === 2) c.p = pr.p;
        c.q += t; left -= t; got += t;
      });
    });
    take.push({ p:pr.p, q:got });
    fits += got;
  });
  return { req:req, fits:fits, left:req - fits, take:take };
}
// D-5157076 splits into D-5157076 and D-5157076-2; split again and the next
// one is -3. The number a customer was given stays on the part that ships.
function sp2SplitId(id) {
  // only a split suffix comes off \u2014 the order number itself ends in a long
  // run of digits, and taking that for a suffix turns D-5157062 into D
  var m = String(id).match(/^(.*-\d{4,})-(\d{1,2})$/);
  var base = m ? m[1] : String(id);
  for (var n = 2; n < 40; n++) {
    var want = base + '-' + n;
    if (!SP2_ORDERS.some(function (o) { return o.id === want; })) return want;
  }
  return base + '-x';
}
function sp2SplitAsk(e, k, id) {
  e.stopPropagation();
  var o = SP2_ORDERS.filter(function (x) { return x.id === id; })[0];
  var d = SP2_DRIVERS[k];
  if (!o || !d) return;
  var plan = sp2SplitPlan(k, o);
  if (!plan.fits)
    return sp2Toast('Nothing of ' + id + ' fits on ' + d.truck + ' as it stands.\n' +
      'Every compartment is holding another product, so there is nothing to split — ' +
      'take an order off first.', 1);
  if (!plan.left)
    return sp2Toast(id + ' fits on ' + d.truck + ' whole — nothing to split.', 1);
  var kid = sp2SplitId(o.id);
  sp2Confirm('Split ' + id + '?',
    plan.req.toLocaleString() + ' gal was ordered. ' + plan.fits.toLocaleString() +
    ' gal fits on ' + d.truck + ' now and stays as ' + id + '. The other ' +
    plan.left.toLocaleString() + ' gal becomes ' + kid +
    ', unplanned, for another truck — same ship-to, same window.',
    'Split order', function () { sp2SplitGo(k, id); });
}
function sp2SplitGo(k, id) {
  var o = SP2_ORDERS.filter(function (x) { return x.id === id; })[0];
  var d = SP2_DRIVERS[k];
  if (!o || !d) return;
  var plan = sp2SplitPlan(k, o);
  if (!plan.fits || !plan.left) return;
  var kid = sp2SplitId(o.id);
  var rest = [];
  o.prods.forEach(function (pr, i) {
    var got = plan.take[i] ? plan.take[i].q : 0;
    if (pr.q - got > 0) rest.push({ p:pr.p, q:pr.q - got });
    pr.q = got;
  });
  o.prods = o.prods.filter(function (pr) { return pr.q > 0; });
  SP2_ORDERS.push({ id:kid, ship:o.ship, addr:o.addr, t:o.t, type:o.type, driver:'',
    prods:rest, split:{ of:id, req:plan.req, here:plan.fits, left:plan.left, truck:d.truck } });
  o.split = { to:kid, req:plan.req, here:plan.fits, left:plan.left, truck:d.truck };
  sp2PackInto(k, plan.take, 'auto', -1);
  sp2Render();
  sp2Toast(id + ' split · ' + plan.req.toLocaleString() + ' gal ordered.\n' +
    plan.fits.toLocaleString() + ' gal loaded onto ' + d.truck + ' as ' + id + ' · ' +
    plan.left.toLocaleString() + ' gal left as ' + kid + ', back in the orders column.', 1);
}

// How well an order sits in a rig, on its own: pack it into the empty rig the
// way the real packer would, then ask how much of the compartments it took up
// it actually fills. 100% is an order that leaves no air in the tanks it uses;
// 50% is an order that half-fills one. It is a property of the order and the
// rig, not of what else happens to be loaded, so it does not change as the day
// is built.
function sp2OrderFit(k, o) {
  var cells = sp2Cells(k).map(function (c) {
    return { cap:c.cap, p:'', q:0, u:c.u, i:c.i };
  });
  var placed = 0;
  sp2Lines(o).forEach(function (pr) {
    var left = pr.q;
    [1, 2].forEach(function (pass) {
      cells.forEach(function (c) {
        if (!left) return;
        var same = c.p === pr.p, empty = !c.p || c.q === 0;
        if (pass === 1 ? !(same && c.q > 0) : !empty) return;
        var take = Math.min(c.cap - c.q, left);
        if (!take) return;
        if (pass === 2) c.p = pr.p;
        c.q += take; left -= take; placed += take;
      });
    });
  });
  var used = cells.filter(function (c) { return c.q > 0; });
  var room = used.reduce(function (a, c) { return a + c.cap; }, 0);
  return { pct: room ? Math.round(placed / room * 100) : 0,
           placed:placed, room:room, comps:used.length };
}
// How good a fit is, as a reading rather than a number: a compartment left
// half empty is a tank of air driven around the state, so under half is poor,
// and 80% is where a load stops wasting room worth another order.
function sp2FitBand(pct) {
  return pct >= 80 ? 'high' : pct >= 50 ? 'mid' : 'low';
}
// The orders that fill this rig best: the top fit, and anything within four
// points of it \u2014 so a lane of four orders usually marks one or two. It is
// read against the other orders on the same rig, which is what "closest to
// 100%" can mean when a 6,000 gal wagon and a 16,000 gal transport are both
// on the screen; each chip still states its own number. Two points is a tie,
// not a band \u2014 wider and most of the lane lights up, which marks nothing.
function sp2BestFits(k, os) {
  var fits = os.map(function (o) { return sp2OrderFit(k, o).pct; });
  var top = Math.max.apply(null, fits.concat([0]));
  if (os.length < 2 || !top) return {};
  var out = {};
  os.forEach(function (o, i) { if (top - fits[i] <= 2) out[o.id] = fits[i]; });
  return out;
}
// "C1", "C1 and C3", "C1, C3 and C4", then a count \u2014 a list of five numbers
// beside a button is not a read.
function sp2CompList(ns) {
  if (!ns.length) return '';
  if (ns.length > 3) return ns.length + ' compartments';
  if (ns.length === 1) return ns[0];
  return ns.slice(0, -1).join(', ') + ' and ' + ns[ns.length - 1];
}
// Spelled out for the hover, where there is room: "compartment 1 and trailer
// compartment 2" rather than "C1 and Trailer C2".
function sp2CompLong(ns) {
  var say = ns.map(function (n) {
    return n.indexOf('Trailer') === 0
      ? 'trailer compartment ' + n.slice(9) : 'compartment ' + n.slice(1);
  });
  if (say.length === 1) return say[0];
  return say.slice(0, -1).join(', ') + ' and ' + say[say.length - 1];
}

function sp2TakeSuggestion(e, k, id) {
  e.stopPropagation();
  var o = SP2_ORDERS.filter(function (x) { return x.id === id; })[0];
  var d = SP2_DRIVERS[k];
  if (!o || !d || o.driver) return;
  var r = sp2PackInto(k, o.prods, 'auto', -1);
  o.driver = k;
  sp2Driver = k;
  sp2SelOrder = o.id;
  sp2Render();
  if (!r.put)
    sp2Toast('Nothing could be loaded: ' + r.short.join(', ') + ' has nowhere to go in ' +
             d.truck + ' (' + sp2RigCap(k).toLocaleString() + ' gal).\n' +
             o.id + ' is on the rig with empty tanks.', 1);
  else
    sp2Toast(o.id + ' loaded onto ' + d.truck + ' \u00b7 ' + r.put.toLocaleString() + ' gal');
}

function sp2SuggestHtml(k) {
  var sg = sp2Suggest(k, 3);
  // One statement, whatever the rig is carrying: a compartment with room left
  // is a compartment with room left, empty or part-filled.
  var head = '<div class="sp2-sg-head">' +
    '<span class="sp2-sg-ttl">Fill the compartments with room left</span>' +
    (sg.room > 0
      ? '<span class="sp2-sg-room">' + sg.room.toLocaleString() + ' gal of room' +
        (sg.best && sg.best.gal < sg.room
          ? ' \u00b7 at most ' + sg.best.gal.toLocaleString() + ' in one order' : '') +
        '</span>'
      : '') +
    '</div>';
  if (!sg.picks.length)
    return '<div class="sp2-sg">' + head + '<div class="sp2-sg-none">' + sg.why + '</div></div>';

  // A suggestion is an act, not a label: each one is a row with its own Add,
  // so an order goes onto the rig without being dragged there.
  var rows = sg.picks.map(function (o) {
    var rc = sp2Reach(k, o), w = sp2Win(o);
    return '<div class="sp2-sg-item">' +
        '<div class="sp2-sg-main">' +
          '<div class="sp2-sg-l1">' +
            '<span class="sp2-sg-id">' + o.id + '</span>' +
            '<span class="sp2-kind" title="' + o.type + '">' + o.type.charAt(0) + '</span>' +
            '<span class="sp2-sg-ship">' + o.ship + '</span>' +
          '</div>' +
          '<div class="sp2-sg-l2">' +
            '<span class="sp2-sg-gal">' + sp2Gal(o).toLocaleString() + ' gal</span>' +
            '<span class="sp2-sep"></span>' +
            '<span>' + sp2Clock(w.from) + '\u2013' + sp2Clock(w.to) + '</span>' +
            (rc ? '<span class="sp2-sep"></span>' + sp2ReachHtml(rc, o) : '') +
          '</div>' +
        '</div>' +
        (function (into) {
          return '<span class="sp2-sg-to" title="' +
              (into.length ? 'Goes into ' + sp2CompLong(into) + '. ' : '') +
              'The rig ends at ' + o.__after + '% full.">' +
            (into.length ? '<span class="sp2-sg-to-c">Into ' + sp2CompList(into) + '</span>' : '') +
            '<span class="sp2-sg-to-p">Rig at ' + o.__after + '%</span>' +
          '</span>';
        })(sp2WouldFill(k, o.prods)) +
        '<button class="sp2-sg-add" onclick="sp2TakeSuggestion(event,\'' + k + '\',\'' + o.id + '\')" ' +
          'title="Put ' + o.id + ' on ' + SP2_DRIVERS[k].truck + '">Add</button>' +
      '</div>';
  }).join('');
  var all = sg.picks.length > 1
    ? '<button class="sp2-sg-addall" onclick="sp2TakeAll(event,\'' + k + '\')">Add all ' +
        sg.picks.length + '</button>'
    : '';
  return '<div class="sp2-sg">' + head + '<div class="sp2-sg-list">' + rows + '</div>' + all + '</div>';
}

// The reader is being told a distance and a time; both are worked out, so both
// show their working. The distance is the rack to this ship-to \u2014 a truck
// delivers out of the terminal, not out of the yard \u2014 and the time is
// everything driven to get there, hub to rack to the stops ahead of it.
function sp2ReachHtml(rc, o) {
  var I = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.6v.4"/></svg>';
  return '<span class="sp2-why">' +
      rc.mi.toFixed(1) + ' mi from the rack \u00b7 ' + sp2Dur(rc.min) + ' driving' +
      '<span class="sp2-info" tabindex="0" role="button" ' +
        'aria-label="How this distance and time are worked out">' + I + '</span>' +
      '<span class="sp2-why-card">' +
        '<span class="sp2-why-h">How this is worked out</span>' +
        rc.legs.map(function (l) {
          return '<span class="sp2-why-row"><span>' + l.from + ' \u2192 ' +
            l.to + '</span><b>' + l.mi.toFixed(1) + ' mi</b></span>';
        }).join('') +
        '<span class="sp2-why-row tot"><span>' + rc.total.toFixed(1) + ' mi at ' +
          rc.mph + ' mph</span><b>' + sp2Dur(rc.min) + '</b></span>' +
        '<span class="sp2-why-n">Stop ' + rc.at + ' of ' + rc.of +
          ' once this is on. The miles shown are the rack to ' + o.ship +
          '; the time is everything driven to reach it, loading and time on site aside.</span>' +
      '</span>' +
    '</span>';
}

function sp2TakeAll(e, k) {
  e.stopPropagation();
  var sg = sp2Suggest(k, 3), d = SP2_DRIVERS[k];
  if (!sg.picks.length) return;
  var gal = 0;
  sg.picks.forEach(function (o) {
    if (o.driver) return;
    gal += sp2PackInto(k, o.prods, 'auto', -1).put;
    o.driver = k;
  });
  sp2Driver = k;
  sp2Render();
  sp2Toast(sg.picks.length + ' orders loaded onto ' + d.truck + ' \u00b7 ' + gal.toLocaleString() + ' gal');
}

function sp2FitFor(k, o) {
  var d = SP2_DRIVERS[k];
  if (!d || !SP2_TRUCKS[d.truck]) return null;
  var cells = sp2Cells(k).map(function (c) { return { cap:c.cap, p:c.l.p, q:c.l.q }; });
  var cap = cells.reduce(function (s, c) { return s + c.cap; }, 0);
  var fits = 0, total = sp2Gal(o);
  o.prods.forEach(function (pr) {
    var left = pr.q;
    [1, 2].forEach(function (pass) {
      cells.forEach(function (c) {
        if (!left) return;
        var same = c.p === pr.p, empty = !c.p || c.q === 0;
        if (pass === 1 ? !(same && c.q > 0) : !empty) return;
        if (pass === 2) c.p = pr.p;
        var take = Math.min(c.cap - c.q, left);
        c.q += take; left -= take; fits += take;
      });
    });
  });
  var after = cells.reduce(function (s, c) { return s + c.q; }, 0);
  return { fits:fits, total:total, over:total - fits,
           pct: total ? Math.round(fits / total * 100) : 0,
           rigPct: cap ? Math.round(after / cap * 100) : 0 };
}

// The chip that says it. "Fills the truck" is the one worth looking for: the
// whole order goes on AND the rig leaves full.
// ── Where it is, and when ──────────────────────────────────
// A hub is a real place, so the run to a ship-to is real work. We have no
// routing engine here, so the figure is a stable pseudo-distance per
// hub + ship-to pair — it never moves for the same pair, and it changes when
// you look at a driver who sets out from somewhere else.
function sp2Hash(str) {
  var h = 2166136261;
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = (h * 16777619) >>> 0; }
  return h;
}
// \u2500\u2500 The rack \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
// A truck does not deliver out of the yard. It leaves the hub empty, drives to
// the terminal its hub loads at, racks the load, and only then starts
// delivering. So the miles into a stop are measured from the TERMINAL, and the
// time to reach a stop is everything driven since the hub.
function sp2Terminal(hub) { return SP2_TERMINALS[hub] || { name:'Terminal', mi:10 }; }
// Miles from the rack to a ship-to. The rack sits in the hub's own city, so
// this is the same shape of pseudo-distance the hub used, off its own hash.
function sp2FromTerminal(o, k) {
  var d = SP2_DRIVERS[k || sp2Driver];
  if (!d) return 0;
  var h = sp2Hash('rack|' + d.hub + '|' + o.ship);
  return sp2InRegion(d.hub, o.addr || sp2AddrOf(o.ship))
    ? 2 + (h % 260) / 10
    : 160 + (h % 3400) / 10;
}
// What it takes to REACH a stop: out of the hub, into the rack, then stop by
// stop in window order until this one. Driving only \u2014 loading and the time on
// site belong to the shift, not to the distance.
function sp2Reach(k, o) {
  var d = SP2_DRIVERS[k];
  if (!d) return null;
  var term = sp2Terminal(d.hub);
  var stops = SP2_ORDERS.filter(function (x) { return x.driver === k && x.id !== o.id; })
                        .concat([o])
                        .sort(function (a, b) { return a.t - b.t; });
  var legs = [{ from:d.hub, to:term.name, mi:term.mi }];
  var run = term.mi, prev = null, reach = 0, at = 0;
  stops.forEach(function (x, i) {
    var m = prev ? sp2Leg(prev, x.ship) : sp2FromTerminal(x, k);
    legs.push({ from: prev || term.name, to:x.ship, mi:m });
    run += m;
    if (x.id === o.id) { reach = run; at = i + 1; }
    prev = x.ship;
  });
  return { term:term, legs:legs,
           mi: sp2FromTerminal(o, k),     // the rack to THIS ship-to
           total: reach,                  // hub \u2192 rack \u2192 \u2026 \u2192 this stop
           min: sp2Drive(reach, k), mph: sp2Mph(k), at:at, of:stops.length };
}

function sp2Trip(o, k) {
  var d = SP2_DRIVERS[k || sp2Driver];
  if (!d) return null;
  var h = sp2Hash(d.hub + '|' + o.ship);
  // In region, a stop is 2–30 miles out — drivers own regions and work them.
  // Out of region it is a haul no shift absorbs, which is what makes the
  // planner refuse it rather than quietly offering Denver a Tampa drop.
  var mi = sp2InRegion(d.hub, o.addr || sp2AddrOf(o.ship))
    ? 2 + (h % 280) / 10
    : 160 + (h % 3400) / 10;
  return { hub:d.hub, mi:mi, min: sp2Drive(mi, k || sp2Driver) };
}

// An order is delivered inside a window, not at an instant. The window starts
// at the order's time; how long it runs is a property of the order.
function sp2Win(o) {
  var len = [120, 180, 240, 180][sp2Hash(o.id) % 4];
  return { from:o.t, to:Math.min(o.t + len, 24 * 60 - 5) };
}
// The window is only a problem against a particular driver's shift, so the
// clash is computed where the two meet — never stored on the order.
function sp2WinClash(o, k) {
  var d = SP2_DRIVERS[k || sp2Driver]; if (!d) return null;
  var sh = SP2_SHIFTS[d.shift], w = sp2Win(o);
  var first = d.name.split(' ')[0];
  // A window that merely OPENS before the shift is not a clash — the delivery
  // still has hours inside the shift to happen in. Only a window that cannot be
  // met is one, and the last hour is what cannot be made up.
  if (w.from >= sh.to)   return 'after ' + first + '\u2019s shift';
  if (w.to   <= sh.from) return 'before ' + first + '\u2019s shift';
  if (w.to   >  sh.to)   return sp2Dur(w.to - sh.to) + ' past ' + first + '\u2019s shift';
  return null;
}
function sp2Dur(m) {
  var h = Math.floor(m / 60), x = m % 60;
  return h && x ? h + 'h ' + x + 'm' : h ? h + 'h' : x + 'm';
}

function sp2FitChip(o) {
  // A planned order's head answers a different question: not "would it fit"
  // but "who has it".
  if (o.driver) {
    var od = SP2_DRIVERS[o.driver];
    return od ? '<span class="sp2-who" title="Planned on ' + od.name + '">' +
                  od.name.split(' ')[0] + ' \u00b7 ' + od.truck + '</span>' : '';
  }
  var f = sp2FitFor(sp2Driver, o);
  if (!f) return '';
  var d = SP2_DRIVERS[sp2Driver];
  var why = 'Against ' + d.name + ' · ' + d.truck + ' — ' + f.fits.toLocaleString() +
            ' of ' + f.total.toLocaleString() + ' gal would load, leaving the rig ' + f.rigPct + '% full';
  var cls, text;
  if (f.pct >= 100 && f.rigPct >= 100) { cls = 'perfect'; text = 'Fills the truck'; }
  else if (f.pct >= 100)               { cls = 'full';    text = 'Fits \u00b7 rig <b>' + f.rigPct + '%</b>'; }
  else if (f.pct > 0)                  { cls = 'part';    text = '<b>' + f.pct + '%</b> fits \u00b7 ' + f.over.toLocaleString() + ' gal over'; }
  else                                 { cls = 'none';    text = 'No room'; }
  return '<span class="sp2-fit ' + cls + '" title="' + why + '">' + text + '</span>';
}

// The card is the same in every view; only where it sits changes.
// A splash blend is two products carried in one compartment, so the card lists
// both — each constituent is its own chip, with its own gallons, carrying the
// blend it belongs to and the share it takes. One chip naming two products
// would hide the quantity the terminal actually has to rack.
function sp2Lines(o) {
  var out = [];
  o.prods.forEach(function (pr, src) {
    var b = SP2_BLENDS[pr.p];
    if (!b) return out.push({ p:pr.p, q:pr.q, src:src });
    // the shares are racked in round gallons, so every part but the last is
    // taken to the nearest ten and the last one carries the remainder — the
    // line still totals what was ordered, and no chip reads 8,503 gal
    var left = pr.q;
    b.parts.forEach(function (x, n) {
      var q = n === b.parts.length - 1 ? left
            : Math.round(pr.q * x.pct / 1000) * 10;
      left -= q;
      out.push({ p:x.p, q:q, blend:pr.p, pct:x.pct, src:src, n:n, of:b.parts.length });
    });
  });
  return out;
}

// The card reads down in three bands, separated by space and nothing else:
// which order it is, where it goes, and what is on it. One subject per band,
// and the quantities on a single right edge so two orders compare by eye.
var sp2OpenProds = {};         // orders whose load band has been opened out
var SP2_PROD_CAP = 2;          // products shown before the rest fold into "+N"

function sp2TogglePlist(e, id) {
  e.stopPropagation();
  if (sp2OpenProds[id]) delete sp2OpenProds[id]; else sp2OpenProds[id] = true;
  sp2Render();
}

// ── The order card, round 3 ─────────────────────────────
// Two units with a rule between them. Above it: which order this is, where it
// goes and when it has to be there. Below it: what was asked for, as a table
// you can correct in place. Nothing else — the fit and the run from the hub
// have both come off while their places are decided.
var SP2_UNITS = ['gal', 'L', 'each', 'case', 'drum', 'pail'];

// What the customer asked for, line by line. A splash blend stays ONE line
// here — B5 is what was ordered; the constituents are what the terminal racks,
// and those live in the sheet.
function sp2LineUnit(pr) { return pr.unit || 'gal'; }

// A row is a racked line; the number that is stored is the ORDERED line it
// came from. Typing into a constituent therefore moves the whole blend, and
// its partner follows in ratio — a blend trimmed on one side is off-spec fuel,
// not a smaller order.
function sp2RowSrc(o, n) {
  var pr = sp2Lines(o)[n];
  return pr ? pr : null;
}
function sp2SetQty(e, id, n) {
  e.stopPropagation();
  var o = SP2_ORDERS.filter(function (x) { return x.id === id; })[0];
  var pr = o && sp2RowSrc(o, n);
  if (!pr || !o.prods[pr.src]) return;
  var v = Math.max(0, Math.round(parseFloat(String(e.target.value).replace(/[^0-9.]/g, '')) || 0));
  o.prods[pr.src].q = pr.blend ? Math.round(v * 100 / pr.pct) : v;
  sp2Render();
}
function sp2SetUnit(e, id, n) {
  e.stopPropagation();
  var o = SP2_ORDERS.filter(function (x) { return x.id === id; })[0];
  var pr = o && sp2RowSrc(o, n);
  if (!pr || !o.prods[pr.src]) return;
  o.prods[pr.src].unit = e.target.value;
  sp2Render();
}

// Gallons add up to gallons. A line switched to cases cannot join them, so it
// is counted on its own rather than quietly folded in.
function sp2Totals(o) {
  var by = {};
  o.prods.forEach(function (pr) {
    var u = sp2LineUnit(pr);
    by[u] = (by[u] || 0) + pr.q;
  });
  return Object.keys(by).sort(function (a, b) {
    return a === 'gal' ? -1 : b === 'gal' ? 1 : a.localeCompare(b);
  }).map(function (u) { return by[u].toLocaleString() + ' ' + u; });
}

// What this constituent is blended WITH, and in what ratio — the true
// statement about the row, where naming it after the blend was not.
function sp2BlendWith(pr) {
  var b = SP2_BLENDS[pr.blend];
  if (!b) return pr.pct + '%';
  var others = b.parts.filter(function (x) { return x.p !== pr.p; })
                      .map(function (x) { return x.p; });
  return 'Blended with ' + others.join(' and ') + ' \u00b7 ' +
         b.parts.map(function (x) { return x.pct; }).join(' : ');
}

function sp2CardV3(o, style) {
  var planned = sp2Planned(o);
  var picked  = sp2Picked[o.id] ? ' picked' : '';
  var w = sp2Win(o);

  // The table lists what the terminal actually racks: a splash blend is its
  // constituents, one row each, every row carrying its own blend and share.
  // The rows of one blend are joined by a bracket so two blends on an order
  // never read as four unrelated products.
  var lines = sp2Lines(o);
  var anyBlend = lines.some(function (pr) { return pr.blend; });
  var open = !!sp2CardOpen[o.id];

  var rows = lines.map(function (pr, n) {
    var col = SP2_PROD_COLORS[pr.p] || 'var(--fp-ink-3)';
    var grp = '';
    if (pr.blend) {
      var first = pr.n === 0, last = pr.n === pr.of - 1;
      grp = ' g' + (first ? ' g-first' : last ? ' g-last' : ' g-mid');
    }
    // UNL87 is not "E10" — it is one of the two products an E10 is made from.
    // So the cell carries that product's SHARE, and the bracket beside it says
    // which rows go together. The blend's own name belongs to the order line,
    // not to a constituent.
    var ratio = pr.blend
      ? '<b>' + pr.pct + '%</b>'
      : '<span class="sp2-lt-none">\u2014</span>';
    return '<div class="sp2-lt-row">' +
        '<span class="sp2-lt-c sp2-lt-p"><i class="sp2-dot" style="background:' + col + ';"></i>' +
          '<span>' + pr.p + '</span></span>' +
        (anyBlend ? '<span class="sp2-lt-c sp2-lt-ratio' + grp + '"' +
          (pr.blend ? ' title="' + sp2BlendWith(pr) + '"' : '') +
          '>' + ratio + '</span>' : '') +
        '<span class="sp2-lt-c sp2-lt-edit">' +
          '<input class="sp2-cell" type="text" inputmode="numeric" value="' + pr.q.toLocaleString() + '" ' +
            'aria-label="Quantity for ' + pr.p + '" ' +
            'onclick="event.stopPropagation()" onchange="sp2SetQty(event,\'' + o.id + '\',' + n + ')">' +
        '</span>' +
        '<span class="sp2-lt-c sp2-lt-edit">' +
          '<select class="sp2-cell sp2-cell-u" aria-label="Type for ' + pr.p + '" ' +
            'onclick="event.stopPropagation()" onchange="sp2SetUnit(event,\'' + o.id + '\',' + n + ')">' +
            SP2_UNITS.map(function (u) {
              return '<option value="' + u + '"' + (u === sp2LineUnit(o.prods[pr.src]) ? ' selected' : '') +
                     '>' + u + '</option>';
            }).join('') +
          '</select>' +
        '</span>' +
      '</div>';
  }).join('');

  return '<div class="sp2-card sp2-v3 ' + (planned ? 'planned' : 'unplanned') +
      (sp2SelOrder === o.id ? ' sel' : '') + picked + '" ' + (style ? 'style="' + style + '" ' : '') +
      'data-id="' + o.id + '" ' +
      'draggable="true" ondragstart="sp2DragStart(event,\'' + o.id + '\')" ondragend="sp2DragEnd()" ' +
      'onclick="sp2PickOrder(\'' + o.id + '\')" title="Drag onto the truck to load it">' +

    // ── unit 1 · which order, where it goes, when ──
    '<div class="sp2-card-top">' +
      // the tick gathers orders to drag onto a rig; a planned order is already
      // on one and cannot be taken without releasing it first
      (planned ? '' :
        '<button class="sp2-cbx' + picked + '" title="Pick this order, and drag them together" ' +
          'onclick="sp2TogglePick(event,\'' + o.id + '\')"></button>') +
      '<span class="sp2-ord">' + o.id + '</span>' +
      '<span class="sp2-kind" title="' + o.type + '">' + o.type.charAt(0) + '</span>' +
      (o.split
        ? '<span class="sp2-pill sp2-pill-split" title="' +
            (o.split.of
              ? o.split.here.toLocaleString() + ' gal of ' + o.split.req.toLocaleString() +
                ' went onto ' + o.split.truck + ' as ' + o.split.of + '. This is the ' +
                o.split.left.toLocaleString() + ' gal left over.'
              : o.split.here.toLocaleString() + ' gal of ' + o.split.req.toLocaleString() +
                ' is on ' + o.split.truck + '. The other ' + o.split.left.toLocaleString() +
                ' gal is ' + o.split.to + '.') + '">Split</span>'
        : '') +
      '<span class="sp2-pill sp2-pill-r ' + (planned ? 'sp2-pill-planned' : 'sp2-pill-unplanned') + '">' +
        (planned ? 'Planned' : 'Unplanned') + '</span>' +
      '<button class="sp2-chev" title="Open this order" ' +
        'onclick="sp2OrderOpen(event,\'' + o.id + '\')">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<polyline points="9 18 15 12 9 6"/></svg></button>' +
    '</div>' +

    '<div class="sp2-ship-row">' +
      '<svg class="sp2-pin" width="14" height="14" viewBox="0 0 24 24" fill="none" ' +
        'stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z" fill="currentColor" fill-opacity=".22"/>' +
        '<circle cx="12" cy="10" r="3"/></svg>' +
      '<span class="sp2-ship">' + o.ship + '</span>' +
      '<span class="sp2-tip" role="tooltip">' + o.addr + '</span>' +
    '</div>' +
    '<div class="sp2-win">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>' +
      '<span>' + sp2Clock(w.from) + ' \u2013 ' + sp2Clock(w.to) + '</span>' +
    '</div>' +

    // ── unit 2 · what was asked for, correctable in place ──
    // The DS lines table: flush to the card's edges, a tinted header band,
    // 44px rows, every cell the control itself rather than a box inside a box.
    // The line itself is the switch: the same button, in the same place, at the
    // same size whether the products are showing or not, so a second click
    // lands where the first one did without the cursor moving.
    '<button class="sp2-lsum' + (open ? ' open' : '') + '" ' +
      'onclick="sp2CardToggle(event,\'' + o.id + '\')" ' +
      'title="' + (open ? 'Hide what is on this order' : 'Show what is on this order') + '">' +
      '<span class="sp2-lsum-n">' + lines.length + ' product' +
        (lines.length === 1 ? '' : 's') + '</span>' +
      (anyBlend ? '<span class="sp2-pill sp2-pill-blend">Blend</span>' : '') +
      '<span class="sp2-lsum-q">' + sp2Totals(o).join(' \u00b7 ') + '</span>' +
    '</button>' +
    (open
      ? '<div class="sp2-lt' + (anyBlend ? ' blended' : '') + '">' +
          '<div class="sp2-lt-head">' +
            '<span>Product</span>' +
            (anyBlend ? '<span title="Each product\u2019s share of the blend it is part of">Ratio</span>' : '') +
            '<span>Quantity</span><span>Type</span>' +
          '</div>' +
          rows +
        '</div>'
      : '') +
  '</div>';
}

// The window is a time of day a person reads, not a duty clock.
function sp2Clock(m) {
  var h = Math.floor(m / 60) % 24, x = m % 60;
  var ap = h < 12 ? 'AM' : 'PM', h12 = h % 12 === 0 ? 12 : h % 12;
  return h12 + ':' + String(x).padStart(2, '0') + ' ' + ap;
}

// The column's expand-all pair: a list with arrows beside it, drawing what the
// press will leave behind \u2014 three lines with the chevrons pushing apart to open
// every card, one line with the chevrons coming together to shut them. The
// cards keep their own chevron; this is the tool that acts on all of them.
function sp2ListRow(y) {
  return '<circle cx="3.3" cy="' + y + '" r="1.9" stroke-width="1.7"/>' +
         '<path d="M7.8 ' + y + 'h8"/>';
}
function sp2IcoExpand() {
  return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">' +
    sp2ListRow(6) + sp2ListRow(12) + sp2ListRow(18) +
    '<path d="M17.9 8.4l2.4-2.8 2.4 2.8"/>' +
    '<path d="M17.9 15.6l2.4 2.8 2.4-2.8"/></svg>';
}
function sp2IcoCollapse() {
  return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">' +
    sp2ListRow(12) +
    '<path d="M17.9 5.6l2.4 2.8 2.4-2.8"/>' +
    '<path d="M17.9 18.4l2.4-2.8 2.4 2.8"/></svg>';
}
function sp2CardToggle(e, id) {
  if (e) e.stopPropagation();
  if (sp2CardOpen[id]) delete sp2CardOpen[id]; else sp2CardOpen[id] = true;
  sp2RenderTimeline();
}
// One act for the whole column: if anything is open, shut everything; if
// nothing is, open what is on screen. The icon says which it will do.
function sp2CardsAll() {
  var any = Object.keys(sp2CardOpen).length > 0;
  sp2CardOpen = {};
  if (!any) sp2Visible().forEach(function (o) { sp2CardOpen[o.id] = true; });
  sp2RenderTimeline();
}
// The lanes answer to the same pair. A lane at rest is its driver and its rig
// \u2014 the two head rows \u2014 and everything under them is what the press opens or
// shuts: the shift, the route, the load and the stops. Lanes start open, so
// the first press collapses.
var sp2LaneShut = {};
function sp2LanesAll() {
  var any = Object.keys(sp2LaneShut).length > 0;
  sp2LaneShut = {};
  if (!any) sp2DriverKeys().forEach(function (k) { sp2LaneShut[k] = true; });
  sp2RenderUnit();
}
function sp2LanesAllBtn() {
  var b = document.getElementById('sp2LaneAllBtn');
  if (!b) return;
  var shut = Object.keys(sp2LaneShut).length > 0;
  b.classList.toggle('on', shut);
  b.title = shut ? 'Expand every lane' : 'Collapse every lane';
  b.innerHTML = shut ? sp2IcoExpand() : sp2IcoCollapse();
}
function sp2CardsAllBtn() {
  var b = document.getElementById('sp2AllBtn');
  if (!b) return;
  var any = Object.keys(sp2CardOpen).length > 0;
  b.classList.toggle('on', any);
  b.title = any ? 'Collapse every order' : 'Expand every order';
  // The same pair the cards wear, because it is the same act done to all of
  // them at once \u2014 one icon for expand, one for collapse, everywhere.
  b.innerHTML = any ? sp2IcoCollapse() : sp2IcoExpand();
}

// Every order card is the round-3 card now; the band design it replaced is
// in V1 and in the commit before this one.
function sp2CardHtml(o, style) {
  return sp2CardV3(o, style);

  var planned = sp2Planned(o);
  var picked  = sp2Picked[o.id] ? ' picked' : '';
  var lines   = sp2Lines(o);
  var open    = !!sp2OpenProds[o.id];
  var shown   = open ? lines : lines.slice(0, SP2_PROD_CAP);
  var hidden  = lines.length - shown.length;

  // Every product is its own chip on its own row, the blend's share beside the
  // name and the gallons on the right edge. Capped at two, so a blended order
  // costs a plain order's height until you ask for the rest.
  var rows = shown.map(function (pr) {
    var col = SP2_PROD_COLORS[pr.p] || 'var(--fp-ink-3)';
    return '<span class="sp2-chip"><i class="sp2-dot" style="background:' + col + ';"></i>' +
             pr.p + '</span>' +
           '<span class="sp2-prow-b">' + (pr.blend ? pr.blend + ' \u00b7 ' + pr.pct + '%' : '') + '</span>' +
           '<span class="sp2-prow-q">' + pr.q.toLocaleString() + ' gal</span>';
  }).join('');

  // The window is the fact that can be wrong, so the window carries the
  // warning — not the card, which has nothing else the matter with it.
  var w = sp2Win(o), clash = sp2WinClash(o, sp2Driver), trip = sp2Trip(o, sp2Driver);
  var when = '<span class="sp2-when' + (clash ? ' clash' : '') + '">' + sp2Hhmm(w.from) +
               '\u2013' + sp2Hhmm(w.to) + (clash ? ' \u00b7 ' + clash : '') + '</span>';
  var run = trip
    ? (clash ? '' : '<span class="sp2-sep"></span>') +
      '<span class="sp2-trip"><b>' + trip.mi.toFixed(1) + ' mi</b> \u00b7 ' + trip.min + ' min</span>' +
      '<span class="sp2-from" title="Measured from ' + trip.hub + '">from ' +
        trip.hub.replace(' Hub', '') + '</span>'
    : '';

  var blended = lines.filter(function (pr) { return pr.blend; }).length;
  var count = lines.length + ' product' + (lines.length === 1 ? '' : 's') +
              (sp2HasBlend(o) ? ' \u00b7 ' + blended + ' in a blend' : '');

  return '<div class="sp2-card ' + (planned ? 'planned' : 'unplanned') +
      (sp2SelOrder === o.id ? ' sel' : '') + picked + '" ' + (style ? 'style="' + style + '" ' : '') +
      'data-id="' + o.id + '" ' +
      'draggable="true" ondragstart="sp2DragStart(event,\'' + o.id + '\')" ondragend="sp2DragEnd()" ' +
      'onclick="sp2PickOrder(\'' + o.id + '\')" title="Drag onto the truck to load it \u00b7 ' + o.ship + '">' +

    // ── band 1 · which order it is, and whether it fits ──
    '<div class="sp2-card-top">' +
      '<button class="sp2-cbx' + picked + '" title="Pick this order, and drag them together" ' +
        'onclick="sp2TogglePick(event,\'' + o.id + '\')"></button>' +
      '<span class="sp2-ord">' + o.id + '</span>' +
      '<span class="sp2-kind" title="' + o.type + '">' + o.type.charAt(0) + '</span>' +
      '<span class="sp2-pill ' + (planned ? 'sp2-pill-planned' : 'sp2-pill-unplanned') + '">' +
        (planned ? 'Planned' : 'Unplanned') + '</span>' +
      sp2FitChip(o) +
      '<button class="sp2-open" title="Open this order" ' +
        'onclick="sp2OrderOpen(event,\'' + o.id + '\')">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
        '<path d="M15 3h6v6"/><path d="M10 14 21 3"/>' +
        '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></button>' +
    '</div>' +

    // ── band 2 · where it goes, and when ──
    '<div class="sp2-card-l">' +
      '<div class="sp2-ship">' + o.ship + '</div>' +
      '<div class="sp2-addr">' + o.addr + '</div>' +
      '<div class="sp2-meta">' + when + run + '</div>' +
    '</div>' +

    // ── band 3 · what is on it, closing with the total ──
    '<div class="sp2-card-r">' + rows + '</div>' +
    '<div class="sp2-load-foot">' +
      '<span class="sp2-load-n">' + count + '</span>' +
      (lines.length > SP2_PROD_CAP
        ? '<button class="sp2-more" onclick="sp2TogglePlist(event,\'' + o.id + '\')" ' +
            'title="' + (open ? 'Fold the rest away' : 'Show the other ' + hidden) + '">' +
            (open ? 'Show less' : '+' + hidden) + '</button>'
        : '') +
      '<span class="sp2-load-tot">' + sp2Gal(o).toLocaleString() + ' gal</span>' +
    '</div>' +
  '</div>';
}

// Time runs down a rail instead of across the top. The gap between two orders
// is written on the rail, so the shape of the day still reads without an axis
// wide enough to scale it.
function sp2RenderVertical(orders) {
  if (!orders.length) return '<div class="sp2-empty">Nothing here — try another status or shift.</div>';
  var ranked = sp2Sort === 'fit';
  var rows = orders.map(function(o, i) {
    var gap = '';
    if (i && !ranked) {
      var mins = o.t - orders[i-1].t;
      if (mins >= 45) {
        var h = Math.floor(mins/60), m = mins%60;
        gap = '<div class="sp2-vgap">' + (h ? h + 'h ' : '') + (m ? m + 'm' : '') + ' later</div>';
      }
    }
    return gap + '<div class="sp2-vrow' + (ranked ? ' ranked' : '') + ' ' +
      (sp2Planned(o) ? 'planned' : 'unplanned') + '">' +
      (ranked ? '<span class="sp2-rank">' + (i + 1) + '</span>' : '') +
      '<span class="sp2-vtime">' + sp2Hhmm(o.t) + '</span>' +
      '<span class="sp2-vnode"></span>' +
      '<div class="sp2-vcard">' + sp2CardHtml(o) + '</div>' +
    '</div>';
  }).join('');
  return '<div class="sp2-vt' + (ranked ? ' ranked' : '') + '">' +
    (ranked ? '' : '<div class="sp2-vt-rail"></div>') + rows + '</div>';
}

function sp2RenderTimeline() {
  var orders = sp2Visible();
  var tl = document.getElementById('sp2Tl');

  if (sp2View !== 'h') {
    tl.classList.add('sp2-flow');
    tl.style.padding = '0';
    tl.innerHTML = sp2RenderVertical(orders);
    sp2Counts();
    return;
  }
  tl.classList.remove('sp2-flow');
  tl.style.padding = '';

  var w = sp2Window();
  var hours = Math.ceil((w.to - w.from) / 60);

  var ruler = '';
  for (var i = 0; i <= hours; i++) {
    var m = w.from + i*60;
    var h24 = Math.floor((m % 1440) / 60);
    var tick = h24 === 0 ? '12a' : h24 === 12 ? '12p' : String(h24 % 12 === 0 ? 12 : h24 % 12);
    ruler += '<div class="sp2-hour" style="width:' + SP2_HOUR_W + 'px;">' + tick + '</div>';
  }

  if (!orders.length) {
    tl.innerHTML = '<div class="sp2-ruler">' + ruler + '</div>' +
      '<div class="sp2-empty">No orders in this window — widen the shift range or clear the filter.</div>';
    sp2Counts();
    return;
  }

  // lane packing: an order takes a lane where it does not overlap what is already there
  var lanes = [];
  orders.forEach(function(o) {
    var x = ((o.t - w.from) / 60) * SP2_HOUR_W;
    var placed = false;
    for (var li = 0; li < lanes.length && !placed; li++) {
      var last = lanes[li][lanes[li].length - 1];
      if (x >= last.x + SP2_CARD_W + 8) { lanes[li].push({ o:o, x:x }); placed = true; }
    }
    if (!placed) lanes.push([{ o:o, x:x }]);
  });

  var trackW = Math.max(hours * SP2_HOUR_W, 600);
  var grid = '';
  for (var g = 0; g <= hours; g++) grid += '<div class="sp2-grid-col" style="width:' + SP2_HOUR_W + 'px;"></div>';

  // The cards in a lane are placed by time, so the lane has to be as tall as
  // the tallest one in it — and a card is as tall as its lines table.
  var laneHeight = function (lane) {
    return lane.reduce(function (h, slot) {
      // a shut card is one summary line; an open one is a row per line the
      // table actually draws, which for a blend is its constituents
      return Math.max(h, sp2CardOpen[slot.o.id]
        ? SP2_CARD_BASE + sp2Lines(slot.o).length * SP2_CARD_ROW
        : SP2_CARD_SHUT);
    }, 0);
  };
  var lanesHtml = lanes.map(function(lane) {

var SP2_STATES = [['driving','Driving'], ['on-duty','On duty'], ['off-duty','Off duty'], ['on-leave','On leave']];

function sp2StateWord(s) {
  for (var i = 0; i < SP2_STATES.length; i++) if (SP2_STATES[i][0] === s) return SP2_STATES[i][1];
  return s;

function sp2Synced(m) {
  if (m < 60) return m + ' min ago';

// Available is not a fourth duty state — it crosses them. A driver is

function sp2Duty(d) {
  return d.leave ? 'On leave'
    : d.state === 'driving' ? 'Driving'
    : d.state === 'on-duty' ? 'On duty' : 'Off duty';

function sp2Avail(d) {
  if (d.state === 'off-duty') return false;
  var a = sp2Sum(SP2_TRUCKS[d.truck].comps.map(function (c) { return c.cap; }), d.load);
  var b = d.trailer ? sp2Sum(SP2_TRAILERS[d.trailer].caps, d.tload) : { cap:0, q:0 };
  return (a.q + b.q) < (a.cap + b.cap);
}

// The bands a dispatcher plans the day against. A window can straddle two of

  { c:'drivers', g:'Driver', k:'duty', label:'Hours of service (HOS)', opts:['Driving','On duty','Off duty','On leave'],

    opts:Object.keys(SP2_TRUCKS).sort()

function sp2GroupFacets(g) {
  return SP2_FACETS.filter(function (f) { return f.g === g; });
}
function sp2ColFacets(c) {
  return SP2_FACETS.filter(function (f) { return (f.c || 'drivers') === c; });
}
// An order facet answers about an order, not a rig, so it has its own reader.
function sp2OrderMatch(o, set) {
  return sp2ColFacets('orders').every(function (f) {
    var v = set[f.k];
    if (!v || !v.length) return true;
    var got = f.ord(o);
    return got.some(function (x) { return v.indexOf(x) >= 0; });

}
function sp2OrderCountFor(f, v) {
  var w = sp2Window();

  }).length;

var sp2Facet   = { ostatus:['Unplanned'], room:['Available'] };   // applied — facet key → values
var sp2FpStage = null;   // staged while the panel is open; Apply commits it
var sp2FpOn    = 'Order';    // which group's options are showing
var sp2FpTab   = 'orders';   // which list the panel is narrowing
var sp2FpQ     = {};        // per-facet search text, cleared when the group changes
var sp2FpSeg   = {};        // per-facet segment, for a list of two kinds
// "Available" is not a tab on the row any more; it is the view the planner
// opens on — the rigs that still have room, held in the order they had when
// you arrived. Every other narrowing is a facet behind Filters.
// A preset is a narrowing of the WHOLE planner, both columns at once. The one
// the planner opens on is the day's work: the orders nobody has taken, against
// the rigs that can still take them.
var sp2Views   = [{ id:'vAvail', name:'Available orders and drivers',
                    state:{ q:'', facet:{ ostatus:['Unplanned'], room:['Available'] } } }];
var sp2ViewOn  = 'vAvail';

function sp2FacetOpts(f) {
  if (f.opts) return f.opts.slice();      // a fixed order where one reads better
  if (f.ord) return [];
  var seen = {}, out = [];
  Object.keys(SP2_DRIVERS).forEach(function (k) {
    var v = f.of(SP2_DRIVERS[k], k);
    (Array.isArray(v) ? v : [v]).forEach(function (x) {
      if (x && !seen[x]) { seen[x] = 1; out.push(x); }
    });
  });
  return out.sort();
}
// A rig has one hub but several products on board, so a facet may answer with
// a list — and then a tick matches if ANY of them is in it.
// A range is held as one value, "lo-hi", so everything that reads a facet —
// the chips, the views, the suggested name — keeps working unchanged.
function sp2Range(v) {
  var m = String(v || '').split('-');
  return { lo:+m[0] || 0, hi:+m[1] || 0 };
}
function sp2FacetMatch(k, set) {
  var d = SP2_DRIVERS[k];
  return sp2ColFacets('drivers').every(function (f) {
    var v = set[f.k];
    if (!v || !v.length) return true;
    if (f.kind === 'range') {
      var r = sp2Range(v[0]), x = f.val(d, k);
      return x >= r.lo && x <= r.hi;
    }
    var got = f.of(d, k);
    return Array.isArray(got)

      : v.indexOf(got) >= 0;

}

function sp2OrdCountFor(set) {

    return sp2OrderMatch(o, set);

}

function sp2FpRange(fk, which, v) {

  var cur = (sp2FpStage[fk] || [])[0];

  if (which === 'lo') r.lo = Math.min(+v, r.hi);
  else r.hi = Math.max(+v, r.lo);

    var head = fs.length > 1
      ? '<div class="sp2-fp-sec' + (i ? '' : ' first') + '">' + f.label + '</div>' : '';

              '" step="' + f.step + '" value="' + r.lo + '" aria-label="Least ' + f.label + '" ' +
              'oninput="sp2FpRange(\'' + f.k + '\',\'lo\',this.value)">' +
            '<input type="range" class="sp2-rng-i hi" min="' + f.lo + '" max="' + f.hi +

              'oninput="sp2FpRange(\'' + f.k + '\',\'hi\',this.value)">' +

    var sg = f.seg ? (sp2FpSeg[f.k] || f.seg[0].k) : null;
    var list = sp2FacetOpts(f).filter(function (v) {

  p.innerHTML =
    '<div class="sp2-fp-tabs">' + tabs + '</div>' +
    '<div class="sp2-fp-body">' +
      '<div class="sp2-fp-menu">' + menu + '</div>' +
      '<div class="sp2-fp-opts">' + opts + '</div>' +

      '<span class="sp2-fp-n"><b>' + n + '</b> ' +
        (isOrders ? 'order' : 'rig') + (n === 1 ? '' : 's') + '</span>' +

        '<button class="sp2-btn ghost" onclick="sp2FpClear()">Clear all</button>' +

}

// ── unit.chip-shelf ───────────────────────────────────────
function sp2ShelfDraw() {

function sp2ShelfFor(col, el) {
  if (!el) return;
  // A preset showing unchanged already says what is on, on its own tab. The
  // chips are for a narrowing the reader applied themselves — which includes
  // anything added on top of a preset, the moment it stops matching.
  if (sp2ViewOn && !sp2ViewDirty()) { el.style.display = 'none'; el.innerHTML = ''; return; }
  var X = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
          'stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
  var chips = [];
  sp2ColFacets(col).forEach(function (f) {
    var v = sp2Facet[f.k] || [];
    if (!v.length) return;
    if (v.length === 1) {
      var read = f.kind === 'range'
        ? (function (r) { return r.lo.toLocaleString() + '\u2013' + r.hi.toLocaleString() +
            ' ' + f.unit; })(sp2Range(v[0]))
        : v[0];
      chips.push('<span class="sp2-chipf"><span class="sp2-chipf-l">' + f.label + ':</span> ' +
        read + '<button class="sp2-chipf-x" aria-label="Remove ' + f.label + '" ' +
        'onclick="sp2ChipOff(\'' + f.k + '\',\'' + v[0].replace(/'/g, "\\'") + '\')">' + X + '</button></span>');
