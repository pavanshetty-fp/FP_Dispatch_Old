  var h = TK.h, clip = 'ck' + uid;
  var fuel = '', dividers = '', labels = '', hits = '', cx = x;

  caps.forEach(function (cap, i) {
    var w = widths[i], l = load[i] || { p:'', q:0 };
    var pct = cap ? Math.min(100, Math.round(l.q / cap * 100)) : 0;
    var cls = pct >= 99 ? 'full' : pct > 0 ? 'partial' : 'empty-c';
    var word = pct >= 99 ? 'Full' : pct > 0 ? 'Partially full' : 'Empty';
    var col = SP2_PROD_COLORS[l.p] || 'transparent';
    var mid = cx + w / 2;

    if (pct > 0) {
      fuel += '<g transform="translate(' + cx + ',0)">' +
        '<path class="sp2-sv-liq" data-c="' + i + '" data-top="' + (h * (1 - pct / 100)).toFixed(1) + '" ' +
          'd="' + sp2Wave(w, h * (1 - pct / 100), h) + '" fill="' + col + '"/></g>';
    } else {
      // the design marks an empty compartment with a dashed line at the floor
      fuel += '<line x1="' + (cx + 8) + '" y1="' + (h - 6) + '" x2="' + (cx + w - 8) + '" y2="' + (h - 6) +
              '" stroke="' + TK.divider + '" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.85"/>';
    }
    if (i) dividers += '<rect x="' + (cx - 1) + '" y="0" width="2" height="' + h + '" fill="' + TK.divider + '"/>';
    if (sp2MoveFrom && sp2MoveFrom.k === k && sp2MoveFrom.unit === unit && sp2MoveFrom.i === i)
      labels += '<rect class="sp2-sv-held" x="' + (cx + 2) + '" y="2" width="' + (w - 4) +
                '" height="' + (h - 4) + '" rx="6"/>';
    // Beside the table the drawing is the picture, not the numbers — the
    // table has already listed the product, the gallons and the fill, so the
    // compartment only has to say which one it is.
    labels += sp2RigBare
      ? '<text x="' + mid + '" y="50" class="sp2-sv-c">C' + (i + 1) + '</text>'
      : '<text x="' + mid + '" y="22" class="sp2-sv-c">C' + (i + 1) + ' · ' + cap.toLocaleString() + '</text>' +
        '<text x="' + mid + '" y="45" class="sp2-sv-p' + (l.p ? '' : ' empty') + '">' + (l.p || 'Empty') + '</text>' +
        '<text x="' + mid + '" y="65" class="sp2-sv-q">' + l.q.toLocaleString() + ' gal</text>' +
        '<text x="' + mid + '" y="82" class="sp2-sv-s ' + cls + '">' + pct + '% · ' + word + '</text>';
    hits += '<rect x="' + cx + '" y="0" width="' + w + '" height="' + h + '" fill="transparent" ' +
            'ondragover="sp2DragOver(event)" ondragleave="sp2DragLeave(event)" ' +
            'ondrop="sp2Drop(event,\'' + unit + '\',' + i + ',\'' + k + '\')">' +
            '<title>C' + (i + 1) + ' · ' + cap.toLocaleString() +
            ' gal capacity — change what is in it in the table below</title></rect>';
    cx += w;
  });

  return '<defs><clipPath id="' + clip + '">' +
      '<rect x="' + x + '" y="0" width="' + tw + '" height="' + h + '" rx="34"/>' +
    '</clipPath></defs>' +
    '<rect x="' + x + '" y="0" width="' + tw + '" height="' + h + '" rx="34" fill="' + TK.shell + '"/>' +
    '<g clip-path="url(#' + clip + ')">' + fuel + dividers + '</g>' +
    labels + hits;
}

// A trailer is its own vehicle in the design — own chassis, own two bogies, own
// markers — so a hitched one is drawn as a second unit rather than as a second
// tank hanging off the truck's frame.
function sp2Unit(x0, caps, widths, load, k, unitKey, uid, label) {
  var tw = widths.reduce(function (a, b) { return a + b; }, 0);
  var uw = tw + TK_OVERHANG;
  var wheelsAt = [x0 + 45.5, x0 + 100.5, x0 + uw - 100.5, x0 + uw - 45.5];
  var arches = wheelsAt.map(function (cx) {
    // the fender arch the chassis carries over each wheel
    return '<path d="M' + (cx - 25.5) + ',' + (TK.wheelY + TK.wheelR) + 'a25.5,25.5 0 0 1 51,0" ' +
           'fill="none" stroke="' + TK.chassis + '" stroke-width="2"/>';
  }).join('');
  return '<g>' +
      '<rect x="' + x0 + '" y="' + TK.chassisY + '" width="' + uw + '" height="12" rx="3" fill="' + TK.chassis + '"/>' +
      '<rect x="' + (x0 + 14) + '" y="' + (TK.chassisY + 10) + '" width="112" height="18" rx="3" fill="' + TK.chassis + '"/>' +
      '<rect x="' + (x0 + uw - 126) + '" y="' + (TK.chassisY + 10) + '" width="112" height="18" rx="3" fill="' + TK.chassis + '"/>' +
      '<rect x="' + (x0 + 134) + '" y="109" width="13" height="6" rx="2" fill="' + TK.marker + '"/>' +
      '<rect x="' + (x0 + uw - 147) + '" y="109" width="13" height="6" rx="2" fill="' + TK.marker + '"/>' +
      arches + wheelsAt.map(sp2Wheel).join('') +
      sp2TankSvg(x0 + 12, caps, widths, load, k, unitKey, uid) +
      '<text x="' + (x0 + uw / 2) + '" y="' + (TK.H - 4) + '" class="sp2-sv-tag">' + label + '</text>' +
    '</g>';
}

// The tractor, from the design: stack, cab, windscreen, mirror, steps, lamp,
// bumper — each at the offset it has in the file, measured from the fifth wheel.
function sp2Tractor(x) {
  var im = function (a, dx, dy, w, h) {
    return '<image href="' + TRUCK_ART[a] + '" x="' + (x + dx) + '" y="' + dy +
           '" width="' + w + '" height="' + h + '"/>';
  };
  // The artwork is drawn nose-right, so the whole tractor is flipped about its
  // own middle — it keeps the same box, it just faces the other way.
  return '<g transform="translate(' + (2 * x + TK_TRACTOR) + ',0) scale(-1,1)">' +
    im('stack', 0, 12, 30.884, 104.03) +
    im('cab', 6.5, 28.25, 174.746, 123.491) +
    '<rect x="' + (x + 6.5) + '" y="119.28" width="102.404" height="24.382" rx="2" fill="' + TK.frame + '"/>' +
    '<rect x="' + (x + 6.5) + '" y="129.69" width="95.903" height="31.968" rx="4" fill="' + TK.shell + '"/>' +
    '<rect x="' + (x + 20.2) + '" y="127.41" width="4.567" height="36.534" rx="1" fill="' + TK.divider + '"/>' +
    '<rect x="' + (x + 52.17) + '" y="127.41" width="4.567" height="36.534" rx="1" fill="' + TK.divider + '"/>' +
    '<rect x="' + (x + 84.14) + '" y="127.41" width="4.567" height="36.534" rx="1" fill="' + TK.divider + '"/>' +
    im('windshield', 52.01, 39.31, 43.075, 36.892) +
    '<rect x="' + (x + 91.03) + '" y="44.51" width="9.753" height="24.382" rx="2" fill="' + TK.dark + '"/>' +
    im('mirror-arm', 94.28, 64.83, 9.753, 13.004) +
    '<rect x="' + (x + 52.01) + '" y="88.4" width="17.88" height="6.502" rx="3" fill="' + TK.dark + '"/>' +
    im('headlight', 157.67, 107.9, 19.506, 11.378) +
    im('bumper', 156, 121, 28.762, 19) +
    im('wheel-tractor', 113.85, 124.07, 46.458, 46.458) +
  '</g>';
}

function sp2RigSvg(k, availPx) {
  var d = SP2_DRIVERS[k], t = SP2_TRUCKS[d.truck];
  var trl = d.trailer ? SP2_TRAILERS[d.trailer] : null;
  var uid = (k + d.truck + (d.trailer || '')).replace(/[^a-z0-9]/gi, '');
  var truckCaps = t.comps.map(function (c) { return c.cap; });
  var trlCaps = trl ? trl.caps : [];
  var nUnits = trl ? 2 : 1;

  var all = trlCaps.concat(truckCaps);
  var w = sp2RigWidths(all, availPx / TK.scale, nUnits);
  var trlW = w.slice(0, trlCaps.length), truckW = w.slice(trlCaps.length);

  // nose first, then the truck it pulls, then anything hitched behind that
  var x = TK_TRACTOR, body = '';
  body += sp2Unit(x, truckCaps, truckW, d.load, k, 'truck', uid + 'a',
                  d.truck + ' · ' + t.type);
  x += truckW.reduce(function (a, b) { return a + b; }, 0) + TK_OVERHANG;
  if (trl) {
    x += TK_GAP;
    body += sp2Unit(x, trlCaps, trlW, d.tload, k, 'trailer', uid + 'b',
                    d.trailer + ' · ' + trl.type);
    x += trlW.reduce(function (a, b) { return a + b; }, 0) + TK_OVERHANG;
  }
  var W = x;

  return '<svg class="sp2-sv" width="' + Math.round(W * TK.scale) + '" height="' + Math.round(TK.H * TK.scale) +
      '" viewBox="0 0 ' + W + ' ' + TK.H + '">' +
      '<image href="' + TRUCK_ART['kingpin'] + '" x="' + (TK_TRACTOR - 24) + '" y="119" width="54" height="15.3"/>' +
      sp2Tractor(0) + body +
    '</svg>';
}

var sp2RigBare = false;      // the drawing beside the table drops its numbers
function sp2RigBareArt(k, wide) {
  sp2RigBare = true;
  var html = sp2RigArt(k, wide);
  sp2RigBare = false;
  return html;
}
function sp2RigArt(k, wide) {
  var out = '<div class="sp2-rig" ondragover="sp2DragOver(event)" ondragleave="sp2DragLeave(event)" ' +
      'ondrop="sp2Drop(event,\'auto\',-1,\'' + k + '\')" data-k="' + k + '">' +
    sp2RigSvg(k, wide || 640) +
    '<div class="sp2-drop-hint">Drop the order here to load it</div>' +
  '</div>';
  return out;
}

// The first render cannot know how wide the lane is, so redraw once it does —
// and again whenever the window changes it.
function sp2FitRig() {
  var box = document.querySelector('.sp2-rig');
  if (!box) return;
  // beside the table the rig gets the column, not the card, and it is drawn
  // bare there — the same two things the lane builder decided
  var col = box.closest('.sp2-two-r');
  var avail = (col ? col.clientWidth : box.clientWidth) - 2 * TK_SIDE_PAD;
  if (avail < 160 || !SP2_DRIVERS[box.dataset.k]) return;
  var svg = box.querySelector('.sp2-sv');
  if (svg && Math.abs(+svg.getAttribute('width') - avail) < 2) return;
  sp2RigBare = !!col;
  var html = sp2RigSvg(box.dataset.k, avail);
  sp2RigBare = false;
  box.insertAdjacentHTML('afterbegin', html);
  if (svg) svg.remove();
}
window.addEventListener('resize', function () {
  clearTimeout(window._sp2fit);
  window._sp2fit = setTimeout(sp2FitRig, 120);
});

// Every other lane: plain rectangles, filled to the level. No cab, no wheels —
// enough to see who has room, and nothing more.
function sp2SimpleBars(k) {
  var d = SP2_DRIVERS[k], t = SP2_TRUCKS[d.truck];
  var row = function (caps, load, unit) {
    return caps.map(function (cap, i) {
      var l = load[i] || { p:'', q:0 };
      var pct = cap ? Math.min(100, Math.round(l.q / cap * 100)) : 0;
      var cls = pct >= 99 ? 'full' : pct > 0 ? 'partial' : 'empty-c';
      var col = SP2_PROD_COLORS[l.p] || 'transparent';
      return '<div class="sp2-bar2 ' + cls + '" style="flex-grow:' + cap + ';" ' +
          'ondragover="sp2DragOver(event)" ondragleave="sp2DragLeave(event)" ' +
          'ondrop="sp2Drop(event,\'' + unit + '\',' + i + ',\'' + k + '\')" ' +
          'title="C' + (i + 1) + ' · ' + (l.p || 'Empty') + ' · ' +
            l.q.toLocaleString() + ' / ' + cap.toLocaleString() + ' gal">' +
        '<div class="sp2-bar2-fill" style="height:' + pct + '%;background:' + col + ';"></div>' +
        '<span class="sp2-bar2-c">C' + (i + 1) + '</span>' +
        '<span class="sp2-bar2-p">' + (l.p || '') + '</span>' +
      '</div>';
    }).join('');
  };
  var box = function (inner) { return '<div class="sp2-barbox">' + inner + '</div>'; };
  var out = box(row(t.comps.map(function (c) { return c.cap; }), d.load, 'truck'));
  if (d.trailer) out += box(row(SP2_TRAILERS[d.trailer].caps, d.tload, 'trailer'));
  return '<div class="sp2-bars">' + out + '</div>';
}

// ── The run, stop by stop ──────────────────────────────────
// The route-time model is the one the dispatch docs carry, not one of mine:
//
//   route = dispensing + service + buffer + loading + travel + return
//   dispensing   gallons / the truck's own meter gpm
//   service      20 min + 1.2 min per asset, per ship-to
//   buffer       by volume: <500 gal 5 min · <1,500 10 · <3,000 15 · else 20
//   loading      gallons / 600 gpm + 25 min, once, at the hub
//   travel       road miles / city-and-class speed (25 mph wagon, 31 transport)
//   return       the last stop back to the hub always counts
//
// The miles are still pseudo-distance from a hash — that part is ours — but
// everything done with them now matches the model the planner is built to.

function sp2Assets(ship) {
  // The doc's range is 5–100 assets per ship-to, "skewed low". These are fuel
  // ship-tos with a handful of tanks, so they sit at the low end: 4–33, mostly
  // under 14, which is ~25–40 min on site. The skew matters — at the middle of
  // the range the model says five stops will not fit an eight-hour shift, and
  // that is also why the field research reads "3–4 deliveries per shift".
  var h = sp2Hash('assets|' + ship);
  return 4 + (h % 10 < 8 ? h % 10 : h % 30);
}
function sp2Buffer(gal) { return gal < 500 ? 5 : gal < 1500 ? 10 : gal < 3000 ? 15 : 20; }
function sp2Mph(k) {
  var d = SP2_DRIVERS[k], t = d && SP2_TRUCKS[d.truck];
  return t && t.type === 'Transport' ? 31 : 25;
}
function sp2Drive(mi, k) { return Math.round(mi / sp2Mph(k) * 60); }

// Miles between two ship-tos on one run. A consolidated route is local — the
// Corpus Christi day runs 176 miles over ten loads — so legs are short.
function sp2Leg(a, b) {
  var mi = 1.5 + (sp2Hash(a + '|' + b) % 145) / 10;   // 1.5 – 16.0 miles
  return mi;
}
// Everything that happens at one ship-to: the hose, the paperwork, the buffer.
function sp2OnSite(o, k) {
  var d = SP2_DRIVERS[k], t = d && SP2_TRUCKS[d.truck], gal = sp2Gal(o);
  return Math.round(20 + 1.2 * sp2Assets(o.ship) + gal / ((t && t.meter) || 300) + sp2Buffer(gal));
}
// Racking the load, once, at the terminal \u2014 after the drive out of the hub and
// before the first delivery.
function sp2LoadOut(k) {
  var gal = SP2_ORDERS.reduce(function (a, o) { return a + (o.driver === k ? sp2Gal(o) : 0); }, 0);
  return Math.round(gal / SP2_GPM_LOAD + 25);
}

// When this driver is expected at each of their stops, and what that does to
// the window. An early arrival WAITS for the window to open — so the wait is
// carried into the next leg, which is how a run drifts late.
function sp2Route(k) {
  var d = SP2_DRIVERS[k];
  if (!d) return [];
  var mine = SP2_ORDERS.filter(function (o) { return o.driver === k; })
                       .sort(function (x, y) { return x.t - y.t; });
  if (!mine.length) return [];
  var sh = SP2_SHIFTS[d.shift];
  // out of the hub, into the rack, load, and only then deliver
  var term = sp2Terminal(d.hub);
  var at = Math.max(SP2_NOW, sh ? sh.from : SP2_NOW) +
           sp2Drive(term.mi, k) + sp2LoadOut(k);
  var prev = null;
  return mine.map(function (o) {
    var leg = prev ? sp2Drive(sp2Leg(prev, o.ship), k)
                   : sp2Drive(sp2FromTerminal(o, k), k);
    var eta = at + leg, w = sp2Win(o);
    // Arriving a few minutes before the window opens is not waiting — the
    // stop's own volume buffer is 5–20 minutes wide and absorbs it. Ten
    // minutes is the line; past that the driver is sitting there.
    var kind = eta + 10 < w.from ? 'early' : eta <= w.to ? 'ok' : 'late';
    at = Math.max(eta, w.from) + sp2OnSite(o, k);
    prev = o.ship;
    return { o:o, eta:eta, w:w, kind:kind, leg:leg,
      note: kind === 'ok'    ? 'In window'
          : kind === 'early' ? 'Waits ' + sp2Dur(w.from - eta)
          :                    sp2Dur(eta - w.to) + ' late' };
  });
}

// When the rig is back at the hub, and whether that is inside the shift.
// The return leg always counts, and so does any waiting at the last stop.
function sp2RunEnd(k) {
  var rs = sp2Route(k);
  if (!rs.length) return null;
  var L = rs[rs.length - 1], trip = sp2Trip(L.o, k);
  var back = Math.max(L.eta, L.w.from) + sp2OnSite(L.o, k) + (trip ? trip.min : 30);
  var sh = SP2_SHIFTS[SP2_DRIVERS[k].shift];
  return { back:back, to: sh ? sh.to : 0, over: sh && back > sh.to ? back - sh.to : 0 };
}

function sp2RouteHtml(k) {
  var rs = sp2Route(k);
  if (!rs.length) return '';
  var open = k === sp2Driver, cap = open ? rs.length : 5;   // a day is four or five stops
  var miss = rs.filter(function (r) { return r.kind === 'late'; }).length;
  // The run fills the rig stop by stop, so the day has a point where it stops
  // fitting. The timeline marks it where it happens, between the last stop
  // that fits and the first that does not.
  var rigCap = sp2RigCap(k), run = 0, breach = -1;
  rs.forEach(function (r, i) {
    run += sp2Gal(r.o);
    if (breach < 0 && run > rigCap) breach = i;
  });
  var capLine = '<div class="sp2-rt-cap">Tank capacity exceeded. Remove orders.</div>';
  var rows = rs.slice(0, cap).map(function (r, i) {
    return (i === breach ? capLine : '') +
      '<div class="sp2-rt-row ' + r.kind + (sp2SelOrder === r.o.id ? ' sel' : '') + '" ' +
        'role="button" tabindex="0" ' +
        'title="' + r.o.ship + ' \u00b7 window ' + sp2Short(r.w.from) + '\u2013' + sp2Short(r.w.to) +
          ' \u00b7 ' + sp2Gal(r.o).toLocaleString() + ' gal" ' +
        'onclick="event.stopPropagation();sp2PickOrder(\'' + r.o.id + '\')">' +
        '<span class="sp2-rt-dot"></span>' +
        '<span class="sp2-rt-top">' +
          '<span class="sp2-rt-ship">' + r.o.ship + '</span>' +
          '<span class="sp2-rt-eta">' + sp2Hhmm(r.eta) + '</span>' +
          '<button class="sp2-rt-x" title="Remove ' + r.o.id + ' from ' + SP2_DRIVERS[k].truck + '" ' +
            'onclick="sp2UnplanOrder(event,\'' + k + '\',\'' + r.o.id + '\')">' +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
              'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>' +
        '</span>' +
        '<span class="sp2-rt-note"><span class="sp2-rt-id">' + r.o.id + '</span> \u00b7 ' +
          '<span class="sp2-rt-v">' + r.note + '</span></span>' +
      '</div>';
  }).join('');
  if (rs.length > cap)
    rows += '<button class="sp2-rt-more" onclick="sp2PickDriver(\'' + k + '\')">+' +
      (rs.length - cap) + ' more stop' + (rs.length - cap === 1 ? '' : 's') + '</button>';
  // it breaks further down the run than this lane is showing — still said,
  // where the stops it applies to are
  if (breach >= cap) rows += capLine;
  // The stops answer "does this one make its window". The run as a whole has
  // its own question — does the driver get home inside the shift — and the
  // return leg is the part nobody sees until it is too late.
  var e = sp2RunEnd(k);
  var foot = !e ? '' :
    '<div class="sp2-rt-end">Back at the hub ' + sp2Hhmm(e.back) +
      (e.over ? ' <span class="sp2-rt-over">\u00b7 ' + sp2Dur(e.over) +
                ' past the shift</span>' : '') + '</div>';
  return '<div class="sp2-rt">' +
      '<div class="sp2-rt-hd"><span>Route</span>' +
        '<span class="sp2-rt-n">' + rs.length + ' stop' + (rs.length === 1 ? '' : 's') +
          (miss ? ' \u00b7 ' + miss + ' outside' : '') + '</span></div>' +
      rows + foot +
    '</div>';
}

function sp2StopChips(k, mine, over) {
  var past = {};
  if (over) over.past.forEach(function (o) { past[o.id] = 1; });
  var fitting = mine.filter(function (o) { return !past[o.id]; });
  if (!fitting.length)
    return '<span class="sp2-stop-none">' +
      (mine.length ? 'Every order on this rig is over capacity'
                   : 'No orders planned — drag one here') + '</span>';
  var best = sp2BestFits(k, fitting);
  var d = SP2_DRIVERS[k];
  return fitting.map(function (o) {
    var fit = sp2OrderFit(k, o).pct;
    var band = sp2FitBand(fit);
    return '<span class="sp2-stopw' + (sp2SelOrder === o.id ? ' sel' : '') +
        (best[o.id] ? ' fit' : '') + '" data-id="' + o.id + '" ' +
        'onclick="sp2PickOrder(\'' + o.id + '\')" ' +
        'title="' + o.ship + ' · ' + sp2Gal(o).toLocaleString() + ' gal · fills ' + fit +
          '% of the compartments it needs' + (best[o.id] ? ' — the best fit on this rig' : '') + '">' +
        '<span class="sp2-stop" data-id="' + o.id + '">' +
          '<span class="sp2-stop-t">' + sp2Hhmm(o.t) + '</span>' + o.id +
          '<b>' + sp2Gal(o).toLocaleString() + ' gal</b>' +
          '<button class="sp2-stop-x" title="Take this order off ' + d.truck + '" ' +
            'onclick="sp2UnplanOrder(event,\'' + k + '\',\'' + o.id + '\')">×</button>' +
        '</span>' +
        '<span class="sp2-stop-fit ' + band + '">' + fit + '% fit</span>' +
      '</span>';
  }).join('');
}

function sp2LaneHtml(k) {
  var shut = !!sp2LaneShut[k];
  var d = SP2_DRIVERS[k], t = SP2_TRUCKS[d.truck];
  var caps = t.comps.map(function (c) { return c.cap; });
  var trl = d.trailer ? SP2_TRAILERS[d.trailer] : null;
  var a = sp2Sum(caps, d.load), b = sp2Sum(trl ? trl.caps : [], d.tload);
  var cap = a.cap + b.cap, q = a.q + b.q, pct = cap ? Math.round(q / cap * 100) : 0;

  var mine = SP2_ORDERS.filter(function (o) { return o.driver === k; })
                       .sort(function (x, y) { return x.t - y.t; });
  var gal = mine.reduce(function (s, o) { return s + sp2Gal(o); }, 0);

  var over = sp2Overload(k);
  var warn = !over ? '' :
    '<div class="sp2-over-warn">' +
      '<div class="sp2-over-head">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' +
        '<span class="sp2-over-cap">Tank capacity: ' + over.cap.toLocaleString() +
          ' gal</span>' +
        '<span class="sp2-over-by">Exceeded by: <b>' + over.over.toLocaleString() +
          ' gal</b></span>' +
      '</div>' +
      // What there is no room for, order by order. Cutting an order by gallons
      // was a promise to a customer quietly rewritten; an order comes off whole.
      '<div class="sp2-over-list">' +
        over.past.map(function (o) {
          return '<div class="sp2-over-row">' +
              '<span class="sp2-over-id">' + o.id + '</span>' +
              '<span class="sp2-over-q">' + sp2Gal(o).toLocaleString() + ' gal</span>' +
              // Splitting is only on offer when this rig could actually take
              // part of it: with every compartment holding another product
              // there is nothing to split off.
              (sp2SplitPlan(k, o).fits
                ? '<button class="sp2-over-act sp2-over-s" ' +
                    'onclick="sp2SplitAsk(event,\'' + k + '\',\'' + o.id + '\')">' +
                    // one line forking into two \u2014 the shuffle glyph that was here
                    // reads as "swap these", which is not what this does
                    '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
                      'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                      '<path d="M2 12h7"/><path d="M9 12l5-5h5"/><path d="M9 12l5 5h5"/>' +
                      '<path d="m17 4 3 3-3 3"/><path d="m17 14 3 3-3 3"/></svg>' +
                    '<span class="sp2-over-x-l">Split order</span></button>'
                : '') +
              '<button class="sp2-over-act sp2-over-x" onclick="sp2UnplanOrder(event,\'' + k + '\',\'' + o.id + '\')">' +
                '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
                  'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                  '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>' +
                '<span class="sp2-over-x-l">Remove order</span></button>' +
            '</div>';
        }).join('') +
      '</div>' +
    '</div>';

  return '<div class="sp2-ln' + (k === sp2Driver ? ' on' : '') + ' ' + d.state + '" data-k="' + k + '" ' +
      'ondragover="sp2DragOver(event)" ondragleave="sp2DragLeave(event)" ' +
      'ondrop="sp2Drop(event,\'auto\',-1,\'' + k + '\')" onclick="sp2LaneClick(\'' + k + '\')">' +

    // Who is driving, when their shift runs, and how much of it is left.
    // That is the whole of it at rest; the hours are a hover away and the
    // record is a chevron away.
    '<div class="sp2-ln-drv">' +
      '<div class="sp2-ln-drv-top">' +
        '<button class="sp2-grip" title="Move this lane to where its space puts it" ' +
          'onclick="sp2MoveLane(event,\'' + k + '\')">' +
          '<svg width="12" height="16" viewBox="0 0 12 16" fill="currentColor">' +
          '<circle cx="3.5" cy="3" r="1.3"/><circle cx="8.5" cy="3" r="1.3"/>' +
          '<circle cx="3.5" cy="8" r="1.3"/><circle cx="8.5" cy="8" r="1.3"/>' +
          '<circle cx="3.5" cy="13" r="1.3"/><circle cx="8.5" cy="13" r="1.3"/></svg></button>' +
        '<div class="sp2-av" title="' + d.name + '">' +
          d.name.split(' ').map(function (x) { return x[0]; }).join('').slice(0, 2) + '</div>' +
        '<div class="sp2-ln-name">' + d.name + '</div>' +
        '<button class="sp2-ico-sm" title="Change the driver on ' + d.truck + '" ' +
          'onclick="event.stopPropagation();sp2DriverPop(this,\'' + k + '\')">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
          'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>' +
        '<button class="sp2-ico-sm" title="Open ' + d.name + ', ' + d.truck +
            (trl ? ' and ' + d.trailer : '') + '" ' +
          'onclick="sp2CrewOpen(event,\'' + k + '\')">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
          'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<polyline points="9 18 15 12 9 6"/></svg></button>' +
      '</div>' +

      (shut ? '' : sp2ShiftBlock(k) + sp2RouteHtml(k)) +
    '</div>' +

    '<div class="sp2-ln-day">' +
      '<div class="sp2-ln-truck">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>' +
        '<button class="sp2-ln-truck-id" onclick="event.stopPropagation();sp2TruckPop(this,\'' + k + '\')" ' +
          'title="Change truck">' + d.truck + (trl ? ' + ' + d.trailer : '') +
          '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg>' +
        '</button>' +
        // what the rig IS: its class, its compartments, and — while nothing is
        // planned on it — the capacity those compartments add up to
        '<span class="sp2-ln-comps">' + t.type + ' \u00b7 ' +
          (caps.length + (trl ? trl.caps.length : 0)) + ' compartments' +
          (mine.length ? '' : ' \u00b7 ' + cap.toLocaleString() + ' gal') + '</span>' +
        // what is ON it, in its own group
        (mine.length
          ? '<span class="sp2-ln-orders">' + mine.length + ' order' +
              (mine.length === 1 ? '' : 's') + '</span>' +
            '<span class="sp2-ln-cap"><b>' + pct + '%</b> \u00b7 ' + q.toLocaleString() +
              ' of ' + cap.toLocaleString() + ' gal</span>'
          : '') +
        (k === sp2Driver
          ? (trl
              ? '<button class="sp2-link" onclick="event.stopPropagation();sp2DropTrailer(\'' + k + '\')">Unhitch</button>'
              : '<button class="sp2-trl-btn sm" onclick="event.stopPropagation();sp2TrailerPop(this,\'' + k + '\')">+ Trailer</button>') +
            (q ? '<button class="sp2-link" onclick="event.stopPropagation();sp2Unload(\'' + k +
                   '\')">Unload all</button>' : '')
          : '') +
      '</div>' +

      // A shut lane with nothing planned on it says so, and nothing else:
      // five empty boxes and a "0 orders" are a row of furniture.
      (!shut && k !== sp2Driver && !mine.length
        ? '<div class="sp2-ln-none">Load planning not started.</div>'
        : '') +

      // The open lane's middle is one band: the compartments as a table on the
      // left, the truck drawn beside it on the right. The drawing drops its
      // numbers because the table carries them. Head and foot are unchanged.
      (shut ? ''
        : k === sp2Driver
        ? '<div class="sp2-two">' +
            '<div class="sp2-two-l">' + sp2CompTable(k) + '</div>' +
            '<div class="sp2-two-r">' + sp2RigBareArt(k, 300) + '</div>' +
          '</div>' + sp2SuggestHtml(k)
        : mine.length ? sp2SimpleBars(k) : '') +

      (shut ? '' : warn) +
      // The orders on the rig, as chips. What is over capacity is in the red
      // banner above, so these are the ones that fit — each saying how well it
      // fills the compartments it needs, and the best of them marked.
      (!shut && (k === sp2Driver || mine.length)
        ? '<div class="sp2-ln-stops">' +
            '<div class="sp2-stop-list">' + sp2StopChips(k, mine, over) + '</div>' +
          '</div>'
        : '') +
    '</div>' +
  '</div>';
}

function sp2RenderLanes() {
  var keys = sp2DriverKeys(), host = document.getElementById('sp2V2');
  sp2DrvCounts(keys.length);
  if (!keys.length) { host.innerHTML = '<div class="sp2-empty">No driver matches that.</div>'; return; }
  var w = sp2Window();
  var body = keys.map(sp2LaneHtml).join('');

  // The column names itself, the chips say what is narrowing it and the count
  // sits beside the name — a band repeating all three said nothing new.
  host.innerHTML = body;
  sp2FitRig();
}

function sp2RenderUnit() {
  sp2RenderLanes();
  sp2VrDraw();
  sp2ShelfDraw();
  var b = document.getElementById('sp2FpBtn');
  if (b) {
    var n = sp2FacetN(sp2Facet);
    b.classList.toggle('on', n > 0);
    document.getElementById('sp2FpN').textContent = n;
  }
  sp2CardsAllBtn();
  sp2LanesAllBtn();
  var w = document.getElementById('sp2SrchWrap');
  if (w) w.classList.toggle('has', !!document.getElementById('sp2DrvSearch').value);
  sp2FpDraw();
}

// loading, unloading and hitching all change what would fit
function sp2AfterRig() { sp2Render(); }

function sp2PickDriver(k) {
  sp2Driver = k;
  sp2Render();          // the cards on the left are measured against this rig
}
// Clicking the lane you are already in lets go of it. Nothing is being planned
// onto anything then, so fit has nothing to measure and the sort says so.
// Only the lane does this — everywhere else, picking a driver means picking.
function sp2LaneClick(k) {
  sp2Driver = sp2Driver === k ? null : k;
  sp2Render();
}
function sp2ViewDriver() { sp2Toast(SP2_DRIVERS[sp2Driver].name + ' — driver details would open here'); }

// ══════════════════════════════════════════════════════════
//  Shell
// ══════════════════════════════════════════════════════════
function sp2Render(){
  sp2OutsideMap = null;         // the runs changed, so what is outside did too
  sp2RenderTimeline(); sp2RenderUnit(); sp2Sub(); sp2SortBar();
}

// The header carries the version, not the date — the date picker says the day
// and the ruler says the hours, so the subtitle was a third copy of both.
function sp2Sub() {}

var SP2_DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var SP2_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function sp2Fmt(d) {
  return SP2_DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + SP2_MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}
var sp2Cursor = new Date(2026, 10, 19);
function sp2ShiftDay(n) {
  sp2Cursor.setDate(sp2Cursor.getDate() + n);
  document.getElementById('sp2Date').value = sp2Fmt(sp2Cursor);
  sp2Render();
}
function sp2Today() { sp2Cursor = new Date(2026, 10, 19); document.getElementById('sp2Date').value = sp2Fmt(sp2Cursor); sp2Render(); }

// The planner opens with a driver selected. Their lane was the eleventh of
// twenty, 650px below the fold, so the selection — and anything that lane is
// flagging — opened out of sight. Called once, at startup: after that the
// scroll is the dispatcher's.
function sp2ShowSelected() {
  var sel = document.querySelector('.sp2-ln.on');
  var host = document.getElementById('sp2V2');
  if (!sel || !host) return;
  host.scrollTop += sel.getBoundingClientRect().top - host.getBoundingClientRect().top - 12;
}
function sp2Toast(msg, warn) {
  var t = document.getElementById('sp2Toast');
  t.textContent = msg;
  t.classList.toggle('warn', !!warn);
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.style.display = 'none'; }, warn ? 5200 : 2600);
}

(function () {
  document.getElementById('sp2Date').value = sp2Fmt(sp2Cursor);
  sp2Render();
  sp2ShowSelected();
})();


// ══════════════════════════════════════════════════════════
//  Columns: resize the split, or take one into its own window
// ══════════════════════════════════════════════════════════
// A popped-out column is a second copy of the page showing only that column.
// It keeps its own state — the two windows do not talk to each other, so an
// order cannot be dragged from one into the other.
function sp2PopOut(which) {
  var u = new URL(location.href);
  u.searchParams.set('only', which);
  window.open(u.toString(), 'sp2-' + which, 'width=1000,height=900');
}

(function () {
  var only = new URL(location.href).searchParams.get('only');
  if (only === 'orders' || only === 'drivers') {
    document.getElementById('sp2Body').setAttribute('data-only', only);
    var nav = document.querySelector('.shell-nav');        // only in the combined file
    if (nav) nav.style.display = 'none';
  }

  var grip = document.getElementById('sp2Split');
  var body = document.getElementById('sp2Body');
  var col  = document.querySelector('.sp2-col-orders');
  var on = false;
  grip.addEventListener('mousedown', function (e) {
    on = true; grip.classList.add('on');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', function (e) {
    if (!on) return;
    var r = body.getBoundingClientRect();
    // a hand-set width wins over the one the view would pick
    col.style.flexBasis = Math.min(72, Math.max(14, (e.clientX - r.left) / r.width * 100)) + '%';
    sp2FitRig();
  });
  document.addEventListener('mouseup', function () {
    if (!on) return;
    on = false; grip.classList.remove('on');
    document.body.style.cursor = ''; document.body.style.userSelect = '';
    // a width you set by hand is the width you keep, across reloads
    try { localStorage.setItem('sp2ColWidth', col.style.flexBasis); } catch (e) {}
    sp2FitRig();
  });

  // restore it before anything measures the lane
  try {
    var saved = localStorage.getItem('sp2ColWidth');
    if (saved) { col.style.flexBasis = saved; sp2FitRig(); }
  } catch (e) {}
})();

// the header arrows move the day
function sp2Shift(n){ sp2ShiftDay(n); }
</script>
