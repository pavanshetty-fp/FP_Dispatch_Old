<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>Shift Planner V2 — FleetPanda Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ══ FP DS — light ══════════════════════════════════════════
   Values taken from FP-DS-2026/src/index.css, resolved. Things that are not
   simply the dark theme inverted, and are easy to get wrong:
     · the ground is WARM (#e8e8e4) and everything on it is cool — deliberate
     · a card sits LIGHTER than its lane here; dark inverts that
     · --brand orange is the product mark and the focus ring, never the CTA;
       the CTA is --primary, near-black
     · three stroke weights do three jobs — card rim, divider, field boundary
     · hover is grey (--fp-emphasis); selected is the brand tint (--fp-selected)
   The system has no timeline unit, so the three views below borrow the board
   card and the delivery-timeline's hour scale rather than invent a third thing. */
:root{
  --fp-surface-base:#e8e8e4;
  --fp-shell-ground:#f2f2f2;
  --fp-surface-1b:#ffffff;
  --fp-surface-1a:#f4f5f8;
  --fp-card-1:#dee1e7;
  --fp-card-2:#e8eaed;
  --fp-table-header:#f1f2f2;
  --fp-row-hover:#e8eaed;
  --chip:#efefeb;
  --muted:#e9eaeb;

  --fp-ink-1:#030405;
  --fp-ink-3:#4f5968;
  --fp-ink-inverse:#f0f2f5;

  --fp-outline-1:#cfd3d9;
  --fp-outline-2:#adaeb4;
  --fp-stroke-hairline:#c8c9cd;
  --fp-stroke-field:#91949b;

  --brand:#fa6400;
  --primary:#090c0f;
  --primary-foreground:#f0f2f5;
  --fp-selected:#fee8d9;
  --fp-selected-strong:#a33f00;
  --fp-selected-border:#fdb98c;
  --fp-emphasis:#dee0e5;
  --fp-emphasis-hover:#e4e6ea;
  --ring:#fa6400;

  --status-caution:#b45309;
  --status-info:#1d4ed8;
  --status-success:#15803d;
  --status-failed:#dc2626;
  --status-neutral:#4f5968;

  --r-md:8px; --r-lg:10px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
*{scrollbar-width:none;}
*::-webkit-scrollbar{width:0;height:0;display:none;}
body{font-family:'Geist',system-ui,sans-serif;background:var(--fp-surface-base);color:var(--fp-ink-1);height:100vh;overflow:hidden;}

.sp2{height:100vh;display:flex;flex-direction:column;background:var(--fp-shell-ground);}

/* ── Header ───────────────────────────────────────────────── */
.sp2-hdr{height:56px;background:var(--fp-surface-1b);border-bottom:1px solid var(--fp-stroke-hairline);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;}
.sp2-title{display:flex;align-items:center;gap:10px;}
.sp2-title h1{font-size:16px;line-height:24px;font-weight:600;color:var(--fp-ink-1);}
.sp2-ver{display:inline-flex;align-items:center;height:20px;padding:0 9px;border-radius:9999px;background:var(--muted);font-size:12px;font-weight:500;color:var(--fp-ink-3);}
.sp2-date{display:flex;align-items:center;gap:6px;}
.sp2-nav-btn{width:36px;height:36px;border:1px solid var(--fp-stroke-field);border-radius:var(--r-md);background:var(--fp-surface-1b);color:var(--fp-ink-1);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.sp2-nav-btn:hover{background:var(--fp-emphasis);}
.sp2-date-inp{height:36px;background:var(--fp-surface-1b);border:1px solid var(--fp-stroke-field);border-radius:var(--r-md);color:var(--fp-ink-1);font-family:inherit;font-size:14px;padding:0 12px;outline:none;text-align:center;min-width:164px;cursor:pointer;font-variant-numeric:tabular-nums;}
.sp2-date-inp:focus{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklab,var(--ring) 50%,transparent);}
.sp2-today{height:36px;padding:0 14px;border:1px solid var(--fp-stroke-field);border-radius:var(--r-md);background:var(--fp-surface-1b);color:var(--fp-ink-1);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;}
.sp2-today:hover{background:var(--fp-emphasis);}

/* ── Two columns ──────────────────────────────────────────── */
.sp2-body{flex:1;display:flex;overflow:hidden;min-height:0;}
.sp2-col{display:flex;flex-direction:column;min-width:0;overflow:hidden;}
/* plain percentages, not clamp(): flex-basis cannot interpolate between a
   clamp() and a percentage, so the transition stalls where it started. */
.sp2-col-orders{flex:0 0 40%;min-width:272px;border-right:1px solid var(--fp-stroke-hairline);transition:flex-basis .22s ease;background:var(--fp-surface-1b);}
.sp2-body[data-view="v"] .sp2-col-orders{flex-basis:36%;}
.sp2-body[data-view="v"] .sp2-tl-wrap{overflow-x:hidden;}
.sp2-col-unit{flex:1 1 60%;background:var(--fp-surface-1b);}

/* ── One head for the whole planner ────────────────────────
   The presets and the filters narrow both columns, so they sit above them —
   the DS list page's view row and toolbar, once, not once per column. */
.sp2-head{display:flex;flex-direction:column;align-items:stretch;gap:10px;
  padding:0 16px 10px;border-bottom:1px solid var(--fp-stroke-hairline);
  flex-shrink:0;background:var(--fp-surface-1b);position:relative;}
.sp2-head .sp2-vr{margin:0 -16px;}
.sp2-head .sp2-tools{align-items:center;}
.sp2-head .sp2-tools-r{align-self:center;}

/* ── The head of a column ──────────────────────────────────
   Built as the design system's list page is: the name on its own line, then
   ONE control row — unit.toolbar. Left narrows (quick filters, then search,
   then Filters), right scopes and presents. Never a second control row: a
   menu dropped from the toolbar then lands on the list, which is where a menu
   belongs, and not on top of the filters.  (FPDS unit.toolbar, template.list-page) */
.sp2-col-hdr{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:8px;
  padding:10px 16px;border-bottom:1px solid var(--fp-stroke-hairline);
  flex-shrink:0;background:var(--fp-surface-1b);}
.sp2-col-hdr .sp2-tools-r{margin-left:auto;}
/* the chips sit directly under the name they narrow */
.sp2-col-hdr .sp2-shelf{padding-top:2px;}
.sp2-col-top{display:flex;align-items:center;gap:12px;min-width:0;}
/* the count belongs to the name, not to the row */
.sp2-col-id{display:flex;align-items:center;gap:6px;min-width:0;}
.sp2-col-title{font-size:14px;line-height:20px;font-weight:600;color:var(--fp-ink-1);white-space:nowrap;}

.sp2-tools{display:flex;flex-wrap:wrap;align-items:flex-start;
  justify-content:space-between;gap:12px;min-width:0;}
/* The left cluster takes the row's width rather than shrinking to its widest
   control — a wrapping flex box asks for its biggest child, which would send
   everything after the search onto a second line. */
.sp2-tools-l{flex:1 1 auto;display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap;}
.sp2-pop-out{margin-left:auto;}
.sp2-tools-r{display:flex;align-items:center;gap:4px;flex-shrink:0;margin-left:auto;}
/* every control in the row is 32px tall, as the DS has it */
.sp2-tools .sp2-seg{padding:2px;}
.sp2-tools .sp2-seg-btn{height:26px;}
.sp2-tools .sp2-search{height:32px;flex:1 1 180px;min-width:120px;max-width:320px;}
.sp2-drv-tabs .sp2-seg-btn,.sp2-tools #sp2Quick .sp2-seg-btn{padding:0 6px;}

/* an icon standing in for the label a unit used to carry outside it */
.sp2-seg-ico{display:inline-flex;align-items:center;padding:0 5px 0 7px;color:var(--fp-ink-3);flex-shrink:0;}

/* Filters and Sort: icon triggers, named by their tooltip. Each carries what
   it is doing the way the DS's Filters trigger carries its applied count — so
   a narrowed or re-ordered list never passes for the plain one. */
.sp2-tool-btn{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 8px;
  border:1px solid var(--fp-stroke-field);border-radius:var(--r-md);
  background:var(--fp-surface-1b);color:var(--fp-ink-1);
  font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;}
.sp2-tool-btn:hover{background:var(--fp-emphasis-hover);}
.sp2-tool-btn svg{color:var(--fp-ink-3);}
.sp2-tool-btn.on{border-color:var(--fp-outline-2);}
.sp2-tool-btn.on svg{color:var(--fp-ink-1);}
.sp2-bubble{display:none;align-items:center;justify-content:center;min-width:18px;height:18px;
  padding:0 6px;border-radius:9999px;background:var(--chip);color:var(--fp-ink-1);
  font-size:11px;font-weight:500;font-variant-numeric:tabular-nums;}
.sp2-tool-btn.on .sp2-bubble{display:inline-flex;}

/* the display switch: icon tools, the current one on the chip fill */
/* An icon tool carries its own box, so it reads as a control at rest rather
   than only when you hover it. */
.sp2-ico-tool{display:inline-flex;align-items:center;justify-content:center;
  width:32px;height:32px;border:1px solid var(--fp-stroke-field);border-radius:var(--r-md);
  background:var(--fp-surface-1b);color:var(--fp-ink-3);cursor:pointer;flex-shrink:0;}
.sp2-ico-tool:hover{background:var(--fp-emphasis-hover);color:var(--fp-ink-1);}
.sp2-ico-tool.on{background:var(--chip);color:var(--fp-ink-1);}
.sp2-ico-tool:disabled{opacity:.4;cursor:not-allowed;}
.sp2-ico-tool:disabled:hover{background:var(--fp-surface-1b);color:var(--fp-ink-3);}

/* The display switch is ONE bordered pill of segments, the view you are on
   filled grey — the DS's shape for it (2026-10-23). */
.sp2-vsw{display:inline-flex;height:32px;flex-shrink:0;overflow:hidden;
  border:1px solid var(--fp-stroke-field);border-radius:var(--r-md);
  background:var(--fp-surface-1b);}
.sp2-vsw .sp2-ico-tool{border:none;border-radius:0;height:30px;width:32px;background:none;}
.sp2-vsw .sp2-ico-tool + .sp2-ico-tool{border-left:1px solid var(--fp-outline-1);}
.sp2-vsw .sp2-ico-tool.on{background:var(--chip);}

/* ── More filters ──────────────────────────────────────────
   The rest of the filters live behind a funnel, which carries a dot while any
   of them is on, so a narrowed list never looks like the whole list. */
.sp2-fltwrap{position:static;}
.sp2-fltpop{display:none;position:absolute;left:0;top:calc(100% + 4px);z-index:70;
  min-width:184px;padding:6px;background:var(--fp-surface-1b);
  border:1px solid var(--fp-outline-1);border-radius:var(--r-lg);
  box-shadow:0 8px 20px -6px rgba(3,4,5,.18),0 2px 6px -2px rgba(3,4,5,.1);}
.sp2-fltpop.on{display:block;}
.sp2-fltpop-h{padding:4px 8px 6px;font-size:11px;color:var(--fp-ink-3);}
.sp2-fltrow{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;
  border:none;border-radius:var(--r-sm,6px);background:none;font-family:inherit;
  font-size:13px;color:var(--fp-ink-1);cursor:pointer;text-align:left;}
.sp2-fltrow:hover{background:var(--fp-emphasis-hover);}
.sp2-fltrow:disabled{opacity:.45;cursor:not-allowed;}
.sp2-fltrow:disabled:hover{background:none;}
.sp2-fltrow-n{margin-left:auto;font-size:12px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}
.sp2-fltrow .sp2-tick{width:14px;color:var(--fp-selected-strong);visibility:hidden;}
.sp2-fltrow.on .sp2-tick{visibility:visible;}


.sp2-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 7px;border-radius:9999px;background:var(--muted);font-size:12px;font-weight:500;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}

.sp2-seg{display:flex;background:var(--muted);border:1px solid var(--fp-outline-1);border-radius:var(--r-md);padding:2px;}
.sp2-seg-btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border:none;background:transparent;color:var(--fp-ink-3);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;border-radius:6px;white-space:nowrap;}
.sp2-seg-btn:hover{background:var(--fp-emphasis-hover);color:var(--fp-ink-1);}
.sp2-seg-btn.on{background:var(--primary);color:var(--primary-foreground);font-weight:600;}
.sp2-seg-n{font-size:11px;opacity:.75;font-variant-numeric:tabular-nums;}
.sp2-custom{display:none;align-items:center;gap:6px;}
.sp2-custom.on{display:flex;}
.sp2-time{height:32px;width:72px;background:var(--fp-surface-1b);border:1px solid var(--fp-stroke-field);border-radius:var(--r-md);color:var(--fp-ink-1);font-family:inherit;font-size:13px;padding:0 8px;outline:none;text-align:center;font-variant-numeric:tabular-nums;}
.sp2-time:focus{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklab,var(--ring) 50%,transparent);}


/* ══════════════════════════════════════════════════════════
   Unified View's list head, on the driver column
   ──────────────────────────────────────────────────────────
   The same units the DS list page uses, in the same order:
   unit.view-row, then unit.toolbar, then unit.chip-shelf.
   Scoped to .sp2-col-unit — the orders column keeps its own head.
   ══════════════════════════════════════════════════════════ */

/* ── unit.view-row ────────────────────────────────────────
   All · the views you made · + View · Export. The active tab's
   2px underline lands ON the hairline, so it reads as a tab. */
.sp2-vr{display:flex;align-items:stretch;gap:4px;margin:0 -16px;padding:2px 12px 0;
  border-bottom:1px solid var(--fp-stroke-hairline);}
.sp2-vr-tab{display:inline-flex;align-items:center;gap:6px;align-self:flex-end;
  padding:8px 12px;border:none;border-bottom:2px solid transparent;background:none;
  font-family:inherit;font-size:12px;color:var(--fp-ink-3);cursor:pointer;}
.sp2-vr-tab:hover{color:var(--fp-ink-1);}
.sp2-vr-tab.on{font-weight:500;color:var(--fp-ink-1);border-bottom-color:var(--fp-ink-1);}
.sp2-vr-dot{width:6px;height:6px;border-radius:50%;background:var(--accent-violet,#7c5cff);}
.sp2-vr-ico{display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;border:none;border-radius:var(--r-md);background:none;
  color:var(--fp-ink-3);cursor:pointer;flex-shrink:0;}
.sp2-vr-ico:hover{background:var(--fp-emphasis-hover);color:var(--fp-ink-1);}
.sp2-vr-more{opacity:0;}
.sp2-vr-wrap:hover .sp2-vr-more,.sp2-vr-more.on{opacity:1;}
.sp2-vr-wrap{display:inline-flex;align-items:center;align-self:flex-end;position:relative;}
.sp2-vr-add{display:inline-flex;align-items:center;gap:4px;align-self:flex-end;
  margin-bottom:4px;padding:4px 8px;border:none;border-radius:var(--r-md);background:none;
  font-family:inherit;font-size:12px;color:var(--fp-ink-3);cursor:pointer;}
.sp2-vr-add:hover{background:var(--fp-emphasis-hover);color:var(--fp-ink-1);}
.sp2-vr-end{margin-left:auto;display:flex;align-items:center;align-self:flex-end;
  gap:6px;margin-bottom:12px;}
.sp2-vr-menu{display:none;position:absolute;right:0;top:100%;z-index:80;min-width:150px;
  padding:5px;background:var(--fp-surface-1b);border:1px solid var(--fp-outline-1);
  border-radius:var(--r-lg);box-shadow:0 8px 20px -6px rgba(3,4,5,.18);}
.sp2-vr-menu.on{display:block;}
.sp2-vr-mi{display:block;width:100%;height:30px;padding:0 8px;border:none;border-radius:var(--r-sm,6px);
  background:none;font-family:inherit;font-size:13px;color:var(--fp-ink-1);text-align:left;cursor:pointer;}
.sp2-vr-mi:hover{background:var(--fp-emphasis-hover);}
.sp2-vr-mi.bad{color:var(--status-failed);}

/* ── unit.toolbar · search ────────────────────────────────
   The DS's 320px box with its leading glyph and a clear X. */
.sp2-srch{position:relative;flex:0 1 320px;min-width:150px;}
.sp2-srch>svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);
  color:var(--fp-ink-3);pointer-events:none;}
.sp2-srch .sp2-search{width:100%;max-width:none;padding-left:30px;}
.sp2-srch-x{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:none;
  padding:2px;border:none;background:none;color:var(--fp-ink-3);cursor:pointer;line-height:0;}
.sp2-srch.has .sp2-srch-x{display:block;}
.sp2-srch-x:hover{color:var(--fp-ink-1);}

/* ── unit.filter-panel ────────────────────────────────────
   600px, the facets down the left in 200px, their options to the
   right, and a footer that counts the rows before you commit. */
/* the panel's two lists, as tabs */
.sp2-fp-tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--fp-outline-1);}
.sp2-fp-tab{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:none;
  border-bottom:2px solid transparent;background:none;font-family:inherit;font-size:13px;
  color:var(--fp-ink-3);cursor:pointer;}
.sp2-fp-tab:hover{color:var(--fp-ink-1);}
.sp2-fp-tab.on{font-weight:500;color:var(--fp-ink-1);border-bottom-color:var(--fp-ink-1);}
.sp2-fp-tab-n{min-width:17px;height:17px;padding:0 5px;border-radius:9999px;background:var(--chip);
  font-size:11px;color:var(--fp-ink-1);font-variant-numeric:tabular-nums;
  display:inline-flex;align-items:center;justify-content:center;}

.sp2-fp{display:none;position:absolute;left:0;top:calc(100% + 4px);z-index:90;width:600px;
  background:var(--fp-surface-1b);border:1px solid var(--fp-outline-1);
  border-radius:var(--r-lg);box-shadow:0 10px 28px -8px rgba(3,4,5,.2),0 2px 8px -2px rgba(3,4,5,.1);
  overflow:hidden;}
.sp2-fp.on{display:block;}
.sp2-fp-body{display:flex;height:264px;}
.sp2-fp-menu{width:200px;flex-shrink:0;padding:8px;display:flex;flex-direction:column;gap:4px;
  border-right:1px solid var(--fp-outline-1);overflow:auto;}
.sp2-fp-f{display:flex;align-items:center;height:32px;padding:0 8px;border:none;
  border-radius:var(--r-md);background:none;font-family:inherit;font-size:13px;
  color:var(--fp-ink-3);text-align:left;cursor:pointer;}
.sp2-fp-f:hover{background:var(--fp-emphasis-hover);color:var(--fp-ink-1);}
.sp2-fp-f.on{background:var(--chip);color:var(--fp-ink-1);}
.sp2-fp-f-n{margin-left:auto;font-size:11px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}
.sp2-fp-opts{flex:1;min-width:0;padding:8px 12px;overflow:auto;}
.sp2-fp-o{display:flex;align-items:flex-start;gap:8px;width:100%;min-height:32px;padding:4px 0;
  border:none;background:none;font-family:inherit;text-align:left;cursor:pointer;}
.sp2-fp-o-v{display:block;font-size:13px;color:var(--fp-ink-1);}
.sp2-fp-o-d{display:block;font-size:11px;color:var(--fp-ink-3);}
.sp2-fp-box{width:15px;height:15px;margin-top:2px;flex-shrink:0;position:relative;
  border:1px solid var(--fp-stroke-field);border-radius:4px;background:var(--fp-surface-1b);}
.sp2-fp-o.on .sp2-fp-box{background:var(--fp-ink-1);border-color:var(--fp-ink-1);}
.sp2-fp-o.on .sp2-fp-box::after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;
  border:solid var(--fp-surface-1b);border-width:0 2px 2px 0;transform:rotate(42deg);}
.sp2-fp-foot{display:flex;align-items:center;gap:8px;height:64px;padding:0 16px;
  border-top:1px solid var(--fp-outline-1);}
.sp2-fp-n{font-size:13px;color:var(--fp-ink-3);}
.sp2-fp-n b{font-weight:500;color:var(--fp-ink-1);font-variant-numeric:tabular-nums;}
.sp2-fp-btns{margin-left:auto;display:flex;gap:8px;}

/* ── unit.filter-panel · a group's dimensions, headed ─────── */
.sp2-fp-sec{margin:10px 0 4px;font-size:11px;font-weight:500;letter-spacing:.06em;
  text-transform:uppercase;color:var(--fp-ink-3);}
.sp2-fp-sec.first{margin-top:2px;}
.sp2-fp-none{padding:6px 0;font-size:12px;color:var(--fp-ink-3);}
.sp2-fp-o-n{margin-left:auto;font-size:11px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}
/* a facet with more options than you can scan gets its own search */
.sp2-fp-seg{display:flex;gap:2px;margin:2px 0 6px;padding:2px;background:var(--muted);
  border:1px solid var(--fp-outline-1);border-radius:var(--r-md);}
.sp2-fp-seg .sp2-seg-btn{flex:1;justify-content:center;}
.sp2-pill-kind{height:18px;margin-left:6px;padding:0 7px;font-size:10px;font-weight:500;
  letter-spacing:.03em;background:var(--chip);color:var(--fp-ink-3);}
.sp2-fp-srch{margin:2px 0 6px;}
.sp2-fp-srch input{width:100%;height:32px;padding:0 10px;border:1px solid var(--fp-stroke-field);
  border-radius:var(--r-md);background:var(--fp-surface-1b);font-family:inherit;
  font-size:13px;color:var(--fp-ink-1);outline:none;}
.sp2-fp-srch input:focus{border-color:var(--ring);
  box-shadow:0 0 0 2px color-mix(in oklab,var(--ring) 50%,transparent);}

/* ── the capacity range ───────────────────────────────────
   Two thumbs on one track: how much room a rig has to have. At its full
   width it is not a filter, so it takes itself off. */
.sp2-rng{padding:6px 2px 2px;}
.sp2-rng-read{font-size:13px;font-weight:500;color:var(--fp-ink-1);
  font-variant-numeric:tabular-nums;margin-bottom:10px;}
.sp2-rng-track{position:relative;height:20px;}
.sp2-rng-track::before{content:'';position:absolute;left:0;right:0;top:9px;height:4px;
  border-radius:2px;background:var(--fp-outline-1);}
.sp2-rng-fill{position:absolute;top:9px;height:4px;border-radius:2px;background:var(--fp-ink-1);}
.sp2-rng-i{position:absolute;left:0;width:100%;top:0;height:20px;margin:0;
  background:none;-webkit-appearance:none;appearance:none;pointer-events:none;}
.sp2-rng-i::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;
  width:16px;height:16px;border-radius:50%;background:var(--fp-surface-1b);
  border:2px solid var(--fp-ink-1);box-shadow:0 1px 2px rgba(3,4,5,.2);cursor:pointer;}
.sp2-rng-i::-moz-range-thumb{pointer-events:auto;width:16px;height:16px;border-radius:50%;
  background:var(--fp-surface-1b);border:2px solid var(--fp-ink-1);cursor:pointer;}
.sp2-rng-i:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 50%,transparent);}
.sp2-rng-ends{display:flex;justify-content:space-between;margin-top:6px;
  font-size:11px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}

/* ── unit.chip-shelf ──────────────────────────────────────────
   One pill per facet: the label muted, the value in ink. Several values
   collapse to a count, and the values themselves are a hover away. */
.sp2-shelf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sp2-chipf{position:relative;display:inline-flex;align-items:center;gap:4px;height:28px;
  padding:0 4px 0 12px;border-radius:9999px;background:var(--muted);
  font-size:12px;color:var(--fp-ink-1);max-width:260px;}
.sp2-chipf-l{color:var(--fp-ink-3);white-space:nowrap;}
.sp2-chipf-n{padding:0 6px;border-radius:9999px;background:var(--fp-surface-1b);
  font-size:11px;font-variant-numeric:tabular-nums;}
.sp2-chipf-x{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border:none;border-radius:50%;background:none;padding:0;color:var(--fp-ink-3);cursor:pointer;}
.sp2-chipf-x:hover{background:rgba(3,4,5,.08);color:var(--fp-ink-1);}
.sp2-chipf-card{visibility:hidden;opacity:0;position:absolute;left:0;top:calc(100% + 6px);
  z-index:95;min-width:180px;max-width:280px;padding:6px;background:var(--fp-surface-1b);
  border:1px solid var(--fp-outline-1);border-radius:var(--r-lg);
  box-shadow:0 8px 20px -6px rgba(3,4,5,.18);
  transition:opacity .12s linear,visibility 0s linear .45s;}
.sp2-chipf-card::before{content:'';position:absolute;left:0;right:0;top:-10px;height:10px;}
.sp2-chipf.has-card:hover .sp2-chipf-card,.sp2-chipf-card:hover{visibility:visible;opacity:1;
  transition:opacity .12s linear;}
.sp2-chipf-card-h{display:block;padding:2px 6px 4px;font-size:10px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--fp-ink-3);}
.sp2-chipf-row{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:3px 4px 3px 6px;border-radius:var(--r-sm,6px);font-size:12px;color:var(--fp-ink-1);}
.sp2-chipf-row:hover{background:var(--fp-emphasis-hover);}
.sp2-shelf-clr{border:none;background:none;font-family:inherit;font-size:13px;
  color:var(--fp-ink-3);cursor:pointer;}
.sp2-shelf-clr:hover{color:var(--fp-ink-1);text-decoration:underline;text-underline-offset:2px;}

/* a small primary / outline button, the DS's size="sm" */
.sp2-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;
  border-radius:var(--r-md);border:1px solid transparent;font-family:inherit;
  font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;}
.sp2-btn.pri{background:var(--primary);color:var(--primary-foreground);}
.sp2-btn.pri:hover{filter:brightness(1.08);}
.sp2-btn.ghost{background:none;color:var(--fp-ink-1);}
.sp2-btn.ghost:hover{background:var(--fp-emphasis-hover);}
.sp2-btn.out{background:var(--fp-surface-1b);border-color:var(--fp-stroke-field);color:var(--fp-ink-1);}
.sp2-btn.out:hover{background:var(--fp-emphasis-hover);}
.sp2-btn:disabled{opacity:.45;cursor:not-allowed;}

/* the dialog the view row saves through */
.sp2-dlg-scrim{display:none;position:fixed;inset:0;z-index:200;background:rgba(3,4,5,.35);}
.sp2-dlg-scrim.on{display:block;}
.sp2-dlg{position:absolute;left:50%;top:22%;transform:translateX(-50%);width:384px;
  padding:20px;background:var(--fp-surface-1b);border-radius:var(--r-lg);
  box-shadow:0 20px 50px -12px rgba(3,4,5,.3);}
.sp2-dlg-t{font-size:16px;font-weight:600;color:var(--fp-ink-1);}
.sp2-dlg-l{display:block;margin:16px 0 6px;font-size:12px;color:var(--fp-ink-3);}
.sp2-dlg-i{width:100%;height:36px;padding:0 10px;border:1px solid var(--fp-stroke-field);
  border-radius:var(--r-md);background:var(--fp-surface-1b);font-family:inherit;
  font-size:13px;color:var(--fp-ink-1);outline:none;}
.sp2-dlg-i:focus{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklab,var(--ring) 50%,transparent);}
.sp2-dlg-p{margin:10px 0 0;font-size:13px;line-height:1.45;color:var(--fp-ink-3);}
.sp2-dlg-f{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}

/* ── Timeline ─────────────────────────────────────────────── */
.sp2-tl-wrap{flex:1;overflow:auto;min-height:0;position:relative;}
.sp2-tl{position:relative;padding:0 16px 18px;min-width:min-content;}

.sp2-ruler{position:sticky;top:0;z-index:3;height:32px;background:var(--fp-surface-1b);border-bottom:1px solid var(--fp-stroke-hairline);display:flex;margin:0 -16px;padding:0 16px;}
.sp2-hour{flex-shrink:0;position:relative;font-size:12px;color:var(--fp-ink-3);padding-top:9px;border-left:1px solid var(--fp-outline-1);padding-left:6px;font-variant-numeric:tabular-nums;}

.sp2-lanes{position:relative;padding-top:12px;}
.sp2-lane{position:relative;margin-bottom:8px;}
.sp2-grid{position:absolute;inset:0;display:flex;pointer-events:none;}
.sp2-grid-col{flex-shrink:0;border-left:1px solid color-mix(in oklab,var(--fp-outline-1) 55%,transparent);}

/* the order card — board card's shape and stack levels */
.sp2-card{position:absolute;top:0;height:auto;background:var(--fp-surface-1b);border:1px solid var(--fp-outline-1);border-radius:var(--r-lg);padding:10px 12px;display:flex;flex-direction:column;gap:0;cursor:pointer;overflow:hidden;box-shadow:0 1px 2px 0 rgba(3,4,5,.06);transition:border-color .12s,box-shadow .12s,background .12s;}
.sp2-card:hover{border-color:var(--fp-outline-2);box-shadow:0 4px 8px -2px rgba(3,4,5,.12),0 2px 4px -2px rgba(3,4,5,.08);}
.sp2-card.sel{border-color:var(--fp-selected-border);background:var(--fp-selected);}
.sp2-card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;row-gap:6px;}
.sp2-ord{font-size:14px;font-weight:600;color:var(--fp-ink-1);white-space:nowrap;font-variant-numeric:tabular-nums;}
.sp2-time-lbl{margin-left:auto;font-size:12px;color:var(--fp-ink-3);white-space:nowrap;font-variant-numeric:tabular-nums;}
.sp2-ship{font-size:13px;font-weight:500;color:var(--fp-ink-3);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp2-addr{font-size:12px;color:var(--fp-ink-3);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;opacity:.85;}
.sp2-prods{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;}
.sp2-chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:9999px;background:var(--chip);font-size:12px;color:var(--fp-ink-1);white-space:nowrap;}
.sp2-chip-q{color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}
.sp2-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.sp2-card-foot{display:flex;align-items:center;gap:7px;}

/* pills: kind colour at 10%, text the kind colour, no border */
.sp2-pill{display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:9999px;font-size:12px;font-weight:400;white-space:nowrap;}
.sp2-pill-planned{background:color-mix(in oklab,var(--status-success) 10%,transparent);color:var(--status-success);}
.sp2-pill-unplanned{background:color-mix(in oklab,var(--status-caution) 10%,transparent);color:var(--status-caution);}
/* an order that came out of a split, or had one taken out of it */
.sp2-pill-split{background:var(--chip);color:var(--fp-ink-2);}
.sp2-type{font-size:10px;font-weight:600;color:var(--fp-ink-3);text-transform:uppercase;letter-spacing:0.12em;white-space:nowrap;}

.sp2-empty{padding:44px 16px;text-align:center;font-size:14px;color:var(--fp-ink-3);}

/* ── Vertical timeline ────────────────────────────────────
   Same orders, same cards; time runs down a rail instead of across the top,
   so the column needs width for one card, not for hours. */
.sp2-vt{padding:12px 16px 20px;position:relative;}
.sp2-vt-rail{position:absolute;left:62px;top:0;bottom:0;width:1px;background:var(--fp-outline-1);}
.sp2-vrow{position:relative;display:flex;gap:14px;margin-bottom:10px;}
.sp2-vtime{width:48px;flex-shrink:0;text-align:right;padding-top:10px;font-size:12px;color:var(--fp-ink-3);font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums;}
.sp2-vnode{position:absolute;left:58px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--fp-surface-1b);border:2px solid var(--status-neutral);z-index:1;}
.sp2-vrow.planned .sp2-vnode{border-color:var(--status-success);}
.sp2-vrow.unplanned .sp2-vnode{border-color:var(--status-caution);}
.sp2-vgap{position:relative;height:22px;margin:0 0 10px 76px;display:flex;align-items:center;font-size:12px;color:var(--fp-ink-3);opacity:.8;}
.sp2-vcard{flex:1;min-width:0;margin-left:22px;}

/* ── No timeline — the orders, in the order the day runs them ── */

.sp2-flow .sp2-card{position:static;width:auto;height:auto;min-height:0;}
.sp2-flow .sp2-addr{-webkit-line-clamp:1;}

/* ── Column 2 ─────────────────────────────────────────────── */
.sp2-unit-row{display:flex;align-items:flex-start;min-height:100%;}
.sp2-sec{padding:16px;min-width:0;}
.sp2-sec-drv{flex:0 0 clamp(300px,37%,392px);border-right:1px solid var(--fp-stroke-hairline);align-self:stretch;}
.sp2-sec-trk{flex:1;min-width:0;}
.sp2-sec-lbl{font-size:10px;font-weight:600;color:var(--fp-ink-3);text-transform:uppercase;letter-spacing:0.14em;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.sp2-sec-lbl::after{content:'';flex:1;height:1px;background:var(--fp-stroke-hairline);}

.sp2-state{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;border-radius:9999px;font-size:12px;font-weight:500;white-space:nowrap;}
.sp2-state.on-duty{background:color-mix(in oklab,var(--status-success) 10%,transparent);color:var(--status-success);}
.sp2-state.off-duty{background:var(--muted);color:var(--status-neutral);}
.sp2-state.driving{background:color-mix(in oklab,var(--status-info) 10%,transparent);color:var(--status-info);}
.sp2-state::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
/* the CTA is --primary, near-black. Brand orange is the mark and the ring. */
.sp2-view{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:none;border-radius:var(--r-md);background:var(--primary);color:var(--primary-foreground);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;}
.sp2-view:hover{background:color-mix(in oklab,var(--primary) 88%,#fff);}

.sp2-truck{background:var(--fp-surface-1b);border:1px solid var(--fp-outline-1);border-radius:var(--r-lg);overflow:hidden;}
.sp2-truck-top{padding:14px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--fp-stroke-hairline);}
.sp2-truck-ico{width:32px;height:32px;border-radius:var(--r-md);background:var(--fp-card-1);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sp2-truck-id{font-size:16px;line-height:24px;font-weight:600;color:var(--fp-ink-1);}
.sp2-truck-sub{font-size:13px;color:var(--fp-ink-3);margin-top:1px;}
.sp2-truck-cap{margin-left:auto;text-align:right;}
.sp2-truck-pct{font-size:18px;line-height:28px;font-weight:600;color:var(--fp-ink-1);font-variant-numeric:tabular-nums;}
.sp2-truck-pct-lbl{font-size:12px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}

.full .sp2-comp-pct,.full .sp2-comp-word{color:var(--status-success);}
.partial .sp2-comp-pct,.partial .sp2-comp-word{color:var(--status-caution);}
.empty-c .sp2-comp-pct,.empty-c .sp2-comp-word{color:var(--status-neutral);}

.sp2-none{padding:36px 16px;text-align:center;font-size:14px;color:var(--fp-ink-3);line-height:1.6;}

/* ── Hours of service ─────────────────────────────────────
   Four clocks on every lane, the binding one marked. The colours are the
   Samsara dial colours: green, amber from a fifth left, red near violation. */
.sp2-hos{margin-top:8px;padding:6px 7px 7px;border-radius:6px;background:var(--fp-surface-1a);border:1px solid var(--fp-outline-1);cursor:pointer;}
.sp2-hos:hover{background:var(--fp-row-hover);}
.sp2-hos.warn{border-color:color-mix(in oklab,var(--status-caution) 38%,var(--fp-outline-1));}
.sp2-hos.bad{border-color:color-mix(in oklab,var(--status-failed) 45%,var(--fp-outline-1));}
.sp2-hos-top{display:flex;align-items:center;gap:5px;margin-bottom:5px;}
.sp2-hos-ttl{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--fp-ink-1);}
.sp2-hos-src{font-size:9px;color:var(--fp-ink-3);padding:0 4px;height:13px;line-height:13px;border-radius:4px;background:var(--chip);}
.sp2-hos-go{margin-left:auto;font-size:10px;font-weight:500;color:var(--status-info);text-decoration:underline;text-underline-offset:2px;}
.sp2-hos-row{display:grid;grid-template-columns:1fr 1fr;gap:5px 8px;}
.sp2-hos-c{min-width:0;}
.sp2-hos-c-top{display:flex;align-items:baseline;gap:3px;}
.sp2-hos-c-l{font-size:10px;font-weight:500;color:var(--fp-ink-3);white-space:nowrap;}
.sp2-hos-c-v{font-size:10px;font-weight:600;color:var(--fp-ink-1);font-variant-numeric:tabular-nums;margin-left:auto;}
.sp2-hos-c.bind .sp2-hos-c-l,.sp2-hos-c.bind .sp2-hos-c-v{color:var(--fp-ink-1);}
.sp2-hos-c.bind .sp2-hos-c-l{text-decoration:underline;text-underline-offset:2px;}
.sp2-hos-bar{height:3px;border-radius:2px;background:var(--fp-outline-1);margin-top:3px;overflow:hidden;}
.sp2-hos-bar>i{display:block;height:100%;border-radius:2px;background:var(--status-success);}
.sp2-hos-c.warn .sp2-hos-bar>i{background:var(--status-caution);}
.sp2-hos-c.bad .sp2-hos-bar>i{background:var(--status-failed);}
.sp2-hos-c.warn .sp2-hos-c-v{color:var(--status-caution);}
.sp2-hos-c.bad .sp2-hos-c-v{color:var(--status-failed);}

/* the detail sheet */
#sp2HosScrim{position:fixed;inset:0;background:rgba(3,4,5,.28);z-index:210;opacity:0;pointer-events:none;transition:opacity .16s ease;}
#sp2HosScrim.on{opacity:1;pointer-events:auto;}
#sp2HosSheet{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:calc(100vw - 56px);z-index:211;background:var(--fp-surface-1b);border-left:1px solid var(--fp-outline-1);box-shadow:-12px 0 36px rgba(3,4,5,.14);transform:translateX(100%);transition:transform .18s ease;display:flex;flex-direction:column;}
#sp2HosSheet.on{transform:none;}
#sp2HosSheet[data-size="order"]{width:880px;}
.sp2-hos-hd{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--fp-outline-1);flex-shrink:0;}
.sp2-hos-hd-t{font-size:14px;font-weight:600;}
.sp2-hos-x{margin-left:auto;width:26px;height:26px;border:none;background:transparent;border-radius:4px;cursor:pointer;color:var(--fp-ink-3);display:flex;align-items:center;justify-content:center;}
.sp2-hos-x:hover{background:var(--fp-emphasis);}
#sp2HosBody{flex:1;overflow-y:auto;padding:18px 20px 28px;}

/* ── the sheets ───────────────────────────────────────── */
.sp2-sh-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start;}
.sp2-sh-main{min-width:0;}
.sp2-sh-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.sp2-sh-ttl{font-size:16px;font-weight:600;color:var(--fp-ink-1);}
.sp2-sh-addr{font-size:12px;color:var(--fp-ink-3);margin-top:4px;}
.sp2-sh-facts{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13px;color:var(--fp-ink-3);}
.sp2-sh-facts span+span{border-left:1px solid var(--fp-outline-2);padding-left:12px;}
.sp2-sh-facts span{font-variant-numeric:tabular-nums;}
.sp2-sh-tbl{border:1px solid var(--fp-outline-1);border-radius:var(--r-md);overflow:hidden;}
.sp2-sh-row{display:flex;align-items:center;gap:10px;padding:8px 11px;font-size:13px;
  border-bottom:1px solid var(--fp-stroke-hairline);}
.sp2-sh-row:last-child{border-bottom:none;}
.sp2-sh-c{flex:0 0 58px;font-size:12px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}
.sp2-sh-p{flex:1;min-width:0;display:flex;align-items:center;gap:7px;color:var(--fp-ink-1);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sp2-sh-p .sp2-pill{height:18px;padding:0 8px;font-size:11px;}
.sp2-sh-empty{color:var(--fp-ink-3);}
.sp2-sh-q{margin-left:auto;flex-shrink:0;font-size:13px;font-weight:500;color:var(--fp-ink-1);
  font-variant-numeric:tabular-nums;}

/* the rail: what the record computes, never what you typed */
.sp2-rail{display:flex;flex-direction:column;gap:24px;position:sticky;top:0;min-width:0;}
.sp2-sum{border-radius:14px;padding:4px;
  background:linear-gradient(135deg,color-mix(in oklab,var(--accent-violet) 34%,var(--fp-surface-1a)),
    color-mix(in oklab,#f2b5b5 44%,var(--fp-surface-1a)));}
.sp2-sum-t{font-size:16px;font-weight:600;padding:8px 12px 10px;}
.sp2-sum-in{background:var(--fp-surface-1b);border:1px solid var(--fp-stroke-hairline);
  border-radius:var(--r-lg);padding:12px;}
.sp2-rr{display:flex;align-items:baseline;gap:12px;padding:4px 0;}
.sp2-rr dt{font-size:13px;color:var(--fp-ink-1);min-width:0;}
.sp2-rr dd{margin-left:auto;font-size:13px;color:var(--fp-ink-3);text-align:right;
  font-variant-numeric:tabular-nums;}
.sp2-rr-rule{border-top:1px dashed var(--fp-stroke-hairline);margin:9px 0 4px;}
.sp2-rr.tot dt{font-size:16px;font-weight:500;}
.sp2-rr.tot dd{font-size:16px;font-weight:600;color:var(--fp-ink-1);}
.sp2-railcard{border:1px solid var(--fp-stroke-hairline);border-radius:var(--r-lg);overflow:hidden;}
.sp2-railcard-h{padding:9px 14px;font-size:14px;font-weight:500;color:var(--fp-ink-3);
  border-bottom:1px solid var(--fp-stroke-hairline);}
.sp2-railcard-b{padding:12px 14px;display:flex;flex-direction:column;gap:12px;}
.sp2-act{display:flex;gap:10px;align-items:flex-start;}
.sp2-act-m{width:9px;height:9px;border-radius:50%;margin-top:4px;flex-shrink:0;
  border:2px solid var(--fp-outline-2);background:var(--fp-surface-1b);}
.sp2-act-w{font-size:13px;color:var(--fp-ink-1);line-height:1.4;}
.sp2-act-s{font-size:12px;color:var(--fp-ink-3);margin-top:2px;}

.sp2-hos-who{display:flex;align-items:center;gap:10px;}
.sp2-av.lg{width:34px;height:34px;font-size:12px;}
.sp2-hos-nm{font-size:14px;font-weight:600;}
.sp2-hos-sub{font-size:11px;color:var(--fp-ink-3);margin-top:2px;}
.sp2-hos-note{margin-top:12px;padding:8px 10px;border-radius:6px;background:color-mix(in oklab,var(--status-info) 7%,transparent);font-size:11px;line-height:1.5;color:var(--fp-ink-3);}
.sp2-dials{display:flex;gap:6px;margin-top:16px;}
.sp2-dial{flex:1 1 0;text-align:center;color:var(--status-success);}
.sp2-dial.warn{color:var(--status-caution);}
.sp2-dial.bad{color:var(--status-failed);}
.sp2-dial svg{margin:0 auto;display:block;}
.sp2-dial-v{font-size:13px;font-weight:600;color:var(--fp-ink-1);margin-top:-42px;font-variant-numeric:tabular-nums;}
.sp2-dial-l{font-size:11px;font-weight:500;color:var(--fp-ink-1);margin-top:26px;}
.sp2-dial-max{font-size:10px;color:var(--fp-ink-3);margin-top:1px;}
.sp2-hos-bind{margin-top:14px;padding:8px 10px;border-radius:6px;font-size:12px;font-weight:500;background:color-mix(in oklab,var(--status-success) 10%,transparent);color:var(--status-success);}
.sp2-hos-bind.warn{background:color-mix(in oklab,var(--status-caution) 11%,transparent);color:var(--status-caution);}
.sp2-hos-bind.bad{background:color-mix(in oklab,var(--status-failed) 11%,transparent);color:var(--status-failed);}
.sp2-hos-sect{margin-top:22px;margin-bottom:9px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fp-ink-3);}
.sp2-cyc-bar{height:7px;border-radius:4px;background:var(--fp-outline-1);overflow:hidden;}
.sp2-cyc-bar>i{display:block;height:100%;background:var(--status-caution);}
.sp2-cyc-ln{margin-top:7px;font-size:12px;color:var(--fp-ink-1);}
.sp2-hos-fine{margin-top:5px;font-size:11px;line-height:1.5;color:var(--fp-ink-3);}
.sp2-g{margin-bottom:6px;}
.sp2-g-lbl{font-size:7px;font-weight:600;fill:var(--fp-ink-3);}
.sp2-g-hr{font-size:7px;fill:var(--fp-ink-3);text-anchor:middle;}
.sp2-dl{border:1px solid var(--fp-outline-1);border-radius:6px;overflow:hidden;}
.sp2-dl-row{display:flex;align-items:center;gap:8px;padding:6px 9px;font-size:11px;border-bottom:1px solid var(--fp-stroke-hairline);}
.sp2-dl-row:last-child{border-bottom:none;}
.sp2-dl-t{color:var(--fp-ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;}
.sp2-dl-w{color:var(--fp-ink-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sp2-dl-d{margin-left:auto;color:var(--fp-ink-3);white-space:nowrap;}
.sp2-duty{flex-shrink:0;min-width:28px;text-align:center;padding:0 5px;height:16px;line-height:16px;border-radius:4px;font-size:9px;font-weight:700;letter-spacing:.03em;background:var(--chip);color:var(--fp-ink-3);}
.sp2-duty.D{background:color-mix(in oklab,var(--status-success) 15%,transparent);color:var(--status-success);}
.sp2-duty.ON{background:color-mix(in oklab,var(--status-caution) 15%,transparent);color:var(--status-caution);}
.sp2-duty.SB{background:color-mix(in oklab,var(--status-failed) 13%,transparent);color:var(--status-failed);}
.sp2-duty.big{margin-left:auto;height:22px;line-height:22px;font-size:11px;padding:0 9px;}
.sp2-hos-none{padding:10px;font-size:11px;color:var(--fp-ink-3);}
#sp2Toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:var(--r-md);font-size:14px;font-weight:500;z-index:200;display:none;white-space:nowrap;background:var(--primary);color:var(--primary-foreground);box-shadow:0 8px 24px rgba(3,4,5,.18);}
/* A refusal cannot look like a receipt: it keeps the failed colour on its
   edge, runs to two lines, and stays up twice as long. */
#sp2Toast.warn{white-space:pre-line;text-align:left;line-height:1.45;
  border-left:3px solid var(--status-failed);}


/* ── Header tools: the view switch, and everything else behind one icon ── */
/* a narrow column cannot hold every control on one line, so let them stack
   rather than run off the edge */
.sp2-hdr-tools{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap;justify-content:flex-end;row-gap:6px;}
.sp2-ico-btn{position:relative;width:36px;height:36px;border:1px solid var(--fp-stroke-field);border-radius:var(--r-md);background:var(--fp-surface-1b);color:var(--fp-ink-1);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sp2-ico-btn:hover{background:var(--fp-emphasis);}
.sp2-ico-btn.on{border-color:var(--fp-selected-border);background:var(--fp-selected);}
.sp2-ico-dot{display:none;position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--brand);border:2px solid var(--fp-surface-1b);}
.sp2-search{height:36px;flex:1;min-width:0;max-width:280px;background:var(--fp-surface-1b);border:1px solid var(--fp-stroke-field);border-radius:var(--r-md);color:var(--fp-ink-1);font-family:inherit;font-size:13px;padding:0 12px;outline:none;}
.sp2-search:focus{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklab,var(--ring) 50%,transparent);}

/* The columns clip their own overflow, so a popover has to escape them. */
.sp2-pop{display:none;position:fixed;z-index:120;min-width:280px;background:var(--fp-surface-1b);border:1px solid var(--fp-outline-1);border-radius:var(--r-lg);box-shadow:0 8px 24px rgba(3,4,5,.14),0 2px 6px rgba(3,4,5,.08);padding:14px;}
.sp2-pop.on{display:block;}
.sp2-pop-row{display:flex;flex-direction:column;gap:7px;margin-bottom:12px;}
.sp2-pop-row .sp2-seg{align-self:flex-start;}
.sp2-pop-foot{padding-top:11px;border-top:1px solid var(--fp-stroke-hairline);}
.sp2-pop-ttl{font-size:10px;font-weight:600;color:var(--fp-ink-3);text-transform:uppercase;letter-spacing:.14em;margin-bottom:9px;}
.sp2-pop-item{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:9px 10px;border:1px solid var(--fp-outline-1);border-radius:var(--r-md);background:var(--fp-surface-1b);font-family:inherit;cursor:pointer;margin-bottom:6px;}
.sp2-pop-item:hover{background:var(--fp-emphasis);}
.sp2-pop-item-id{font-size:14px;font-weight:600;color:var(--fp-ink-1);}
.sp2-pop-item-sub{font-size:12px;color:var(--fp-ink-3);}
.sp2-link{border:none;background:none;padding:0;font-family:inherit;font-size:13px;color:var(--fp-ink-3);text-decoration:underline;cursor:pointer;}
.sp2-link:hover{color:var(--fp-ink-1);}

/* ── Section 1: the roster ─────────────────────────────── */
.sp2-unit-row{display:flex;align-items:stretch;flex:1;min-height:0;}
.sp2-sec{padding:16px;min-width:0;display:flex;flex-direction:column;min-height:0;}
.sp2-sec-drv{flex:0 0 clamp(268px,30%,330px);border-right:1px solid var(--fp-stroke-hairline);}
.sp2-sec-trk{flex:1;min-width:0;overflow-y:auto;}
.sp2-drv-list{flex:1;overflow-y:auto;min-height:0;margin:0 -4px;padding:0 4px;}
.sp2-grp{position:sticky;top:0;z-index:2;background:var(--fp-surface-1a);display:flex;align-items:center;gap:8px;padding:8px 0 6px;font-size:10px;font-weight:600;color:var(--fp-ink-3);text-transform:uppercase;letter-spacing:.14em;}
.sp2-drow{background:var(--fp-surface-1b);border:1px solid var(--fp-outline-1);border-radius:var(--r-lg);padding:10px 12px;margin-bottom:8px;cursor:pointer;}
.sp2-drow:hover{background:var(--fp-emphasis);}
.sp2-drow.on{border-color:var(--fp-selected-border);background:var(--fp-selected);}
.sp2-drow-top{display:flex;align-items:center;gap:8px;}
.sp2-drow-chev{color:var(--fp-ink-3);display:flex;flex-shrink:0;transition:transform .15s;}
.sp2-drow.on .sp2-drow-chev{transform:rotate(90deg);}
.sp2-drow-name{font-size:14px;font-weight:600;color:var(--fp-ink-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp2-drow-top .sp2-state{margin-left:auto;flex-shrink:0;}
.sp2-drow-sub{font-size:12px;color:var(--fp-ink-3);margin-top:4px;font-variant-numeric:tabular-nums;}
.sp2-drow-sync{font-size:12px;color:var(--fp-ink-3);margin-top:2px;opacity:.85;}
.sp2-drow-open{margin-top:10px;padding-top:10px;border-top:1px solid var(--fp-stroke-hairline);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sp2-drow-meta{font-size:12px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}
.sp2-drow-open .sp2-view{margin-left:auto;height:32px;padding:0 12px;font-size:13px;}

/* ── Section 2: the rig, drawn ─────────────────────────── */
.sp2-veh-wrap{position:relative;overflow-x:auto;padding:4px 14px 12px;border-bottom:1px solid var(--fp-stroke-hairline);transition:background .12s;}
.sp2-veh-wrap.sp2-over{background:var(--fp-selected);}
.sp2-veh{position:relative;display:flex;align-items:flex-end;padding:18px 0 16px;min-width:min-content;}
.sp2-cabwrap{position:relative;flex:0 0 54px;}
.sp2-cab{height:58px;border:2px solid var(--fp-ink-1);border-right:none;border-radius:9px 0 0 4px;background:var(--fp-card-2);position:relative;}
.sp2-cab-win{position:absolute;left:7px;right:7px;top:7px;height:19px;border-radius:4px 7px 0 0;background:var(--fp-surface-1b);border:1px solid var(--fp-outline-2);}
.sp2-tankwrap{position:relative;flex-basis:0;min-width:min-content;}
.sp2-tank{display:flex;height:118px;border:2px solid var(--fp-ink-1);border-radius:4px 11px 11px 4px;overflow:hidden;background:var(--fp-surface-1b);}
.sp2-wheel{position:absolute;bottom:-11px;width:22px;height:22px;border-radius:50%;background:var(--fp-surface-1b);border:3px solid var(--fp-ink-1);}
.sp2-hitch{flex:0 0 20px;height:6px;margin-bottom:28px;background:var(--fp-ink-1);border-radius:4px;}
.sp2-veh-tag{position:absolute;left:0;right:0;top:-15px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fp-ink-3);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}

/* A compartment is as wide as it is big, and the load rises inside it. */
.sp2-cmp{position:relative;flex-basis:0;min-width:86px;border-right:2px solid var(--fp-ink-1);overflow:hidden;}
.sp2-cmp:last-child{border-right:none;}
.sp2-cmp.sp2-over{outline:2px dashed var(--brand);outline-offset:-3px;}
.sp2-cmp-liq{position:absolute;left:0;right:0;bottom:0;opacity:.85;transition:height .3s ease;}
.sp2-cmp-txt{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:5px 4px;}
.sp2-cmp-c{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--fp-ink-1);text-align:center;}
/* the plate keeps the numbers off the product colour, whatever colour it is */
.sp2-cmp-plate{margin-top:auto;background:rgba(255,255,255,.9);border-radius:6px;padding:4px 2px 5px;text-align:center;}
.sp2-cmp-p{font-size:11px;font-weight:600;color:var(--fp-ink-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp2-cmp-p.empty{color:var(--fp-ink-3);font-weight:400;}
.sp2-cmp-q{font-size:11px;color:var(--fp-ink-1);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp2-cmp-q span{color:var(--fp-ink-3);}
.sp2-cmp-s{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:2px;line-height:1.3;}
.sp2-cmp-s.full{color:var(--status-success);}
.sp2-cmp-s.partial{color:var(--status-caution);}
.sp2-cmp-s.empty-c{color:var(--fp-ink-3);}

.sp2-drop-hint{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:4px;padding:3px 11px;border-radius:9999px;background:var(--fp-selected);color:var(--fp-selected-strong);font-size:11px;font-weight:600;pointer-events:none;white-space:nowrap;}
.sp2-body.dragging .sp2-drop-hint{display:block;}
.sp2-body.dragging .sp2-veh-wrap{outline:2px dashed var(--fp-selected-border);outline-offset:-6px;}

.sp2-veh-scroll{position:relative;}
.sp2-veh-fade{position:absolute;top:0;bottom:0;right:0;width:44px;pointer-events:none;opacity:0;transition:opacity .15s;background:linear-gradient(to right,rgba(255,255,255,0),var(--fp-surface-1b));}
.sp2-veh-scroll.more .sp2-veh-fade{opacity:1;}
.sp2-rig-foot{padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.sp2-trl-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--fp-stroke-field);border-radius:var(--r-md);background:var(--fp-surface-1b);color:var(--fp-ink-1);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;}
.sp2-trl-btn:hover{background:var(--fp-emphasis);}
.sp2-rig-trl{font-size:13px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}


/* ══ V2 — a lane per driver ═══════════════════════════════
   V1 asks you to choose a driver and then shows one rig. A lane shows every
   rig at once, so an order can go straight to whichever has room. */
.sp2-lanes-wrap{flex:1;overflow-y:auto;min-height:0;}
.sp2-ln-hdr{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:7px 16px;background:var(--fp-surface-1b);border-bottom:1px solid var(--fp-stroke-hairline);font-size:10px;font-weight:600;color:var(--fp-ink-3);text-transform:uppercase;letter-spacing:.14em;}
.sp2-ln-hdr-drv{flex:0 0 264px;}
.sp2-ln-hdr-sum{margin-left:auto;font-variant-numeric:tabular-nums;}

.sp2-ln{display:flex;gap:10px;padding:6px 16px;cursor:pointer;}
.sp2-ln:hover{position:relative;z-index:5;}
/* the chosen lane lifts off the list rather than tinting */
.sp2-ln.on{position:relative;z-index:2;}
.sp2-ln.sp2-over .sp2-ln-day{background:var(--fp-selected);border-color:var(--fp-selected-border);outline:2px dashed var(--fp-selected-border);outline-offset:-4px;}
/* off duty is dimmer ground, never dimmer ink — the words still have to read */
.sp2-ln.off-duty .sp2-ln-day{background:var(--fp-card-2);}

/* Who is driving is a card of its own, standing beside the truck's. */
.sp2-ln-drv{flex:0 0 264px;min-width:0;background:var(--fp-surface-1b);
  border:1px solid var(--fp-outline-1);border-radius:var(--r-lg);padding:10px 12px;
  box-shadow:0 1px 2px 0 rgba(3,4,5,.06);transition:box-shadow .12s,border-color .12s;}
.sp2-ln-drv-top{display:flex;align-items:center;gap:8px;}
.sp2-av{width:30px;height:30px;border-radius:50%;background:var(--fp-card-1);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--fp-ink-1);flex-shrink:0;}
.sp2-ln-name{font-size:14px;font-weight:600;color:var(--fp-ink-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp2-ln-drv .sp2-state{margin-top:7px;}
.sp2-ln-flags{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px;}
.sp2-ln-drv .sp2-state{margin-top:0;}
.sp2-hos-chip{display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:9999px;
  font-size:12px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums;}
.sp2-hos-chip.warn{background:color-mix(in oklab,var(--status-caution) 11%,transparent);color:var(--status-caution);}
.sp2-hos-chip.bad{background:color-mix(in oklab,var(--status-failed) 11%,transparent);color:var(--status-failed);}
.sp2-ln-drv-top .sp2-open{width:22px;height:22px;}
.sp2-open.sm{width:22px;height:22px;}
.sp2-ln-shift{font-size:12px;color:var(--fp-ink-3);margin-top:5px;font-variant-numeric:tabular-nums;}
.sp2-ln-sync{font-size:11px;color:var(--fp-ink-3);margin-top:2px;}

/* ── The day, down the driver card ─────────────────────────
   Once a rig has orders, the driver card stops being only who-and-when and
   becomes the run: each stop in the order it happens, when they are expected
   there, and whether that lands inside the window the customer was given.
   The rail is the day; the dot carries the verdict; the line under it says
   the verdict in words, because thirty coloured dots are not a reading. */
.sp2-rt{margin-top:10px;padding-top:9px;border-top:1px solid var(--fp-outline-1);}
.sp2-rt-hd{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--fp-ink-3);margin-bottom:5px;}
.sp2-rt-n{margin-left:auto;font-variant-numeric:tabular-nums;}
/* Point to point: the dot and the thread between them carry the run, so a row
   needs no box of its own. Hovering underlines where it is going; the stop
   that is selected fills its point. */
.sp2-rt-row{position:relative;display:block;width:100%;text-align:left;
  padding:5px 6px 5px 19px;border:none;background:none;font-family:inherit;
  cursor:pointer;}
.sp2-rt-row::before{content:'';position:absolute;left:4.5px;top:17px;bottom:-5px;width:1px;background:var(--fp-outline-1);}
.sp2-rt-row:last-child::before{display:none;}
.sp2-rt-row:hover .sp2-rt-ship{text-decoration:underline;text-underline-offset:2px;}
.sp2-rt-row.sel .sp2-rt-dot{background:var(--fp-selected-border);border-color:var(--fp-selected-border);}
.sp2-rt-row.sel .sp2-rt-ship{color:var(--fp-ink-1);}
/* every stop can be taken off the rig, from the stop itself */
.sp2-rt-x{flex-shrink:0;width:20px;height:20px;margin:-2px -4px -2px 0;display:inline-flex;
  align-items:center;justify-content:center;border:none;border-radius:var(--r-sm,6px);
  background:transparent;color:var(--fp-ink-3);opacity:0;
  transition:opacity .12s linear,background .12s,color .12s;}
.sp2-rt-row:hover .sp2-rt-x,.sp2-rt-x:focus-visible{opacity:1;}
.sp2-rt-x:hover{background:color-mix(in oklab,var(--status-failed) 14%,transparent);
  color:var(--status-failed);}
.sp2-rt-dot{position:absolute;left:0;top:8px;width:10px;height:10px;border-radius:50%;
  background:var(--fp-surface-1b);border:2px solid var(--status-neutral);}
.sp2-rt-row.ok .sp2-rt-dot{border-color:var(--status-success);}
.sp2-rt-row.early .sp2-rt-dot{border-color:var(--status-info);}
.sp2-rt-row.late .sp2-rt-dot{border-color:var(--status-failed);}
.sp2-rt-top{display:flex;align-items:baseline;gap:8px;}
.sp2-rt-ship{flex:1;min-width:0;font-size:12px;font-weight:600;color:var(--fp-ink-1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp2-rt-eta{flex-shrink:0;font-size:12px;color:var(--fp-ink-2);font-variant-numeric:tabular-nums;}
.sp2-rt-note{display:block;margin-top:1px;font-size:11px;color:var(--fp-ink-3);
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp2-rt-id{color:var(--fp-ink-3);}
.sp2-rt-row.late .sp2-rt-v{color:var(--status-failed);}
.sp2-rt-more{display:block;width:100%;margin-left:19px;padding:3px 0;border:none;background:none;
  font-family:inherit;font-size:11px;color:var(--fp-ink-3);text-align:left;cursor:pointer;}
.sp2-rt-more:hover{color:var(--fp-ink-1);}
/* the line across the run where the rig stops having room */
.sp2-rt-cap{display:flex;align-items:center;gap:7px;margin:5px 0 5px 19px;
  font-size:11px;font-weight:500;color:var(--status-failed);}
.sp2-rt-cap::before{content:'';flex:0 0 14px;height:2px;border-radius:2px;
  background:var(--status-failed);}
.sp2-rt-cap::after{content:'';flex:1;height:1px;background:color-mix(in oklab,var(--status-failed) 45%,transparent);}
.sp2-rt-end{margin:4px 0 0 19px;font-size:11px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}
.sp2-rt-over{color:var(--status-failed);}

.sp2-ln-day{flex:1;min-width:0;background:var(--fp-surface-1b);border:1px solid var(--fp-outline-1);border-radius:var(--r-lg);padding:10px 12px;box-shadow:0 1px 2px 0 rgba(3,4,5,.06);transition:box-shadow .12s,border-color .12s;}
.sp2-ln:hover .sp2-ln-drv,.sp2-ln:hover .sp2-ln-day{border-color:var(--fp-outline-2);box-shadow:0 4px 8px -2px rgba(3,4,5,.12),0 2px 4px -2px rgba(3,4,5,.08);}
.sp2-ln.on .sp2-ln-drv,.sp2-ln.on .sp2-ln-day{border-color:var(--fp-selected-border);box-shadow:0 4px 8px -2px rgba(3,4,5,.14),0 2px 4px -2px rgba(3,4,5,.08);}
.sp2-ln-truck{display:flex;align-items:center;gap:9px;flex-wrap:wrap;color:var(--fp-ink-3);}
.sp2-ln-truck-id{font-size:14px;font-weight:600;color:var(--fp-ink-1);}
.sp2-ln-comps{font-size:12px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}
.sp2-ln-cap{margin-left:auto;font-size:12px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;}
.sp2-ln-cap b{font-size:14px;font-weight:600;color:var(--fp-ink-1);}
.sp2-trl-btn.sm{height:26px;padding:0 9px;font-size:12px;}

.sp2-ln-stops{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px;}
.sp2-ln-stops-lbl{font-size:12px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;margin-right:2px;}
/* an order on the rig: the pill, and the fit chip docked to its end */
.sp2-stopw{display:inline-flex;align-items:center;cursor:pointer;white-space:nowrap;}
.sp2-stop{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;
  border-radius:9999px;background:var(--chip);font-size:12px;color:var(--fp-ink-1);
  font-variant-numeric:tabular-nums;white-space:nowrap;}
.sp2-stopw:hover .sp2-stop{background:var(--fp-emphasis-hover);}
.sp2-stopw.sel .sp2-stop{background:var(--fp-selected);box-shadow:inset 0 0 0 1px var(--fp-selected-border);}
.sp2-stop-t{color:var(--fp-ink-3);}
.sp2-stop b{font-weight:400;color:var(--fp-ink-3);}
/* How much of the compartments it needs the order actually fills — its own
   chip, docked to the order's. Its left edge is the order chip's rounded end
   cut back out of it: a 13px disc centred 5px left of this chip's box, which
   is the pill's own 12px arc plus the 1px of air between them, so the gap
   reads as 1px the whole way round rather than closing to a wedge. The right
   end is an ordinary rounded chip. The box overlaps the pill by 7px for that
   to be possible, and the mask takes those 7px back off. */
.sp2-stop-fit{margin-left:-7px;height:24px;display:inline-flex;align-items:center;
  padding:0 11px 0 15px;border-radius:0 9999px 9999px 0;background:var(--fp-emphasis);
  font-size:12px;color:var(--fp-ink-2);font-variant-numeric:tabular-nums;
  -webkit-mask-image:radial-gradient(circle 13px at -5px 50%,transparent 13px,#000 13.5px);
  mask-image:radial-gradient(circle 13px at -5px 50%,transparent 13px,#000 13.5px);}
/* The fit chip carries the verdict in the status colours every other verdict
   in the system uses: under half is poor, 80% and over is a load that is not
   driving air around. */
.sp2-stop-fit.low{background:color-mix(in oklab,var(--status-failed) 14%,var(--fp-surface-1b));
  color:color-mix(in oklab,var(--status-failed) 86%,#0b0d12);font-weight:600;}
.sp2-stop-fit.mid{background:color-mix(in oklab,var(--status-caution) 16%,var(--fp-surface-1b));
  color:color-mix(in oklab,var(--status-caution) 72%,#0b0d12);font-weight:600;}
.sp2-stop-fit.high{background:color-mix(in oklab,var(--status-success) 14%,var(--fp-surface-1b));
  color:color-mix(in oklab,var(--status-success) 84%,#0b0d12);font-weight:600;}
/* The best fit on the rig stays violet, as every highlight is, but it marks
   the ORDER — the fit chip is busy saying how good the fit is. The token
   carries its own fallback: this screen does not declare --accent-violet, and
   a bare var() would resolve to nothing and take the color-mix with it. */
.sp2-stopw.fit .sp2-stop{box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--accent-violet,#7c5cff) 48%,transparent);
  background:color-mix(in oklab,var(--accent-violet,#7c5cff) 10%,var(--fp-surface-1b));}
.sp2-stopw.fit.sel .sp2-stop{box-shadow:inset 0 0 0 1px var(--fp-selected-border);}
.sp2-stop-x{border:none;background:none;padding:0 0 0 3px;margin-right:-3px;font-family:inherit;
  font-size:14px;line-height:1;color:var(--fp-ink-3);}
.sp2-stop-x:hover{color:var(--status-failed);}
.sp2-stop-list{flex:1;min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.sp2-stop-none{font-size:12px;color:var(--fp-ink-3);}


/* ── the tanker, drawn ────────────────────────────────────
   Natural size, scrolled rather than scaled, so a compartment's numbers stay
   the same size whatever truck is under them. */
/* centred when it is narrower than the lane; `safe` so a long rig still
   starts at its nose instead of being clipped on the left */
.sp2-rig{position:relative;margin-top:10px;overflow-x:auto;padding-bottom:2px;display:flex;justify-content:center;justify-content:safe center;}
.sp2-sv{display:block;flex:none;}
/* Type inside the drawing is in DESIGN units and renders at TK.scale, so these
   are the rendered sizes divided by 0.68. All of it is the design's dark ink:
   a status colour would have to sit on whatever fuel is behind it. */
.sp2-sv text{font-family:inherit;text-anchor:middle;dominant-baseline:middle;fill:#242425;}
.sp2-sv-c{font-size:13px;font-weight:700;letter-spacing:.04em;opacity:.55;}
.sp2-sv-p{font-size:18px;font-weight:600;}
.sp2-sv-p.empty{font-weight:400;opacity:.5;}
.sp2-sv-q{font-size:16px;}
.sp2-sv-s{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.75;}
.sp2-sv-tag{font-size:13px;font-weight:600;letter-spacing:.09em;fill:var(--fp-ink-3);text-transform:uppercase;}

/* one box per vehicle, divided into compartments — not a row of loose tiles */
.sp2-bars{display:flex;gap:10px;margin-top:9px;height:52px;}
/* A lane you are not working in keeps its compartments — one short segment
   each, filled to its own level in its product's colour — so the shape of the
   load and the empty compartment still read, at a third of the height. */
.sp2-ln:not(.on) .sp2-bars{height:18px;margin-top:10px;gap:8px;}
.sp2-ln:not(.on) .sp2-barbox{border-width:1px;border-color:var(--fp-outline-1);border-radius:6px;}
.sp2-ln:not(.on) .sp2-bar2{border-right-width:1px;border-right-color:var(--fp-outline-1);min-width:14px;background:var(--fp-card-1);}
.sp2-ln:not(.on) .sp2-bar2-c,.sp2-ln:not(.on) .sp2-bar2-p{display:none;}
.sp2-barbox{flex:1;min-width:0;display:flex;border:1.5px solid var(--fp-outline-2);border-radius:var(--r-md);overflow:hidden;background:var(--fp-surface-1b);}
.sp2-bar2{position:relative;flex-basis:0;min-width:28px;border-right:1.5px solid var(--fp-outline-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden;}
.sp2-bar2:last-child{border-right:none;}
.sp2-bar2.sp2-over{box-shadow:inset 0 0 0 2px var(--brand);}
.sp2-bar2-fill{position:absolute;left:0;right:0;bottom:0;transition:height .3s ease;}
.sp2-bar2-c{position:relative;z-index:1;font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--fp-ink-1);opacity:.62;}
.sp2-bar2-p{position:relative;z-index:1;font-size:10px;font-weight:600;color:var(--fp-ink-1);max-width:100%;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp2-r2-chassis{height:5px;margin:0 12px 0 0;background:var(--fp-ink-1);border-radius:0 0 3px 3px;}
.sp2-r2-cabframe{height:5px;margin-left:5px;background:var(--fp-ink-1);}
.sp2-r2-axles{position:relative;height:20px;}
.sp2-r2-wheel{position:absolute;top:-2px;width:19px;height:19px;border-radius:50%;background:var(--fp-surface-1b);border:3px solid var(--fp-ink-1);}
.sp2-r2-hitch{flex:0 0 16px;flex-shrink:0;height:5px;margin-top:110px;background:var(--fp-ink-1);border-radius:4px;}
.sp2-r2-tag{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fp-ink-3);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}


/* ── Compact: a density, not a second drawing ─────────────
   The selected lane keeps the tanker whatever the density; the rest keep their
   bars and lose the writing, which you only need for the rig you are loading. */

/* ── where the driver is in their shift ─────────────────── */
.sp2-shift{margin-top:9px;padding-top:9px;border-top:1px solid var(--fp-stroke-hairline);}
.sp2-shift-top{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;}
.sp2-shift-win{font-size:12px;color:var(--fp-ink-1);font-weight:500;font-variant-numeric:tabular-nums;}
.sp2-shift-word{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fp-ink-3);}
.sp2-shift.running .sp2-shift-word{color:var(--status-success);}
.sp2-shift.over .sp2-shift-word{color:var(--status-failed);}
.sp2-shift-left{margin-left:auto;font-size:12px;font-weight:600;color:var(--fp-ink-1);font-variant-numeric:tabular-nums;white-space:nowrap;}
.sp2-shift-bar{position:relative;height:6px;border-radius:4px;background:var(--fp-card-1);margin-top:6px;overflow:visible;}
.sp2-shift-done{height:100%;border-radius:4px;background:var(--status-neutral);opacity:.45;}
.sp2-shift.running .sp2-shift-done{background:var(--status-success);opacity:.55;}
.sp2-shift.over .sp2-shift-done{background:var(--status-failed);opacity:.45;}
.sp2-shift-now{position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:var(--fp-ink-1);transform:translateX(-1.5px);}
.sp2-shift-sub{font-size:11px;color:var(--fp-ink-3);margin-top:5px;font-variant-numeric:tabular-nums;}
.sp2-ln-drv .sp2-link{margin-top:8px;display:inline-block;}

/* the truck name is the way to change it */
.sp2-ln-truck-id{display:inline-flex;align-items:center;gap:4px;border:none;background:none;padding:2px 4px;margin-left:-4px;border-radius:4px;font-family:inherit;font-size:14px;font-weight:600;color:var(--fp-ink-1);cursor:pointer;}
.sp2-ln-truck-id:hover{background:var(--fp-emphasis-hover);}
.sp2-ln-truck-id svg{opacity:.5;}

/* a compartment that has been picked up and is waiting to be put down */
.sp2-sv-held{fill:none;stroke:var(--brand);stroke-width:3;stroke-dasharray:7 5;}
.sp2-pop-scroll{max-height:300px;overflow-y:auto;margin:0 -4px;padding:0 4px;}
.sp2-pop-item.on{border-color:var(--fp-selected-border);background:var(--fp-selected);}
/* ── the grip between the columns, and a column on its own ── */
/* The grip stays a thin line, but the thing you have to hit is wider than the
   line — 7px is a miss as often as a catch. The ::before is the hit area and
   reaches past the divider on both sides without moving the layout. */
.sp2-split{flex:0 0 7px;cursor:col-resize;background:var(--fp-card-1);border-right:1px solid var(--fp-stroke-hairline);position:relative;z-index:6;touch-action:none;}
.sp2-split::before{content:'';position:absolute;top:0;bottom:0;left:-9px;right:-5px;cursor:col-resize;}
.sp2-split::after{content:'';position:absolute;top:50%;left:2px;width:3px;height:34px;margin-top:-17px;border-radius:2px;background:var(--fp-outline-2);pointer-events:none;}
.sp2-split:hover,.sp2-split.on{background:var(--fp-emphasis);}
.sp2-split:hover::after,.sp2-split.on::after{background:var(--brand);}
.sp2-ico-btn.sm{width:30px;height:30px;}
.sp2-body[data-only="orders"] .sp2-col-unit,
.sp2-body[data-only="orders"] .sp2-split,
.sp2-body[data-only="drivers"] .sp2-col-orders,
.sp2-body[data-only="drivers"] .sp2-split{display:none;}
.sp2-body[data-only="orders"] .sp2-col-orders,
.sp2-body[data-only="drivers"] .sp2-col-unit{flex:1 1 100% !important;}
.sp2-ln-stops{display:flex;align-items:center;gap:12px;}
.sp2-ln-stops-lbl{margin-left:auto;flex-shrink:0;}

/* more gallons than rig: say by how much, and offer the ways out */
.sp2-over-warn{margin-top:9px;padding:9px 11px;border-radius:var(--r-md);background:color-mix(in oklab,var(--status-failed) 9%,transparent);border:1px solid color-mix(in oklab,var(--status-failed) 30%,transparent);}
/* What the rig holds is a fact, in the ink every other fact is written in.
   What is over it is the warning, and only that part is red. */
.sp2-over-head{display:flex;align-items:center;gap:7px;font-size:12px;
  color:var(--fp-ink-1);font-variant-numeric:tabular-nums;}
.sp2-over-head b{font-weight:600;}
.sp2-over-head>svg{flex-shrink:0;color:var(--status-failed);}
.sp2-over-cap{margin-right:14px;}
.sp2-over-by{color:var(--status-failed);}
/* side by side: each is a short reading, and a column of them was a column of
   white space. They grow where they stand when the remove opens. */
.sp2-over-list{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;}
.sp2-over-row{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 3px 0 10px;
  border-radius:9999px;background:var(--fp-surface-1b);font-size:12px;
  font-variant-numeric:tabular-nums;}
.sp2-over-id{font-weight:500;color:var(--fp-ink-1);}
.sp2-over-q{color:var(--fp-ink-3);}
/* the remove sits on the right as an icon and says its name when reached for */
/* what a chip can do: an icon that says its name when it is reached for */
.sp2-over-act{height:24px;display:inline-flex;align-items:center;gap:0;
  padding:0 5px;border:none;border-radius:9999px;background:transparent;
  color:var(--fp-ink-3);font-family:inherit;font-size:12px;font-weight:500;
  white-space:nowrap;transition:background .12s,color .12s;}
.sp2-over-x{margin-left:auto;}
.sp2-over-x-l{max-width:0;overflow:hidden;opacity:0;
  transition:max-width .16s ease,opacity .12s linear,padding-left .16s ease;}
.sp2-over-act:hover .sp2-over-x-l{max-width:120px;opacity:1;padding-left:6px;}
.sp2-over-x:hover{background:color-mix(in oklab,var(--status-failed) 14%,transparent);
  color:var(--status-failed);}
/* splitting is not a removal, so it does not wear the removal's colour */
.sp2-over-s:hover{background:var(--fp-emphasis-hover);color:var(--fp-ink-1);}
.sp2-fix{height:28px;padding:0 11px;border:1px solid var(--fp-stroke-field);border-radius:var(--r-md);background:var(--fp-surface-1b);color:var(--fp-ink-1);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;font-variant-numeric:tabular-nums;}
.sp2-fix:hover{background:var(--fp-emphasis);border-color:var(--fp-ink-3);}
.sp2-move{min-width:290px;}
.sp2-move-range{width:100%;accent-color:var(--brand);margin:2px 0 10px;}
.sp2-move-row{display:flex;align-items:center;gap:8px;}
.sp2-move-row .sp2-time{width:88px;text-align:right;}
.sp2-move-of{font-size:11px;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}
.sp2-move-quick{display:flex;align-items:center;gap:6px;margin-top:11px;}
/* ── how much of this order the chosen rig could take ── */
/* The fit belongs beside the order number, not across the foot — it answers
   "is this one mine?", which is the head's question. */
.sp2-fit,.sp2-who{margin-left:auto;font-size:12px;color:var(--fp-ink-3);white-space:nowrap;
  font-variant-numeric:tabular-nums;}
.sp2-fit b{font-weight:600;color:var(--fp-ink-1);}
.sp2-fit.perfect{color:var(--status-success);font-weight:600;}
.sp2-fit.perfect b{color:var(--status-success);}
.sp2-fit.full b{color:var(--fp-ink-1);}
.sp2-fit.part{color:var(--status-caution);}
.sp2-fit.part b{color:var(--status-caution);}
.sp2-fit.none{color:var(--status-neutral);}
.sp2-card-top .sp2-open{margin-left:0;}
/* ranked by fit: no rail, no gaps — those are about time */
.sp2-vt.ranked .sp2-vrow{gap:10px;}
.sp2-vrow.ranked .sp2-vtime{width:auto;padding-top:11px;opacity:.75;}
.sp2-vrow.ranked .sp2-vnode{display:none;}
.sp2-vrow.ranked .sp2-vcard{margin-left:0;}
.sp2-rank{flex-shrink:0;width:20px;padding-top:10px;text-align:right;font-size:12px;font-weight:700;color:var(--fp-ink-3);font-variant-numeric:tabular-nums;}
.sp2-seg-btn:disabled{opacity:.4;cursor:not-allowed;}
.sp2-seg-btn:disabled:hover{background:transparent;color:var(--fp-ink-3);}
/* ── the order card ────────────────────────────────────── */
.sp2-card-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
/* the kind of order, as a letter: D delivery · E extraction · T transfer */
.sp2-kind{flex-shrink:0;width:18px;height:18px;border-radius:50%;background:var(--fp-card-1);color:var(--fp-ink-1);font-size:9px;font-weight:700;letter-spacing:0;display:flex;align-items:center;justify-content:center;}
.sp2-pill-blend{background:color-mix(in oklab,var(--status-info) 12%,transparent);color:var(--status-info);}
.sp2-chip.blend{box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--status-info) 45%,transparent);}
.sp2-prods{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;}

/* the driver tabs sit on the header line like everything else on it */

.sp2-col-hdr{align-items:stretch;}
/* ── the order card: who and where on the left, what on the right ── */
/* Three bands, grouped by space, no rules between them. */
.sp2-card-l{min-width:0;margin-top:10px;}
.sp2-card-r{min-width:0;margin-top:11px;display:grid;
  grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center;}
.sp2-card-r .sp2-chip{justify-self:start;max-width:100%;overflow:hidden;}
.sp2-more{height:20px;padding:0 9px;border:1px solid var(--fp-stroke-field);
  border-radius:9999px;background:var(--fp-surface-1b);color:var(--fp-ink-3);
  font-family:inherit;font-size:12px;cursor:pointer;font-variant-numeric:tabular-nums;}
.sp2-more:hover{background:var(--fp-emphasis);color:var(--fp-ink-1);}
.sp2-load-foot{display:flex;align-items:center;gap:9px;margin-top:9px;}
.sp2-load-n{font-size:12px;color:var(--fp-ink-3);}
.sp2-load-tot{margin-left:auto;font-size:14px;font-weight:600;color:var(--fp-ink-1);
  font-variant-numeric:tabular-nums;}
.sp2-prow-b{font-size:11px;color:var(--fp-ink-3);white-space:nowrap;}
.sp2-prow-q{font-size:12px;font-weight:500;color:var(--fp-ink-1);white-space:nowrap;
  text-align:right;font-variant-numeric:tabular-nums;}

/* six dots: the lane can be moved */
.sp2-grip{width:16px;height:22px;flex-shrink:0;margin-left:-4px;border:none;background:transparent;
  color:var(--fp-outline-2);display:inline-flex;align-items:center;justify-content:center;
  padding:0;cursor:grab;}
.sp2-grip:hover{color:var(--fp-ink-3);}
.sp2-grip:active{cursor:grabbing;}
/* the orders on the rig are their own group, apart from what the rig is */
.sp2-ln-orders{margin-left:8px;font-size:12px;font-weight:500;color:var(--fp-ink-1);
  font-variant-numeric:tabular-nums;white-space:nowrap;}
.sp2-ln-none{margin-top:10px;font-size:12px;color:var(--fp-ink-3);}

/* ── the driver block ──────────────────────────────────
   Who, when, and how much of the shift is left. Everything else about this
   driver's clock is one hover away. */
.sp2-av{width:34px;height:34px;box-shadow:inset 0 0 0 1px var(--fp-outline-1);}
.sp2-ico-sm{width:22px;height:22px;flex-shrink:0;border:none;border-radius:var(--r-sm,6px);
  background:transparent;color:var(--fp-ink-3);display:inline-flex;align-items:center;
  justify-content:center;cursor:pointer;}
.sp2-ico-sm:hover{background:var(--fp-emphasis);color:var(--fp-ink-1);}
.sp2-ln-drv-top .sp2-ico-sm:first-of-type{margin-left:auto;}
.sp2-hv{position:relative;margin-top:9px;}
.sp2-ln-shift{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fp-ink-3);
  font-variant-numeric:tabular-nums;margin-top:0;cursor:help;}
.sp2-ln-shift svg{flex-shrink:0;}
.sp2-ln-left{display:inline-block;margin-top:4px;margin-left:19px;font-size:12px;font-weight:500;
  color:var(--fp-ink-1);font-variant-numeric:tabular-nums;cursor:help;
  text-decoration:underline;text-decoration-style:dotted;
  text-decoration-color:var(--fp-outline-2);text-underline-offset:4px;}
.sp2-hv:hover .sp2-ln-left{text-decoration-color:var(--fp-ink-1);}
.sp2-ln-left.before{color:var(--fp-ink-3);}
.sp2-ln-left.over,.sp2-ln-left.off{color:var(--fp-ink-3);}
/* A hover card you cannot reach is a hover card you cannot read. Two things
   keep it: a transparent bridge across the gap under the trigger, so the
   pointer never crosses dead ground, and a held-open window on the way out —
   the card stays hit-testable for .45s after the pointer leaves, which is long
   enough to land on it and short enough never to be in the way. Visibility
   does the holding because `display` cannot be delayed. */
.sp2-hv-card{visibility:hidden;opacity:0;position:absolute;left:-10px;top:100%;margin-top:6px;
  z-index:60;width:320px;padding:12px;border:1px solid var(--fp-outline-1);
  border-radius:var(--r-lg);background:var(--fp-surface-1b);
  box-shadow:0 8px 10px -6px rgba(3,4,5,.1),0 20px 25px -5px rgba(3,4,5,.1);
  transition:opacity .12s linear,visibility 0s linear .45s;}
.sp2-hv-card::before{content:'';position:absolute;left:0;right:0;top:-10px;height:10px;}
.sp2-hv:hover .sp2-hv-card,.sp2-hv-card:hover{visibility:visible;opacity:1;
  transition:opacity .12s linear;}
.sp2-hv-card .sp2-shift{margin-top:0;}
.sp2-hv-card .sp2-hos{cursor:default;}
.sp2-hv-card .sp2-hos:hover{background:var(--fp-surface-1a);}
.sp2-hv-cta{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
  height:32px;margin-top:10px;border:none;border-radius:var(--r-md);background:var(--primary);
  color:var(--primary-foreground);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;}
.sp2-hv-cta:hover{background:color-mix(in oklab,var(--primary) 88%,#fff);}

/* ── the trial middle: load left, truck right ──────────
   The table holds the numbers you change; the drawing beside it holds the
   picture. Together they take one band of the card instead of two. */
/* The band is as tall as the table; the drawing sits on its baseline, so the
   bottom of the truck lines up with the bottom of the compartment card. */
/* Half each, whatever the screen is: the table and the drawing say the same
   thing two ways, so neither outranks the other. The ratio is fixed; the
   widths follow the column. */
.sp2-two{display:flex;gap:12px;align-items:stretch;margin-top:10px;}
.sp2-two-l{flex:1 1 0;min-width:0;}
.sp2-two-r{flex:1 1 0;min-width:0;display:flex;align-items:flex-end;justify-content:center;}
/* Comp and the readouts take what they need; the product name gets the rest.
   TM is the tank monitor, and the head has to fit at this width. */
.sp2-two-l .sp2-ct{margin-top:0;grid-template-columns:46px minmax(0,1fr) 58px 68px;}
.sp2-two-l .sp2-ct-head>span,.sp2-two-l .sp2-ct-n,.sp2-two-l .sp2-ct-p,
.sp2-two-l .sp2-ct-f,.sp2-two-l .sp2-cell{padding-left:7px;padding-right:7px;}
.sp2-two-l .sp2-ct-head>span{height:32px;font-size:12px;}
.sp2-two-l .sp2-ct .sp2-lt-c{height:34px;}
.sp2-two-l .sp2-ct-n,.sp2-two-l .sp2-ct-p,.sp2-two-l .sp2-ct-f,
.sp2-two-l .sp2-cell{font-size:12px;}
/* the monitor keeps 12px of its own on the right, where every other cell
