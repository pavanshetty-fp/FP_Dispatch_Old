      '<span class="sp2-chipf-n">' + v.length + '</span>' +
      '<button class="sp2-chipf-x" aria-label="Remove ' + f.label + '" ' +
      'onclick="sp2ChipOff(\'' + f.k + '\',null)">' + X + '</button>' +
      '<span class="sp2-chipf-card"><span class="sp2-chipf-card-h">' + f.label + '</span>' +
        v.map(function (x) {
          return '<span class="sp2-chipf-row">' + x +
            '<button class="sp2-chipf-x" aria-label="Remove ' + x + '" ' +
            'onclick="sp2ChipOff(\'' + f.k + '\',\'' + x.replace(/'/g, "\\'") + '\')">' + X + '</button></span>';
        }).join('') +

// Clear all on a column's shelf clears that column's narrowing, not the other's.

// null takes the whole facet off, which is what the ✕ on a multi-value chip does
function sp2ChipOff(fk, v) {

  sp2OnlyDriver = null;

// ── unit.view-row ─────────────────────────────────────────
// A view stores the whole narrowing AND the arrangement, and opens in it.
function sp2ViewState() {
  return {
    q:     (document.getElementById('sp2DrvSearch') || {}).value || '',
    facet: JSON.parse(JSON.stringify(sp2Facet)),
  };
}
function sp2ViewKey(st) {
  return [st.q,
    SP2_FACETS.map(function (f) { return f.k + ':' + (st.facet[f.k] || []).slice().sort().join(','); }).join('|'),
  ].join('~');
}
function sp2ViewDefault() { return { q:'', facet:{} }; }
function sp2ViewApply(st) {
  sp2Facet = JSON.parse(JSON.stringify(st.facet));
  sp2OnlyDriver = null;
  document.getElementById('sp2DrvSearch').value = st.q;
  sp2AvailFreeze();
  sp2RenderUnit();
}
function sp2ViewDirty() {
  var v = sp2Views.filter(function (x) { return x.id === sp2ViewOn; })[0];
  return sp2ViewKey(sp2ViewState()) !== sp2ViewKey(v ? v.state : sp2ViewDefault());
}
function sp2VrDraw() {
  var el = document.getElementById('sp2Vr');
  if (!el) return;
  var dirty = sp2ViewDirty();
  var html = '<button class="sp2-vr-tab' + (sp2ViewOn ? '' : ' on') + '" onclick="sp2VrAll()">All' +
    (!sp2ViewOn && dirty ? '<span class="sp2-vr-dot" title="All has unsaved changes"></span>' : '') + '</button>';

  sp2Views.forEach(function (v) {
    var act = v.id === sp2ViewOn;
    html += '<span class="sp2-vr-wrap">' +
      '<button class="sp2-vr-tab' + (act ? ' on' : '') + '" onclick="sp2VrPick(\'' + v.id + '\')">' + v.name + '</button>' +
      (act && dirty
        ? '<button class="sp2-vr-ico" title="Update changes" onclick="sp2VrUpdate(\'' + v.id + '\')">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
          'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><polyline points="21 4 21 9 16 9"/></svg></button>'
        : '') +
      '<button class="sp2-vr-ico sp2-vr-more" title="More" onclick="sp2VrMenu(event,\'' + v.id + '\')">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">' +
        '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>' +
      '<span class="sp2-vr-menu" id="sp2VrM' + v.id + '" onclick="event.stopPropagation()">' +
        (act && dirty ? '<button class="sp2-vr-mi" onclick="sp2VrUpdate(\'' + v.id + '\')">Update view</button>' : '') +
        '<button class="sp2-vr-mi" onclick="sp2VrRename(\'' + v.id + '\')">Rename</button>' +
        '<button class="sp2-vr-mi bad" onclick="sp2VrDelete(\'' + v.id + '\')">Delete</button>' +
      '</span>' +
    '</span>';
  });

  html += '<button class="sp2-vr-add" onclick="sp2VrNew()">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/>' +
      '<line x1="5" y1="12" x2="19" y2="12"/></svg>View</button>';

}
// Each tab keeps its own unsaved changes, so leaving a view and coming back
// finds it as it was left — and pressing the tab you are already on is the
// one way to drop them.
var sp2Park = {};
function sp2TabId() { return sp2ViewOn || 'all'; }

function sp2VrAll() {
  if (!sp2ViewOn) {                      // already on All: this is its reset
    delete sp2Park.all;
    sp2ViewApply(sp2ViewDefault());
    return;
  }
  sp2Park[sp2ViewOn] = sp2ViewState();   // park the view's changes where it is
  sp2ViewOn = null;
  sp2ViewApply(sp2Park.all || sp2ViewDefault());
}
function sp2VrPick(id) {
  var v = sp2Views.filter(function (x) { return x.id === id; })[0];
  if (!v) return;
  if (sp2ViewOn === id) {                // the one you are on: back to saved
    delete sp2Park[id];
    sp2ViewApply(v.state);
    return;
  }
  sp2Park[sp2TabId()] = sp2ViewState();
  sp2ViewOn = id;
  sp2ViewApply(sp2Park[id] || v.state);
}
function sp2VrUpdate(id) {
  var v = sp2Views.filter(function (x) { return x.id === id; })[0];
  if (!v) return;
  v.state = sp2ViewState();
  delete sp2Park[id];
  sp2VrCloseMenus();
  sp2RenderUnit();
  sp2Toast('“' + v.name + '” updated');
}
function sp2VrDelete(id) {
  sp2Views = sp2Views.filter(function (x) { return x.id !== id; });
  delete sp2Park[id];
  if (sp2ViewOn === id) sp2ViewOn = null;
  sp2VrCloseMenus();
  sp2RenderUnit();
}
function sp2VrMenu(e, id) {
  e.stopPropagation();
  var m = document.getElementById('sp2VrM' + id);
  var was = m.classList.contains('on');
  sp2VrCloseMenus();
  if (!was) { m.classList.add('on'); m.previousElementSibling.classList.add('on'); }
}
function sp2VrCloseMenus() {
  document.querySelectorAll('.sp2-vr-menu.on').forEach(function (m) { m.classList.remove('on'); });
  document.querySelectorAll('.sp2-vr-more.on').forEach(function (b) { b.classList.remove('on'); });
}

// the Save / Rename dialog
var sp2DlgMode = 'save', sp2DlgId = null;
// Naming is the friction that stops people saving views, so the box opens with
// a name made from what is narrowing the list.
function sp2VrSuggest() {
  var parts = [];
  SP2_FACETS.forEach(function (f) {
    var v = sp2Facet[f.k] || [];
    if (!v.length) return;
    if (f.kind === 'range') {
      var rr = sp2Range(v[0]);
      parts.push(rr.lo.toLocaleString() + '\u2013' + rr.hi.toLocaleString() + ' ' + f.unit);
      return;
    }
    parts.push(v.length === 1 ? v[0] : v.length === 2 ? v[0] + ' & ' + v[1] : v.length + ' ' + f.label.toLowerCase());
  });
  return parts.slice(0, 3).join(' · ');
}
function sp2VrNew() {

  var i = document.getElementById('sp2DlgI');
  document.getElementById('sp2DlgT').textContent = 'Save current view';
  document.getElementById('sp2DlgOk').textContent = 'Save view';

}
function sp2VrRename(id) {
  var v = sp2Views.filter(function (x) { return x.id === id; })[0];

  sp2VrCloseMenus();
  var i = document.getElementById('sp2DlgI');
  document.getElementById('sp2DlgT').textContent = 'Rename view';
  document.getElementById('sp2DlgOk').textContent = 'Rename';

  document.getElementById('sp2DlgScrim').classList.add('on');

}
function sp2DlgClose() { document.getElementById('sp2DlgScrim').classList.remove('on'); }
function sp2DlgKey(e) {
  if (e.key === 'Enter') sp2DlgSave();
  else if (e.key === 'Escape') sp2DlgClose();
  else if ((e.key === 'ArrowRight' || e.key === 'Tab') && sp2DlgMode === 'save' && !e.target.value) {
    var sug = sp2VrSuggest();

  }
}
function sp2DlgSave() {
  var i = document.getElementById('sp2DlgI');
  var name = (i.value || (sp2DlgMode === 'save' ? sp2VrSuggest() : '')).trim();
  if (!name) return;
  if (sp2DlgMode === 'rename') {
    var v = sp2Views.filter(function (x) { return x.id === sp2DlgId; })[0];
    if (v) v.name = name;
  } else {
    var id = 'v' + (Date.now() % 100000);
    sp2Views.push({ id:id, name:name, state:sp2ViewState() });
    delete sp2Park[sp2TabId()];       // the changes moved into the new view
    sp2ViewOn = id;
  }
  sp2DlgClose();
  sp2RenderUnit();
}

function sp2DriverKeys() {
  // The one rig a selected planned order is on, whatever the filters say —
  // the filters narrow a search, and this is not a search any more.
  if (sp2OnlyDriver) {
    var sel = SP2_ORDERS.filter(function (x) { return x.id === sp2SelOrder; })[0];
    if (sel && sel.driver === sp2OnlyDriver && SP2_DRIVERS[sp2OnlyDriver]) return [sp2OnlyDriver];
    sp2OnlyDriver = null;
  }
  var q = (document.getElementById('sp2DrvSearch').value || '').toLowerCase().trim();
  var room = (sp2Facet.room || []).indexOf('Available') >= 0;
  if (room && !sp2AvailOrder) sp2FreezeAvail();
  var keys = Object.keys(SP2_DRIVERS).filter(function (k) {
    var d = SP2_DRIVERS[k];
    if (q && (d.name + ' ' + d.truck + ' ' + d.hub).toLowerCase().indexOf(q) < 0) return false;
    // A rig that had room when you arrived keeps its place even once you have
    // filled it — otherwise the card you just loaded disappears from under you.
    // It drops off the next time the filter is asked for a fresh order.
    if (room && !sp2Avail(d) && sp2AvailOrder.indexOf(k) >= 0) return true;
    if (!sp2FacetMatch(k, sp2Facet)) return false;
    return true;
  });
  // Available leads with the rigs that have most room — but it is taken ONCE,
  // when you arrive at the tab, and then held. Loading a truck fills it, and a
  // list that re-sorted on every drop would slide the card you are working on
  // out from under you. Clicking Available again is how you ask for a fresh one.
  if (room) {
    var at = {};
    sp2AvailOrder.forEach(function (k, n) { at[k] = n; });
    keys.sort(function (a, b) {
      var pa = at[a], pb = at[b];
      if (pa === undefined && pb === undefined) return sp2RigFill(a).pct - sp2RigFill(b).pct;
      if (pa === undefined) return 1;        // newly freed up: joins the end
      if (pb === undefined) return -1;
      return pa - pb;
    });
  }
  return keys;
}

// The ordering Available would give right now, by room.
function sp2AvailRank() {
  return Object.keys(SP2_DRIVERS)
    .filter(function (k) { return sp2Avail(SP2_DRIVERS[k]); })
    .sort(function (a, b) {
      var fa = sp2RigFill(a), fb = sp2RigFill(b);
      return fa.pct - fb.pct || fb.free - fa.free;
    });
}
function sp2FreezeAvail() { sp2AvailOrder = sp2AvailRank(); }

// One card, moved to where its space puts it — on request, never on its own.
function sp2MoveLane(e, k) {
  e.stopPropagation();
  if (!sp2AvailOrder) return;
  var rest = sp2AvailOrder.filter(function (x) { return x !== k; });
  var f = sp2RigFill(k), at = rest.length;
  for (var n = 0; n < rest.length; n++) {
    var g = sp2RigFill(rest[n]);
    if (g.pct > f.pct || (g.pct === f.pct && g.free < f.free)) { at = n; break; }
  }
  rest.splice(at, 0, k);
  sp2AvailOrder = rest;
  sp2RenderUnit();
  sp2Toast(SP2_DRIVERS[k].truck + ' moved to ' + (at + 1) + ' of ' + rest.length + ' by space left');
}

// How full a rig is, 0–100. Drives the Available ordering.
function sp2RigFill(k) {
  var cap = sp2RigCap(k);
  var on = sp2Cells(k).reduce(function (s, c) { return s + c.l.q; }, 0);
  return { pct: cap ? on / cap * 100 : 100, free: cap - on };
}

// ══════════════════════════════════════════════════════════
//  Hours of service — surfaced from Samsara, never computed here
// ══════════════════════════════════════════════════════════
// Samsara runs the DOT rules against each driver's own ruleset and we read the
// four clocks as they come. So every number below is shown, compared and
// coloured, but none of it is derived from our own shift data: if Samsara and
// the shift window disagree, Samsara is right and the lane says so.

function sp2Hm(m) {
  if (m <= 0) return '0:00';
  return Math.floor(m / 60) + ':' + String(Math.round(m % 60)).padStart(2, '0');
}
// Green until a fifth of the limit is left, amber from there, red near violation.
function sp2HosCls(rem, max) {
  var f = rem / max;
  return f < 0.08 ? 'bad' : f < 0.2 ? 'warn' : 'ok';
}
// The clock that will stop the driver first — the one worth naming on a card.
function sp2HosBind(h) {
  return ['brk','drv','shf','cyc'].reduce(function (a, b) {
    return h[b] / SP2_HOS_MAX[b] < h[a] / SP2_HOS_MAX[a] ? b : a;
  });
}
function sp2HosWorst(h) {
  var b = sp2HosBind(h);
  return sp2HosCls(h[b], SP2_HOS_MAX[b]);
}

// The strip every lane carries: all four clocks, the binding one marked.
// The shift time, what is left of it, and — on hover — everything about this
// driver's clock: the shift drawn, the four Samsara boxes, and the way into
// the record.
function sp2ShiftBlock(k) {
  var d = SP2_DRIVERS[k], st = sp2ShiftState(d);
  var off = d.state === 'off-duty';
  var read = off ? 'Off duty' : st ? st.note : '\u2014';
  var cls = off ? 'off' : st ? st.kind : '';
  return '<div class="sp2-hv">' +
      '<div class="sp2-ln-shift">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
          'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
          '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>' +
        '<span>' + sp2ShiftLabel(d.shift) + '</span>' +
      '</div>' +
      '<div class="sp2-ln-left ' + cls + '">' + read + '</div>' +
      '<div class="sp2-hv-card" onclick="event.stopPropagation()">' +
        sp2ShiftStrip(d) +
        sp2HosStrip(k, true) +
        '<button class="sp2-hv-cta" onclick="sp2CrewOpen(event,\'' + k + '\')">' +
          'Open driver details' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
          'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<polyline points="9 18 15 12 9 6"/></svg></button>' +
      '</div>' +
    '</div>';
}

function sp2HosStrip(k, bare) {
  var h = SP2_DRIVERS[k].hos, bind = sp2HosBind(h);
  var cells = ['brk','drv','shf','cyc'].map(function (c) {
    var rem = h[c], max = SP2_HOS_MAX[c], cls = sp2HosCls(rem, max);
    // the binding clock is marked only when it is actually tight — on a rested
    // driver every clock is green and underlining one of them says nothing
    var mark = c === bind && cls !== 'ok';
    return '<div class="sp2-hos-c ' + cls + (mark ? ' bind' : '') + '" ' +
        'title="' + SP2_HOS_NAME[c] + ' — ' + sp2Hm(rem) + ' of ' + (max / 60) + 'h left">' +
        '<div class="sp2-hos-c-top">' +
          '<span class="sp2-hos-c-l">' + SP2_HOS_NAME[c] + '</span>' +
          '<span class="sp2-hos-c-v">' + sp2Hm(rem) + '</span>' +
        '</div>' +
        '<div class="sp2-hos-bar"><i style="width:' +
          Math.max(2, Math.round(rem / max * 100)) + '%;"></i></div>' +
      '</div>';
  }).join('');
  return '<div class="sp2-hos ' + sp2HosWorst(h) + (bare ? ' bare' : '') + '"' +
      (bare ? '' : ' onclick="sp2HosOpen(event,\'' + k + '\')"') +
      ' title="Hours of service, read from Samsara">' +
      '<div class="sp2-hos-top">' +
        '<span class="sp2-hos-ttl">HOS</span>' +
        '<span class="sp2-hos-src">Samsara</span>' +
        (bare ? '' : '<span class="sp2-hos-go">View detail</span>') +
      '</div>' +
      '<div class="sp2-hos-row">' + cells + '</div>' +
    '</div>';
}

// ── The detail ───────────────────────────────────────────
// One ring per clock, depleting as the hours go — the same shape as the dials
// in the Samsara driver app, so a dispatcher reading both sees one picture.
function sp2HosDial(key, rem) {
  var max = SP2_HOS_MAX[key], cls = sp2HosCls(rem, max);
  var r = 25, c = 2 * Math.PI * r, on = Math.max(0, Math.min(1, rem / max));
  return '<div class="sp2-dial ' + cls + '">' +
      '<svg class="sp2-sv" width="64" height="64" viewBox="0 0 64 64">' +
        '<circle cx="32" cy="32" r="' + r + '" fill="none" stroke="var(--fp-outline-1)" stroke-width="6"/>' +
        '<circle cx="32" cy="32" r="' + r + '" fill="none" stroke="currentColor" stroke-width="6" ' +
          'stroke-linecap="round" stroke-dasharray="' + (c * on).toFixed(1) + ' ' + c.toFixed(1) + '" ' +
          'transform="rotate(-90 32 32)"/>' +
      '</svg>' +
      '<div class="sp2-dial-v">' + sp2Hm(rem) + '</div>' +
      '<div class="sp2-dial-l">' + SP2_HOS_NAME[key] + '</div>' +
      '<div class="sp2-dial-max">of ' + (max / 60) + 'h</div>' +
    '</div>';
}

// The day as the ELD recorded it. Off-duty drivers have no day to show.
var SP2_DUTY_DAY = [
  ['ON', 15, 'Pre-trip inspection'],
  ['D',  95, 'Drive to terminal'],
  ['ON', 40, 'Loading'],
  ['D',  70, 'Drive to first stop'],
  ['ON', 35, 'Delivery'],
  ['OFF',30, 'Required 30-minute break'],
  ['D',  80, 'Drive'],
  ['ON', 45, 'Delivery'],
  ['D',  60, 'Drive'],
  ['ON', 30, 'Post-trip inspection'],
];
function sp2HosLog(k) {
  var d = SP2_DRIVERS[k], s = SP2_SHIFTS[d.shift];
  if (d.state === 'off-duty') return [{ st:'OFF', from:0, to:1440, what:'Off duty — not on the roster today' }];
  var at = s.from, end = Math.min(s.to, SP2_NOW), out = [];
  if (end <= at) return [];
  SP2_DUTY_DAY.forEach(function (row) {
    if (at >= end) return;
    var to = Math.min(at + row[1], end);
    out.push({ st:row[0], from:at, to:to, what:row[2] });
    at = to;
  });
  return out;
}

// The classic ELD graph: four rows, a stepped line between them.
var SP2_DUTY_ROWS = ['OFF','SB','D','ON'];
function sp2HosGraph(k) {
  var log = sp2HosLog(k);
  var W = 392, H = 76, rowH = H / 4, x = function (m) { return m / 1440 * W; };
  var grid = SP2_DUTY_ROWS.map(function (r, n) {
    return '<line x1="0" y1="' + (n * rowH) + '" x2="' + W + '" y2="' + (n * rowH) +
           '" stroke="var(--fp-outline-1)" stroke-width="1"/>' +
           '<text x="2" y="' + (n * rowH + 11) + '" class="sp2-g-lbl">' + r + '</text>';
  }).join('') + '<line x1="0" y1="' + H + '" x2="' + W + '" y2="' + H +
    '" stroke="var(--fp-outline-1)" stroke-width="1"/>';
  var hours = '';
  for (var hh = 0; hh <= 24; hh += 3)
    hours += '<line x1="' + x(hh * 60) + '" y1="0" x2="' + x(hh * 60) + '" y2="' + H +
             '" stroke="var(--fp-stroke-hairline)" stroke-width="1" opacity=".55"/>' +
             '<text x="' + x(hh * 60) + '" y="' + (H + 11) + '" class="sp2-g-hr">' + hh + '</text>';
  var path = '', prev = null;
  log.forEach(function (r) {
    var y = SP2_DUTY_ROWS.indexOf(r.st) * rowH + rowH / 2;
    if (prev !== null && prev !== y) path += 'L' + x(r.from).toFixed(1) + ',' + y.toFixed(1) + ' ';
    path += (path ? 'L' : 'M') + x(r.from).toFixed(1) + ',' + y.toFixed(1) + ' ' +
            'L' + x(r.to).toFixed(1) + ',' + y.toFixed(1) + ' ';
    prev = y;
  });
  return '<svg class="sp2-g sp2-sv" width="' + W + '" height="' + (H + 15) + '" viewBox="0 0 ' + W + ' ' + (H + 15) + '">' +
      hours + grid +
      (path ? '<path d="' + path + '" fill="none" stroke="var(--status-success)" stroke-width="2" ' +
              'stroke-linejoin="round" stroke-linecap="round"/>' : '') +
    '</svg>';
}

var sp2HosFor = null;
function sp2HosBodyHtml(k) {
  var d = SP2_DRIVERS[k], h = d.hos, bind = sp2HosBind(h);
  var used = SP2_HOS_MAX.cyc - h.cyc;

  var log = sp2HosLog(k).map(function (r) {
    return '<div class="sp2-dl-row">' +
        '<span class="sp2-duty ' + r.st + '">' + r.st + '</span>' +
        '<span class="sp2-dl-t">' + sp2Hhmm(r.from) + '–' + sp2Hhmm(r.to) + '</span>' +
        '<span class="sp2-dl-w">' + r.what + '</span>' +
        '<span class="sp2-dl-d">' + sp2Dur(r.to - r.from) + '</span>' +
      '</div>';
  }).join('') || '<div class="sp2-hos-none">Nothing recorded yet — the shift has not begun.</div>';

  return '<div class="sp2-hos-who">' +
      '<div class="sp2-av lg">' + d.name.split(' ').map(function (x) { return x[0]; }).join('').slice(0, 2) + '</div>' +
      '<div>' +
        '<div class="sp2-hos-nm">' + d.name + '</div>' +
        '<div class="sp2-hos-sub">' + d.truck + ' · ' + d.hub + ' · ' + sp2ShiftLabel(d.shift) + '</div>' +
      '</div>' +
      '<span class="sp2-duty ' + h.duty + ' big">' + h.duty + '</span>' +
    '</div>' +

    '<div class="sp2-hos-note">Read from Samsara ' + sp2Dur(h.read) + ' ago. Samsara computes these ' +
      'against this driver&rsquo;s ruleset; FleetPanda only shows them.</div>' +

    '<div class="sp2-dials">' + ['brk','drv','shf','cyc'].map(function (c) {
      return sp2HosDial(c, h[c]);

    '<div class="sp2-hos-bind ' + sp2HosCls(h[bind], SP2_HOS_MAX[bind]) + '">' +
      SP2_HOS_NAME[bind] + ' is the binding limit — ' + sp2Hm(h[bind]) + ' left' +
    '</div>' +

    '<div class="sp2-hos-sect">Weekly cycle</div>' +
    '<div class="sp2-cyc">' +
      '<div class="sp2-cyc-bar"><i style="width:' + Math.round(used / SP2_HOS_MAX.cyc * 100) + '%;"></i></div>' +
      '<div class="sp2-cyc-ln"><b>' + sp2Hm(used) + '</b> used of 70h · <b>' + sp2Hm(h.cyc) + '</b> available</div>' +
      '<div class="sp2-hos-fine">A rolling 8-day window, counted in hours — not day N of 8. ' +
        sp2Hm(h.back) + ' comes back tonight as the oldest day rolls off.</div>' +
    '</div>' +

    '<div class="sp2-hos-sect">Today</div>' +
    sp2HosGraph(k) +
    '<div class="sp2-dl">' + log + '</div>';
}

// One sheet, two records. It reads; it never acts — changing a driver, a truck
// or a load is done in the lane, and a second place to do it is a second place

function sp2HosClose() {

function sp2HosOpen(e, k) { sp2CrewOpen(e, k); }
document.addEventListener('keydown', function (e) {

// ── The order, and what it adds up to ───────────────────
var sp2OrdFor = null;
var SP2_ACTORS = ['Priya Raman','Dale Hoffmann','Marcus Webb','Yasmin Qureshi'];

  var row = function (l, v) {
    return '<div class="sp2-rr"><dt>' + l + '</dt><dd>' + v + '</dd></div>';
  };

    '<div class="sp2-sh-grid">' +

          (drv ? '<span>' + drv.name + ' \u00b7 ' + drv.truck + '</span>' : '<span>No driver yet</span>') +
        '</div>' +

        '<div class="sp2-hos-sect">Ordered</div>' +

            row('Products', lines.length + ' line' + (lines.length === 1 ? '' : 's')) +

            (f ? row('Against ' + SP2_DRIVERS[sp2Driver].truck,
                     f.pct >= 100 ? 'Fits \u00b7 rig ' + f.rigPct + '%'

// ── Driver, truck and trailer, in one sheet ──────────────
function sp2CrewOpen(e, k) {
  if (e) e.stopPropagation();
  sp2HosFor = k;
  var d = SP2_DRIVERS[k], t = SP2_TRUCKS[d.truck];
  var trl = d.trailer ? SP2_TRAILERS[d.trailer] : null;

  var comps = function (caps, load, pre) {
    return '<div class="sp2-sh-tbl">' + caps.map(function (cap, i) {
      var l = (load && load[i]) || { p:'', q:0 };
      var col = SP2_PROD_COLORS[l.p] || 'var(--fp-outline-1)';
      return '<div class="sp2-sh-row">' +
          '<span class="sp2-sh-c">' + pre + (i + 1) + '</span>' +
          '<span class="sp2-sh-p">' + (l.p
            ? '<i class="sp2-dot" style="background:' + col + ';"></i>' + l.p
            : '<span class="sp2-sh-empty">Empty</span>') + '</span>' +
          '<span class="sp2-sh-q">' + l.q.toLocaleString() + ' / ' + cap.toLocaleString() + ' gal</span>' +
        '</div>';
    }).join('') + '</div>';
  };

  var mine = SP2_ORDERS.filter(function (o) { return o.driver === k; })
                       .sort(function (x, y) { return x.t - y.t; });
  var route = mine.length
    ? '<div class="sp2-sh-tbl">' + mine.map(function (o) {
        var tr = sp2Trip(o, k);
        return '<div class="sp2-sh-row">' +
            '<span class="sp2-sh-c">' + sp2Hhmm(o.t) + '</span>' +
            '<span class="sp2-sh-p">' + o.ship + '</span>' +
            '<span class="sp2-sh-q">' + (tr ? tr.mi.toFixed(1) + ' mi \u00b7 ' : '') +
              sp2Gal(o).toLocaleString() + ' gal</span>' +
          '</div>';
      }).join('') + '</div>'
    : '<div class="sp2-hos-none">Nothing planned on this rig yet.</div>';

  sp2SheetShow(d.name + ' \u00b7 ' + d.truck + (trl ? ' + ' + d.trailer : ''), 'crew',
    sp2HosBodyHtml(k) +
    '<div class="sp2-hos-sect">Truck \u00b7 ' + d.truck + '</div>' +
    '<div class="sp2-sh-facts">' +
      '<span>' + t.type + '</span><span>' + t.comps.length + ' compartments</span>' +
      '<span>' + t.comps.reduce(function (a, c) { return a + c.cap; }, 0).toLocaleString() + ' gal</span>' +
      '<span>Meter ' + t.meter + '</span>' +
    '</div>' +
    comps(t.comps.map(function (c) { return c.cap; }), d.load, 'C') +
    (trl
      ? '<div class="sp2-hos-sect">Trailer \u00b7 ' + d.trailer + '</div>' +
        '<div class="sp2-sh-facts">' +
          '<span>Pup trailer</span><span>' + trl.caps.length + ' compartments</span>' +
          '<span>' + trl.caps.reduce(function (a, c) { return a + c; }, 0).toLocaleString() + ' gal</span>' +
        '</div>' +
        comps(trl.caps, d.tload, 'T')
      : '<div class="sp2-hos-sect">Trailer</div>' +
        '<div class="sp2-hos-none">No trailer hitched.</div>') +
    '<div class="sp2-hos-sect">Today\u2019s route</div>' + route);
}

// One row per driver. The chosen one opens in place — its orders, its gallons
// and the way into the full record — so the roster never leaves the screen.
function sp2DrvCounts(shown) {
  var all = Object.keys(SP2_DRIVERS);
  var n = function (s) { return all.filter(function (k) { return SP2_DRIVERS[k].state === s; }).length; };
  document.getElementById('sp2DrvCount').textContent = shown;
}

// Availability and duty are facets now. This stays as the way to set them in
// one call — the control that used to do it has moved into the panel.
function sp2SetDrvFilter(f) {
  sp2OnlyDriver = null;
  sp2Facet.room = f === 'available' ? ['Available'] : [];
  sp2Facet.duty = f === 'driving' ? ['Driving']
    : f === 'on-duty' ? ['On duty'] : f === 'off-duty' ? ['Off duty'] : [];
  sp2AvailFreeze();
  sp2RenderUnit();
}
// Arriving at "has room" is the ask for a fresh ordering; nothing else
// re-sorts it, or the card you are loading slides out from under you.
function sp2AvailFreeze() {
  if ((sp2Facet.room || []).indexOf('Available') >= 0) sp2FreezeAvail();
  else sp2AvailOrder = null;
}

// Compact is only a density, not a different render: the chosen lane stays
// full, so you can scan thirty rigs and still work the one you are on.

// ══════════════════════════════════════════════════════════
//  Column 2 · Section 2 — the rig, drawn
// ══════════════════════════════════════════════════════════
// Truck and trailer are the same thing twice, so one function draws both. The
// compartments divide the tank by capacity, and the load rises inside them.
function sp2Sum(caps, load) {
  var cap = caps.reduce(function (a, c) { return a + c; }, 0);
  var q = caps.reduce(function (a, c, i) { return a + ((load[i] && load[i].q) || 0); }, 0);
  return { cap:cap, q:q, pct:cap ? Math.round(q / cap * 100) : 0 };
}

// ── the trailer yard ──────────────────────────────────────
var sp2TrlFor = null;       // the driver the trailer popover is hitching to


// ══════════════════════════════════════════════════════════
//  Shift standing, and moving fuel between compartments
// ══════════════════════════════════════════════════════════
function sp2Dur(m) {
  m = Math.max(0, Math.round(m));
  var h = Math.floor(m / 60);
  return (h ? h + 'h ' : '') + (m % 60) + 'm';
}

// Where the driver is in their shift right now — the thing a dispatcher wants
// before handing them another drop.
function sp2ShiftState(d) {
  var s = SP2_SHIFTS[d.shift];
  if (!s) return null;
  var span = s.to - s.from, done = SP2_NOW - s.from;
  if (done < 0)      return { kind:'before',  pct:0,   note:'starts in ' + sp2Dur(-done), s:s, span:span };
  if (done >= span)  return { kind:'over',    pct:100, note:'ended ' + sp2Dur(done - span) + ' ago', s:s, span:span };
  return { kind:'running', pct:Math.round(done / span * 100),
           note:sp2Dur(span - done) + ' left', s:s, span:span };
}

function sp2ShiftStrip(d) {
  var st = sp2ShiftState(d);
  if (!st) return '';
  var word = st.kind === 'before' ? 'Not started' : st.kind === 'over' ? 'Shift over' : 'Mid-shift';
  return '<div class="sp2-shift ' + st.kind + '">' +
      '<div class="sp2-shift-top">' +
        '<span class="sp2-shift-win">' + sp2ShiftLabel(d.shift) + '</span>' +
        '<span class="sp2-shift-word">' + word + '</span>' +
        '<span class="sp2-shift-left">' + st.note + '</span>' +
      '</div>' +
      '<div class="sp2-shift-bar">' +
        '<div class="sp2-shift-done" style="width:' + st.pct + '%;"></div>' +
        (st.kind === 'running' ? '<span class="sp2-shift-now" style="left:' + st.pct + '%;"></span>' : '') +
      '</div>' +
      '<div class="sp2-shift-sub">' + sp2Dur(st.span) + ' shift · 30 min buffer · now ' + sp2Hhmm(SP2_NOW) + '</div>' +
    '</div>';
}

// One compartment, wherever it sits on the rig.
function sp2Cell(k, unit, i) {
  var d = SP2_DRIVERS[k];
  if (unit === 'trailer') {
    var tr = d.trailer && SP2_TRAILERS[d.trailer];
    return tr ? { cap:tr.caps[i], l:d.tload[i] } : null;
  }
  return { cap:SP2_TRUCKS[d.truck].comps[i].cap, l:d.load[i] };
}

// Moving fuel is a quantity, not a compartment. Pick the compartment it comes
// out of, pick the one it goes into, then say how much — all of it, or 200 gal
// of it. One product per compartment still holds, so the destination has to be
// empty or already hold the same thing.
var sp2MoveTo = null, sp2MoveMax = 0;

// ── Rearranging the load: the compartments as a table ───
// Moving fuel used to be a mode: click a compartment, read a toast, click
// another, set a number, press Move. The mode was invisible between the two
// clicks and the rules only arrived after you had picked. So the load is a
// table you balance instead — type a smaller number into a compartment and
// the gallons you took out are held until you put them somewhere.
var sp2Pend = null;          // { k, p, q } — fuel out of a compartment, not yet in one
var sp2Undo = null;          // the load as it was before this round of edits

function sp2LoadSnap(k) {
  var d = SP2_DRIVERS[k];
  return { k:k, load:JSON.parse(JSON.stringify(d.load)),
           tload:JSON.parse(JSON.stringify(d.tload || [])) };
}
function sp2LoadBack() {
  if (!sp2Undo) return;
  var d = SP2_DRIVERS[sp2Undo.k];
  d.load = JSON.parse(JSON.stringify(sp2Undo.load));
  d.tload = JSON.parse(JSON.stringify(sp2Undo.tload));
  sp2Undo = null; sp2Pend = null;
  sp2Render();
  sp2Toast('The load is back as it was');
}

function sp2SetComp(e, k, unit, i) {
  e.stopPropagation();
  var cell = sp2Cell(k, unit, i);
  if (!cell) return;
  var was = cell.l.q;
  var want = Math.max(0, Math.round(parseFloat(String(e.target.value).replace(/[^0-9.]/g, '')) || 0));

  // a compartment never takes more than it holds — the figure is held to the
  // cap as it is typed, and the reason is said out loud
  if (want > cell.cap) {
    want = cell.cap;
    sp2Toast(sp2CompName(unit, i) + ' holds ' + cell.cap.toLocaleString() + ' gal — that is its capacity');
  }
  if (want === was) return sp2Render();

  if (!sp2Undo || sp2Undo.k !== k) sp2Undo = sp2LoadSnap(k);

  if (want < was) {
    // fuel comes OUT and waits to be placed
    var prod = cell.l.p;
    if (sp2Pend && sp2Pend.p !== prod) {
      sp2Toast('Place the ' + sp2Pend.q.toLocaleString() + ' gal of ' + sp2Pend.p + ' first');
      return sp2Render();
    }
    cell.l.q = want;
    if (!want) cell.l.p = '';
    sp2Pend = { k:k, p:prod, q:(sp2Pend ? sp2Pend.q : 0) + (was - want) };
    if (!sp2Pend.q) sp2Pend = null;
    return sp2Render();
  }

  // fuel goes IN — only what is waiting, and only of that product
  var add = want - was;
  if (!sp2Pend) {
    sp2Toast('There is no loose fuel to put in — take some out of another compartment first');
    return sp2Render();
  }
  if (cell.l.q && cell.l.p !== sp2Pend.p) {
    sp2Toast(sp2CompName(unit, i) + ' holds ' + cell.l.p + ' — one product per compartment');
    return sp2Render();
  }
  if (add > sp2Pend.q) {
    add = sp2Pend.q;
    sp2Toast('Only ' + sp2Pend.q.toLocaleString() + ' gal of ' + sp2Pend.p + ' is loose');
  }
  cell.l.p = sp2Pend.p;
  cell.l.q += add;
  sp2Pend.q -= add;
  if (!sp2Pend.q) sp2Pend = null;
  sp2Render();
}

// One press that puts whatever is loose into the first compartment that can
// take it — the common case, without typing it twice.
function sp2PendPlace(e, k) {
  e.stopPropagation();
  if (!sp2Pend) return;
  var cells = sp2Cells(k);
  for (var n = 0; n < cells.length && sp2Pend; n++) {
    var c = cells[n], room = c.cap - c.l.q;
    if (room <= 0) continue;
    if (c.l.q && c.l.p !== sp2Pend.p) continue;
    var take = Math.min(room, sp2Pend.q);
    c.l.p = sp2Pend.p; c.l.q += take; sp2Pend.q -= take;
    if (!sp2Pend.q) sp2Pend = null;
  }
  sp2Render();
  if (sp2Pend) sp2Toast(sp2Pend.q.toLocaleString() + ' gal of ' + sp2Pend.p + ' still has nowhere to go');
}

function sp2CompTable(k) {
  var cells = sp2Cells(k);
  var rows = cells.map(function (c) {
    var pct = c.cap ? Math.round(c.l.q / c.cap * 100) : 0;
    var col = SP2_PROD_COLORS[c.l.p] || 'var(--fp-ink-3)';
    var name = c.l.p
      ? '<i class="sp2-dot" style="background:' + col + ';"></i>' + c.l.p
      : '<span class="sp2-lt-none">Empty' +
        (sp2Pend && sp2Pend.k === k ? ' \u2014 takes ' + sp2Pend.p : '') + '</span>';
    return '<div class="sp2-ct-row">' +
        '<span class="sp2-lt-c sp2-ct-n">' + sp2CompName(c.u, c.i) + '</span>' +
        '<span class="sp2-lt-c sp2-ct-p">' + name + '</span>' +
        '<span class="sp2-lt-c sp2-lt-edit">' +
          '<input class="sp2-cell" type="text" inputmode="numeric" ' +
            'value="' + c.l.q.toLocaleString() + '" ' +
            'aria-label="Gallons in ' + sp2CompName(c.u, c.i) + '" ' +
            'title="Holds ' + c.cap.toLocaleString() + ' gal" ' +
            'onclick="event.stopPropagation()" ' +
            'onchange="sp2SetComp(event,\'' + k + '\',\'' + c.u + '\',' + c.i + ')">' +
        '</span>' +
        '<span class="sp2-lt-c sp2-ct-f">' +
          '<span class="sp2-ct-bar"><i style="width:' + pct +
            '%;background:' + (c.l.q ? col : 'transparent') + ';"></i></span>' +
          '<span class="sp2-ct-pct">' + pct + '%</span>' +
        '</span>' +
      '</div>';
  }).join('');

  var placed = cells.reduce(function (a, c) { return a + c.l.q; }, 0);
  var loose = sp2Pend && sp2Pend.k === k ? sp2Pend : null;
  var foot = loose
    ? '<span class="sp2-ct-loose"><b>' + loose.q.toLocaleString() + ' gal</b> of ' + loose.p +
        ' still to place</span>' +
      '<button class="sp2-ct-btn" onclick="sp2PendPlace(event,\'' + k + '\')">Put it where it fits</button>'
    : '<span class="sp2-ct-ok">Balanced \u00b7 ' + placed.toLocaleString() + ' gal placed</span>';

  return '<div class="sp2-ct' + (loose ? ' loose' : '') + '">' +
      '<div class="sp2-ct-head"><span>Comp</span><span>Product</span><span>Gallons</span>' +
        '<span title="Tank monitor">TM</span></div>' +
      rows +
      '<div class="sp2-ct-foot">' + foot +
        (sp2Undo && sp2Undo.k === k
          ? '<button class="sp2-ct-btn out" onclick="event.stopPropagation();sp2LoadBack()">Undo</button>'
          : '') +
      '</div>' +
    '</div>';
}

function sp2CompClick(e, k, unit, i) {
  e.stopPropagation();
  var here = sp2Cell(k, unit, i);
  if (!here) return;

  if (!sp2MoveFrom) {
    if (!here.l.q) return;                       // nothing in it to move
    sp2MoveFrom = { k:k, unit:unit, i:i };
    sp2RenderUnit();
    sp2Toast('Moving ' + here.l.p + ' — pick the compartment it goes into');
    return;
  }
  if (sp2MoveFrom.k === k && sp2MoveFrom.unit === unit && sp2MoveFrom.i === i)
    return sp2MoveCancel();                      // put it back
  if (sp2MoveFrom.k !== k) {
    sp2Toast('Fuel moves between compartments of one rig, not between trucks');
    return sp2MoveCancel();
  }

  var from = sp2Cell(k, sp2MoveFrom.unit, sp2MoveFrom.i);
  if (here.l.q && here.l.p !== from.l.p)
    return sp2Toast('That compartment holds ' + here.l.p + ' — one product per compartment');
  var room = here.cap - here.l.q;
  if (room <= 0) return sp2Toast('That compartment is full');

  sp2MoveTo = { unit:unit, i:i };
  sp2MoveMax = Math.min(from.l.q, room);
  var step = sp2MoveMax >= 400 ? 50 : 10;
  document.getElementById('sp2TrlPop').innerHTML =
    '<div class="sp2-pop-ttl">Move ' + from.l.p + ' · ' +
      sp2CompName(sp2MoveFrom.unit, sp2MoveFrom.i) + ' → ' + sp2CompName(unit, i) + '</div>' +
    '<div class="sp2-move">' +
      '<input class="sp2-move-range" id="sp2MoveR" type="range" min="0" step="' + step + '" max="' +
        sp2MoveMax + '" value="' + sp2MoveMax + '" oninput="sp2MoveSync(this.value)">' +
      '<div class="sp2-move-row">' +
        '<input class="sp2-time" id="sp2MoveN" value="' + sp2MoveMax + '" oninput="sp2MoveSync(this.value)">' +
        '<span class="sp2-move-of">gal of ' + from.l.q.toLocaleString() +
          ' · room for ' + room.toLocaleString() + '</span>' +
      '</div>' +
      '<div class="sp2-move-quick">' +
        '<button class="sp2-fix" onclick="sp2MoveSync(' + Math.round(sp2MoveMax * 0.25) + ')">25%</button>' +
        '<button class="sp2-fix" onclick="sp2MoveSync(' + Math.round(sp2MoveMax * 0.5) + ')">50%</button>' +
        '<button class="sp2-fix" onclick="sp2MoveSync(' + sp2MoveMax + ')">All</button>' +
        '<button class="sp2-view" style="margin-left:auto;height:28px;padding:0 14px;font-size:12px;" ' +
          'onclick="sp2DoMove(\'' + k + '\')">Move</button>' +
      '</div>' +
    '</div>';
  sp2PopAt('sp2TrlPop', e.currentTarget);
}

function sp2CompName(unit, i) { return (unit === 'trailer' ? 'Trailer C' : 'C') + (i + 1); }

function sp2MoveSync(v) {
  v = Math.max(0, Math.min(sp2MoveMax, Math.round(+v || 0)));
  var r = document.getElementById('sp2MoveR'), n = document.getElementById('sp2MoveN');
  if (r) r.value = v;
  if (n && +n.value !== v) n.value = v;
}

function sp2MoveCancel() {
  sp2MoveFrom = null; sp2MoveTo = null;
  var pop = document.getElementById('sp2TrlPop');
  if (pop) pop.classList.remove('on');
  sp2Render();          // moving fuel changes what else would fit
}

function sp2DoMove(k) {
  if (!sp2MoveFrom || !sp2MoveTo) return sp2MoveCancel();
  var n = document.getElementById('sp2MoveN');
  var qty = Math.max(0, Math.min(sp2MoveMax, Math.round(+(n && n.value) || 0)));
  if (!qty) return sp2MoveCancel();
  var from = sp2Cell(k, sp2MoveFrom.unit, sp2MoveFrom.i);
  var to   = sp2Cell(k, sp2MoveTo.unit,   sp2MoveTo.i);
  var prod = from.l.p;
  from.l.q -= qty;
  if (!from.l.q) from.l.p = '';
  to.l.p = prod;
  to.l.q += qty;
  var what = sp2CompName(sp2MoveFrom.unit, sp2MoveFrom.i) + ' → ' + sp2CompName(sp2MoveTo.unit, sp2MoveTo.i);
  sp2MoveCancel();
  sp2Toast(qty.toLocaleString() + ' gal of ' + prod + ' moved · ' + what);
}

// ── changing who drives what ─────────────────────────────
// Both pickers are the same move underneath: two drivers trade rigs. Changing
// the driver takes the planned orders along, because the work is going with
// the truck; changing the truck leaves them where they are.
function sp2TradeRigs(a, b, withOrders) {
  var A = SP2_DRIVERS[a], B = SP2_DRIVERS[b], tmp;
  ['truck', 'load', 'trailer', 'tload'].forEach(function (f) {
    tmp = A[f]; A[f] = B[f]; B[f] = tmp;
  });
  if (withOrders) SP2_ORDERS.forEach(function (o) {
    if (o.driver === a) o.driver = b; else if (o.driver === b) o.driver = a;
  });
}

function sp2TruckPop(btn, k) {
  var mine = SP2_DRIVERS[k].truck;
  var rows = Object.keys(SP2_TRUCKS).map(function (id) {
    var sp = SP2_TRUCKS[id];
    var holder = Object.keys(SP2_DRIVERS).filter(function (x) { return SP2_DRIVERS[x].truck === id; })[0];
    var cap = sp.comps.reduce(function (s, c) { return s + c.cap; }, 0);
    return '<button class="sp2-pop-item' + (id === mine ? ' on' : '') +
        '" onclick="sp2PickTruck(\'' + k + '\',\'' + id + '\')">' +
        '<span class="sp2-pop-item-id">' + id + (id === mine ? ' · current' : '') + '</span>' +
        '<span class="sp2-pop-item-sub">' + sp.type + ' · ' + sp.comps.length + ' comps · ' +
          cap.toLocaleString() + ' gal' + (holder && holder !== k ? ' · ' + SP2_DRIVERS[holder].name : '') +
        '</span></button>';
  }).join('');
  document.getElementById('sp2TrlPop').innerHTML =
    '<div class="sp2-pop-ttl">Give ' + SP2_DRIVERS[k].name + ' a different truck</div>' +
    '<div class="sp2-pop-scroll">' + rows + '</div>';
  sp2PopAt('sp2TrlPop', btn);
}
function sp2PickTruck(k, id) {
  document.getElementById('sp2TrlPop').classList.remove('on');
  if (SP2_DRIVERS[k].truck === id) return;
  var holder = Object.keys(SP2_DRIVERS).filter(function (x) { return SP2_DRIVERS[x].truck === id; })[0];
  if (holder) sp2TradeRigs(k, holder, false);
  else SP2_DRIVERS[k].truck = id;
  sp2Render();
  sp2Toast(SP2_DRIVERS[k].name + ' is on ' + id + (holder ? ' — ' + SP2_DRIVERS[holder].name + ' takes ' + SP2_DRIVERS[holder].truck : ''));
}

function sp2DriverPop(btn, k) {
  var rows = sp2DriverKeys().filter(function (x) { return x !== k; }).map(function (x) {
    var d = SP2_DRIVERS[x], st = sp2ShiftState(d);
    return '<button class="sp2-pop-item" onclick="sp2PickDriverFor(\'' + k + '\',\'' + x + '\')">' +
        '<span class="sp2-pop-item-id">' + d.name + '</span>' +
        '<span class="sp2-pop-item-sub">' + sp2StateWord(d.state) + ' · ' + sp2ShiftLabel(d.shift) +
          (st ? ' · ' + st.note : '') + ' · ' + d.truck + '</span></button>';
  }).join('');
  document.getElementById('sp2TrlPop').innerHTML =
    '<div class="sp2-pop-ttl">Hand ' + SP2_DRIVERS[k].truck + ' and its orders to</div>' +
    '<div class="sp2-pop-scroll">' + rows + '</div>';
  sp2PopAt('sp2TrlPop', btn);
}
function sp2PickDriverFor(k, other) {
  document.getElementById('sp2TrlPop').classList.remove('on');
  sp2TradeRigs(k, other, true);
  sp2Driver = other;
  sp2Render();
  sp2Toast(SP2_DRIVERS[other].name + ' takes it over from ' + SP2_DRIVERS[k].name);
}

function sp2TrailerPop(btn, k) {
  sp2TrlFor = k || sp2Driver;
  var p = document.getElementById('sp2TrlPop');
  p.innerHTML = '<div class="sp2-pop-ttl">Hitch a trailer</div>' +
    Object.keys(SP2_TRAILERS).map(function (k) {
      var tr = SP2_TRAILERS[k];
      var cap = tr.caps.reduce(function (a, c) { return a + c; }, 0);
      return '<button class="sp2-pop-item" onclick="sp2AddTrailer(\'' + k + '\')">' +
          '<span class="sp2-pop-item-id">' + k + '</span>' +
          '<span class="sp2-pop-item-sub">' + tr.type + ' · ' + tr.caps.length +
            ' comps · ' + cap.toLocaleString() + ' gal</span>' +
        '</button>';
    }).join('');
  sp2PopAt('sp2TrlPop', btn);
}
function sp2AddTrailer(trl, k) {
  k = k || sp2TrlFor || sp2Driver;
  var d = SP2_DRIVERS[k];
  d.trailer = trl;
  d.tload = SP2_TRAILERS[trl].caps.map(function () { return { p:'', q:0 }; });
  document.getElementById('sp2TrlPop').classList.remove('on');
  sp2Render();
  sp2Toast(trl + ' hitched to ' + d.truck);
}
function sp2DropTrailer(k) {
  var d = SP2_DRIVERS[k || sp2Driver], had = d.trailer;
  var left = d.tload.reduce(function (a, l) { return a + l.q; }, 0);
  if (left) return sp2Toast(had + ' still holds ' + left.toLocaleString() + ' gal — unload it first');
  d.trailer = null; d.tload = [];
  sp2Render();
  sp2Toast(had + ' unhitched');
}
// Emptying a rig throws away a morning's loading, so it is asked for twice:
// the button says what it will clear, the dialog says what survives it.
var sp2CfmFn = null;
function sp2Confirm(title, line, label, fn) {
  document.getElementById('sp2CfmT').textContent = title;
  document.getElementById('sp2CfmP').textContent = line;
  document.getElementById('sp2CfmOk').textContent = label;
  sp2CfmFn = fn;
  document.getElementById('sp2CfmScrim').classList.add('on');
}
function sp2CfmClose() {
  document.getElementById('sp2CfmScrim').classList.remove('on');
  sp2CfmFn = null;
}
function sp2CfmGo() {
  var fn = sp2CfmFn;
  sp2CfmClose();
  if (fn) fn();
}
function sp2Unload(k) {
  var d = SP2_DRIVERS[k || sp2Driver];
  var held = d.load.concat(d.tload).reduce(function (a, l) { return a + l.q; }, 0);
  if (!held) return;                      // nothing in it to clear
  sp2Confirm('Unload all of ' + d.truck + '?',
    held.toLocaleString() + ' gal comes out of every compartment. The orders stay planned ' +
      'on the rig, so the load can be built again.',
    'Unload all',
    function () { sp2UnloadGo(k); });
}
function sp2UnloadGo(k) {
  var d = SP2_DRIVERS[k || sp2Driver];
  d.load.forEach(function (l) { l.p = ''; l.q = 0; });
  d.tload.forEach(function (l) { l.p = ''; l.q = 0; });
  sp2Render();
  sp2Toast(d.truck + ' emptied — the orders stay planned');
}

// ══════════════════════════════════════════════════════════
//  Drag an order onto the rig
// ══════════════════════════════════════════════════════════
// Dragging a ticked order drags every ticked order. Dragging an unticked one
// is still one order, so the old gesture is untouched.
function sp2DragSet(id) {
  var set = Object.keys(sp2Picked).filter(function (x) { return sp2Picked[x]; });
  return (id && set.indexOf(id) < 0) ? [id] : set.length ? set : (id ? [id] : []);
}
function sp2DragStart(e, id) {
  sp2Drag = sp2DragSet(id);
  e.dataTransfer.effectAllowed = 'copy';
  try { e.dataTransfer.setData('text/plain', sp2Drag.join(',')); } catch (x) {}
  document.getElementById('sp2Body').classList.add('dragging');
  if (sp2Drag.length > 1 && e.dataTransfer.setDragImage) {
    var g = document.createElement('div');
    g.className = 'sp2-ghost';
    g.textContent = sp2Drag.length + ' orders';
    document.body.appendChild(g);
    e.dataTransfer.setDragImage(g, 18, 14);
    setTimeout(function () { g.remove(); }, 0);
  }
}
function sp2TogglePick(e, id) {
  e.stopPropagation();
  if (sp2Picked[id]) delete sp2Picked[id]; else sp2Picked[id] = true;
  sp2Render();
}
function sp2ClearPicks() { sp2Picked = {}; sp2Render(); }
function sp2DragEnd() {
  sp2Drag = null;
  document.getElementById('sp2Body').classList.remove('dragging');
  document.querySelectorAll('.sp2-over').forEach(function (x) { x.classList.remove('sp2-over'); });
}
function sp2DragOver(e) {
  if (!sp2Drag) return;
  e.preventDefault(); e.stopPropagation();
  e.dataTransfer.dropEffect = 'copy';
  var el = e.currentTarget;
  if (!el.classList.contains('sp2-over')) {
    document.querySelectorAll('.sp2-over').forEach(function (x) { x.classList.remove('sp2-over'); });
    el.classList.add('sp2-over');
  }
}
function sp2DragLeave(e) {
  if (!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove('sp2-over');
}

// One product per compartment — the rule only bends for a blend, and none of
// these are blends. So a line fills what already holds it, then takes an empty.
// Every compartment on the rig, rear to front, as somewhere to put fuel.
function sp2Cells(k) {
  var d = SP2_DRIVERS[k], out = [];
  SP2_TRUCKS[d.truck].comps.forEach(function (c, i) { out.push({ cap:c.cap, l:d.load[i], u:'truck', i:i }); });
  if (d.trailer) SP2_TRAILERS[d.trailer].caps.forEach(function (c, i) {
    out.push({ cap:c, l:d.tload[i], u:'trailer', i:i });
  });
  return out;
}

// One product per compartment — the rule only bends for a blend, and none of
// these are blends. So a line fills what already holds it, then takes an empty.
function sp2PackInto(k, prods, unit, idx) {
  var cells = sp2Cells(k);
  if (idx >= 0) cells.sort(function (a, b) {
    return (b.u === unit && b.i === idx) - (a.u === unit && a.i === idx);
  });
  var short = [], put = 0;
  prods.forEach(function (pr) {
    var left = pr.q;
    [1, 2].forEach(function (pass) {
      cells.forEach(function (c) {
        if (!left) return;
        var same = c.l.p === pr.p, empty = !c.l.p || c.l.q === 0;
        if (pass === 1 ? !(same && c.l.q > 0) : !empty) return;
        if (pass === 2) c.l.p = pr.p;
        var take = Math.min(c.cap - c.l.q, left);
        c.l.q += take; left -= take; put += take;
      });
    });
    if (left) short.push(pr.p + ' ' + left.toLocaleString() + ' gal');
  });
  return { put:put, short:short };
}

// Taking an order off a truck takes its gallons with it, product by product,
// from wherever they ended up — fuel can have been moved since it was loaded.
function sp2TakeOut(k, prods) {
  var cells = sp2Cells(k);
  prods.forEach(function (pr) {
    var left = pr.q;
    cells.forEach(function (c) {
      if (!left || c.l.p !== pr.p) return;
      var take = Math.min(c.l.q, left);
      c.l.q -= take; left -= take;
      if (!c.l.q) c.l.p = '';
    });
  });
}

function sp2Drop(e, unit, idx, k) {
  e.preventDefault(); e.stopPropagation();
  // sp2Drag is a list, but anything that sets it by hand (a test, a console)
  // may hand over a single id — take both.
  var ids = Array.isArray(sp2Drag) ? sp2Drag.slice()
          : typeof sp2Drag === 'string' && sp2Drag ? [sp2Drag]
          : ((e.dataTransfer && e.dataTransfer.getData('text/plain')) || '').split(',').filter(Boolean);
  sp2DragEnd();
  if (!ids.length) return;
  k = k || sp2Driver;
  var d = SP2_DRIVERS[k];
  if (!d) return;

  // Several orders go on in the order they were given, each into the same rig.
  // Only the first one may name a compartment; the rest pack where they fit,
  // because a named compartment can only take one order's worth.
  var loaded = [], gal = 0, shortOf = [], held = [], last = null;
  ids.forEach(function (id, n) {
    var o = SP2_ORDERS.filter(function (x) { return x.id === id; })[0];
    if (!o) return;
    // An order already planned on someone else is theirs until it is taken off
    // their lane. Moving it across behind their back is how double-booking starts.
    if (o.driver && o.driver !== k) return held.push(o.id);
    if (o.driver === k) return;
    var r = sp2PackInto(k, o.prods, n === 0 ? unit : 'auto', n === 0 ? idx : -1);
    o.driver = k; last = o.id;
    loaded.push(o.id); gal += r.put;
    r.short.forEach(function (x) { if (shortOf.indexOf(x) < 0) shortOf.push(x); });
    delete sp2Picked[o.id];
  });

  if (!loaded.length)
    return sp2Toast(held.length
      ? held.join(', ') + ' is planned on another driver — take it off that lane first'
      : 'Nothing to load');

  sp2Driver = k;
  sp2SelOrder = last;
  sp2Render();

  var what = loaded.length === 1 ? loaded[0] : loaded.length + ' orders';
  // Nothing went in. The order is on the rig — that is how a dispatcher plans
  // past capacity and then finds a trailer — but the tanks did not move, and a
  // line that opens "loaded onto" reads like it worked.
  if (!gal)
    sp2Toast('Nothing could be loaded: ' + shortOf.join(', ') + ' has nowhere to go in ' +
             d.truck + ' (' + sp2RigCap(k).toLocaleString() + ' gal).\n' +
             what + ' is on the rig with empty tanks — ' +
             (d.trailer ? 'take an order off' : 'hitch a trailer or take an order off') + '.', 1);
  else if (shortOf.length)
    sp2Toast(what + ' on ' + d.truck + ' \u00b7 ' + gal.toLocaleString() + ' gal loaded.\n' +
             shortOf.join(', ') + ' would not fit' +
             (d.trailer ? '' : ' — hitch a trailer') + '.', 1);
  else
    sp2Toast(what + ' loaded onto ' + d.truck + ' \u00b7 ' + gal.toLocaleString() + ' gal');
}

// ── taking orders back off, and what to do when the rig is over ──
function sp2UnplanOrder(e, k, id) {
  e.stopPropagation();
  var o = SP2_ORDERS.filter(function (x) { return x.id === id; })[0];
  if (!o) return;
  sp2TakeOut(k, o.prods);
  o.driver = '';
  if (sp2SelOrder === id) sp2SelOrder = null;
  sp2Render();
  sp2Toast(id + ' taken off ' + SP2_DRIVERS[k].truck + ' — back in the orders column');
}

function sp2RigCap(k) {
  var d = SP2_DRIVERS[k];
  var cap = SP2_TRUCKS[d.truck].comps.reduce(function (s, c) { return s + c.cap; }, 0);
  if (d.trailer) cap += SP2_TRAILERS[d.trailer].caps.reduce(function (s, c) { return s + c; }, 0);
  return cap;
}

// More gallons planned than the rig holds: say by how much, and which orders
// are past the line. The way out is to take one off, which every reading in
// the banner does \u2014 one kind of chip, one act.
function sp2Overload(k) {
  var cap = sp2RigCap(k);
  var mine = SP2_ORDERS.filter(function (o) { return o.driver === k; });
  var want = mine.reduce(function (s, o) { return s + sp2Gal(o); }, 0);
  if (want <= cap) return null;
  var over = want - cap;
  // The day fills the rig stop by stop, so one stop is where the running total
  // crosses capacity. That order is what broke it, and it is the only one the
  // banner names — listing everything behind it read as "all five of these
  // are over capacity" when one order was the problem. Take it off and the
  // banner comes back pointing at whatever breaks it next, if anything does.
  var run = 0, past = [];
  mine.slice().sort(function (a, b) { return a.t - b.t; }).forEach(function (o) {
    run += sp2Gal(o);
    if (run > cap && !past.length) past.push(o);
  });
  return { over:over, cap:cap, want:want, past:past, first:past[0] };
}

// The design's wave, normalised: the same bezier at any width, any level.
function sp2Wave(w, y, h) {
  var p = function (fx, fy) { return (fx * w).toFixed(2) + ',' + (y + fy).toFixed(2); };
  return 'M' + p(0.3972, 8.4352) +
         'C' + p(0.2402, 12.4047) + ' ' + p(0.06698, 4.4657) + ' ' + p(0, 0) +
         'V' + h + 'H' + w.toFixed(2) + 'V' + y.toFixed(2) +
         'C' + p(0.8552, -8.4352) + ' ' + p(0.5934, 3.4733) + ' ' + p(0.3972, 8.4352) + 'Z';
}

// three concentric circles, exactly as the design's wheel
function sp2Wheel(cx) {
  return '<circle cx="' + cx + '" cy="' + (TK.wheelY + TK.wheelR) + '" r="23.5" fill="' + TK.dark + '"/>' +
         '<circle cx="' + cx + '" cy="' + (TK.wheelY + TK.wheelR) + '" r="15.5" fill="' + TK.shell + '"/>' +
         '<circle cx="' + cx + '" cy="' + (TK.wheelY + TK.wheelR) + '" r="7.5" fill="' + TK.hub + '"/>';
}

// Widths come from the space available, so the rig spans the lane instead of
// sitting small in the corner of it. Capacity still sets the proportion; the
// floor keeps a compartment at roughly the shape the design drew.
// The ceiling is twice the compartment the design draws. Past that a tank
// stops reading as a tank and becomes a stretched bar, so a wide lane keeps
// the slack and the rig sits centred in it instead.
var TK_MIN_W = 100, TK_MAX_W = 440, TK_GAP = 18, TK_TRACTOR = 185, TK_OVERHANG = 24;
var TK_SIDE_PAD = 50;   // air either side of the rig, in screen pixels

function sp2RigWidths(caps, availUnits, nUnits) {
  var total = caps.reduce(function (a, c) { return a + c; }, 0);
  var budget = availUnits - nUnits * TK_OVERHANG - TK_TRACTOR - (nUnits > 1 ? TK_GAP : 0);
  // if the floors overshoot the budget the rig runs long and scrolls; if the
  // ceiling bites, it comes up short of the lane and centres
  return caps.map(function (c) {
    return Math.min(TK_MAX_W, Math.max(TK_MIN_W, Math.round(budget * c / total)));
  });
}

function sp2TankSvg(x, caps, widths, load, k, unit, uid) {
